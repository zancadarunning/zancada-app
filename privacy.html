function detectLang(){
  const url = new URL(window.location.href);
  const q = url.searchParams.get('lang');
  if(q && L[q]) return q;
  try{
    const saved = localStorage.getItem('zancada_legal_lang');
    if(saved && L[saved]) return saved;
  }catch(e){}
  const nav = (navigator.language || 'es').slice(0,2).toLowerCase();
  if(L[nav]) return nav;
  return 'es';
}

function render(code){
  const d = L[code];
  document.documentElement.lang = LANG_NAMES[code] || code;
  document.getElementById('page-title').textContent = d.title;
  document.getElementById('back-link').textContent = d.back;
  document.getElementById('t-title').textContent = d.title.replace(/^Zancada\s*—\s*/, '');
  document.getElementById('t-updated').textContent = d.updated;
  document.getElementById('t-intro').textContent = d.intro;
  document.getElementById('t-h-collect').textContent = d.h_collect;
  document.getElementById('t-collect').innerHTML = d.collect.map(([label,desc])=>`<li><strong>${label}:</strong> ${desc}</li>`).join('');
  document.getElementById('t-h-how').textContent = d.h_how;
  document.getElementById('t-how').textContent = d.how;
  document.getElementById('t-h-use').textContent = d.h_use;
  document.getElementById('t-use').innerHTML = d.use.map(item=>`<li>${item}</li>`).join('');
  document.getElementById('t-h-share').textContent = d.h_share;
  document.getElementById('t-share-intro').textContent = d.share_intro;
  document.getElementById('t-share').innerHTML = d.share.map(([label,desc])=>`<li><strong>${label}:</strong> ${desc}</li>`).join('');
  document.getElementById('t-h-storage').textContent = d.h_storage;
  document.getElementById('t-storage').textContent = d.storage;
  document.getElementById('t-h-rights').textContent = d.h_rights;
  document.getElementById('t-rights').textContent = d.rights;
  document.getElementById('t-h-minors').textContent = d.h_minors;
  document.getElementById('t-minors').textContent = d.minors;
  document.getElementById('t-h-changes').textContent = d.h_changes;
  document.getElementById('t-changes').textContent = d.changes;
  document.getElementById('t-h-contact').textContent = d.h_contact;
  document.getElementById('t-contact-q').textContent = d.contact_q;
  document.getElementById('t-note').textContent = d.note;
  document.querySelectorAll('.lang-pill').forEach(p=>p.classList.toggle('active', p.dataset.v===code));
  try{ localStorage.setItem('zancada_legal_lang', code); }catch(e){}
}

const langRow = document.getElementById('lang-row');
Object.keys(LANG_LABELS).forEach(code=>{
  const el = document.createElement('div');
  el.className = 'lang-pill';
  el.dataset.v = code;
  el.textContent = LANG_LABELS[code];
  el.onclick = ()=>render(code);
  langRow.appendChild(el);
});

render(detectLang());
</script>
</body>
</html>
