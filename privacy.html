  .health-box .health-label{font-size:11px; font-weight:700; letter-spacing:.12em; text-transform:uppercase; color:var(--ink); margin:0 0 10px;}
  .health-box p{color:var(--ink); margin:0; font-size:14.5px;}
  .placeholder-box{border:1px solid var(--ink); padding:16px 18px; margin-top:4px;}

<script>
const L = {"es":{"title":"Zancada — Política de Privacidad","back":"‹ Volver a Zancada","updated":"Última actualización: 6 de octubre de 2026","intro":"Esta política explica qué datos recopila Zancada, para qué los usa y qué opciones tenés al respecto. La escribimos en lenguaje simple, sin vueltas legales innecesarias.","summary_label":"En resumen","summary":["No vendemos tus datos ni los usamos con fines publicitarios. Tus datos de salud y ubicación nunca se usan para publicidad ni marketing.","Si registrás una carrera con el celular, la app usa tu ubicación (GPS) también en segundo plano, solo mientras la carrera está activa.","No usamos cookies de rastreo ni SDKs de analítica de ningún tipo.","Podés borrar todos tus datos vos mismo, cuando quieras, desde la app.","Solo compartimos datos con los servicios necesarios para que la app funcione — la lista completa está más abajo."],"sections":[{"h":"1. Responsable de tus datos","ph":"[A completar antes de publicar la app: razón social o nombre completo de la persona responsable del tratamiento de datos, CUIT, domicilio legal y, si corresponde, número de inscripción de la base de datos ante la Agencia de Acceso a la Información Pública (AAIP) de Argentina.]","p":["Para cualquier consulta sobre quién administra tus datos y cómo, escribinos a info@zancada.org."]},{"h":"2. Qué datos recopilamos","ul":["<strong>Cuenta y perfil:<\/strong> tu email, tu nombre y tu foto de perfil. Si iniciás sesión con Google o Apple, también los datos básicos de esa cuenta. Si elegís cambiar tu foto, la app te pide acceso a la cámara o a la galería de tu dispositivo (es opcional): la imagen solo se usa para tu perfil dentro de la app y no se comparte con terceros.","<strong>Datos de salud y entrenamiento (datos sensibles):<\/strong> tus carreras (distancia, duración, ritmo, ruta GPS, cadencia, desnivel, potencia), tu frecuencia cardíaca y tus zonas, tu peso, altura, fecha de nacimiento y género, las molestias o notas de salud que cargues y el resultado del test de nivel.","<strong>Ubicación, también en segundo plano:<\/strong> cuando registrás una carrera con tu celular, la app recopila tu ubicación (GPS) en tiempo real y en segundo plano. Esto significa que sigue registrando tu ruta, ritmo y distancia aunque minimices la app o apagues la pantalla, y muestra una notificación mientras lo hace. El seguimiento se detiene apenas finalizás la actividad. Si sincronizás tus carreras desde un reloj, no usamos el GPS de tu teléfono.","<strong>Perfil deportivo:<\/strong> terreno preferido, tipo de corredor, días de entrenamiento, si medís por tiempo o por distancia, objetivo o carrera próxima, meta semanal, deportes complementarios y las zapatillas que registrás.","<strong>Conversaciones con Zonda:<\/strong> los mensajes que intercambiás con Zonda, el coach de IA, y el contexto deportivo que usa para responderte.","<strong>Datos de otras apps y del teléfono (opcionales):<\/strong> las actividades que sincronizás desde Strava, Polar, Wahoo, COROS, Suunto o Health Connect (en Android: ejercicios, distancia y frecuencia cardíaca) y, si activás agregar tu plan al calendario del teléfono, el permiso de calendario, que usamos solo para crear y borrar tus entrenamientos en un calendario propio llamado \"Zancada\".","<strong>Preferencias técnicas:<\/strong> idioma, sistema de unidades, estado de las notificaciones push y un identificador de tu dispositivo para entregarlas."],"p":["Tratamos estos datos, incluidos los de salud y ubicación, con tu consentimiento expreso, que das al crear la cuenta y al activar cada función (el GPS en segundo plano, una integración, las notificaciones). Podés retirarlo en cualquier momento borrando tus datos desde la app."]},{"h":"3. Cómo obtenemos estos datos","p":["La mayoría los cargás vos directamente en la app o los genera tu teléfono al registrar una carrera. Si conectás tu reloj o tu cuenta de Strava, Polar, Wahoo, COROS o Suunto, o activás Health Connect, sincronizamos tus carreras automáticamente desde ahí (solo las que vos autorizás). Si iniciás sesión con Google o Apple, recibimos los datos básicos que esas plataformas comparten para identificarte."]},{"h":"4. Para qué los usamos","ul":["Generar y ajustar tu plan de entrenamiento semana a semana, y calcular tus ritmos y zonas a partir del test de nivel.","Mostrarte tu progreso, historial, estadísticas y el estado de tus zapatillas.","Que el coach con IA pueda darte respuestas y sugerencias con contexto real sobre vos.","Avisarte por notificación push de tu sesión del día (si lo activaste).","Alertarte si tu carga de entrenamiento sube muy rápido o si tus zapatillas ya pasaron su vida útil recomendada."],"box":{"label":"Restricción de uso","text":"Los datos de salud, ubicación y métricas físicas nunca se usan con fines publicitarios ni de marketing, ni se venden ni se ceden a terceros ni a intermediarios de datos (data brokers). Cumplimos con las políticas para desarrolladores de Apple App Store y Google Play."}},{"h":"5. Con quién compartimos datos","p":["No vendemos tus datos a nadie, ni los usamos con fines publicitarios. Los compartimos únicamente con los servicios que hacen funcionar la app:"],"ul":["<strong>Supabase:<\/strong> aloja la base de datos donde se guarda tu información.","<strong>Strava:<\/strong> sincronización bidireccional de actividades, solo si vos la conectás.","<strong>Polar:<\/strong> sincronización de tus carreras, solo si conectás tu cuenta de Polar.","<strong>Wahoo:<\/strong> sincronización de tus carreras y envío de tus entrenamientos planificados (con intervalos y pulso objetivo), solo si conectás tu cuenta de Wahoo.","<strong>COROS:<\/strong> sincronización de tus carreras, solo si conectás tu cuenta de COROS.","<strong>Suunto:<\/strong> sincronización de tus carreras y envío de tus entrenamientos planificados (con intervalos y pulso objetivo), solo si conectás tu cuenta de Suunto.","<strong>Google y Apple:<\/strong> inicio de sesión, únicamente si elegís entrar con tu cuenta de Google o de Apple.","<strong>Firebase Cloud Messaging (Google):<\/strong> recibe un identificador de tu dispositivo para poder entregarte las notificaciones push del coach, si las activaste.","<strong>Anthropic (Claude):<\/strong> es el modelo de IA detrás de Zonda, nuestro coach virtual. Procesa lo que le escribís y el contexto que necesitamos pasarle para que pueda responder con criterio: tu perfil, tu plan de entrenamiento, tu historial reciente de carreras, tus zonas de frecuencia cardíaca y las notas o molestias que hayas registrado. Según sus condiciones para clientes de su API, Anthropic no usa lo que le enviamos para entrenar sus modelos.","<strong>Sentry:<\/strong> recibe información técnica cuando ocurre un error en el servidor, o cuando alguien intenta acceder a una parte protegida de la app sin autorización, para que podamos detectarlo y solucionarlo. Nunca le mandamos tu contraseña ni datos de pago."]},{"h":"Transferencia internacional de datos","p":["Estos proveedores operan servidores fuera de Argentina (por ejemplo, en Estados Unidos y en la Unión Europea), por lo que al usar Zancada tus datos se transfieren a otros países. Lo hacemos mediante conexiones seguras y solo con proveedores que ofrecen garantías de seguridad adecuadas, conforme a la Ley 25.326 y, cuando corresponde, al Reglamento General de Protección de Datos (RGPD) de la Unión Europea."]},{"h":"6. Seguridad, almacenamiento y retención","p":["Toda la información se transmite con cifrado seguro (HTTPS/TLS) y se guarda en servidores con acceso restringido. Tus datos quedan guardados en tu cuenta mientras la cuenta exista. Además, la app guarda una copia temporal en tu teléfono para poder seguir funcionando sin conexión, que se sincroniza apenas volvés a tener internet.","Cuando borrás tu cuenta, tus datos personales, de salud y de ubicación se eliminan de nuestros servidores de producción. Las copias de seguridad rotan y se destruyen automáticamente en un plazo máximo de 30 días."]},{"h":"7. Cookies, analítica y tecnologías similares","p":["Zancada no usa cookies de publicidad, no usa Google Analytics, Meta Pixel ni ningún otro SDK de analítica o rastreo, y no compartimos tus datos con redes publicitarias. Usamos únicamente almacenamiento técnico esencial para que la app funcione: mantener tu sesión iniciada, guardar una copia de tus datos en tu teléfono para que funcione sin conexión, y un identificador de tu dispositivo para poder enviarte notificaciones push (a través de Firebase Cloud Messaging) si las activaste. Como no usamos cookies de rastreo ni herramientas de analítica, no hace falta mostrarte un banner de consentimiento de cookies."]},{"h":"8. Tus derechos","p":["Sos dueño de tu información. Podés borrar todos tus datos vos mismo en cualquier momento desde Perfil → Borrar mis datos. También podés pedirnos acceso a tus datos, su rectificación o actualización, su portabilidad (una copia en un formato estructurado) o su supresión, y retirar tu consentimiento, escribiéndonos a info@zancada.org.","Si estás en Argentina, estos derechos están reconocidos por la Ley 25.326 de Protección de Datos Personales. El acceso a tus datos es gratuito a intervalos no inferiores a seis meses, salvo que acredites un interés legítimo. La Agencia de Acceso a la Información Pública (AAIP), órgano de control de esa ley, atiende las denuncias y reclamos por incumplimientos.","Si estás en la Unión Europea o en otro país con su propia normativa de protección de datos (por ejemplo, el RGPD), tenés los derechos equivalentes de acceder, corregir, borrar, oponerte, limitar el tratamiento y llevarte tu información, y podés presentar un reclamo ante la autoridad de protección de datos que corresponda."]},{"h":"9. Menores de edad","p":["Zancada no está dirigida a menores de 16 años. Entre los 16 y los 17 años solo podés usarla con la autorización de tu madre, padre o tutor legal, que deben consentir el tratamiento de tus datos. Si detectamos que recopilamos datos de un menor sin ese consentimiento, eliminamos la cuenta de inmediato."]},{"h":"10. Cambios a esta política","p":["Si cambiamos esta política de forma importante —en especial la forma en que tratamos tus datos sensibles—, te lo vamos a avisar de forma destacada dentro de la app antes de que entre en vigencia. Si no estás de acuerdo con el cambio, podés borrar tu cuenta."]}],"h_contact":"Contacto","contact_q":"¿Preguntas sobre tus datos o esta política?","note":"Este documento fue redactado como una plantilla general para una app en desarrollo y no constituye asesoramiento legal. Antes de lanzar Zancada públicamente, te recomendamos que un abogado la revise y la adapte a las leyes de tu país."},"en":{"title":"Zancada — Privacy Policy","back":"‹ Back to Zancada","updated":"Last updated: October 6, 2026","intro":"This policy explains what data Zancada collects, what it uses it for, and what choices you have. We wrote it in plain language, without unnecessary legalese.","summary_label":"At a glance","summary":["We don't sell your data or use it for advertising. Your health and location data is never used for advertising or marketing.","If you record a run with your phone, the app uses your location (GPS) in the background too, only while the run is active.","We use no tracking cookies and no analytics SDKs of any kind.","You can delete all your data yourself, whenever you want, from the app.","We only share data with the services needed to make the app work — the full list is below."],"sections":[{"h":"1. Who is responsible for your data","ph":"[To complete before publishing the app: company name or full name of the person responsible for processing data, tax ID (CUIT), legal address and, if applicable, the database registration number with Argentina's Agency for Access to Public Information (AAIP).]","p":["For any question about who manages your data and how, write to us at info@zancada.org."]},{"h":"2. What data we collect","ul":["<strong>Account and profile:<\/strong> your email, your name and your profile photo. If you sign in with Google or Apple, also the basic data from that account. If you choose to change your photo, the app asks for access to your device's camera or gallery (optional): the image is only used for your profile inside the app and is not shared with third parties.","<strong>Health and training data (sensitive data):<\/strong> your runs (distance, duration, pace, GPS route, cadence, elevation, power), your heart rate and zones, your weight, height, date of birth and gender, any discomfort or health notes you enter, and your fitness test result.","<strong>Location, including in the background:<\/strong> when you record a run with your phone, the app collects your location (GPS) in real time and in the background. This means it keeps tracking your route, pace and distance even if you minimize the app or turn the screen off, and it shows a notification while doing so. Tracking stops as soon as you finish the activity. If you sync your runs from a watch, we don't use your phone's GPS.","<strong>Sports profile:<\/strong> preferred terrain, runner type, training days, whether you measure by time or distance, goal or upcoming race, weekly goal, complementary sports and the shoes you log.","<strong>Conversations with Zonda:<\/strong> the messages you exchange with Zonda, the AI coach, and the training context it uses to answer you.","<strong>Data from other apps and your phone (optional):<\/strong> activities you sync from Strava, Polar, Wahoo, COROS, Suunto or Health Connect (on Android: exercises, distance and heart rate) and, if you turn on adding your plan to your phone's calendar, the calendar permission, which we only use to create and delete your workouts in a calendar of its own called \"Zancada\".","<strong>Technical preferences:<\/strong> language, unit system, push-notification status and a device identifier to deliver them."],"p":["We process this data, including health and location data, with your express consent, which you give when creating your account and when turning on each feature (background GPS, an integration, notifications). You can withdraw it at any time by deleting your data from the app."]},{"h":"3. How we get this data","p":["Most of it you enter directly in the app, or your phone generates it when you record a run. If you connect your watch or your Strava, Polar, Wahoo, COROS or Suunto account, or turn on Health Connect, we sync your runs automatically from there (only the ones you authorize). If you sign in with Google or Apple, we receive the basic data those platforms share to identify you."]},{"h":"4. What we use it for","ul":["Generate and adjust your training plan week by week, and calculate your paces and zones from the fitness test.","Show you your progress, history, statistics and the status of your shoes.","Let the AI coach give you answers and suggestions with real context about you.","Notify you by push notification about your session of the day (if you turned it on).","Alert you if your training load rises too fast or if your shoes are past their recommended lifespan."],"box":{"label":"Use restriction","text":"Health, location and physical-metrics data is never used for advertising or marketing purposes, and is never sold or handed over to third parties or data brokers. We comply with the Apple App Store and Google Play developer policies."}},{"h":"5. Who we share data with","p":["We don't sell your data to anyone, nor use it for advertising. We only share it with the services that make the app work:"],"ul":["<strong>Supabase:<\/strong> hosts the database where your information is stored.","<strong>Strava:<\/strong> two-way activity sync, only if you connect it.","<strong>Polar:<\/strong> sync of your runs, only if you connect your Polar account.","<strong>Wahoo:<\/strong> sync of your runs and sending of your planned workouts (with intervals and target heart rate), only if you connect your Wahoo account.","<strong>COROS:<\/strong> sync of your runs, only if you connect your COROS account.","<strong>Suunto:<\/strong> sync of your runs and sending of your planned workouts (with intervals and target heart rate), only if you connect your Suunto account.","<strong>Google and Apple:<\/strong> sign-in, only if you choose to sign in with your Google or Apple account.","<strong>Firebase Cloud Messaging (Google):<\/strong> receives a device identifier so it can deliver the coach's push notifications, if you turned them on.","<strong>Anthropic (Claude):<\/strong> the AI model behind Zonda, our virtual coach. It processes what you write and the context we need to pass it so it can answer sensibly: your profile, your training plan, your recent run history, your heart rate zones and the notes or discomfort you logged. Under its terms for API customers, Anthropic does not use what we send it to train its models.","<strong>Sentry:<\/strong> receives technical information when a server error happens, or when someone tries to reach a protected part of the app without authorization, so we can detect and fix it. We never send it your password or payment data."]},{"h":"International data transfer","p":["These providers operate servers outside Argentina (for example, in the United States and the European Union), so by using Zancada your data is transferred to other countries. We do this over secure connections and only with providers that offer adequate security guarantees, in accordance with Argentina's Law 25,326 and, where applicable, the EU General Data Protection Regulation (GDPR)."]},{"h":"6. Security, storage and retention","p":["All information is transmitted with secure encryption (HTTPS/TLS) and stored on servers with restricted access. Your data stays in your account as long as the account exists. The app also keeps a temporary copy on your phone so it can keep working offline, which syncs as soon as you're back online.","When you delete your account, your personal, health and location data is removed from our production servers. Backups rotate and are automatically destroyed within a maximum of 30 days."]},{"h":"7. Cookies, analytics and similar technologies","p":["Zancada uses no advertising cookies, no Google Analytics, Meta Pixel or any other analytics or tracking SDK, and we don't share your data with ad networks. We only use essential technical storage for the app to work: keeping you signed in, keeping a copy of your data on your phone so it works offline, and a device identifier so we can send you push notifications (through Firebase Cloud Messaging) if you turned them on. Since we use no tracking cookies or analytics tools, there is no need to show you a cookie consent banner."]},{"h":"8. Your rights","p":["Your information is yours. You can delete all your data yourself at any time from Profile → Delete my data. You can also ask us for access to your data, its correction or update, its portability (a copy in a structured format) or its deletion, and withdraw your consent, by writing to info@zancada.org.","If you are in Argentina, these rights are recognized by Law 25,326 on Personal Data Protection. Access to your data is free of charge at intervals of no less than six months, unless you show a legitimate interest. The Agency for Access to Public Information (AAIP), the control body for that law, handles complaints and claims about non-compliance.","If you are in the European Union or another country with its own data-protection rules (for example, the GDPR), you have the equivalent rights to access, correct, delete, object, restrict processing and take your information with you, and you can file a complaint with the competent data-protection authority."]},{"h":"9. Minors","p":["Zancada is not directed at anyone under 16. Between 16 and 17 you may only use it with the authorization of your parent or legal guardian, who must consent to the processing of your data. If we detect that we collected a minor's data without that consent, we delete the account immediately."]},{"h":"10. Changes to this policy","p":["If we change this policy in a significant way — especially how we handle your sensitive data — we will notify you prominently inside the app before it takes effect. If you don't agree with the change, you can delete your account."]}],"h_contact":"Contact","contact_q":"Questions about your data or this policy?","note":"This document was written as a general template for an app in development and does not constitute legal advice. Before launching Zancada publicly, we recommend having a lawyer review it and adapt it to your country's laws."},"pt":{"title":"Zancada — Política de Privacidade","back":"‹ Voltar para o Zancada","updated":"Última atualização: 6 de outubro de 2026","intro":"Esta política explica quais dados o Zancada coleta, para que os usa e quais opções você tem. Escrevemos em linguagem simples, sem juridiquês desnecessário.","summary_label":"Resumo","summary":["Não vendemos seus dados nem os usamos para publicidade. Seus dados de saúde e localização nunca são usados para publicidade ou marketing.","Se você registra uma corrida pelo celular, o app usa sua localização (GPS) também em segundo plano, apenas enquanto a corrida está ativa.","Não usamos cookies de rastreamento nem SDKs de análise de nenhum tipo.","Você pode apagar todos os seus dados por conta própria, quando quiser, pelo app.","Só compartilhamos dados com os serviços necessários para o app funcionar — a lista completa está abaixo."],"sections":[{"h":"1. Responsável pelos seus dados","ph":"[A completar antes de publicar o app: razão social ou nome completo da pessoa responsável pelo tratamento dos dados, CUIT, endereço legal e, se aplicável, o número de registro do banco de dados na Agência de Acesso à Informação Pública (AAIP) da Argentina.]","p":["Para qualquer dúvida sobre quem administra seus dados e como, escreva para info@zancada.org."]},{"h":"2. Quais dados coletamos","ul":["<strong>Conta e perfil:<\/strong> seu e-mail, seu nome e sua foto de perfil. Se você entra com Google ou Apple, também os dados básicos dessa conta. Se você escolher trocar sua foto, o app pede acesso à câmera ou à galeria do seu dispositivo (opcional): a imagem só é usada no seu perfil dentro do app e não é compartilhada com terceiros.","<strong>Dados de saúde e treino (dados sensíveis):<\/strong> suas corridas (distância, duração, ritmo, rota GPS, cadência, desnível, potência), sua frequência cardíaca e suas zonas, seu peso, altura, data de nascimento e gênero, os desconfortos ou notas de saúde que você registrar e o resultado do teste de nível.","<strong>Localização, inclusive em segundo plano:<\/strong> quando você registra uma corrida com o celular, o app coleta sua localização (GPS) em tempo real e em segundo plano. Isso significa que ele continua registrando sua rota, ritmo e distância mesmo que você minimize o app ou apague a tela, e mostra uma notificação enquanto faz isso. O rastreamento para assim que você finaliza a atividade. Se você sincroniza suas corridas de um relógio, não usamos o GPS do seu celular.","<strong>Perfil esportivo:<\/strong> terreno preferido, tipo de corredor, dias de treino, se você mede por tempo ou por distância, objetivo ou prova próxima, meta semanal, esportes complementares e os tênis que você registra.","<strong>Conversas com o Zonda:<\/strong> as mensagens que você troca com o Zonda, o coach de IA, e o contexto esportivo que ele usa para responder.","<strong>Dados de outros apps e do celular (opcionais):<\/strong> as atividades que você sincroniza do Strava, Polar, Wahoo, COROS, Suunto ou Health Connect (no Android: exercícios, distância e frequência cardíaca) e, se você ativar adicionar seu plano ao calendário do celular, a permissão de calendário, que usamos apenas para criar e apagar seus treinos em um calendário próprio chamado \"Zancada\".","<strong>Preferências técnicas:<\/strong> idioma, sistema de unidades, estado das notificações push e um identificador do seu dispositivo para entregá-las."],"p":["Tratamos esses dados, inclusive os de saúde e localização, com o seu consentimento expresso, que você dá ao criar a conta e ao ativar cada função (o GPS em segundo plano, uma integração, as notificações). Você pode retirá-lo a qualquer momento apagando seus dados pelo app."]},{"h":"3. Como obtemos esses dados","p":["A maioria você mesmo registra no app, ou o celular gera ao registrar uma corrida. Se você conecta seu relógio ou sua conta Strava, Polar, Wahoo, COROS ou Suunto, ou ativa o Health Connect, sincronizamos suas corridas automaticamente de lá (apenas as que você autoriza). Se você entra com Google ou Apple, recebemos os dados básicos que essas plataformas compartilham para identificar você."]},{"h":"4. Para que os usamos","ul":["Gerar e ajustar seu plano de treino semana a semana, e calcular seus ritmos e zonas a partir do teste de nível.","Mostrar seu progresso, histórico, estatísticas e o estado dos seus tênis.","Para que o coach com IA possa dar respostas e sugestões com contexto real sobre você.","Avisar por notificação push sobre sua sessão do dia (se você ativou).","Alertar se sua carga de treino sobe rápido demais ou se seus tênis passaram da vida útil recomendada."],"box":{"label":"Restrição de uso","text":"Os dados de saúde, localização e métricas físicas nunca são usados para fins publicitários ou de marketing, nem vendidos ou cedidos a terceiros ou a corretores de dados (data brokers). Cumprimos as políticas para desenvolvedores da Apple App Store e do Google Play."}},{"h":"5. Com quem compartilhamos dados","p":["Não vendemos seus dados a ninguém nem os usamos para publicidade. Só os compartilhamos com os serviços que fazem o app funcionar:"],"ul":["<strong>Supabase:<\/strong> hospeda o banco de dados onde suas informações ficam guardadas.","<strong>Strava:<\/strong> sincronização bidirecional de atividades, só se você conectar.","<strong>Polar:<\/strong> sincronização das suas corridas, só se você conectar sua conta Polar.","<strong>Wahoo:<\/strong> sincronização das suas corridas e envio dos seus treinos planejados (com intervalos e frequência cardíaca alvo), só se você conectar sua conta Wahoo.","<strong>COROS:<\/strong> sincronização das suas corridas, só se você conectar sua conta COROS.","<strong>Suunto:<\/strong> sincronização das suas corridas e envio dos seus treinos planejados (com intervalos e frequência cardíaca alvo), só se você conectar sua conta Suunto.","<strong>Google e Apple:<\/strong> login, somente se você escolher entrar com sua conta Google ou Apple.","<strong>Firebase Cloud Messaging (Google):<\/strong> recebe um identificador do seu dispositivo para poder entregar as notificações push do coach, se você as ativou.","<strong>Anthropic (Claude):<\/strong> é o modelo de IA por trás do Zonda, nosso coach virtual. Processa o que você escreve e o contexto que precisamos passar para que ele responda com critério: seu perfil, seu plano de treino, seu histórico recente de corridas, suas zonas de frequência cardíaca e as notas ou desconfortos que você registrou. Segundo seus termos para clientes de API, a Anthropic não usa o que enviamos para treinar seus modelos.","<strong>Sentry:<\/strong> recebe informações técnicas quando ocorre um erro no servidor, ou quando alguém tenta acessar uma parte protegida do app sem autorização, para podermos detectar e corrigir. Nunca enviamos sua senha nem dados de pagamento."]},{"h":"Transferência internacional de dados","p":["Esses provedores operam servidores fora da Argentina (por exemplo, nos Estados Unidos e na União Europeia), portanto, ao usar o Zancada, seus dados são transferidos para outros países. Fazemos isso por conexões seguras e somente com provedores que oferecem garantias de segurança adequadas, conforme a Lei argentina 25.326 e, quando aplicável, o Regulamento Geral de Proteção de Dados (RGPD) da União Europeia."]},{"h":"6. Segurança, armazenamento e retenção","p":["Todas as informações são transmitidas com criptografia segura (HTTPS/TLS) e guardadas em servidores com acesso restrito. Seus dados ficam na sua conta enquanto ela existir. O app também guarda uma cópia temporária no seu celular para continuar funcionando sem conexão, que é sincronizada assim que você volta a ter internet.","Quando você apaga sua conta, seus dados pessoais, de saúde e de localização são removidos dos nossos servidores de produção. As cópias de segurança rodam e são destruídas automaticamente em no máximo 30 dias."]},{"h":"7. Cookies, análise e tecnologias semelhantes","p":["O Zancada não usa cookies de publicidade, nem Google Analytics, Meta Pixel ou qualquer outro SDK de análise ou rastreamento, e não compartilhamos seus dados com redes de anúncios. Usamos apenas armazenamento técnico essencial para o app funcionar: manter sua sessão iniciada, guardar uma cópia dos seus dados no celular para funcionar sem conexão e um identificador do seu dispositivo para enviar notificações push (via Firebase Cloud Messaging), se você as ativou. Como não usamos cookies de rastreamento nem ferramentas de análise, não é preciso mostrar um banner de consentimento de cookies."]},{"h":"8. Seus direitos","p":["Suas informações são suas. Você pode apagar todos os seus dados por conta própria a qualquer momento em Perfil → Apagar meus dados. Também pode pedir acesso, retificação ou atualização, portabilidade (uma cópia em formato estruturado) ou exclusão dos seus dados, e retirar seu consentimento, escrevendo para info@zancada.org.","Se você está na Argentina, esses direitos são reconhecidos pela Lei 25.326 de Proteção de Dados Pessoais. O acesso aos seus dados é gratuito em intervalos não inferiores a seis meses, salvo se você comprovar interesse legítimo. A Agência de Acesso à Informação Pública (AAIP), órgão de controle dessa lei, atende denúncias e reclamações por descumprimento.","Se você está na União Europeia ou em outro país com normas próprias de proteção de dados (por exemplo, o RGPD), você tem os direitos equivalentes de acessar, corrigir, apagar, opor-se, limitar o tratamento e levar suas informações, e pode apresentar uma reclamação à autoridade de proteção de dados competente."]},{"h":"9. Menores de idade","p":["O Zancada não é direcionado a menores de 16 anos. Entre 16 e 17 anos você só pode usá-lo com a autorização de seus pais ou responsável legal, que devem consentir o tratamento dos seus dados. Se detectarmos que coletamos dados de um menor sem esse consentimento, excluímos a conta imediatamente."]},{"h":"10. Mudanças nesta política","p":["Se mudarmos esta política de forma importante — em especial a forma como tratamos seus dados sensíveis —, avisaremos de forma destacada dentro do app antes de entrar em vigor. Se você não concordar com a mudança, pode apagar sua conta."]}],"h_contact":"Contato","contact_q":"Dúvidas sobre seus dados ou esta política?","note":"Este documento foi redigido como um modelo geral para um app em desenvolvimento e não constitui aconselhamento jurídico. Antes de lançar o Zancada publicamente, recomendamos que um advogado o revise e o adapte às leis do seu país."},"fr":{"title":"Zancada — Politique de Confidentialité","back":"‹ Retour à Zancada","updated":"Dernière mise à jour : 6 octobre 2026","intro":"Cette politique explique quelles données Zancada collecte, à quoi elles servent et quels choix tu as. On l'a écrite en langage simple, sans jargon juridique inutile.","summary_label":"En bref","summary":["On ne vend pas tes données et on ne les utilise pas pour la publicité. Tes données de santé et de localisation ne servent jamais à de la publicité ni du marketing.","Si tu enregistres une course avec ton téléphone, l'appli utilise ta position (GPS) aussi en arrière-plan, uniquement pendant que la course est active.","On n'utilise aucun cookie de suivi ni SDK d'analyse d'aucune sorte.","Tu peux supprimer toutes tes données toi-même, quand tu veux, depuis l'appli.","On ne partage des données qu'avec les services nécessaires au fonctionnement de l'appli — la liste complète est plus bas."],"sections":[{"h":"1. Responsable de tes données","ph":"[À compléter avant la publication de l'appli : raison sociale ou nom complet de la personne responsable du traitement des données, CUIT, adresse légale et, le cas échéant, numéro d'enregistrement de la base de données auprès de l'Agence d'accès à l'information publique (AAIP) d'Argentine.]","p":["Pour toute question sur qui gère tes données et comment, écris-nous à info@zancada.org."]},{"h":"2. Quelles données on collecte","ul":["<strong>Compte et profil :<\/strong> ton e-mail, ton nom et ta photo de profil. Si tu te connectes avec Google ou Apple, aussi les données de base de ce compte. Si tu choisis de changer ta photo, l'appli demande l'accès à la caméra ou à la galerie de ton appareil (facultatif) : l'image sert uniquement à ton profil dans l'appli et n'est pas partagée avec des tiers.","<strong>Données de santé et d'entraînement (données sensibles) :<\/strong> tes courses (distance, durée, allure, tracé GPS, cadence, dénivelé, puissance), ta fréquence cardiaque et tes zones, ton poids, ta taille, ta date de naissance et ton genre, les gênes ou notes de santé que tu saisis et le résultat du test de niveau.","<strong>Localisation, y compris en arrière-plan :<\/strong> quand tu enregistres une course avec ton téléphone, l'appli collecte ta position (GPS) en temps réel et en arrière-plan. Cela signifie qu'elle continue d'enregistrer ton tracé, ton allure et ta distance même si tu réduis l'appli ou éteins l'écran, et qu'elle affiche une notification pendant ce temps. Le suivi s'arrête dès que tu termines l'activité. Si tu synchronises tes courses depuis une montre, on n'utilise pas le GPS de ton téléphone.","<strong>Profil sportif :<\/strong> terrain préféré, type de coureur, jours d'entraînement, mesure au temps ou à la distance, objectif ou course à venir, objectif hebdomadaire, sports complémentaires et chaussures que tu enregistres.","<strong>Conversations avec Zonda :<\/strong> les messages que tu échanges avec Zonda, le coach IA, et le contexte sportif qu'il utilise pour te répondre.","<strong>Données d'autres applis et du téléphone (facultatif) :<\/strong> les activités que tu synchronises depuis Strava, Polar, Wahoo, COROS, Suunto ou Health Connect (sous Android : exercices, distance et fréquence cardiaque) et, si tu actives l'ajout de ton plan au calendrier du téléphone, l'autorisation d'accès au calendrier, qu'on utilise uniquement pour créer et supprimer tes entraînements dans un calendrier à part appelé « Zancada ».","<strong>Préférences techniques :<\/strong> langue, système d'unités, état des notifications push et un identifiant de ton appareil pour les livrer."],"p":["On traite ces données, y compris celles de santé et de localisation, avec ton consentement exprès, que tu donnes en créant ton compte et en activant chaque fonction (le GPS en arrière-plan, une intégration, les notifications). Tu peux le retirer à tout moment en supprimant tes données depuis l'appli."]},{"h":"3. Comment on obtient ces données","p":["La plupart, tu les saisis directement dans l'appli, ou ton téléphone les génère quand tu enregistres une course. Si tu connectes ta montre ou ton compte Strava, Polar, Wahoo, COROS ou Suunto, ou si tu actives Health Connect, on synchronise tes courses automatiquement depuis là (uniquement celles que tu autorises). Si tu te connectes avec Google ou Apple, on reçoit les données de base que ces plateformes partagent pour t'identifier."]},{"h":"4. À quoi elles servent","ul":["Générer et ajuster ton plan d'entraînement semaine après semaine, et calculer tes allures et zones à partir du test de niveau.","Te montrer ta progression, ton historique, tes statistiques et l'état de tes chaussures.","Permettre au coach IA de te donner des réponses et des suggestions avec un vrai contexte sur toi.","T'avertir par notification push de ta séance du jour (si tu l'as activée).","T'alerter si ta charge d'entraînement augmente trop vite ou si tes chaussures ont dépassé leur durée de vie recommandée."],"box":{"label":"Restriction d'usage","text":"Les données de santé, de localisation et de métriques physiques ne sont jamais utilisées à des fins publicitaires ou de marketing, ni vendues ou cédées à des tiers ou à des courtiers en données (data brokers). On respecte les règles pour développeurs de l'Apple App Store et de Google Play."}},{"h":"5. Avec qui on partage des données","p":["On ne vend tes données à personne et on ne les utilise pas pour la publicité. On les partage uniquement avec les services qui font fonctionner l'appli :"],"ul":["<strong>Supabase :<\/strong> héberge la base de données où sont stockées tes informations.","<strong>Strava :<\/strong> synchronisation bidirectionnelle des activités, uniquement si tu la connectes.","<strong>Polar :<\/strong> synchronisation de tes courses, uniquement si tu connectes ton compte Polar.","<strong>Wahoo :<\/strong> synchronisation de tes courses et envoi de tes entraînements planifiés (avec intervalles et fréquence cardiaque cible), uniquement si tu connectes ton compte Wahoo.","<strong>COROS :<\/strong> synchronisation de tes courses, uniquement si tu connectes ton compte COROS.","<strong>Suunto :<\/strong> synchronisation de tes courses et envoi de tes entraînements planifiés (avec intervalles et fréquence cardiaque cible), uniquement si tu connectes ton compte Suunto.","<strong>Google et Apple :<\/strong> connexion, uniquement si tu choisis de te connecter avec ton compte Google ou Apple.","<strong>Firebase Cloud Messaging (Google) :<\/strong> reçoit un identifiant de ton appareil pour pouvoir te livrer les notifications push du coach, si tu les as activées.","<strong>Anthropic (Claude) :<\/strong> c'est le modèle d'IA derrière Zonda, notre coach virtuel. Il traite ce que tu écris et le contexte qu'on doit lui passer pour qu'il réponde avec discernement : ton profil, ton plan d'entraînement, ton historique récent de courses, tes zones de fréquence cardiaque et les notes ou gênes que tu as enregistrées. Selon ses conditions pour les clients de son API, Anthropic n'utilise pas ce qu'on lui envoie pour entraîner ses modèles.","<strong>Sentry :<\/strong> reçoit des informations techniques quand une erreur survient sur le serveur, ou quand quelqu'un tente d'accéder sans autorisation à une partie protégée de l'appli, pour qu'on puisse la détecter et la corriger. On ne lui envoie jamais ton mot de passe ni de données de paiement."]},{"h":"Transfert international de données","p":["Ces prestataires exploitent des serveurs hors d'Argentine (par exemple aux États-Unis et dans l'Union européenne) : en utilisant Zancada, tes données sont donc transférées vers d'autres pays. On le fait via des connexions sécurisées et uniquement avec des prestataires offrant des garanties de sécurité adéquates, conformément à la loi argentine 25.326 et, le cas échéant, au Règlement général sur la protection des données (RGPD) de l'Union européenne."]},{"h":"6. Sécurité, stockage et conservation","p":["Toutes les informations sont transmises avec un chiffrement sécurisé (HTTPS/TLS) et stockées sur des serveurs à accès restreint. Tes données restent dans ton compte tant que celui-ci existe. L'appli garde aussi une copie temporaire sur ton téléphone pour continuer à fonctionner hors ligne, synchronisée dès que tu retrouves internet.","Quand tu supprimes ton compte, tes données personnelles, de santé et de localisation sont effacées de nos serveurs de production. Les sauvegardes tournent et sont détruites automatiquement dans un délai maximum de 30 jours."]},{"h":"7. Cookies, analyse et technologies similaires","p":["Zancada n'utilise pas de cookies publicitaires, ni Google Analytics, Meta Pixel ou tout autre SDK d'analyse ou de suivi, et on ne partage pas tes données avec des réseaux publicitaires. On utilise uniquement un stockage technique essentiel pour que l'appli fonctionne : garder ta session ouverte, conserver une copie de tes données sur ton téléphone pour le mode hors ligne, et un identifiant de ton appareil pour t'envoyer des notifications push (via Firebase Cloud Messaging) si tu les as activées. Comme on n'utilise ni cookies de suivi ni outils d'analyse, il n'est pas nécessaire d'afficher une bannière de consentement aux cookies."]},{"h":"8. Tes droits","p":["Tes informations t'appartiennent. Tu peux supprimer toutes tes données toi-même à tout moment depuis Profil → Supprimer mes données. Tu peux aussi nous demander l'accès à tes données, leur rectification ou mise à jour, leur portabilité (une copie dans un format structuré) ou leur suppression, et retirer ton consentement, en écrivant à info@zancada.org.","Si tu es en Argentine, ces droits sont reconnus par la loi 25.326 sur la protection des données personnelles. L'accès à tes données est gratuit à intervalles d'au moins six mois, sauf si tu justifies d'un intérêt légitime. L'Agence d'accès à l'information publique (AAIP), organe de contrôle de cette loi, traite les plaintes et réclamations pour manquements.","Si tu es dans l'Union européenne ou dans un autre pays disposant de sa propre réglementation (par exemple le RGPD), tu as les droits équivalents d'accès, de rectification, d'effacement, d'opposition, de limitation du traitement et de portabilité, et tu peux introduire une réclamation auprès de l'autorité de protection des données compétente."]},{"h":"9. Mineurs","p":["Zancada ne s'adresse pas aux moins de 16 ans. Entre 16 et 17 ans, tu ne peux l'utiliser qu'avec l'autorisation de ton parent ou tuteur légal, qui doit consentir au traitement de tes données. Si on détecte qu'on a collecté les données d'un mineur sans ce consentement, on supprime le compte immédiatement."]},{"h":"10. Modifications de cette politique","p":["Si on modifie cette politique de façon importante — notamment la manière dont on traite tes données sensibles —, on te le signalera de façon visible dans l'appli avant son entrée en vigueur. Si tu n'es pas d'accord avec la modification, tu peux supprimer ton compte."]}],"h_contact":"Contact","contact_q":"Des questions sur tes données ou cette politique ?","note":"Ce document a été rédigé comme un modèle général pour une appli en développement et ne constitue pas un conseil juridique. Avant de lancer Zancada publiquement, on te recommande de le faire relire par un avocat et de l'adapter aux lois de ton pays."},"it":{"title":"Zancada — Informativa sulla Privacy","back":"‹ Torna a Zancada","updated":"Ultimo aggiornamento: 6 ottobre 2026","intro":"Questa informativa spiega quali dati raccoglie Zancada, per cosa li usa e quali scelte hai. L'abbiamo scritta in linguaggio semplice, senza giri legali inutili.","summary_label":"In breve","summary":["Non vendiamo i tuoi dati né li usiamo per la pubblicità. I tuoi dati di salute e di posizione non vengono mai usati per pubblicità o marketing.","Se registri una corsa con il telefono, l'app usa la tua posizione (GPS) anche in background, solo mentre la corsa è attiva.","Non usiamo cookie di tracciamento né SDK di analisi di alcun tipo.","Puoi eliminare tutti i tuoi dati da solo, quando vuoi, dall'app.","Condividiamo dati solo con i servizi necessari al funzionamento dell'app — l'elenco completo è più sotto."],"sections":[{"h":"1. Titolare dei tuoi dati","ph":"[Da completare prima della pubblicazione dell'app: ragione sociale o nome completo della persona responsabile del trattamento dei dati, CUIT, indirizzo legale e, se applicabile, numero di registrazione della banca dati presso l'Agenzia per l'accesso all'informazione pubblica (AAIP) argentina.]","p":["Per qualsiasi domanda su chi gestisce i tuoi dati e come, scrivici a info@zancada.org."]},{"h":"2. Quali dati raccogliamo","ul":["<strong>Account e profilo:<\/strong> la tua e-mail, il tuo nome e la tua foto profilo. Se accedi con Google o Apple, anche i dati di base di quell'account. Se scegli di cambiare la foto, l'app chiede l'accesso alla fotocamera o alla galleria del dispositivo (facoltativo): l'immagine serve solo per il tuo profilo nell'app e non viene condivisa con terzi.","<strong>Dati di salute e allenamento (dati sensibili):<\/strong> le tue corse (distanza, durata, ritmo, percorso GPS, cadenza, dislivello, potenza), la tua frequenza cardiaca e le tue zone, peso, altezza, data di nascita e genere, i fastidi o le note di salute che inserisci e il risultato del test di livello.","<strong>Posizione, anche in background:<\/strong> quando registri una corsa con il telefono, l'app raccoglie la tua posizione (GPS) in tempo reale e in background. Ciò significa che continua a registrare percorso, ritmo e distanza anche se riduci a icona l'app o spegni lo schermo, e mostra una notifica mentre lo fa. Il tracciamento si ferma non appena termini l'attività. Se sincronizzi le corse da un orologio, non usiamo il GPS del telefono.","<strong>Profilo sportivo:<\/strong> terreno preferito, tipo di corridore, giorni di allenamento, se misuri a tempo o a distanza, obiettivo o gara in programma, obiettivo settimanale, sport complementari e le scarpe che registri.","<strong>Conversazioni con Zonda:<\/strong> i messaggi che scambi con Zonda, il coach IA, e il contesto sportivo che usa per risponderti.","<strong>Dati di altre app e del telefono (facoltativi):<\/strong> le attività che sincronizzi da Strava, Polar, Wahoo, COROS, Suunto o Health Connect (su Android: esercizi, distanza e frequenza cardiaca) e, se attivi l'aggiunta del piano al calendario del telefono, il permesso del calendario, che usiamo solo per creare ed eliminare i tuoi allenamenti in un calendario dedicato chiamato \"Zancada\".","<strong>Preferenze tecniche:<\/strong> lingua, sistema di unità, stato delle notifiche push e un identificativo del dispositivo per consegnarle."],"p":["Trattiamo questi dati, inclusi quelli di salute e posizione, con il tuo consenso esplicito, che dai creando l'account e attivando ogni funzione (il GPS in background, un'integrazione, le notifiche). Puoi revocarlo in qualsiasi momento eliminando i tuoi dati dall'app."]},{"h":"3. Come otteniamo questi dati","p":["La maggior parte li inserisci tu direttamente nell'app, oppure li genera il telefono quando registri una corsa. Se colleghi il tuo orologio o il tuo account Strava, Polar, Wahoo, COROS o Suunto, o attivi Health Connect, sincronizziamo le tue corse automaticamente da lì (solo quelle che autorizzi). Se accedi con Google o Apple, riceviamo i dati di base che quelle piattaforme condividono per identificarti."]},{"h":"4. Per cosa li usiamo","ul":["Generare e adattare il tuo piano di allenamento settimana dopo settimana, e calcolare ritmi e zone dal test di livello.","Mostrarti i tuoi progressi, lo storico, le statistiche e lo stato delle scarpe.","Permettere al coach IA di darti risposte e suggerimenti con un contesto reale su di te.","Avvisarti con una notifica push della sessione del giorno (se l'hai attivata).","Avvisarti se il carico di allenamento sale troppo in fretta o se le scarpe hanno superato la vita utile consigliata."],"box":{"label":"Limite d'uso","text":"I dati di salute, posizione e metriche fisiche non vengono mai usati per scopi pubblicitari o di marketing, né venduti o ceduti a terzi o a intermediari di dati (data broker). Rispettiamo le norme per sviluppatori di Apple App Store e Google Play."}},{"h":"5. Con chi condividiamo i dati","p":["Non vendiamo i tuoi dati a nessuno né li usiamo per la pubblicità. Li condividiamo solo con i servizi che fanno funzionare l'app:"],"ul":["<strong>Supabase:<\/strong> ospita il database in cui sono salvate le tue informazioni.","<strong>Strava:<\/strong> sincronizzazione bidirezionale delle attività, solo se la colleghi.","<strong>Polar:<\/strong> sincronizzazione delle tue corse, solo se colleghi il tuo account Polar.","<strong>Wahoo:<\/strong> sincronizzazione delle tue corse e invio dei tuoi allenamenti pianificati (con intervalli e frequenza cardiaca obiettivo), solo se colleghi il tuo account Wahoo.","<strong>COROS:<\/strong> sincronizzazione delle tue corse, solo se colleghi il tuo account COROS.","<strong>Suunto:<\/strong> sincronizzazione delle tue corse e invio dei tuoi allenamenti pianificati (con intervalli e frequenza cardiaca obiettivo), solo se colleghi il tuo account Suunto.","<strong>Google e Apple:<\/strong> accesso, solo se scegli di entrare con il tuo account Google o Apple.","<strong>Firebase Cloud Messaging (Google):<\/strong> riceve un identificativo del tuo dispositivo per poterti consegnare le notifiche push del coach, se le hai attivate.","<strong>Anthropic (Claude):<\/strong> è il modello di IA dietro Zonda, il nostro coach virtuale. Elabora ciò che scrivi e il contesto che dobbiamo passargli per rispondere con criterio: il tuo profilo, il tuo piano, il tuo storico recente di corse, le tue zone di frequenza cardiaca e le note o i fastidi che hai registrato. Secondo le sue condizioni per i clienti API, Anthropic non usa ciò che le inviamo per addestrare i suoi modelli.","<strong>Sentry:<\/strong> riceve informazioni tecniche quando si verifica un errore sul server, o quando qualcuno tenta di accedere senza autorizzazione a una parte protetta dell'app, così da poterlo rilevare e risolvere. Non gli inviamo mai la tua password né dati di pagamento."]},{"h":"Trasferimento internazionale dei dati","p":["Questi fornitori gestiscono server fuori dall'Argentina (ad esempio negli Stati Uniti e nell'Unione Europea), quindi usando Zancada i tuoi dati vengono trasferiti in altri paesi. Lo facciamo tramite connessioni sicure e solo con fornitori che offrono adeguate garanzie di sicurezza, in conformità alla legge argentina 25.326 e, ove applicabile, al Regolamento generale sulla protezione dei dati (GDPR) dell'Unione Europea."]},{"h":"6. Sicurezza, archiviazione e conservazione","p":["Tutte le informazioni vengono trasmesse con crittografia sicura (HTTPS/TLS) e conservate su server ad accesso limitato. I tuoi dati restano nel tuo account finché esiste. L'app conserva inoltre una copia temporanea sul telefono per continuare a funzionare offline, che si sincronizza appena torni online.","Quando elimini il tuo account, i tuoi dati personali, di salute e di posizione vengono rimossi dai nostri server di produzione. I backup ruotano e vengono distrutti automaticamente entro un massimo di 30 giorni."]},{"h":"7. Cookie, analisi e tecnologie simili","p":["Zancada non usa cookie pubblicitari, né Google Analytics, Meta Pixel o altri SDK di analisi o tracciamento, e non condividiamo i tuoi dati con reti pubblicitarie. Usiamo solo archiviazione tecnica essenziale per il funzionamento dell'app: mantenere la sessione attiva, conservare una copia dei tuoi dati sul telefono per l'uso offline e un identificativo del dispositivo per inviarti notifiche push (tramite Firebase Cloud Messaging) se le hai attivate. Poiché non usiamo cookie di tracciamento né strumenti di analisi, non serve mostrarti un banner di consenso ai cookie."]},{"h":"8. I tuoi diritti","p":["Le tue informazioni sono tue. Puoi eliminare tutti i tuoi dati da solo in qualsiasi momento da Profilo → Elimina i miei dati. Puoi anche chiederci l'accesso ai tuoi dati, la rettifica o l'aggiornamento, la portabilità (una copia in formato strutturato) o la cancellazione, e revocare il consenso, scrivendo a info@zancada.org.","Se sei in Argentina, questi diritti sono riconosciuti dalla legge 25.326 sulla protezione dei dati personali. L'accesso ai tuoi dati è gratuito a intervalli non inferiori a sei mesi, salvo che tu dimostri un interesse legittimo. L'Agenzia per l'accesso all'informazione pubblica (AAIP), organo di controllo di tale legge, si occupa di denunce e reclami per inadempienze.","Se sei nell'Unione Europea o in un altro paese con una propria normativa (ad esempio il GDPR), hai diritti equivalenti di accesso, rettifica, cancellazione, opposizione, limitazione del trattamento e portabilità, e puoi presentare reclamo all'autorità di protezione dei dati competente."]},{"h":"9. Minori","p":["Zancada non è rivolta a persone sotto i 16 anni. Tra i 16 e i 17 anni puoi usarla solo con l'autorizzazione di un genitore o tutore legale, che deve acconsentire al trattamento dei tuoi dati. Se rileviamo di aver raccolto dati di un minore senza tale consenso, eliminiamo subito l'account."]},{"h":"10. Modifiche a questa informativa","p":["Se modifichiamo questa informativa in modo significativo — in particolare il modo in cui trattiamo i tuoi dati sensibili —, te lo segnaleremo in modo evidente nell'app prima che entri in vigore. Se non sei d'accordo con la modifica, puoi eliminare il tuo account."]}],"h_contact":"Contatto","contact_q":"Domande sui tuoi dati o su questa informativa?","note":"Questo documento è stato redatto come modello generale per un'app in sviluppo e non costituisce consulenza legale. Prima di lanciare Zancada pubblicamente, ti consigliamo di farlo revisionare da un avvocato e di adattarlo alle leggi del tuo paese."},"de":{"title":"Zancada — Datenschutzerklärung","back":"‹ Zurück zu Zancada","updated":"Zuletzt aktualisiert: 6. Oktober 2026","intro":"Diese Erklärung beschreibt, welche Daten Zancada erhebt, wofür sie verwendet werden und welche Möglichkeiten du hast. Wir haben sie in einfacher Sprache geschrieben, ohne unnötiges Juristendeutsch.","summary_label":"Auf einen Blick","summary":["Wir verkaufen deine Daten nicht und verwenden sie nicht für Werbung. Deine Gesundheits- und Standortdaten werden nie für Werbung oder Marketing genutzt.","Wenn du einen Lauf mit dem Handy aufzeichnest, nutzt die App deinen Standort (GPS) auch im Hintergrund, nur solange der Lauf aktiv ist.","Wir verwenden keine Tracking-Cookies und keine Analyse-SDKs jeglicher Art.","Du kannst alle deine Daten jederzeit selbst in der App löschen.","Wir teilen Daten nur mit den Diensten, die für den Betrieb der App nötig sind — die vollständige Liste steht weiter unten."],"sections":[{"h":"1. Verantwortlicher für deine Daten","ph":"[Vor Veröffentlichung der App zu ergänzen: Firmenname oder vollständiger Name der für die Datenverarbeitung verantwortlichen Person, CUIT, Rechtsanschrift und gegebenenfalls Registrierungsnummer der Datenbank bei der argentinischen Behörde für Zugang zu öffentlichen Informationen (AAIP).]","p":["Für Fragen dazu, wer deine Daten verwaltet und wie, schreib uns an info@zancada.org."]},{"h":"2. Welche Daten wir erheben","ul":["<strong>Konto und Profil:<\/strong> deine E-Mail-Adresse, dein Name und dein Profilfoto. Wenn du dich mit Google oder Apple anmeldest, auch die Basisdaten dieses Kontos. Wenn du dein Foto ändern möchtest, bittet die App um Zugriff auf Kamera oder Galerie deines Geräts (optional): Das Bild wird nur für dein Profil in der App verwendet und nicht an Dritte weitergegeben.","<strong>Gesundheits- und Trainingsdaten (sensible Daten):<\/strong> deine Läufe (Distanz, Dauer, Tempo, GPS-Strecke, Schrittfrequenz, Höhenmeter, Leistung), deine Herzfrequenz und Zonen, dein Gewicht, deine Größe, dein Geburtsdatum und Geschlecht, Beschwerden oder Gesundheitsnotizen, die du einträgst, und das Ergebnis des Leistungstests.","<strong>Standort, auch im Hintergrund:<\/strong> Wenn du einen Lauf mit deinem Handy aufzeichnest, erfasst die App deinen Standort (GPS) in Echtzeit und im Hintergrund. Das heißt, sie zeichnet Strecke, Tempo und Distanz weiter auf, auch wenn du die App minimierst oder den Bildschirm ausschaltest, und zeigt währenddessen eine Benachrichtigung an. Die Aufzeichnung endet, sobald du die Aktivität beendest. Wenn du deine Läufe von einer Uhr synchronisierst, nutzen wir das GPS deines Handys nicht.","<strong>Sportprofil:<\/strong> bevorzugtes Terrain, Läufertyp, Trainingstage, ob du nach Zeit oder Distanz misst, Ziel oder anstehender Wettkampf, Wochenziel, ergänzende Sportarten und die Schuhe, die du erfasst.","<strong>Gespräche mit Zonda:<\/strong> die Nachrichten, die du mit Zonda, dem KI-Coach, austauschst, und der sportliche Kontext, den er zum Antworten nutzt.","<strong>Daten aus anderen Apps und vom Handy (optional):<\/strong> Aktivitäten, die du von Strava, Polar, Wahoo, COROS, Suunto oder Health Connect synchronisierst (unter Android: Übungen, Distanz und Herzfrequenz) und, wenn du das Hinzufügen deines Plans zum Handykalender aktivierst, die Kalenderberechtigung, die wir nur nutzen, um deine Trainings in einem eigenen Kalender namens „Zancada“ anzulegen und zu löschen.","<strong>Technische Einstellungen:<\/strong> Sprache, Einheitensystem, Status der Push-Benachrichtigungen und eine Gerätekennung für deren Zustellung."],"p":["Wir verarbeiten diese Daten, einschließlich der Gesundheits- und Standortdaten, mit deiner ausdrücklichen Einwilligung, die du beim Erstellen des Kontos und beim Aktivieren jeder Funktion (Hintergrund-GPS, eine Integration, Benachrichtigungen) erteilst. Du kannst sie jederzeit widerrufen, indem du deine Daten in der App löschst."]},{"h":"3. Wie wir diese Daten erhalten","p":["Das meiste trägst du direkt in der App ein oder dein Handy erzeugt es, wenn du einen Lauf aufzeichnest. Wenn du deine Uhr oder dein Strava-, Polar-, Wahoo-, COROS- oder Suunto-Konto verbindest oder Health Connect aktivierst, synchronisieren wir deine Läufe automatisch von dort (nur die, die du freigibst). Wenn du dich mit Google oder Apple anmeldest, erhalten wir die Basisdaten, die diese Plattformen zur Identifizierung teilen."]},{"h":"4. Wofür wir sie verwenden","ul":["Deinen Trainingsplan Woche für Woche erstellen und anpassen sowie Tempi und Zonen aus dem Leistungstest berechnen.","Dir Fortschritt, Verlauf, Statistiken und den Zustand deiner Schuhe zeigen.","Dem KI-Coach ermöglichen, dir Antworten und Vorschläge mit echtem Kontext zu dir zu geben.","Dich per Push-Benachrichtigung an deine Tageseinheit erinnern (wenn aktiviert).","Dich warnen, wenn deine Trainingsbelastung zu schnell steigt oder deine Schuhe ihre empfohlene Lebensdauer überschritten haben."],"box":{"label":"Nutzungsbeschränkung","text":"Gesundheits-, Standort- und körperliche Messdaten werden niemals für Werbe- oder Marketingzwecke verwendet und weder an Dritte noch an Datenhändler (Data Broker) verkauft oder weitergegeben. Wir halten die Entwicklerrichtlinien des Apple App Store und von Google Play ein."}},{"h":"5. Mit wem wir Daten teilen","p":["Wir verkaufen deine Daten an niemanden und nutzen sie nicht für Werbung. Wir teilen sie ausschließlich mit den Diensten, die die App zum Laufen bringen:"],"ul":["<strong>Supabase:<\/strong> hostet die Datenbank, in der deine Informationen gespeichert sind.","<strong>Strava:<\/strong> bidirektionale Synchronisierung von Aktivitäten, nur wenn du sie verbindest.","<strong>Polar:<\/strong> Synchronisierung deiner Läufe, nur wenn du dein Polar-Konto verbindest.","<strong>Wahoo:<\/strong> Synchronisierung deiner Läufe und Übermittlung deiner geplanten Trainings (mit Intervallen und Ziel-Herzfrequenz), nur wenn du dein Wahoo-Konto verbindest.","<strong>COROS:<\/strong> Synchronisierung deiner Läufe, nur wenn du dein COROS-Konto verbindest.","<strong>Suunto:<\/strong> Synchronisierung deiner Läufe und Übermittlung deiner geplanten Trainings (mit Intervallen und Ziel-Herzfrequenz), nur wenn du dein Suunto-Konto verbindest.","<strong>Google und Apple:<\/strong> Anmeldung, nur wenn du dich mit deinem Google- oder Apple-Konto anmeldest.","<strong>Firebase Cloud Messaging (Google):<\/strong> erhält eine Gerätekennung, um dir die Push-Benachrichtigungen des Coaches zuzustellen, falls du sie aktiviert hast.","<strong>Anthropic (Claude):<\/strong> das KI-Modell hinter Zonda, unserem virtuellen Coach. Es verarbeitet, was du schreibst, und den Kontext, den wir ihm übergeben müssen, damit es sinnvoll antworten kann: dein Profil, deinen Trainingsplan, deinen jüngsten Laufverlauf, deine Herzfrequenzzonen und die Notizen oder Beschwerden, die du erfasst hast. Nach den Bedingungen für API-Kunden verwendet Anthropic die an sie gesendeten Daten nicht zum Training ihrer Modelle.","<strong>Sentry:<\/strong> erhält technische Informationen, wenn ein Serverfehler auftritt oder jemand unbefugt auf einen geschützten Teil der App zugreifen will, damit wir das erkennen und beheben können. Wir senden ihm nie dein Passwort oder Zahlungsdaten."]},{"h":"Internationale Datenübermittlung","p":["Diese Anbieter betreiben Server außerhalb Argentiniens (zum Beispiel in den USA und der Europäischen Union); durch die Nutzung von Zancada werden deine Daten daher in andere Länder übermittelt. Wir tun das über sichere Verbindungen und nur mit Anbietern, die angemessene Sicherheitsgarantien bieten, gemäß dem argentinischen Gesetz 25.326 und, soweit anwendbar, der Datenschutz-Grundverordnung (DSGVO) der Europäischen Union."]},{"h":"6. Sicherheit, Speicherung und Aufbewahrung","p":["Alle Informationen werden mit sicherer Verschlüsselung (HTTPS/TLS) übertragen und auf Servern mit beschränktem Zugriff gespeichert. Deine Daten bleiben in deinem Konto, solange es besteht. Die App speichert außerdem eine temporäre Kopie auf deinem Handy, damit sie offline weiterarbeiten kann; sie wird synchronisiert, sobald du wieder online bist.","Wenn du dein Konto löschst, werden deine personenbezogenen Daten, Gesundheits- und Standortdaten von unseren Produktionsservern entfernt. Datensicherungen rotieren und werden automatisch innerhalb von höchstens 30 Tagen vernichtet."]},{"h":"7. Cookies, Analyse und ähnliche Technologien","p":["Zancada verwendet keine Werbe-Cookies, kein Google Analytics, keinen Meta Pixel und kein anderes Analyse- oder Tracking-SDK, und wir geben deine Daten nicht an Werbenetzwerke weiter. Wir nutzen ausschließlich technisch notwendigen Speicher, damit die App funktioniert: deine Sitzung aktiv halten, eine Kopie deiner Daten auf dem Handy für den Offline-Betrieb ablegen und eine Gerätekennung, um dir Push-Benachrichtigungen (über Firebase Cloud Messaging) zu senden, falls du sie aktiviert hast. Da wir weder Tracking-Cookies noch Analysetools verwenden, ist kein Cookie-Einwilligungsbanner nötig."]},{"h":"8. Deine Rechte","p":["Deine Informationen gehören dir. Du kannst jederzeit alle deine Daten selbst löschen unter Profil → Meine Daten löschen. Du kannst uns auch um Auskunft, Berichtigung oder Aktualisierung, Übertragbarkeit (eine Kopie in strukturiertem Format) oder Löschung deiner Daten bitten und deine Einwilligung widerrufen, indem du an info@zancada.org schreibst.","Wenn du in Argentinien bist, sind diese Rechte durch das Gesetz 25.326 zum Schutz personenbezogener Daten anerkannt. Die Auskunft über deine Daten ist kostenlos in Abständen von mindestens sechs Monaten, sofern du kein berechtigtes Interesse nachweist. Die Behörde für Zugang zu öffentlichen Informationen (AAIP), Kontrollorgan dieses Gesetzes, bearbeitet Beschwerden und Anzeigen wegen Verstößen.","Wenn du in der Europäischen Union oder in einem anderen Land mit eigenen Datenschutzvorschriften (z. B. der DSGVO) bist, hast du die entsprechenden Rechte auf Auskunft, Berichtigung, Löschung, Widerspruch, Einschränkung der Verarbeitung und Datenübertragbarkeit und kannst bei der zuständigen Datenschutzbehörde Beschwerde einlegen."]},{"h":"9. Minderjährige","p":["Zancada richtet sich nicht an Personen unter 16 Jahren. Zwischen 16 und 17 Jahren darfst du sie nur mit Zustimmung deiner Eltern oder deines gesetzlichen Vertreters nutzen, die der Verarbeitung deiner Daten zustimmen müssen. Wenn wir feststellen, dass wir Daten eines Minderjährigen ohne diese Zustimmung erhoben haben, löschen wir das Konto sofort."]},{"h":"10. Änderungen dieser Erklärung","p":["Wenn wir diese Erklärung wesentlich ändern — insbesondere die Art, wie wir deine sensiblen Daten behandeln —, weisen wir dich vor Inkrafttreten deutlich in der App darauf hin. Wenn du mit der Änderung nicht einverstanden bist, kannst du dein Konto löschen."]}],"h_contact":"Kontakt","contact_q":"Fragen zu deinen Daten oder dieser Erklärung?","note":"Dieses Dokument wurde als allgemeine Vorlage für eine App in Entwicklung verfasst und stellt keine Rechtsberatung dar. Bevor du Zancada öffentlich veröffentlichst, empfehlen wir, es von einem Anwalt prüfen und an die Gesetze deines Landes anpassen zu lassen."}};
const LANG_LABELS = {es:'ES', en:'EN', pt:'PT', fr:'FR', it:'IT', de:'DE'};
const LANG_NAMES = {es:'es', en:'en-US', pt:'pt-BR', fr:'fr', it:'it', de:'de'};

function detectLang(){
  const url = new URL(window.location.href);
  const q = url.searchParams.get('lang');
  if(q && L[q]) return q;
  try{
    const saved = localStorage.getItem('zancada_legal_lang');
    if(saved && L[saved]) return saved;
  }catch(e){}
  const nav = (navigator.language || 'es').slice(0,2).toLowerCase();
  if(L[nav]) return nav;
  return 'es';
}

// Cada documento es una lista de secciones: título, párrafos, lista, recuadro de aviso o recuadro "a completar".
// El texto es propio (no viene de usuarios), por eso se arma con innerHTML para poder usar <strong> y <a>.
function renderSection(s){
  let html = '<h2>' + s.h + '</h2>';
  if(s.ph) html += '<div class="placeholder-box"><p>' + s.ph + '</p></div>';
  (s.p || []).forEach(t => { html += '<p>' + t + '</p>'; });
  if(s.ul) html += '<ul>' + s.ul.map(i => '<li>' + i + '</li>').join('') + '</ul>';
  if(s.box) html += '<div class="health-box"><p class="health-label">' + s.box.label + '</p><p>' + s.box.text + '</p></div>';
  return html;
}

function render(code){
  const d = L[code];
  document.documentElement.lang = LANG_NAMES[code] || code;
  document.getElementById('page-title').textContent = d.title;
  document.getElementById('back-link').textContent = d.back;
  document.getElementById('t-title').textContent = d.title.replace(/^Zancada\s*—\s*/, '');
  document.getElementById('t-updated').textContent = d.updated;
  document.getElementById('t-intro').textContent = d.intro;
  document.getElementById('t-summary-label').textContent = d.summary_label;
  document.getElementById('t-summary').innerHTML = d.summary.map(item=>'<li>' + item + '</li>').join('');
  document.getElementById('t-sections').innerHTML = d.sections.map(renderSection).join('');
  document.getElementById('t-h-contact').textContent = d.h_contact;
  document.getElementById('t-contact-q').textContent = d.contact_q;
  document.getElementById('t-note').textContent = d.note;
  document.querySelectorAll('.lang-pill').forEach(p=>p.classList.toggle('active', p.dataset.v===code));
  try{ localStorage.setItem('zancada_legal_lang', code); }catch(e){}
}

const langRow = document.getElementById('lang-row');
Object.keys(LANG_LABELS).forEach(code=>{
  const el = document.createElement('div');
  el.className = 'lang-pill';
  el.dataset.v = code;
  el.textContent = LANG_LABELS[code];
  el.onclick = ()=>render(code);
  langRow.appendChild(el);
});

render(detectLang());
</script>
</body>
</html>
