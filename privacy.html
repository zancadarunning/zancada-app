<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title id="page-title">Zancada — Política de Privacidad</title>
<link rel="canonical" href="https://zancada.org/privacy.html">
<meta name="theme-color" content="#ffffff">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#ffffff; --ink:#1a1a1a; --ink-soft:#4a4a4a; --ink-faint:#767676;
    --line:#c9c9c9; --line-soft:#e2e2e2;
  }
  *{box-sizing:border-box;}
  html,body{margin:0; padding:0; background:var(--paper);}
  body{font-family:'Source Serif 4', Georgia, 'Times New Roman', serif; color:var(--ink); line-height:1.7; -webkit-font-smoothing:antialiased;}
  .wrap{max-width:680px; margin:0 auto; padding:56px 28px 90px;}
  .back{display:inline-block; color:var(--ink-faint); text-decoration:none; font-size:13px; margin-bottom:24px; border-bottom:1px solid transparent;}
  .back:hover{color:var(--ink); border-bottom-color:var(--ink);}
  .lang-row{display:flex; gap:0; flex-wrap:wrap; margin-bottom:32px; border-bottom:1px solid var(--line-soft); padding-bottom:14px;}
  .lang-pill{padding:0; margin-right:16px; border:none; background:none;
    color:var(--ink-faint); font-family:inherit; font-size:12.5px; letter-spacing:.03em; text-transform:uppercase; cursor:pointer;}
  .lang-pill.active{color:var(--ink); text-decoration:underline; text-underline-offset:3px;}
  h1{font-weight:700; letter-spacing:.01em; font-size:29px; margin:0 0 8px; text-align:center;}
  .updated{color:var(--ink-faint); font-size:12.5px; margin:0 0 36px; text-align:center; font-style:italic;}
  .summary-box{border-top:1px solid var(--ink); border-bottom:1px solid var(--ink); padding:20px 0; margin-bottom:8px;}
  .summary-box .summary-label{font-size:11px; font-weight:700; letter-spacing:.12em; text-transform:uppercase; color:var(--ink); margin:0 0 12px;}
  .summary-box ul{margin:0; padding-left:18px;}
  .summary-box li{color:var(--ink-soft); font-size:14px; margin-bottom:7px;}
  .summary-box li:last-child{margin-bottom:0;}
  h2{font-weight:700; letter-spacing:0; font-size:17px; color:var(--ink); margin:38px 0 12px; padding-bottom:6px; border-bottom:1px solid var(--line-soft);}
  p, li{color:var(--ink-soft); font-size:15px;}
  strong{color:var(--ink); font-weight:600;}
  ul{padding-left:20px;}
  li{margin-bottom:8px;}
  a{color:var(--ink); text-decoration:underline; text-underline-offset:2px;}
  .health-box{border:1px solid var(--ink); padding:18px 20px; margin-top:12px;}
  .health-box .health-label{font-size:11px; font-weight:700; letter-spacing:.12em; text-transform:uppercase; color:var(--ink); margin:0 0 10px;}
  .health-box p{color:var(--ink); margin:0; font-size:14.5px;}
  .placeholder-box{border:1px solid var(--ink); padding:16px 18px; margin-top:4px;}
  .placeholder-box p{color:var(--ink); margin:0; font-size:13.5px; font-style:italic;}
  .note{border-top:1px solid var(--line); padding-top:16px; font-size:13px; color:var(--ink-faint); margin-top:56px; font-style:italic;}
  .contact{border:1px solid var(--line-soft); padding:18px 20px; margin-top:16px;}
  @media print{ .lang-row, .back{display:none;} }
</style>
</head>
<body>
<div class="wrap">
  <a class="back" id="back-link" href="/">‹ Volver a Zancada</a>
  <div class="lang-row" id="lang-row"></div>

  <h1 id="t-title"></h1>
  <p class="updated" id="t-updated"></p>
  <p id="t-intro"></p>

  <div class="summary-box">
    <p class="summary-label" id="t-summary-label"></p>
    <ul id="t-summary"></ul>
  </div>

  <div id="t-sections"></div>

  <h2 id="t-h-contact"></h2>
  <div class="contact">
    <p style="margin:0;" id="t-contact-q"></p>
    <p style="margin:4px 0 0;"><a href="mailto:info@zancada.org">info@zancada.org</a></p>
  </div>

  <div class="note" id="t-note"></div>
</div>

<script src="/js/legal-privacy.js"></script>
</body>
</html>
