<script>
const L = {"es":{"title":"Zancada — Política de Privacidad","back":"‹ Volver a Zancada","updated":"Última actualización: 6 de octubre de 2026","intro":"La presente Política de Privacidad describe cómo Zancada recopila, utiliza, comparte y protege los datos personales de sus usuarios, y cuáles son los derechos y opciones que les asisten. Se redacta en lenguaje claro y debe leerse junto con los Términos y Condiciones del servicio.","summary_label":"En resumen","summary":["Zancada no vende los datos personales ni los utiliza con fines publicitarios. Los datos de salud, ubicación y métricas físicas nunca se usan para publicidad ni marketing.","Cuando el Usuario registra una carrera con su teléfono, la aplicación utiliza su ubicación (GPS) también en segundo plano, únicamente mientras la actividad está en curso.","No se utilizan cookies de seguimiento ni herramientas de analítica de ningún tipo.","El Usuario puede eliminar todos sus datos en cualquier momento desde la aplicación.","Los datos solo se comparten con los proveedores necesarios para el funcionamiento del servicio, detallados en la sección 6."],"sections":[{"h":"1. Alcance y responsable del tratamiento","p":["Esta Política se aplica a la aplicación móvil Zancada, a su versión web y a los servicios, funciones y sitios relacionados (en conjunto, los \"Servicios\"). En esta Política, \"Zancada\", \"nosotros\" y \"nuestro\" designan al responsable del tratamiento indicado a continuación; \"Usuario\" designa a la persona que utiliza los Servicios."],"ph":"[A completar antes de publicar la app]: razón social o nombre completo del responsable del tratamiento de los datos, CUIT, domicilio legal, correo de contacto y, si corresponde, número de inscripción de la base de datos ante la Agencia de Acceso a la Información Pública (AAIP) de la República Argentina.","p2":[]},{"h":"2. Datos personales que recopilamos","p":["Según las funciones que el Usuario utilice, Zancada trata las siguientes categorías de datos:"],"ul":["<strong>Datos de cuenta y perfil:<\/strong> correo electrónico, nombre, foto de perfil y contraseña (esta última, protegida por el proveedor de autenticación). Si el Usuario inicia sesión con Google o Apple, se reciben además los datos básicos que esas plataformas comparten. Si el Usuario decide cambiar su foto, la aplicación solicita acceso a la cámara o a la galería del dispositivo, de forma opcional; la imagen se utiliza exclusivamente para el perfil dentro de la aplicación y no se comparte con terceros.","<strong>Datos de salud y entrenamiento (datos sensibles):<\/strong> carreras registradas (distancia, duración, ritmo, ruta GPS, cadencia, desnivel, potencia), frecuencia cardíaca y zonas configuradas, peso, altura, fecha de nacimiento y género, molestias o notas de salud que el Usuario cargue voluntariamente, y el resultado del test de nivel.","<strong>Métricas calculadas:<\/strong> ritmos de entrenamiento, zonas, índices de rendimiento y ajustes del plan que Zancada genera a partir de los datos anteriores.","<strong>Ubicación, incluso en segundo plano:<\/strong> cuando el Usuario registra una carrera con su teléfono, la aplicación recopila su ubicación precisa (GPS) en tiempo real y en segundo plano. Ello implica que continúa registrando la ruta, el ritmo y la distancia aunque la aplicación esté minimizada o la pantalla apagada, y que se muestra una notificación mientras lo hace. El seguimiento se detiene al finalizar la actividad. Si el Usuario sincroniza sus carreras desde un reloj, no se utiliza el GPS del teléfono. El uso prolongado del GPS puede incrementar el consumo de batería.","<strong>Perfil deportivo:<\/strong> terreno preferido, tipo de corredor, días de entrenamiento, preferencia de medición por tiempo o por distancia, objetivo o carrera próxima, meta semanal, deportes complementarios y calzado registrado.","<strong>Conversaciones con Zonda:<\/strong> los mensajes intercambiados con Zonda, el asistente virtual basado en Inteligencia Artificial, y el contexto deportivo necesario para responder.","<strong>Datos provenientes de dispositivos y aplicaciones de terceros (opcionales):<\/strong> actividades sincronizadas desde Strava, Polar, Wahoo, COROS, Suunto o Health Connect (en Android: ejercicios, distancia y frecuencia cardíaca). Si el Usuario activa la incorporación de su plan al calendario del teléfono, se utiliza el permiso de calendario únicamente para crear y eliminar los entrenamientos en un calendario propio denominado \"Zancada\".","<strong>Datos de soporte:<\/strong> la información que el Usuario nos envía al solicitar asistencia o enviar comentarios.","<strong>Datos técnicos del dispositivo:<\/strong> dirección IP, tipo de dispositivo y versión del sistema operativo, versión de la aplicación, registros de errores e identificadores del dispositivo necesarios para entregar notificaciones push.","<strong>Preferencias:<\/strong> idioma, sistema de unidades y estado de las notificaciones.","<strong>Datos de pago:<\/strong> Zancada no recopila ni almacena datos de tarjetas. Los pagos se procesan exclusivamente a través de Apple App Store o Google Play, que informan a Zancada únicamente el estado de la suscripción."],"p2":["Estos datos, incluidos los de salud y ubicación, se tratan con el consentimiento expreso del Usuario, que se presta al crear la cuenta y al activar cada función (por ejemplo, el GPS en segundo plano, una integración o las notificaciones). El consentimiento puede retirarse en cualquier momento eliminando los datos desde la aplicación, sin que ello afecte la licitud del tratamiento previo."]},{"h":"3. Fuentes de los datos","p":["La mayor parte de los datos es aportada directamente por el Usuario o generada por su teléfono al registrar una actividad. Asimismo, se obtienen datos de: (a) dispositivos y aplicaciones que el Usuario decide conectar (Strava, Polar, Wahoo, COROS, Suunto, Health Connect), de los cuales solo se importan las actividades autorizadas; (b) las cuentas de terceros con las que el Usuario inicia sesión (Google o Apple); y (c) proveedores de servicios, por ejemplo, los informes técnicos de errores.","Cuando los datos de salud provienen de dispositivos o aplicaciones conectados, Zancada los utiliza exclusivamente para prestar las funciones descritas en esta Política y no los vende, no los utiliza con fines publicitarios y no los cede a terceros sin el consentimiento del Usuario."]},{"h":"4. Finalidades y bases legales del tratamiento","p":["Zancada trata los datos personales para las siguientes finalidades, apoyándose en las bases legales indicadas:"],"ul":["<strong>Prestar los Servicios:<\/strong> crear y administrar la cuenta, generar y ajustar el plan de entrenamiento, calcular ritmos y zonas a partir del test de nivel, registrar y analizar actividades, mostrar el progreso, el historial y el estado del calzado. Base legal: ejecución del contrato (Términos y Condiciones) y consentimiento.","<strong>Asistencia con Inteligencia Artificial:<\/strong> permitir que Zonda responda con contexto real sobre el Usuario. Base legal: ejecución del contrato y consentimiento.","<strong>Notificaciones y alertas:<\/strong> avisar la sesión del día y alertar sobre aumentos rápidos de la carga de entrenamiento o el desgaste del calzado, cuando el Usuario las haya activado. Base legal: consentimiento.","<strong>Soporte y comunicaciones del servicio:<\/strong> responder consultas y comunicar cambios relevantes en los Términos o en esta Política. Base legal: ejecución del contrato e interés legítimo.","<strong>Seguridad, prevención de abusos y mejora técnica:<\/strong> detectar y corregir errores, proteger la integridad de los Servicios y prevenir accesos no autorizados. Base legal: interés legítimo.","<strong>Cumplimiento de obligaciones legales:<\/strong> atender requerimientos de autoridades competentes y obligaciones contables o fiscales vinculadas a las suscripciones. Base legal: obligación legal."],"box":{"label":"Restricción de uso","text":"Los datos de salud, ubicación y métricas físicas nunca se utilizan con fines publicitarios ni de marketing, y no se venden ni se ceden a terceros ni a intermediarios de datos (data brokers). Zancada cumple las políticas para desarrolladores de Apple App Store y Google Play."}},{"h":"5. Decisiones automatizadas e Inteligencia Artificial","p":["Los planes de entrenamiento, sus ajustes semanales y las respuestas de Zonda se generan de forma automatizada a partir de los datos del Usuario. Estas herramientas tienen carácter orientativo y no producen decisiones con efectos jurídicos ni que afecten significativamente al Usuario. El Usuario puede modificar su plan, solicitar su revisión y ejercer los derechos descritos en la sección 11 escribiendo a info@zancada.org.","Para generar las respuestas de Zonda, Zancada envía a Anthropic (Claude) el texto del Usuario y el contexto estrictamente necesario: perfil, plan, historial reciente de carreras, zonas de frecuencia cardíaca y notas o molestias registradas. Conforme a sus condiciones para clientes de su API, Anthropic no utiliza esa información para entrenar sus modelos."]},{"h":"6. Destinatarios de los datos","p":["Zancada no vende los datos personales. Los datos se comunican únicamente a los siguientes proveedores y terceros, en la medida necesaria para el funcionamiento del servicio:"],"ul":["<strong>Supabase:<\/strong> aloja la base de datos donde se almacena la información del Usuario.","<strong>Vercel:<\/strong> aloja la aplicación web y las funciones de servidor.","<strong>Strava:<\/strong> sincronización bidireccional de actividades, solo si el Usuario la conecta.","<strong>Polar:<\/strong> sincronización de carreras, solo si el Usuario conecta su cuenta.","<strong>Wahoo:<\/strong> sincronización de carreras y envío de los entrenamientos planificados (con intervalos y pulso objetivo), solo si el Usuario conecta su cuenta.","<strong>COROS:<\/strong> sincronización de carreras, solo si el Usuario conecta su cuenta.","<strong>Suunto:<\/strong> sincronización de carreras y envío de los entrenamientos planificados (con intervalos y pulso objetivo), solo si el Usuario conecta su cuenta.","<strong>Google y Apple:<\/strong> inicio de sesión, únicamente si el Usuario elige ingresar con su cuenta de Google o de Apple, y suscripciones a través de sus tiendas.","<strong>Firebase Cloud Messaging (Google):<\/strong> recibe un identificador del dispositivo para entregar las notificaciones push, si el Usuario las activó.","<strong>Anthropic (Claude):<\/strong> modelo de Inteligencia Artificial que da funcionamiento a Zonda, en los términos de la sección 5.","<strong>Sentry:<\/strong> recibe información técnica cuando ocurre un error en el servidor o se intenta un acceso no autorizado a una parte protegida de la aplicación. Nunca se le envían contraseñas ni datos de pago."],"p2":["Los proveedores actúan por cuenta de Zancada, solo acceden a la información necesaria para su función y están obligados a protegerla. Adicionalmente, Zancada podrá conservar o comunicar datos cuando sea exigido por la ley o por una orden de autoridad competente, o cuando resulte razonablemente necesario para prevenir un daño grave a las personas, detectar fraudes o abusos, o ejercer o defender derechos en un procedimiento legal. En caso de fusión, adquisición o transferencia del negocio, los datos podrán transferirse al sucesor, previa notificación al Usuario y sujetos a esta Política."]},{"h":"7. Transferencias internacionales de datos","p":["Los proveedores mencionados operan servidores fuera de la República Argentina (por ejemplo, en los Estados Unidos y en la Unión Europea), por lo que el uso de los Servicios implica la transferencia internacional de datos personales. Dichas transferencias se realizan mediante conexiones seguras y únicamente con proveedores que ofrecen garantías adecuadas de protección, mediante cláusulas contractuales tipo u otros mecanismos reconocidos, conforme a la Ley 25.326 y, cuando corresponde, al Reglamento General de Protección de Datos (RGPD) de la Unión Europea. Al utilizar los Servicios, el Usuario presta su consentimiento informado a estas transferencias. Puede solicitar información sobre las garantías aplicables escribiendo a info@zancada.org."]},{"h":"8. Seguridad de la información","p":["Zancada aplica medidas técnicas, administrativas y físicas razonables para proteger los datos contra acceso no autorizado, pérdida, alteración o divulgación: cifrado en tránsito (HTTPS/TLS), servidores con acceso restringido, control de autorizaciones por usuario y monitoreo de errores. Ningún sistema es infalible. Si se produjera un incidente de seguridad que afecte los datos personales del Usuario, Zancada lo notificará conforme a la normativa aplicable."]},{"h":"9. Conservación y eliminación de los datos","p":["Los datos se conservan en la cuenta del Usuario mientras esta se encuentre activa. La aplicación guarda además una copia temporal en el teléfono para funcionar sin conexión, que se sincroniza al recuperar internet. Los registros técnicos de errores se conservan por un período limitado, que no supera los 90 días.","Al eliminar la cuenta (Perfil → Borrar mis datos), los datos personales, de salud y de ubicación se suprimen de los servidores de producción; las copias de seguridad rotan y se destruyen automáticamente en un plazo máximo de 30 días. Zancada podrá eliminar las cuentas que permanezcan inactivas por más de tres años, previo aviso al correo registrado. Los datos que deban conservarse por obligaciones legales (por ejemplo, fiscales o contables) se mantendrán únicamente por el plazo exigido."]},{"h":"10. Cookies, analítica y tecnologías similares","p":["Zancada no utiliza cookies publicitarias, Google Analytics, Meta Pixel ni ningún otro SDK de analítica o rastreo, y no comparte datos con redes publicitarias. Solo se emplea almacenamiento técnico esencial para el funcionamiento de la aplicación: mantener la sesión iniciada, guardar una copia de los datos en el teléfono para el uso sin conexión y un identificador del dispositivo para entregar notificaciones push (mediante Firebase Cloud Messaging), si fueron activadas. Al no utilizarse cookies de rastreo ni herramientas de analítica, no resulta necesario un banner de consentimiento de cookies, y no se procesan señales \"No rastrear\" ni de control global de privacidad porque no existe seguimiento publicitario."]},{"h":"11. Derechos del titular de los datos y cómo ejercerlos","p":["El titular de los datos puede, en cualquier momento: acceder a sus datos; solicitar su rectificación, actualización o supresión; oponerse al tratamiento o pedir su limitación; solicitar la portabilidad (una copia en formato estructurado y de uso común); y retirar el consentimiento prestado. Puede eliminar todos sus datos por sí mismo desde Perfil → Borrar mis datos.","Para ejercer estos derechos debe escribir a info@zancada.org, indicando el derecho que desea ejercer y los datos a los que se refiere, desde el correo asociado a la cuenta (o acreditando su identidad por otro medio razonable). La respuesta se brindará en los plazos legales: diez (10) días corridos para el acceso y cinco (5) días hábiles para la rectificación, actualización o supresión. El ejercicio de los derechos no implica discriminación ni modificación de las condiciones del servicio.","En la República Argentina, el acceso a los datos personales es gratuito a intervalos no inferiores a seis meses, salvo que se acredite un interés legítimo. La Agencia de Acceso a la Información Pública (AAIP), órgano de control de la Ley 25.326, atiende las denuncias y reclamos por incumplimientos de la normativa de protección de datos personales (argentina.gob.ar/aaip).","Si el titular se encuentra en la Unión Europea, el Reino Unido u otra jurisdicción con normativa propia (por ejemplo, el RGPD), le asisten los derechos equivalentes y puede presentar una reclamación ante la autoridad de control competente. Representante en la Unión Europea, si correspondiera: [A completar antes de publicar la app]."]},{"h":"12. Residentes de Estados Unidos y de otras jurisdicciones","p":["Zancada no vende datos personales ni los comparte con fines de publicidad dirigida o de comportamiento entre contextos. La información sensible (incluidos los datos de salud y la ubicación precisa) se utiliza únicamente para prestar los Servicios solicitados. Los residentes de estados de los Estados Unidos con leyes de privacidad (por ejemplo, California) pueden ejercer sus derechos de acceso, corrección, eliminación y portabilidad por el medio indicado en la sección 11, sin ser objeto de discriminación."]},{"h":"13. Menores de edad","p":["Zancada no está dirigida a menores de 16 años y no recopila intencionalmente sus datos. Entre los 16 y los 17 años, el uso de los Servicios requiere la autorización de la madre, el padre o el tutor legal, quienes deben consentir el tratamiento de los datos. Si se detectara la recopilación de datos de un menor sin dicho consentimiento, la cuenta será eliminada de inmediato. Los padres o tutores pueden contactarse en info@zancada.org para solicitar la eliminación de los datos de un menor."]},{"h":"14. Enlaces y servicios de terceros","p":["Los Servicios pueden contener enlaces a sitios o aplicaciones de terceros y permitir la conexión con plataformas externas (Strava, Polar, Wahoo, COROS, Suunto, Google, Apple, entre otras). Los datos que el Usuario entregue a dichos terceros se rigen por sus propias políticas de privacidad, sobre las cuales Zancada no tiene control ni asume responsabilidad. Se recomienda leerlas antes de conectar una cuenta."]},{"h":"15. Cambios a esta Política","p":["Zancada podrá modificar esta Política para reflejar cambios legales o del servicio. Las modificaciones se publicarán con su fecha de vigencia. Cuando el cambio sea sustancial —en especial respecto del tratamiento de datos sensibles—, se notificará de forma destacada dentro de la aplicación antes de su entrada en vigencia. Si el Usuario no está de acuerdo con la modificación, puede dejar de usar los Servicios y eliminar su cuenta."]}],"h_contact":"Contacto","contact_q":"Consultas, solicitudes de ejercicio de derechos o reclamos sobre el tratamiento de datos personales:","note":"Este documento fue redactado como una plantilla general para una aplicación en desarrollo y no constituye asesoramiento legal. Antes de lanzar Zancada públicamente, se recomienda que un abogado lo revise y lo adapte a la normativa aplicable."},"en":{"title":"Zancada — Privacy Policy","back":"‹ Back to Zancada","updated":"Last updated: October 6, 2026","intro":"This Privacy Policy describes how Zancada collects, uses, shares and protects the personal data of its users, and the rights and choices available to them. It is written in plain language and must be read together with the Terms and Conditions of the service.","summary_label":"At a glance","summary":["Zancada does not sell personal data or use it for advertising. Health, location and physical-metrics data is never used for advertising or marketing.","When the User records a run with their phone, the app uses their location (GPS) in the background too, only while the activity is in progress.","No tracking cookies or analytics tools of any kind are used.","The User can delete all their data at any time from the app.","Data is only shared with the providers needed to operate the service, listed in section 6."],"sections":[{"h":"1. Scope and data controller","p":["This Policy applies to the Zancada mobile application, its web version and the related services, features and sites (together, the \"Services\"). In this Policy, \"Zancada\", \"we\" and \"our\" refer to the controller identified below; \"User\" refers to the person who uses the Services."],"ph":"[To be completed before publishing the app]: company name or full name of the data controller, tax ID (CUIT), legal address, contact email and, where applicable, the database registration number with the Agency for Access to Public Information (AAIP) of the Argentine Republic.","p2":[]},{"h":"2. Personal data we collect","p":["Depending on the features the User uses, Zancada processes the following categories of data:"],"ul":["<strong>Account and profile data:<\/strong> email address, name, profile photo and password (the latter protected by the authentication provider). If the User signs in with Google or Apple, the basic data those platforms share is also received. If the User chooses to change their photo, the app asks, optionally, for access to the device's camera or gallery; the image is used exclusively for the profile within the app and is not shared with third parties.","<strong>Health and training data (sensitive data):<\/strong> recorded runs (distance, duration, pace, GPS route, cadence, elevation, power), heart rate and configured zones, weight, height, date of birth and gender, discomfort or health notes the User voluntarily enters, and the fitness test result.","<strong>Calculated metrics:<\/strong> training paces, zones, performance indices and plan adjustments that Zancada generates from the data above.","<strong>Location, including in the background:<\/strong> when the User records a run with their phone, the app collects their precise location (GPS) in real time and in the background. This means it keeps recording the route, pace and distance even if the app is minimized or the screen is off, and a notification is shown while it does so. Tracking stops when the activity ends. If the User syncs their runs from a watch, the phone's GPS is not used. Prolonged GPS use may increase battery consumption.","<strong>Sports profile:<\/strong> preferred terrain, runner type, training days, preference for measuring by time or distance, goal or upcoming race, weekly goal, complementary sports and logged footwear.","<strong>Conversations with Zonda:<\/strong> the messages exchanged with Zonda, the virtual assistant based on Artificial Intelligence, and the training context needed to respond.","<strong>Data from third-party devices and apps (optional):<\/strong> activities synced from Strava, Polar, Wahoo, COROS, Suunto or Health Connect (on Android: exercises, distance and heart rate). If the User turns on adding their plan to the phone's calendar, the calendar permission is used only to create and delete the workouts in a calendar of its own called \"Zancada\".","<strong>Support data:<\/strong> the information the User sends us when requesting assistance or submitting feedback.","<strong>Technical device data:<\/strong> IP address, device type and operating system version, app version, error logs and the device identifiers needed to deliver push notifications.","<strong>Preferences:<\/strong> language, unit system and notification status.","<strong>Payment data:<\/strong> Zancada does not collect or store card data. Payments are processed exclusively through the Apple App Store or Google Play, which inform Zancada only of the subscription status."],"p2":["This data, including health and location data, is processed with the User's express consent, given when creating the account and when turning on each feature (for example, background GPS, an integration or notifications). Consent may be withdrawn at any time by deleting the data from the app, without affecting the lawfulness of prior processing."]},{"h":"3. Sources of data","p":["Most of the data is provided directly by the User or generated by their phone when recording an activity. Data is also obtained from: (a) devices and apps the User chooses to connect (Strava, Polar, Wahoo, COROS, Suunto, Health Connect), from which only authorized activities are imported; (b) the third-party accounts the User signs in with (Google or Apple); and (c) service providers, for example technical error reports.","When health data comes from connected devices or apps, Zancada uses it exclusively to provide the features described in this Policy and does not sell it, use it for advertising or disclose it to third parties without the User's consent."]},{"h":"4. Purposes and legal bases of processing","p":["Zancada processes personal data for the following purposes, relying on the legal bases indicated:"],"ul":["<strong>Providing the Services:<\/strong> creating and managing the account, generating and adjusting the training plan, calculating paces and zones from the fitness test, recording and analyzing activities, and showing progress, history and footwear status. Legal basis: performance of the contract (Terms and Conditions) and consent.","<strong>Artificial Intelligence assistance:<\/strong> allowing Zonda to respond with real context about the User. Legal basis: performance of the contract and consent.","<strong>Notifications and alerts:<\/strong> notifying of the day's session and alerting about rapid increases in training load or footwear wear, when the User has turned them on. Legal basis: consent.","<strong>Support and service communications:<\/strong> answering inquiries and communicating relevant changes to the Terms or this Policy. Legal basis: performance of the contract and legitimate interest.","<strong>Security, abuse prevention and technical improvement:<\/strong> detecting and fixing errors, protecting the integrity of the Services and preventing unauthorized access. Legal basis: legitimate interest.","<strong>Compliance with legal obligations:<\/strong> responding to requests from competent authorities and accounting or tax obligations linked to subscriptions. Legal basis: legal obligation."],"box":{"label":"Use restriction","text":"Health, location and physical-metrics data is never used for advertising or marketing purposes, and is not sold or handed over to third parties or data brokers. Zancada complies with the Apple App Store and Google Play developer policies."}},{"h":"5. Automated decisions and Artificial Intelligence","p":["Training plans, their weekly adjustments and Zonda's answers are generated automatically from the User's data. These tools are for guidance and do not produce decisions with legal effects or that significantly affect the User. The User may change their plan, request its review and exercise the rights described in section 11 by writing to info@zancada.org.","To generate Zonda's answers, Zancada sends Anthropic (Claude) the User's text and the strictly necessary context: profile, plan, recent run history, heart rate zones and logged notes or discomfort. Under its terms for API customers, Anthropic does not use that information to train its models."]},{"h":"6. Recipients of the data","p":["Zancada does not sell personal data. Data is disclosed only to the following providers and third parties, to the extent necessary for the service to operate:"],"ul":["<strong>Supabase:<\/strong> hosts the database where the User's information is stored.","<strong>Vercel:<\/strong> hosts the web application and server functions.","<strong>Strava:<\/strong> two-way activity sync, only if the User connects it.","<strong>Polar:<\/strong> sync of runs, only if the User connects their account.","<strong>Wahoo:<\/strong> sync of runs and sending of planned workouts (with intervals and target heart rate), only if the User connects their account.","<strong>COROS:<\/strong> sync of runs, only if the User connects their account.","<strong>Suunto:<\/strong> sync of runs and sending of planned workouts (with intervals and target heart rate), only if the User connects their account.","<strong>Google and Apple:<\/strong> sign-in, only if the User chooses to sign in with their Google or Apple account, and subscriptions through their stores.","<strong>Firebase Cloud Messaging (Google):<\/strong> receives a device identifier to deliver push notifications, if the User turned them on.","<strong>Anthropic (Claude):<\/strong> the Artificial Intelligence model that powers Zonda, under the terms of section 5.","<strong>Sentry:<\/strong> receives technical information when a server error occurs or unauthorized access to a protected part of the app is attempted. Passwords and payment data are never sent to it."],"p2":["Providers act on behalf of Zancada, only access the information needed for their function and are required to protect it. In addition, Zancada may retain or disclose data when required by law or an order of a competent authority, or when reasonably necessary to prevent serious harm to people, detect fraud or abuse, or establish or defend rights in legal proceedings. In the event of a merger, acquisition or transfer of the business, the data may be transferred to the successor, with prior notice to the User and subject to this Policy."]},{"h":"7. International data transfers","p":["The providers mentioned operate servers outside the Argentine Republic (for example, in the United States and the European Union), so using the Services involves the international transfer of personal data. These transfers take place over secure connections and only with providers that offer adequate protection guarantees, through standard contractual clauses or other recognized mechanisms, in accordance with Law 25,326 and, where applicable, the EU General Data Protection Regulation (GDPR). By using the Services, the User gives informed consent to these transfers. Information about the safeguards applied may be requested by writing to info@zancada.org."]},{"h":"8. Information security","p":["Zancada applies reasonable technical, administrative and physical measures to protect data against unauthorized access, loss, alteration or disclosure: encryption in transit (HTTPS/TLS), restricted-access servers, per-user authorization controls and error monitoring. No system is infallible. If a security incident affecting the User's personal data occurs, Zancada will notify it in accordance with applicable law."]},{"h":"9. Data retention and deletion","p":["Data is kept in the User's account while the account is active. The app also keeps a temporary copy on the phone to work offline, which syncs when the connection is restored. Technical error logs are kept for a limited period of no more than 90 days.","When the account is deleted (Profile → Delete my data), personal, health and location data is removed from the production servers; backups rotate and are automatically destroyed within a maximum of 30 days. Zancada may delete accounts that remain inactive for more than three years, with prior notice to the registered email. Data that must be kept because of legal obligations (for example, tax or accounting) will be kept only for the period required."]},{"h":"10. Cookies, analytics and similar technologies","p":["Zancada does not use advertising cookies, Google Analytics, Meta Pixel or any other analytics or tracking SDK, and does not share data with ad networks. Only essential technical storage is used for the app to work: keeping the session signed in, keeping a copy of the data on the phone for offline use and a device identifier to deliver push notifications (through Firebase Cloud Messaging), if turned on. Since no tracking cookies or analytics tools are used, a cookie consent banner is not necessary, and \"Do Not Track\" or global privacy control signals are not processed because there is no advertising tracking."]},{"h":"11. Rights of the data subject and how to exercise them","p":["The data subject may at any time: access their data; request its rectification, update or deletion; object to the processing or request its restriction; request portability (a copy in a structured, commonly used format); and withdraw the consent given. They can delete all their data themselves from Profile → Delete my data.","To exercise these rights, they must write to info@zancada.org, stating the right they wish to exercise and the data concerned, from the email associated with the account (or proving their identity by another reasonable means). The response will be given within the legal deadlines: ten (10) calendar days for access and five (5) business days for rectification, update or deletion. Exercising these rights entails no discrimination or change in the service conditions.","In the Argentine Republic, access to personal data is free of charge at intervals of no less than six months, unless a legitimate interest is shown. The Agency for Access to Public Information (AAIP), the control body of Law 25,326, handles complaints and claims about breaches of personal data protection rules (argentina.gob.ar/aaip).","If the data subject is in the European Union, the United Kingdom or another jurisdiction with its own rules (for example, the GDPR), they have the equivalent rights and may lodge a complaint with the competent supervisory authority. Representative in the European Union, if applicable: [To be completed before publishing the app]."]},{"h":"12. Residents of the United States and other jurisdictions","p":["Zancada does not sell personal data or share it for targeted advertising or cross-context behavioral advertising. Sensitive information (including health data and precise location) is used only to provide the Services requested. Residents of US states with privacy laws (for example, California) may exercise their rights of access, correction, deletion and portability through the means indicated in section 11, without being discriminated against."]},{"h":"13. Minors","p":["Zancada is not directed at anyone under 16 and does not knowingly collect their data. Between 16 and 17, use of the Services requires the authorization of the parent or legal guardian, who must consent to the processing of the data. If the collection of a minor's data without that consent is detected, the account will be deleted immediately. Parents or guardians may contact info@zancada.org to request the deletion of a minor's data."]},{"h":"14. Third-party links and services","p":["The Services may contain links to third-party sites or apps and allow connection with external platforms (Strava, Polar, Wahoo, COROS, Suunto, Google, Apple, among others). Data the User gives those third parties is governed by their own privacy policies, over which Zancada has no control and for which it assumes no responsibility. It is recommended to read them before connecting an account."]},{"h":"15. Changes to this Policy","p":["Zancada may modify this Policy to reflect legal or service changes. Changes will be published with their effective date. Where a change is substantial — especially regarding the processing of sensitive data — it will be notified prominently inside the app before it takes effect. If the User does not agree with the change, they may stop using the Services and delete their account."]}],"h_contact":"Contact","contact_q":"Inquiries, requests to exercise rights or complaints about the processing of personal data:","note":"This document was written as a general template for an app in development and does not constitute legal advice. Before launching Zancada publicly, it is recommended that a lawyer review it and adapt it to the applicable regulations."},"pt":{"title":"Zancada — Política de Privacidade","back":"‹ Voltar para o Zancada","updated":"Última atualização: 6 de outubro de 2026","intro":"Esta Política de Privacidade descreve como o Zancada coleta, utiliza, compartilha e protege os dados pessoais de seus usuários, e quais são os direitos e opções que lhes cabem. Está redigida em linguagem clara e deve ser lida em conjunto com os Termos e Condições do serviço.","summary_label":"Resumo","summary":["O Zancada não vende dados pessoais nem os utiliza para fins publicitários. Os dados de saúde, localização e métricas físicas nunca são usados para publicidade ou marketing.","Quando o Usuário registra uma corrida com o celular, o aplicativo utiliza sua localização (GPS) também em segundo plano, somente enquanto a atividade está em andamento.","Não são utilizados cookies de rastreamento nem ferramentas de análise de nenhum tipo.","O Usuário pode excluir todos os seus dados a qualquer momento pelo aplicativo.","Os dados só são compartilhados com os provedores necessários ao funcionamento do serviço, detalhados na seção 6."],"sections":[{"h":"1. Alcance e responsável pelo tratamento","p":["Esta Política se aplica ao aplicativo móvel Zancada, à sua versão web e aos serviços, funções e sites relacionados (em conjunto, os \"Serviços\"). Nesta Política, \"Zancada\", \"nós\" e \"nosso\" designam o responsável pelo tratamento indicado abaixo; \"Usuário\" designa a pessoa que utiliza os Serviços."],"ph":"[A completar antes de publicar o aplicativo]: razão social ou nome completo do responsável pelo tratamento dos dados, CUIT, endereço legal, e-mail de contato e, se aplicável, número de registro do banco de dados na Agência de Acesso à Informação Pública (AAIP) da República Argentina.","p2":[]},{"h":"2. Dados pessoais que coletamos","p":["Conforme as funções utilizadas pelo Usuário, o Zancada trata as seguintes categorias de dados:"],"ul":["<strong>Dados de conta e perfil:<\/strong> e-mail, nome, foto de perfil e senha (esta última protegida pelo provedor de autenticação). Se o Usuário entra com Google ou Apple, também são recebidos os dados básicos que essas plataformas compartilham. Se o Usuário decide trocar a foto, o aplicativo solicita, de forma opcional, acesso à câmera ou à galeria do dispositivo; a imagem é utilizada exclusivamente para o perfil dentro do aplicativo e não é compartilhada com terceiros.","<strong>Dados de saúde e treino (dados sensíveis):<\/strong> corridas registradas (distância, duração, ritmo, rota GPS, cadência, desnível, potência), frequência cardíaca e zonas configuradas, peso, altura, data de nascimento e gênero, desconfortos ou notas de saúde que o Usuário registre voluntariamente e o resultado do teste de nível.","<strong>Métricas calculadas:<\/strong> ritmos de treino, zonas, índices de desempenho e ajustes do plano que o Zancada gera a partir dos dados anteriores.","<strong>Localização, inclusive em segundo plano:<\/strong> quando o Usuário registra uma corrida com o celular, o aplicativo coleta sua localização precisa (GPS) em tempo real e em segundo plano. Isso significa que continua registrando a rota, o ritmo e a distância mesmo com o aplicativo minimizado ou a tela apagada, e que uma notificação é exibida enquanto isso ocorre. O rastreamento cessa ao finalizar a atividade. Se o Usuário sincroniza suas corridas de um relógio, o GPS do celular não é utilizado. O uso prolongado do GPS pode aumentar o consumo de bateria.","<strong>Perfil esportivo:<\/strong> terreno preferido, tipo de corredor, dias de treino, preferência de medição por tempo ou por distância, objetivo ou prova próxima, meta semanal, esportes complementares e calçados registrados.","<strong>Conversas com o Zonda:<\/strong> as mensagens trocadas com o Zonda, o assistente virtual baseado em Inteligência Artificial, e o contexto esportivo necessário para responder.","<strong>Dados de dispositivos e aplicativos de terceiros (opcionais):<\/strong> atividades sincronizadas do Strava, Polar, Wahoo, COROS, Suunto ou Health Connect (no Android: exercícios, distância e frequência cardíaca). Se o Usuário ativa a inclusão do plano no calendário do celular, a permissão de calendário é utilizada apenas para criar e excluir os treinos em um calendário próprio chamado \"Zancada\".","<strong>Dados de suporte:<\/strong> as informações que o Usuário nos envia ao solicitar assistência ou enviar comentários.","<strong>Dados técnicos do dispositivo:<\/strong> endereço IP, tipo de dispositivo e versão do sistema operacional, versão do aplicativo, registros de erros e identificadores do dispositivo necessários para entregar notificações push.","<strong>Preferências:<\/strong> idioma, sistema de unidades e estado das notificações.","<strong>Dados de pagamento:<\/strong> o Zancada não coleta nem armazena dados de cartões. Os pagamentos são processados exclusivamente pela Apple App Store ou pelo Google Play, que informam ao Zancada apenas o estado da assinatura."],"p2":["Esses dados, inclusive os de saúde e localização, são tratados com o consentimento expresso do Usuário, prestado ao criar a conta e ao ativar cada função (por exemplo, o GPS em segundo plano, uma integração ou as notificações). O consentimento pode ser retirado a qualquer momento excluindo os dados pelo aplicativo, sem afetar a licitude do tratamento anterior."]},{"h":"3. Fontes dos dados","p":["A maior parte dos dados é fornecida diretamente pelo Usuário ou gerada pelo seu celular ao registrar uma atividade. Também são obtidos dados de: (a) dispositivos e aplicativos que o Usuário decide conectar (Strava, Polar, Wahoo, COROS, Suunto, Health Connect), dos quais só são importadas as atividades autorizadas; (b) as contas de terceiros com as quais o Usuário entra (Google ou Apple); e (c) prestadores de serviços, por exemplo, relatórios técnicos de erros.","Quando os dados de saúde provêm de dispositivos ou aplicativos conectados, o Zancada os utiliza exclusivamente para prestar as funções descritas nesta Política e não os vende, não os usa para fins publicitários nem os cede a terceiros sem o consentimento do Usuário."]},{"h":"4. Finalidades e bases legais do tratamento","p":["O Zancada trata os dados pessoais para as seguintes finalidades, com apoio nas bases legais indicadas:"],"ul":["<strong>Prestar os Serviços:<\/strong> criar e administrar a conta, gerar e ajustar o plano de treino, calcular ritmos e zonas a partir do teste de nível, registrar e analisar atividades, exibir progresso, histórico e estado dos calçados. Base legal: execução do contrato (Termos e Condições) e consentimento.","<strong>Assistência com Inteligência Artificial:<\/strong> permitir que o Zonda responda com contexto real sobre o Usuário. Base legal: execução do contrato e consentimento.","<strong>Notificações e alertas:<\/strong> avisar a sessão do dia e alertar sobre aumentos rápidos da carga de treino ou desgaste dos calçados, quando o Usuário os tiver ativado. Base legal: consentimento.","<strong>Suporte e comunicações do serviço:<\/strong> responder consultas e comunicar mudanças relevantes nos Termos ou nesta Política. Base legal: execução do contrato e interesse legítimo.","<strong>Segurança, prevenção de abusos e melhoria técnica:<\/strong> detectar e corrigir erros, proteger a integridade dos Serviços e prevenir acessos não autorizados. Base legal: interesse legítimo.","<strong>Cumprimento de obrigações legais:<\/strong> atender requisições de autoridades competentes e obrigações contábeis ou fiscais ligadas às assinaturas. Base legal: obrigação legal."],"box":{"label":"Restrição de uso","text":"Os dados de saúde, localização e métricas físicas nunca são utilizados para fins publicitários ou de marketing, nem vendidos ou cedidos a terceiros ou a corretores de dados (data brokers). O Zancada cumpre as políticas para desenvolvedores da Apple App Store e do Google Play."}},{"h":"5. Decisões automatizadas e Inteligência Artificial","p":["Os planos de treino, seus ajustes semanais e as respostas do Zonda são gerados de forma automatizada a partir dos dados do Usuário. Essas ferramentas têm caráter orientativo e não produzem decisões com efeitos jurídicos nem que afetem significativamente o Usuário. O Usuário pode modificar seu plano, solicitar sua revisão e exercer os direitos descritos na seção 11 escrevendo para info@zancada.org.","Para gerar as respostas do Zonda, o Zancada envia à Anthropic (Claude) o texto do Usuário e o contexto estritamente necessário: perfil, plano, histórico recente de corridas, zonas de frequência cardíaca e notas ou desconfortos registrados. Conforme seus termos para clientes de API, a Anthropic não utiliza essas informações para treinar seus modelos."]},{"h":"6. Destinatários dos dados","p":["O Zancada não vende dados pessoais. Os dados são comunicados apenas aos seguintes provedores e terceiros, na medida necessária ao funcionamento do serviço:"],"ul":["<strong>Supabase:<\/strong> hospeda o banco de dados onde são armazenadas as informações do Usuário.","<strong>Vercel:<\/strong> hospeda o aplicativo web e as funções de servidor.","<strong>Strava:<\/strong> sincronização bidirecional de atividades, somente se o Usuário a conectar.","<strong>Polar:<\/strong> sincronização de corridas, somente se o Usuário conectar sua conta.","<strong>Wahoo:<\/strong> sincronização de corridas e envio dos treinos planejados (com intervalos e frequência cardíaca alvo), somente se o Usuário conectar sua conta.","<strong>COROS:<\/strong> sincronização de corridas, somente se o Usuário conectar sua conta.","<strong>Suunto:<\/strong> sincronização de corridas e envio dos treinos planejados (com intervalos e frequência cardíaca alvo), somente se o Usuário conectar sua conta.","<strong>Google e Apple:<\/strong> login, somente se o Usuário escolher entrar com sua conta Google ou Apple, e assinaturas por meio de suas lojas.","<strong>Firebase Cloud Messaging (Google):<\/strong> recebe um identificador do dispositivo para entregar as notificações push, se o Usuário as ativou.","<strong>Anthropic (Claude):<\/strong> modelo de Inteligência Artificial que dá funcionamento ao Zonda, nos termos da seção 5.","<strong>Sentry:<\/strong> recebe informações técnicas quando ocorre um erro no servidor ou é tentado um acesso não autorizado a uma parte protegida do aplicativo. Nunca recebe senhas nem dados de pagamento."],"p2":["Os provedores atuam por conta do Zancada, só acessam as informações necessárias para sua função e são obrigados a protegê-las. Além disso, o Zancada poderá conservar ou comunicar dados quando exigido por lei ou por ordem de autoridade competente, ou quando razoavelmente necessário para prevenir dano grave às pessoas, detectar fraudes ou abusos, ou exercer ou defender direitos em procedimento legal. Em caso de fusão, aquisição ou transferência do negócio, os dados poderão ser transferidos ao sucessor, mediante prévia notificação ao Usuário e sujeitos a esta Política."]},{"h":"7. Transferências internacionais de dados","p":["Os provedores mencionados operam servidores fora da República Argentina (por exemplo, nos Estados Unidos e na União Europeia), de modo que o uso dos Serviços implica a transferência internacional de dados pessoais. Essas transferências são realizadas por conexões seguras e somente com provedores que oferecem garantias adequadas de proteção, por meio de cláusulas contratuais padrão ou outros mecanismos reconhecidos, conforme a Lei argentina 25.326 e, quando aplicável, o Regulamento Geral de Proteção de Dados (RGPD) da União Europeia. Ao utilizar os Serviços, o Usuário presta consentimento informado a essas transferências. Pode solicitar informações sobre as garantias aplicadas escrevendo para info@zancada.org."]},{"h":"8. Segurança da informação","p":["O Zancada aplica medidas técnicas, administrativas e físicas razoáveis para proteger os dados contra acesso não autorizado, perda, alteração ou divulgação: criptografia em trânsito (HTTPS/TLS), servidores com acesso restrito, controle de autorizações por usuário e monitoramento de erros. Nenhum sistema é infalível. Se ocorrer um incidente de segurança que afete os dados pessoais do Usuário, o Zancada o notificará conforme a normativa aplicável."]},{"h":"9. Conservação e exclusão dos dados","p":["Os dados são conservados na conta do Usuário enquanto ela estiver ativa. O aplicativo também guarda uma cópia temporária no celular para funcionar sem conexão, que é sincronizada ao recuperar a internet. Os registros técnicos de erros são conservados por um período limitado, que não excede 90 dias.","Ao excluir a conta (Perfil → Apagar meus dados), os dados pessoais, de saúde e de localização são removidos dos servidores de produção; as cópias de segurança rotacionam e são destruídas automaticamente em no máximo 30 dias. O Zancada poderá excluir contas que permaneçam inativas por mais de três anos, mediante aviso prévio ao e-mail registrado. Os dados que devam ser conservados por obrigações legais (por exemplo, fiscais ou contábeis) serão mantidos apenas pelo prazo exigido."]},{"h":"10. Cookies, análise e tecnologias semelhantes","p":["O Zancada não utiliza cookies publicitários, Google Analytics, Meta Pixel nem qualquer outro SDK de análise ou rastreamento, e não compartilha dados com redes de publicidade. Emprega-se apenas armazenamento técnico essencial para o funcionamento do aplicativo: manter a sessão iniciada, guardar uma cópia dos dados no celular para uso sem conexão e um identificador do dispositivo para entregar notificações push (via Firebase Cloud Messaging), se ativadas. Como não são usados cookies de rastreamento nem ferramentas de análise, não é necessário um banner de consentimento de cookies, e não se processam sinais \"Do Not Track\" nem de controle global de privacidade porque não existe rastreamento publicitário."]},{"h":"11. Direitos do titular dos dados e como exercê-los","p":["O titular dos dados pode, a qualquer momento: acessar seus dados; solicitar sua retificação, atualização ou exclusão; opor-se ao tratamento ou pedir sua limitação; solicitar a portabilidade (uma cópia em formato estruturado e de uso comum); e retirar o consentimento prestado. Pode excluir todos os seus dados por conta própria em Perfil → Apagar meus dados.","Para exercer esses direitos, deve escrever para info@zancada.org, indicando o direito que deseja exercer e os dados a que se refere, a partir do e-mail associado à conta (ou comprovando sua identidade por outro meio razoável). A resposta será dada nos prazos legais: dez (10) dias corridos para o acesso e cinco (5) dias úteis para a retificação, atualização ou exclusão. O exercício dos direitos não implica discriminação nem alteração das condições do serviço.","Na República Argentina, o acesso aos dados pessoais é gratuito em intervalos não inferiores a seis meses, salvo comprovação de interesse legítimo. A Agência de Acesso à Informação Pública (AAIP), órgão de controle da Lei 25.326, atende as denúncias e reclamações por descumprimento da normativa de proteção de dados pessoais (argentina.gob.ar/aaip).","Se o titular estiver na União Europeia, no Reino Unido ou em outra jurisdição com normativa própria (por exemplo, o RGPD), cabem-lhe os direitos equivalentes e pode apresentar reclamação perante a autoridade de controle competente. Representante na União Europeia, se aplicável: [A completar antes de publicar o aplicativo]."]},{"h":"12. Residentes dos Estados Unidos e de outras jurisdições","p":["O Zancada não vende dados pessoais nem os compartilha para publicidade direcionada ou publicidade comportamental entre contextos. As informações sensíveis (incluindo dados de saúde e localização precisa) são utilizadas apenas para prestar os Serviços solicitados. Os residentes de estados dos Estados Unidos com leis de privacidade (por exemplo, Califórnia) podem exercer seus direitos de acesso, correção, exclusão e portabilidade pelo meio indicado na seção 11, sem sofrer discriminação."]},{"h":"13. Menores de idade","p":["O Zancada não é direcionado a menores de 16 anos e não coleta intencionalmente seus dados. Entre 16 e 17 anos, o uso dos Serviços requer a autorização da mãe, do pai ou do responsável legal, que devem consentir o tratamento dos dados. Se for detectada a coleta de dados de um menor sem esse consentimento, a conta será excluída imediatamente. Pais ou responsáveis podem entrar em contato em info@zancada.org para solicitar a exclusão dos dados de um menor."]},{"h":"14. Links e serviços de terceiros","p":["Os Serviços podem conter links para sites ou aplicativos de terceiros e permitir a conexão com plataformas externas (Strava, Polar, Wahoo, COROS, Suunto, Google, Apple, entre outras). Os dados que o Usuário entregar a esses terceiros regem-se por suas próprias políticas de privacidade, sobre as quais o Zancada não tem controle nem assume responsabilidade. Recomenda-se lê-las antes de conectar uma conta."]},{"h":"15. Mudanças nesta Política","p":["O Zancada poderá modificar esta Política para refletir mudanças legais ou do serviço. As modificações serão publicadas com sua data de vigência. Quando a mudança for substancial — em especial quanto ao tratamento de dados sensíveis —, será notificada de forma destacada dentro do aplicativo antes de entrar em vigor. Se o Usuário não concordar com a modificação, pode deixar de usar os Serviços e excluir sua conta."]}],"h_contact":"Contato","contact_q":"Consultas, solicitações de exercício de direitos ou reclamações sobre o tratamento de dados pessoais:","note":"Este documento foi redigido como um modelo geral para um aplicativo em desenvolvimento e não constitui aconselhamento jurídico. Antes de lançar o Zancada publicamente, recomenda-se que um advogado o revise e o adapte à normativa aplicável."},"fr":{"title":"Zancada — Politique de Confidentialité","back":"‹ Retour à Zancada","updated":"Dernière mise à jour : 6 octobre 2026","intro":"La présente Politique de Confidentialité décrit la manière dont Zancada collecte, utilise, partage et protège les données personnelles de ses utilisateurs, ainsi que les droits et choix dont ceux-ci disposent. Elle est rédigée en langage clair et doit être lue conjointement avec les Conditions Générales du service.","summary_label":"En bref","summary":["Zancada ne vend pas les données personnelles et ne les utilise pas à des fins publicitaires. Les données de santé, de localisation et de métriques physiques ne servent jamais à de la publicité ni du marketing.","Lorsque l'Utilisateur enregistre une course avec son téléphone, l'application utilise sa position (GPS) également en arrière-plan, uniquement pendant que l'activité est en cours.","Aucun cookie de suivi ni outil d'analyse d'aucune sorte n'est utilisé.","L'Utilisateur peut supprimer toutes ses données à tout moment depuis l'application.","Les données ne sont partagées qu'avec les prestataires nécessaires au fonctionnement du service, détaillés à la section 6."],"sections":[{"h":"1. Champ d'application et responsable du traitement","p":["La présente Politique s'applique à l'application mobile Zancada, à sa version web et aux services, fonctionnalités et sites associés (ensemble, les « Services »). Dans la présente Politique, « Zancada », « nous » et « notre » désignent le responsable du traitement indiqué ci-dessous ; « Utilisateur » désigne la personne qui utilise les Services."],"ph":"[À compléter avant la publication de l'application] : raison sociale ou nom complet du responsable du traitement des données, CUIT, adresse légale, e-mail de contact et, le cas échéant, numéro d'enregistrement de la base de données auprès de l'Agence d'accès à l'information publique (AAIP) de la République argentine.","p2":[]},{"h":"2. Données personnelles que nous collectons","p":["Selon les fonctions utilisées par l'Utilisateur, Zancada traite les catégories de données suivantes :"],"ul":["<strong>Données de compte et de profil :<\/strong> adresse e-mail, nom, photo de profil et mot de passe (ce dernier protégé par le prestataire d'authentification). Si l'Utilisateur se connecte avec Google ou Apple, les données de base partagées par ces plateformes sont également reçues. Si l'Utilisateur choisit de changer sa photo, l'application demande, à titre facultatif, l'accès à la caméra ou à la galerie de l'appareil ; l'image est utilisée exclusivement pour le profil dans l'application et n'est pas partagée avec des tiers.","<strong>Données de santé et d'entraînement (données sensibles) :<\/strong> courses enregistrées (distance, durée, allure, tracé GPS, cadence, dénivelé, puissance), fréquence cardiaque et zones configurées, poids, taille, date de naissance et genre, gênes ou notes de santé que l'Utilisateur saisit volontairement, et résultat du test de niveau.","<strong>Métriques calculées :<\/strong> allures d'entraînement, zones, indices de performance et ajustements du plan que Zancada génère à partir des données ci-dessus.","<strong>Localisation, y compris en arrière-plan :<\/strong> lorsque l'Utilisateur enregistre une course avec son téléphone, l'application collecte sa position précise (GPS) en temps réel et en arrière-plan. Cela signifie qu'elle continue d'enregistrer le tracé, l'allure et la distance même si l'application est réduite ou l'écran éteint, et qu'une notification s'affiche pendant ce temps. Le suivi s'arrête à la fin de l'activité. Si l'Utilisateur synchronise ses courses depuis une montre, le GPS du téléphone n'est pas utilisé. L'usage prolongé du GPS peut accroître la consommation de batterie.","<strong>Profil sportif :<\/strong> terrain préféré, type de coureur, jours d'entraînement, préférence de mesure au temps ou à la distance, objectif ou course à venir, objectif hebdomadaire, sports complémentaires et chaussures enregistrées.","<strong>Conversations avec Zonda :<\/strong> les messages échangés avec Zonda, l'assistant virtuel fondé sur l'Intelligence Artificielle, et le contexte sportif nécessaire pour répondre.","<strong>Données d'appareils et d'applications tiers (facultatif) :<\/strong> activités synchronisées depuis Strava, Polar, Wahoo, COROS, Suunto ou Health Connect (sous Android : exercices, distance et fréquence cardiaque). Si l'Utilisateur active l'ajout de son plan au calendrier du téléphone, l'autorisation d'accès au calendrier est utilisée uniquement pour créer et supprimer les entraînements dans un calendrier propre appelé « Zancada ».","<strong>Données de support :<\/strong> les informations que l'Utilisateur nous transmet lorsqu'il demande de l'aide ou envoie des commentaires.","<strong>Données techniques de l'appareil :<\/strong> adresse IP, type d'appareil et version du système d'exploitation, version de l'application, journaux d'erreurs et identifiants de l'appareil nécessaires pour livrer les notifications push.","<strong>Préférences :<\/strong> langue, système d'unités et état des notifications.","<strong>Données de paiement :<\/strong> Zancada ne collecte ni ne conserve de données de cartes. Les paiements sont traités exclusivement via l'Apple App Store ou Google Play, qui ne communiquent à Zancada que l'état de l'abonnement."],"p2":["Ces données, y compris celles de santé et de localisation, sont traitées avec le consentement exprès de l'Utilisateur, donné lors de la création du compte et de l'activation de chaque fonction (par exemple, le GPS en arrière-plan, une intégration ou les notifications). Le consentement peut être retiré à tout moment en supprimant les données depuis l'application, sans affecter la licéité du traitement antérieur."]},{"h":"3. Sources des données","p":["La plupart des données sont fournies directement par l'Utilisateur ou générées par son téléphone lors de l'enregistrement d'une activité. Des données sont également obtenues auprès : (a) des appareils et applications que l'Utilisateur choisit de connecter (Strava, Polar, Wahoo, COROS, Suunto, Health Connect), dont seules les activités autorisées sont importées ; (b) des comptes tiers avec lesquels l'Utilisateur se connecte (Google ou Apple) ; et (c) de prestataires de services, par exemple les rapports techniques d'erreurs.","Lorsque les données de santé proviennent d'appareils ou d'applications connectés, Zancada les utilise exclusivement pour fournir les fonctions décrites dans la présente Politique et ne les vend pas, ne les utilise pas à des fins publicitaires et ne les cède pas à des tiers sans le consentement de l'Utilisateur."]},{"h":"4. Finalités et bases légales du traitement","p":["Zancada traite les données personnelles pour les finalités suivantes, en s'appuyant sur les bases légales indiquées :"],"ul":["<strong>Fournir les Services :<\/strong> créer et gérer le compte, générer et ajuster le plan d'entraînement, calculer les allures et zones à partir du test de niveau, enregistrer et analyser les activités, afficher la progression, l'historique et l'état des chaussures. Base légale : exécution du contrat (Conditions Générales) et consentement.","<strong>Assistance par Intelligence Artificielle :<\/strong> permettre à Zonda de répondre avec un contexte réel sur l'Utilisateur. Base légale : exécution du contrat et consentement.","<strong>Notifications et alertes :<\/strong> signaler la séance du jour et alerter en cas d'augmentation rapide de la charge d'entraînement ou d'usure des chaussures, lorsque l'Utilisateur les a activées. Base légale : consentement.","<strong>Support et communications du service :<\/strong> répondre aux demandes et informer des changements importants des Conditions ou de la présente Politique. Base légale : exécution du contrat et intérêt légitime.","<strong>Sécurité, prévention des abus et amélioration technique :<\/strong> détecter et corriger les erreurs, protéger l'intégrité des Services et prévenir les accès non autorisés. Base légale : intérêt légitime.","<strong>Respect des obligations légales :<\/strong> répondre aux demandes des autorités compétentes et aux obligations comptables ou fiscales liées aux abonnements. Base légale : obligation légale."],"box":{"label":"Restriction d'usage","text":"Les données de santé, de localisation et de métriques physiques ne sont jamais utilisées à des fins publicitaires ou de marketing, et ne sont ni vendues ni cédées à des tiers ou à des courtiers en données (data brokers). Zancada respecte les règles pour développeurs de l'Apple App Store et de Google Play."}},{"h":"5. Décisions automatisées et Intelligence Artificielle","p":["Les plans d'entraînement, leurs ajustements hebdomadaires et les réponses de Zonda sont générés de manière automatisée à partir des données de l'Utilisateur. Ces outils ont un caractère indicatif et ne produisent pas de décisions ayant des effets juridiques ni affectant significativement l'Utilisateur. L'Utilisateur peut modifier son plan, en demander la révision et exercer les droits décrits à la section 11 en écrivant à info@zancada.org.","Pour générer les réponses de Zonda, Zancada envoie à Anthropic (Claude) le texte de l'Utilisateur et le contexte strictement nécessaire : profil, plan, historique récent de courses, zones de fréquence cardiaque et notes ou gênes enregistrées. Selon ses conditions pour les clients de son API, Anthropic n'utilise pas ces informations pour entraîner ses modèles."]},{"h":"6. Destinataires des données","p":["Zancada ne vend pas les données personnelles. Les données sont communiquées uniquement aux prestataires et tiers suivants, dans la mesure nécessaire au fonctionnement du service :"],"ul":["<strong>Supabase :<\/strong> héberge la base de données où sont stockées les informations de l'Utilisateur.","<strong>Vercel :<\/strong> héberge l'application web et les fonctions serveur.","<strong>Strava :<\/strong> synchronisation bidirectionnelle des activités, uniquement si l'Utilisateur la connecte.","<strong>Polar :<\/strong> synchronisation des courses, uniquement si l'Utilisateur connecte son compte.","<strong>Wahoo :<\/strong> synchronisation des courses et envoi des entraînements planifiés (avec intervalles et fréquence cardiaque cible), uniquement si l'Utilisateur connecte son compte.","<strong>COROS :<\/strong> synchronisation des courses, uniquement si l'Utilisateur connecte son compte.","<strong>Suunto :<\/strong> synchronisation des courses et envoi des entraînements planifiés (avec intervalles et fréquence cardiaque cible), uniquement si l'Utilisateur connecte son compte.","<strong>Google et Apple :<\/strong> connexion, uniquement si l'Utilisateur choisit de se connecter avec son compte Google ou Apple, et abonnements via leurs boutiques.","<strong>Firebase Cloud Messaging (Google) :<\/strong> reçoit un identifiant de l'appareil pour livrer les notifications push, si l'Utilisateur les a activées.","<strong>Anthropic (Claude) :<\/strong> modèle d'Intelligence Artificielle qui fait fonctionner Zonda, dans les conditions de la section 5.","<strong>Sentry :<\/strong> reçoit des informations techniques lorsqu'une erreur serveur survient ou qu'un accès non autorisé à une partie protégée de l'application est tenté. Aucun mot de passe ni donnée de paiement ne lui est envoyé."],"p2":["Les prestataires agissent pour le compte de Zancada, n'accèdent qu'aux informations nécessaires à leur fonction et sont tenus de les protéger. En outre, Zancada pourra conserver ou communiquer des données lorsque la loi ou une décision d'une autorité compétente l'exige, ou lorsque cela est raisonnablement nécessaire pour prévenir un préjudice grave aux personnes, détecter une fraude ou un abus, ou exercer ou défendre des droits dans une procédure légale. En cas de fusion, d'acquisition ou de transfert de l'activité, les données pourront être transférées au successeur, après notification à l'Utilisateur et sous réserve de la présente Politique."]},{"h":"7. Transferts internationaux de données","p":["Les prestataires mentionnés exploitent des serveurs hors de la République argentine (par exemple, aux États-Unis et dans l'Union européenne) ; l'utilisation des Services implique donc un transfert international de données personnelles. Ces transferts s'effectuent par des connexions sécurisées et uniquement avec des prestataires offrant des garanties de protection adéquates, au moyen de clauses contractuelles types ou d'autres mécanismes reconnus, conformément à la loi argentine 25.326 et, le cas échéant, au Règlement général sur la protection des données (RGPD) de l'Union européenne. En utilisant les Services, l'Utilisateur consent de manière éclairée à ces transferts. Il peut demander des informations sur les garanties appliquées en écrivant à info@zancada.org."]},{"h":"8. Sécurité de l'information","p":["Zancada applique des mesures techniques, administratives et physiques raisonnables pour protéger les données contre l'accès non autorisé, la perte, l'altération ou la divulgation : chiffrement en transit (HTTPS/TLS), serveurs à accès restreint, contrôle des autorisations par utilisateur et surveillance des erreurs. Aucun système n'est infaillible. En cas d'incident de sécurité affectant les données personnelles de l'Utilisateur, Zancada le notifiera conformément à la réglementation applicable."]},{"h":"9. Conservation et suppression des données","p":["Les données sont conservées dans le compte de l'Utilisateur tant que celui-ci est actif. L'application garde aussi une copie temporaire sur le téléphone pour fonctionner hors ligne, synchronisée au retour de la connexion. Les journaux techniques d'erreurs sont conservés pendant une durée limitée, n'excédant pas 90 jours.","Lors de la suppression du compte (Profil → Supprimer mes données), les données personnelles, de santé et de localisation sont effacées des serveurs de production ; les sauvegardes tournent et sont détruites automatiquement dans un délai maximum de 30 jours. Zancada pourra supprimer les comptes restés inactifs plus de trois ans, après avertissement à l'adresse e-mail enregistrée. Les données qui doivent être conservées en vertu d'obligations légales (par exemple, fiscales ou comptables) ne le seront que pendant la durée exigée."]},{"h":"10. Cookies, analyse et technologies similaires","p":["Zancada n'utilise pas de cookies publicitaires, ni Google Analytics, Meta Pixel ou tout autre SDK d'analyse ou de suivi, et ne partage pas de données avec des réseaux publicitaires. Seul un stockage technique essentiel est employé pour le fonctionnement de l'application : maintenir la session ouverte, conserver une copie des données sur le téléphone pour l'usage hors ligne et un identifiant de l'appareil pour livrer les notifications push (via Firebase Cloud Messaging), si elles sont activées. Comme aucun cookie de suivi ni outil d'analyse n'est utilisé, une bannière de consentement aux cookies n'est pas nécessaire, et les signaux « Do Not Track » ou de contrôle global de la vie privée ne sont pas traités car il n'existe aucun suivi publicitaire."]},{"h":"11. Droits de la personne concernée et comment les exercer","p":["La personne concernée peut, à tout moment : accéder à ses données ; demander leur rectification, mise à jour ou suppression ; s'opposer au traitement ou en demander la limitation ; demander la portabilité (une copie dans un format structuré et couramment utilisé) ; et retirer le consentement donné. Elle peut supprimer elle-même toutes ses données depuis Profil → Supprimer mes données.","Pour exercer ces droits, elle doit écrire à info@zancada.org, en indiquant le droit qu'elle souhaite exercer et les données concernées, depuis l'adresse e-mail associée au compte (ou en justifiant de son identité par un autre moyen raisonnable). La réponse sera donnée dans les délais légaux : dix (10) jours calendaires pour l'accès et cinq (5) jours ouvrables pour la rectification, la mise à jour ou la suppression. L'exercice des droits n'entraîne aucune discrimination ni modification des conditions du service.","Dans la République argentine, l'accès aux données personnelles est gratuit à intervalles d'au moins six mois, sauf justification d'un intérêt légitime. L'Agence d'accès à l'information publique (AAIP), organe de contrôle de la loi 25.326, traite les plaintes et réclamations pour manquements à la réglementation sur la protection des données personnelles (argentina.gob.ar/aaip).","Si la personne concernée se trouve dans l'Union européenne, au Royaume-Uni ou dans une autre juridiction dotée de sa propre réglementation (par exemple, le RGPD), elle dispose des droits équivalents et peut introduire une réclamation auprès de l'autorité de contrôle compétente. Représentant dans l'Union européenne, le cas échéant : [À compléter avant la publication de l'application]."]},{"h":"12. Résidents des États-Unis et d'autres juridictions","p":["Zancada ne vend pas de données personnelles et ne les partage pas à des fins de publicité ciblée ou de publicité comportementale intercontextuelle. Les informations sensibles (y compris les données de santé et la localisation précise) sont utilisées uniquement pour fournir les Services demandés. Les résidents d'États américains dotés de lois sur la vie privée (par exemple, la Californie) peuvent exercer leurs droits d'accès, de correction, de suppression et de portabilité par le moyen indiqué à la section 11, sans subir de discrimination."]},{"h":"13. Mineurs","p":["Zancada ne s'adresse pas aux moins de 16 ans et ne collecte pas sciemment leurs données. Entre 16 et 17 ans, l'utilisation des Services requiert l'autorisation du parent ou du tuteur légal, qui doit consentir au traitement des données. Si la collecte de données d'un mineur sans ce consentement est détectée, le compte sera supprimé immédiatement. Les parents ou tuteurs peuvent écrire à info@zancada.org pour demander la suppression des données d'un mineur."]},{"h":"14. Liens et services de tiers","p":["Les Services peuvent contenir des liens vers des sites ou applications de tiers et permettre la connexion à des plateformes externes (Strava, Polar, Wahoo, COROS, Suunto, Google, Apple, entre autres). Les données que l'Utilisateur confie à ces tiers sont régies par leurs propres politiques de confidentialité, sur lesquelles Zancada n'exerce aucun contrôle et dont elle n'assume aucune responsabilité. Il est recommandé de les lire avant de connecter un compte."]},{"h":"15. Modifications de la présente Politique","p":["Zancada pourra modifier la présente Politique pour refléter des changements légaux ou du service. Les modifications seront publiées avec leur date d'entrée en vigueur. Lorsque le changement est substantiel — notamment concernant le traitement des données sensibles —, il sera notifié de manière visible dans l'application avant son entrée en vigueur. Si l'Utilisateur n'est pas d'accord avec la modification, il peut cesser d'utiliser les Services et supprimer son compte."]}],"h_contact":"Contact","contact_q":"Questions, demandes d'exercice de droits ou réclamations relatives au traitement des données personnelles :","note":"Ce document a été rédigé comme un modèle général pour une application en développement et ne constitue pas un conseil juridique. Avant de lancer Zancada publiquement, il est recommandé de le faire relire par un avocat et de l'adapter à la réglementation applicable."},"it":{"title":"Zancada — Informativa sulla Privacy","back":"‹ Torna a Zancada","updated":"Ultimo aggiornamento: 6 ottobre 2026","intro":"La presente Informativa sulla Privacy descrive come Zancada raccoglie, utilizza, condivide e protegge i dati personali dei propri utenti, e quali diritti e scelte spettano loro. È redatta in linguaggio chiaro e deve essere letta insieme ai Termini e Condizioni del servizio.","summary_label":"In breve","summary":["Zancada non vende i dati personali né li utilizza a fini pubblicitari. I dati di salute, di posizione e le metriche fisiche non vengono mai usati per pubblicità o marketing.","Quando l'Utente registra una corsa con il telefono, l'app utilizza la sua posizione (GPS) anche in background, solo mentre l'attività è in corso.","Non vengono utilizzati cookie di tracciamento né strumenti di analisi di alcun tipo.","L'Utente può eliminare tutti i propri dati in qualsiasi momento dall'app.","I dati sono condivisi solo con i fornitori necessari al funzionamento del servizio, indicati nella sezione 6."],"sections":[{"h":"1. Ambito e titolare del trattamento","p":["La presente Informativa si applica all'applicazione mobile Zancada, alla sua versione web e ai servizi, alle funzioni e ai siti correlati (insieme, i \"Servizi\"). In questa Informativa, \"Zancada\", \"noi\" e \"nostro\" designano il titolare del trattamento indicato di seguito; \"Utente\" designa la persona che utilizza i Servizi."],"ph":"[Da completare prima della pubblicazione dell'app]: ragione sociale o nome completo del titolare del trattamento dei dati, CUIT, indirizzo legale, e-mail di contatto e, se applicabile, numero di registrazione della banca dati presso l'Agenzia per l'accesso all'informazione pubblica (AAIP) della Repubblica Argentina.","p2":[]},{"h":"2. Dati personali che raccogliamo","p":["In base alle funzioni utilizzate dall'Utente, Zancada tratta le seguenti categorie di dati:"],"ul":["<strong>Dati di account e profilo:<\/strong> indirizzo e-mail, nome, foto del profilo e password (quest'ultima protetta dal fornitore di autenticazione). Se l'Utente accede con Google o Apple, si ricevono anche i dati di base che tali piattaforme condividono. Se l'Utente sceglie di cambiare la foto, l'app chiede, in modo facoltativo, l'accesso alla fotocamera o alla galleria del dispositivo; l'immagine è utilizzata esclusivamente per il profilo nell'app e non è condivisa con terzi.","<strong>Dati di salute e allenamento (dati sensibili):<\/strong> corse registrate (distanza, durata, ritmo, percorso GPS, cadenza, dislivello, potenza), frequenza cardiaca e zone impostate, peso, altezza, data di nascita e genere, fastidi o note di salute che l'Utente inserisce volontariamente e il risultato del test di livello.","<strong>Metriche calcolate:<\/strong> ritmi di allenamento, zone, indici di prestazione e adattamenti del piano che Zancada genera a partire dai dati precedenti.","<strong>Posizione, anche in background:<\/strong> quando l'Utente registra una corsa con il telefono, l'app raccoglie la sua posizione precisa (GPS) in tempo reale e in background. Ciò significa che continua a registrare percorso, ritmo e distanza anche se l'app è ridotta a icona o lo schermo è spento, e che viene mostrata una notifica mentre lo fa. Il tracciamento si interrompe al termine dell'attività. Se l'Utente sincronizza le corse da un orologio, il GPS del telefono non viene utilizzato. L'uso prolungato del GPS può aumentare il consumo della batteria.","<strong>Profilo sportivo:<\/strong> terreno preferito, tipo di corridore, giorni di allenamento, preferenza di misurazione a tempo o a distanza, obiettivo o gara in programma, obiettivo settimanale, sport complementari e scarpe registrate.","<strong>Conversazioni con Zonda:<\/strong> i messaggi scambiati con Zonda, l'assistente virtuale basato sull'Intelligenza Artificiale, e il contesto sportivo necessario per rispondere.","<strong>Dati di dispositivi e app di terze parti (facoltativi):<\/strong> attività sincronizzate da Strava, Polar, Wahoo, COROS, Suunto o Health Connect (su Android: esercizi, distanza e frequenza cardiaca). Se l'Utente attiva l'aggiunta del piano al calendario del telefono, il permesso del calendario è utilizzato solo per creare ed eliminare gli allenamenti in un calendario dedicato chiamato \"Zancada\".","<strong>Dati di supporto:<\/strong> le informazioni che l'Utente ci invia quando richiede assistenza o invia commenti.","<strong>Dati tecnici del dispositivo:<\/strong> indirizzo IP, tipo di dispositivo e versione del sistema operativo, versione dell'app, registri degli errori e identificativi del dispositivo necessari per consegnare le notifiche push.","<strong>Preferenze:<\/strong> lingua, sistema di unità e stato delle notifiche.","<strong>Dati di pagamento:<\/strong> Zancada non raccoglie né conserva dati di carte. I pagamenti sono elaborati esclusivamente tramite Apple App Store o Google Play, che comunicano a Zancada soltanto lo stato dell'abbonamento."],"p2":["Questi dati, inclusi quelli di salute e di posizione, sono trattati con il consenso esplicito dell'Utente, prestato alla creazione dell'account e all'attivazione di ciascuna funzione (ad esempio, il GPS in background, un'integrazione o le notifiche). Il consenso può essere revocato in qualsiasi momento eliminando i dati dall'app, senza pregiudicare la liceità del trattamento precedente."]},{"h":"3. Fonti dei dati","p":["La maggior parte dei dati è fornita direttamente dall'Utente o generata dal suo telefono durante la registrazione di un'attività. Si ottengono inoltre dati da: (a) dispositivi e app che l'Utente decide di collegare (Strava, Polar, Wahoo, COROS, Suunto, Health Connect), dai quali si importano solo le attività autorizzate; (b) gli account di terze par
