ti con cui l'Utente accede (Google o Apple); e (c) fornitori di servizi, ad esempio i rapporti tecnici sugli errori.","Quando i dati di salute provengono da dispositivi o app collegati, Zancada li utilizza esclusivamente per fornire le funzioni descritte in questa Informativa e non li vende, non li usa a fini pubblicitari e non li cede a terzi senza il consenso dell'Utente."]},{"h":"4. Finalità e basi giuridiche del trattamento","p":["Zancada tratta i dati personali per le seguenti finalità, sulla base delle basi giuridiche indicate:"],"ul":["<strong>Fornire i Servizi:<\/strong> creare e gestire l'account, generare e adattare il piano di allenamento, calcolare ritmi e zone dal test di livello, registrare e analizzare le attività, mostrare progressi, storico e stato delle scarpe. Base giuridica: esecuzione del contratto (Termini e Condizioni) e consenso.","<strong>Assistenza con Intelligenza Artificiale:<\/strong> consentire a Zonda di rispondere con un contesto reale sull'Utente. Base giuridica: esecuzione del contratto e consenso.","<strong>Notifiche e avvisi:<\/strong> segnalare la sessione del giorno e avvisare di aumenti rapidi del carico di allenamento o dell'usura delle scarpe, quando l'Utente li ha attivati. Base giuridica: consenso.","<strong>Supporto e comunicazioni di servizio:<\/strong> rispondere alle richieste e comunicare modifiche rilevanti dei Termini o di questa Informativa. Base giuridica: esecuzione del contratto e legittimo interesse.","<strong>Sicurezza, prevenzione degli abusi e miglioramento tecnico:<\/strong> rilevare e correggere errori, proteggere l'integrità dei Servizi e prevenire accessi non autorizzati. Base giuridica: legittimo interesse.","<strong>Adempimento di obblighi legali:<\/strong> rispondere a richieste di autorità competenti e agli obblighi contabili o fiscali legati agli abbonamenti. Base giuridica: obbligo legale."],"box":{"label":"Limite d'uso","text":"I dati di salute, di posizione e le metriche fisiche non vengono mai utilizzati per scopi pubblicitari o di marketing, né venduti o ceduti a terzi o a intermediari di dati (data broker). Zancada rispetta le norme per sviluppatori di Apple App Store e Google Play."}},{"h":"5. Decisioni automatizzate e Intelligenza Artificiale","p":["I piani di allenamento, i loro adattamenti settimanali e le risposte di Zonda sono generati in modo automatizzato a partire dai dati dell'Utente. Questi strumenti hanno carattere indicativo e non producono decisioni con effetti giuridici né che incidano in modo significativo sull'Utente. L'Utente può modificare il proprio piano, chiederne la revisione ed esercitare i diritti descritti nella sezione 11 scrivendo a info@zancada.org.","Per generare le risposte di Zonda, Zancada invia ad Anthropic (Claude) il testo dell'Utente e il contesto strettamente necessario: profilo, piano, storico recente delle corse, zone di frequenza cardiaca e note o fastidi registrati. Secondo le sue condizioni per i clienti API, Anthropic non utilizza tali informazioni per addestrare i propri modelli."]},{"h":"6. Destinatari dei dati","p":["Zancada non vende i dati personali. I dati sono comunicati solo ai seguenti fornitori e terzi, nella misura necessaria al funzionamento del servizio:"],"ul":["<strong>Supabase:<\/strong> ospita il database in cui sono conservate le informazioni dell'Utente.","<strong>Vercel:<\/strong> ospita l'applicazione web e le funzioni server.","<strong>Strava:<\/strong> sincronizzazione bidirezionale delle attività, solo se l'Utente la collega.","<strong>Polar:<\/strong> sincronizzazione delle corse, solo se l'Utente collega il proprio account.","<strong>Wahoo:<\/strong> sincronizzazione delle corse e invio degli allenamenti pianificati (con intervalli e frequenza cardiaca obiettivo), solo se l'Utente collega il proprio account.","<strong>COROS:<\/strong> sincronizzazione delle corse, solo se l'Utente collega il proprio account.","<strong>Suunto:<\/strong> sincronizzazione delle corse e invio degli allenamenti pianificati (con intervalli e frequenza cardiaca obiettivo), solo se l'Utente collega il proprio account.","<strong>Google e Apple:<\/strong> accesso, solo se l'Utente sceglie di entrare con il proprio account Google o Apple, e abbonamenti tramite i rispettivi store.","<strong>Firebase Cloud Messaging (Google):<\/strong> riceve un identificativo del dispositivo per consegnare le notifiche push, se l'Utente le ha attivate.","<strong>Anthropic (Claude):<\/strong> modello di Intelligenza Artificiale che fa funzionare Zonda, nei termini della sezione 5.","<strong>Sentry:<\/strong> riceve informazioni tecniche quando si verifica un errore sul server o si tenta un accesso non autorizzato a una parte protetta dell'app. Non gli vengono mai inviati password né dati di pagamento."],"p2":["I fornitori agiscono per conto di Zancada, accedono solo alle informazioni necessarie alla loro funzione e sono tenuti a proteggerle. Inoltre, Zancada potrà conservare o comunicare dati quando richiesto dalla legge o da un ordine di un'autorità competente, o quando sia ragionevolmente necessario per prevenire un danno grave alle persone, rilevare frodi o abusi, o esercitare o difendere diritti in un procedimento legale. In caso di fusione, acquisizione o cessione dell'attività, i dati potranno essere trasferiti al successore, previa notifica all'Utente e nel rispetto di questa Informativa."]},{"h":"7. Trasferimenti internazionali di dati","p":["I fornitori indicati gestiscono server fuori dalla Repubblica Argentina (ad esempio, negli Stati Uniti e nell'Unione Europea), per cui l'uso dei Servizi comporta il trasferimento internazionale di dati personali. Tali trasferimenti avvengono tramite connessioni sicure e solo con fornitori che offrono garanzie adeguate di protezione, mediante clausole contrattuali tipo o altri meccanismi riconosciuti, in conformità alla legge argentina 25.326 e, ove applicabile, al Regolamento generale sulla protezione dei dati (GDPR) dell'Unione Europea. Utilizzando i Servizi, l'Utente presta il proprio consenso informato a tali trasferimenti. Può richiedere informazioni sulle garanzie applicate scrivendo a info@zancada.org."]},{"h":"8. Sicurezza delle informazioni","p":["Zancada applica misure tecniche, amministrative e fisiche ragionevoli per proteggere i dati da accesso non autorizzato, perdita, alterazione o divulgazione: crittografia in transito (HTTPS/TLS), server ad accesso limitato, controllo delle autorizzazioni per utente e monitoraggio degli errori. Nessun sistema è infallibile. In caso di incidente di sicurezza che riguardi i dati personali dell'Utente, Zancada lo notificherà in conformità alla normativa applicabile."]},{"h":"9. Conservazione e cancellazione dei dati","p":["I dati sono conservati nell'account dell'Utente finché questo è attivo. L'app conserva inoltre una copia temporanea sul telefono per funzionare offline, che si sincronizza quando torna la connessione. I registri tecnici degli errori sono conservati per un periodo limitato, non superiore a 90 giorni.","Quando l'account viene eliminato (Profilo → Elimina i miei dati), i dati personali, di salute e di posizione sono rimossi dai server di produzione; i backup ruotano e sono distrutti automaticamente entro un massimo di 30 giorni. Zancada potrà eliminare gli account rimasti inattivi per oltre tre anni, previo avviso all'e-mail registrata. I dati che devono essere conservati per obblighi di legge (ad esempio, fiscali o contabili) saranno mantenuti solo per il periodo richiesto."]},{"h":"10. Cookie, analisi e tecnologie simili","p":["Zancada non utilizza cookie pubblicitari, Google Analytics, Meta Pixel né alcun altro SDK di analisi o tracciamento, e non condivide dati con reti pubblicitarie. Si impiega solo archiviazione tecnica essenziale per il funzionamento dell'app: mantenere la sessione attiva, conservare una copia dei dati sul telefono per l'uso offline e un identificativo del dispositivo per consegnare le notifiche push (tramite Firebase Cloud Messaging), se attivate. Poiché non si usano cookie di tracciamento né strumenti di analisi, non è necessario un banner di consenso ai cookie, e non si elaborano segnali \"Do Not Track\" né di controllo globale della privacy perché non esiste tracciamento pubblicitario."]},{"h":"11. Diritti dell'interessato e come esercitarli","p":["L'interessato può, in qualsiasi momento: accedere ai propri dati; chiederne la rettifica, l'aggiornamento o la cancellazione; opporsi al trattamento o chiederne la limitazione; richiedere la portabilità (una copia in formato strutturato e di uso comune); e revocare il consenso prestato. Può eliminare da solo tutti i propri dati da Profilo → Elimina i miei dati.","Per esercitare tali diritti deve scrivere a info@zancada.org, indicando il diritto che intende esercitare e i dati a cui si riferisce, dall'e-mail associata all'account (o dimostrando la propria identità con altro mezzo ragionevole). La risposta sarà fornita nei termini di legge: dieci (10) giorni di calendario per l'accesso e cinque (5) giorni lavorativi per la rettifica, l'aggiornamento o la cancellazione. L'esercizio dei diritti non comporta discriminazioni né modifiche delle condizioni del servizio.","Nella Repubblica Argentina, l'accesso ai dati personali è gratuito a intervalli non inferiori a sei mesi, salvo che si dimostri un interesse legittimo. L'Agenzia per l'accesso all'informazione pubblica (AAIP), organo di controllo della legge 25.326, tratta le denunce e i reclami per violazioni della normativa sulla protezione dei dati personali (argentina.gob.ar/aaip).","Se l'interessato si trova nell'Unione Europea, nel Regno Unito o in un'altra giurisdizione con normativa propria (ad esempio, il GDPR), gli spettano i diritti equivalenti e può presentare reclamo all'autorità di controllo competente. Rappresentante nell'Unione Europea, se applicabile: [Da completare prima della pubblicazione dell'app]."]},{"h":"12. Residenti negli Stati Uniti e in altre giurisdizioni","p":["Zancada non vende dati personali né li condivide per pubblicità mirata o pubblicità comportamentale tra contesti. Le informazioni sensibili (inclusi i dati di salute e la posizione precisa) sono utilizzate solo per fornire i Servizi richiesti. I residenti di Stati USA con leggi sulla privacy (ad esempio, la California) possono esercitare i diritti di accesso, correzione, cancellazione e portabilità attraverso il mezzo indicato nella sezione 11, senza subire discriminazioni."]},{"h":"13. Minori","p":["Zancada non è rivolta a persone sotto i 16 anni e non ne raccoglie consapevolmente i dati. Tra i 16 e i 17 anni, l'uso dei Servizi richiede l'autorizzazione del genitore o del tutore legale, che deve acconsentire al trattamento dei dati. Se si rilevasse la raccolta di dati di un minore senza tale consenso, l'account sarà eliminato immediatamente. I genitori o tutori possono contattare info@zancada.org per richiedere la cancellazione dei dati di un minore."]},{"h":"14. Link e servizi di terze parti","p":["I Servizi possono contenere link a siti o app di terze parti e consentire il collegamento con piattaforme esterne (Strava, Polar, Wahoo, COROS, Suunto, Google, Apple, tra altre). I dati che l'Utente fornisce a tali terzi sono regolati dalle rispettive informative sulla privacy, sulle quali Zancada non ha controllo né assume responsabilità. Si raccomanda di leggerle prima di collegare un account."]},{"h":"15. Modifiche a questa Informativa","p":["Zancada potrà modificare questa Informativa per riflettere cambiamenti normativi o del servizio. Le modifiche saranno pubblicate con la data di efficacia. Quando la modifica è sostanziale — in particolare riguardo al trattamento dei dati sensibili —, sarà notificata in modo evidente nell'app prima dell'entrata in vigore. Se l'Utente non è d'accordo con la modifica, può smettere di usare i Servizi ed eliminare il proprio account."]}],"h_contact":"Contatto","contact_q":"Domande, richieste di esercizio dei diritti o reclami sul trattamento dei dati personali:","note":"Questo documento è stato redatto come modello generale per un'app in sviluppo e non costituisce consulenza legale. Prima di lanciare Zancada pubblicamente, si raccomanda che un avvocato lo riveda e lo adatti alla normativa applicabile."},"de":{"title":"Zancada — Datenschutzerklärung","back":"‹ Zurück zu Zancada","updated":"Zuletzt aktualisiert: 6. Oktober 2026","intro":"Diese Datenschutzerklärung beschreibt, wie Zancada personenbezogene Daten seiner Nutzer erhebt, verwendet, weitergibt und schützt und welche Rechte und Wahlmöglichkeiten den Nutzern zustehen. Sie ist in verständlicher Sprache verfasst und zusammen mit den Allgemeinen Geschäftsbedingungen des Dienstes zu lesen.","summary_label":"Kurz gefasst","summary":["Zancada verkauft keine personenbezogenen Daten und verwendet sie nicht für Werbezwecke. Gesundheits-, Standort- und körperliche Messdaten werden niemals für Werbung oder Marketing genutzt.","Wenn der Nutzer einen Lauf mit dem Smartphone aufzeichnet, verwendet die App seinen Standort (GPS), auch im Hintergrund, und nur solange die Aktivität läuft.","Es werden keine Tracking-Cookies und keine Analysewerkzeuge irgendeiner Art eingesetzt.","Der Nutzer kann jederzeit alle seine Daten in der App löschen.","Daten werden nur an die für den Betrieb des Dienstes erforderlichen Dienstleister weitergegeben, die in Abschnitt 6 aufgeführt sind."],"sections":[{"h":"1. Geltungsbereich und Verantwortlicher","p":["Diese Erklärung gilt für die mobile Anwendung Zancada, ihre Webversion sowie die zugehörigen Dienste, Funktionen und Websites (zusammen die „Dienste“). In dieser Erklärung bezeichnen „Zancada“, „wir“ und „unser“ den nachstehend angegebenen Verantwortlichen; „Nutzer“ bezeichnet die Person, die die Dienste verwendet."],"ph":"[Vor der Veröffentlichung der App zu ergänzen]: Firma oder vollständiger Name des Verantwortlichen für die Datenverarbeitung, CUIT, Rechtsanschrift, Kontakt-E-Mail und gegebenenfalls Registernummer der Datenbank bei der Agentur für den Zugang zu öffentlichen Informationen (AAIP) der Argentinischen Republik.","p2":[]},{"h":"2. Personenbezogene Daten, die wir erheben","p":["Je nach den vom Nutzer verwendeten Funktionen verarbeitet Zancada die folgenden Datenkategorien:"],"ul":["<strong>Konto- und Profildaten:<\/strong> E-Mail-Adresse, Name, Profilbild und Passwort (letzteres geschützt durch den Authentifizierungsdienstleister). Meldet sich der Nutzer mit Google oder Apple an, erhalten wir zudem die Basisdaten, die diese Plattformen weitergeben. Wählt der Nutzer ein neues Foto, fragt die App freiwillig nach Zugriff auf die Kamera oder Galerie des Geräts; das Bild wird ausschließlich für das Profil in der App verwendet und nicht an Dritte weitergegeben.","<strong>Gesundheits- und Trainingsdaten (sensible Daten):<\/strong> aufgezeichnete Läufe (Distanz, Dauer, Tempo, GPS-Strecke, Schrittfrequenz, Höhenmeter, Leistung), Herzfrequenz und eingestellte Zonen, Gewicht, Größe, Geburtsdatum und Geschlecht, vom Nutzer freiwillig angegebene Beschwerden oder Gesundheitshinweise sowie das Ergebnis des Leistungstests.","<strong>Berechnete Kennzahlen:<\/strong> Trainingstempi, Zonen, Leistungsindizes und Plananpassungen, die Zancada aus den vorstehenden Daten erzeugt.","<strong>Standort, auch im Hintergrund:<\/strong> Zeichnet der Nutzer einen Lauf mit dem Smartphone auf, erhebt die App seinen genauen Standort (GPS) in Echtzeit und im Hintergrund. Das bedeutet, dass Strecke, Tempo und Distanz auch dann weiter aufgezeichnet werden, wenn die App minimiert oder der Bildschirm ausgeschaltet ist, und dass dabei eine Benachrichtigung angezeigt wird. Die Erfassung endet mit dem Ende der Aktivität. Synchronisiert der Nutzer Läufe von einer Uhr, wird das GPS des Smartphones nicht verwendet. Die längere Nutzung des GPS kann den Akkuverbrauch erhöhen.","<strong>Sportprofil:<\/strong> bevorzugtes Terrain, Läufertyp, Trainingstage, Präferenz für Zeit- oder Distanzsteuerung, Ziel oder geplanter Wettkampf, Wochenziel, Ergänzungssportarten und registrierte Laufschuhe.","<strong>Gespräche mit Zonda:<\/strong> die mit Zonda, dem auf Künstlicher Intelligenz basierenden virtuellen Assistenten, ausgetauschten Nachrichten und der sportliche Kontext, der zur Antwort erforderlich ist.","<strong>Daten von Geräten und Apps Dritter (optional):<\/strong> Aktivitäten, die von Strava, Polar, Wahoo, COROS, Suunto oder Health Connect synchronisiert werden (unter Android: Übungen, Distanz und Herzfrequenz). Aktiviert der Nutzer das Hinzufügen des Plans zum Kalender des Smartphones, wird die Kalenderberechtigung ausschließlich zum Anlegen und Löschen der Trainingseinheiten in einem eigenen Kalender namens „Zancada“ verwendet.","<strong>Supportdaten:<\/strong> Informationen, die uns der Nutzer bei Supportanfragen oder Rückmeldungen übermittelt.","<strong>Technische Gerätedaten:<\/strong> IP-Adresse, Gerätetyp und Betriebssystemversion, App-Version, Fehlerprotokolle und Gerätekennungen, die zur Zustellung von Push-Benachrichtigungen erforderlich sind.","<strong>Einstellungen:<\/strong> Sprache, Maßeinheitensystem und Status der Benachrichtigungen.","<strong>Zahlungsdaten:<\/strong> Zancada erhebt und speichert keine Kartendaten. Zahlungen werden ausschließlich über den Apple App Store oder Google Play abgewickelt, die Zancada lediglich den Status des Abonnements mitteilen."],"p2":["Diese Daten, einschließlich der Gesundheits- und Standortdaten, werden mit der ausdrücklichen Einwilligung des Nutzers verarbeitet, die bei der Kontoerstellung und bei der Aktivierung der jeweiligen Funktion (z. B. GPS im Hintergrund, eine Integration oder Benachrichtigungen) erteilt wird. Die Einwilligung kann jederzeit durch Löschen der Daten in der App widerrufen werden, ohne die Rechtmäßigkeit der bis dahin erfolgten Verarbeitung zu berühren."]},{"h":"3. Datenquellen","p":["Der größte Teil der Daten wird vom Nutzer selbst bereitgestellt oder von seinem Smartphone bei der Aufzeichnung einer Aktivität erzeugt. Daten stammen außerdem aus: (a) Geräten und Apps, die der Nutzer verbindet (Strava, Polar, Wahoo, COROS, Suunto, Health Connect), aus denen nur die autorisierten Aktivitäten importiert werden; (b) Konten Dritter, mit denen sich der Nutzer anmeldet (Google oder Apple); und (c) Dienstleistern, etwa technischen Fehlerberichten.","Stammen Gesundheitsdaten von verbundenen Geräten oder Apps, verwendet Zancada sie ausschließlich zur Bereitstellung der in dieser Erklärung beschriebenen Funktionen und verkauft sie nicht, nutzt sie nicht für Werbung und gibt sie nicht ohne Einwilligung des Nutzers an Dritte weiter."]},{"h":"4. Zwecke und Rechtsgrundlagen der Verarbeitung","p":["Zancada verarbeitet personenbezogene Daten zu den folgenden Zwecken auf der jeweils genannten Rechtsgrundlage:"],"ul":["<strong>Bereitstellung der Dienste:<\/strong> Konto anlegen und verwalten, Trainingsplan erstellen und anpassen, Tempi und Zonen aus dem Leistungstest berechnen, Aktivitäten aufzeichnen und auswerten, Fortschritt, Verlauf und Schuhstatus anzeigen. Rechtsgrundlage: Vertragserfüllung (Allgemeine Geschäftsbedingungen) und Einwilligung.","<strong>Unterstützung durch Künstliche Intelligenz:<\/strong> Zonda ermöglichen, mit realem Kontext zum Nutzer zu antworten. Rechtsgrundlage: Vertragserfüllung und Einwilligung.","<strong>Benachrichtigungen und Hinweise:<\/strong> auf die Tageseinheit hinweisen und bei schnellen Steigerungen der Trainingsbelastung oder Schuhabnutzung warnen, sofern vom Nutzer aktiviert. Rechtsgrundlage: Einwilligung.","<strong>Support und Servicemitteilungen:<\/strong> Anfragen beantworten und über wesentliche Änderungen der Bedingungen oder dieser Erklärung informieren. Rechtsgrundlage: Vertragserfüllung und berechtigtes Interesse.","<strong>Sicherheit, Missbrauchsprävention und technische Verbesserung:<\/strong> Fehler erkennen und beheben, die Integrität der Dienste schützen und unbefugten Zugriff verhindern. Rechtsgrundlage: berechtigtes Interesse.","<strong>Erfüllung rechtlicher Pflichten:<\/strong> Anfragen zuständiger Behörden beantworten sowie buchhalterische oder steuerliche Pflichten im Zusammenhang mit Abonnements erfüllen. Rechtsgrundlage: rechtliche Verpflichtung."],"box":{"label":"Nutzungsgrenze","text":"Gesundheits-, Standort- und körperliche Messdaten werden niemals für Werbe- oder Marketingzwecke verwendet und niemals an Dritte oder Datenhändler (Data Broker) verkauft oder weitergegeben. Zancada hält die Entwicklerrichtlinien des Apple App Store und von Google Play ein."}},{"h":"5. Automatisierte Entscheidungen und Künstliche Intelligenz","p":["Trainingspläne, ihre wöchentlichen Anpassungen und die Antworten von Zonda werden automatisiert auf Grundlage der Daten des Nutzers erzeugt. Diese Werkzeuge haben empfehlenden Charakter und führen weder zu Entscheidungen mit rechtlicher Wirkung noch zu solchen, die den Nutzer erheblich beeinträchtigen. Der Nutzer kann seinen Plan ändern, eine Überprüfung verlangen und die in Abschnitt 11 beschriebenen Rechte ausüben, indem er an info@zancada.org schreibt.","Zur Erzeugung der Antworten von Zonda übermittelt Zancada an Anthropic (Claude) den Text des Nutzers und den unbedingt erforderlichen Kontext: Profil, Plan, jüngster Laufverlauf, Herzfrequenzzonen sowie erfasste Hinweise oder Beschwerden. Nach den Bedingungen für API-Kunden verwendet Anthropic diese Informationen nicht zum Training seiner Modelle."]},{"h":"6. Empfänger der Daten","p":["Zancada verkauft keine personenbezogenen Daten. Daten werden nur an die folgenden Dienstleister und Dritten weitergegeben, soweit dies für den Betrieb des Dienstes erforderlich ist:"],"ul":["<strong>Supabase:<\/strong> hostet die Datenbank, in der die Informationen des Nutzers gespeichert sind.","<strong>Vercel:<\/strong> hostet die Webanwendung und die Serverfunktionen.","<strong>Strava:<\/strong> bidirektionale Synchronisierung von Aktivitäten, nur wenn der Nutzer sie verbindet.","<strong>Polar:<\/strong> Synchronisierung von Läufen, nur wenn der Nutzer sein Konto verbindet.","<strong>Wahoo:<\/strong> Synchronisierung von Läufen und Übermittlung geplanter Trainingseinheiten (mit Intervallen und Zielherzfrequenz), nur wenn der Nutzer sein Konto verbindet.","<strong>COROS:<\/strong> Synchronisierung von Läufen, nur wenn der Nutzer sein Konto verbindet.","<strong>Suunto:<\/strong> Synchronisierung von Läufen und Übermittlung geplanter Trainingseinheiten (mit Intervallen und Zielherzfrequenz), nur wenn der Nutzer sein Konto verbindet.","<strong>Google und Apple:<\/strong> Anmeldung, nur wenn der Nutzer sich mit seinem Google- oder Apple-Konto anmeldet, sowie Abonnements über die jeweiligen Stores.","<strong>Firebase Cloud Messaging (Google):<\/strong> erhält eine Gerätekennung zur Zustellung von Push-Benachrichtigungen, sofern der Nutzer diese aktiviert hat.","<strong>Anthropic (Claude):<\/strong> Modell der Künstlichen Intelligenz, das Zonda betreibt, nach Maßgabe von Abschnitt 5.","<strong>Sentry:<\/strong> erhält technische Informationen, wenn auf dem Server ein Fehler auftritt oder ein unbefugter Zugriff auf einen geschützten Teil der App versucht wird. Passwörter und Zahlungsdaten werden ihm niemals übermittelt."],"p2":["Die Dienstleister handeln im Auftrag von Zancada, greifen nur auf die für ihre Funktion erforderlichen Informationen zu und sind zu deren Schutz verpflichtet. Zudem kann Zancada Daten aufbewahren oder offenlegen, wenn dies gesetzlich oder durch Anordnung einer zuständigen Behörde verlangt wird oder vernünftigerweise erforderlich ist, um schweren Schaden von Personen abzuwenden, Betrug oder Missbrauch zu erkennen oder Rechte in einem Rechtsverfahren auszuüben oder zu verteidigen. Bei einer Fusion, Übernahme oder Übertragung des Geschäfts können die Daten auf den Rechtsnachfolger übergehen, nach vorheriger Mitteilung an den Nutzer und unter Beachtung dieser Erklärung."]},{"h":"7. Internationale Datenübermittlung","p":["Die genannten Dienstleister betreiben Server außerhalb der Argentinischen Republik (z. B. in den Vereinigten Staaten und in der Europäischen Union); daher beinhaltet die Nutzung der Dienste eine internationale Übermittlung personenbezogener Daten. Diese Übermittlungen erfolgen über sichere Verbindungen und nur an Dienstleister, die angemessene Schutzgarantien bieten, mittels Standardvertragsklauseln oder anderer anerkannter Mechanismen, gemäß dem argentinischen Gesetz 25.326 und, soweit anwendbar, der Datenschutz-Grundverordnung (DSGVO) der Europäischen Union. Mit der Nutzung der Dienste erteilt der Nutzer seine informierte Einwilligung in diese Übermittlungen. Informationen über die angewandten Garantien können unter info@zancada.org angefordert werden."]},{"h":"8. Informationssicherheit","p":["Zancada wendet angemessene technische, organisatorische und physische Maßnahmen an, um Daten vor unbefugtem Zugriff, Verlust, Veränderung oder Offenlegung zu schützen: Verschlüsselung bei der Übertragung (HTTPS/TLS), Server mit beschränktem Zugang, Berechtigungskontrolle je Nutzer und Fehlerüberwachung. Kein System ist unfehlbar. Bei einem Sicherheitsvorfall, der personenbezogene Daten des Nutzers betrifft, wird Zancada dies nach den anwendbaren Vorschriften mitteilen."]},{"h":"9. Aufbewahrung und Löschung der Daten","p":["Die Daten werden im Konto des Nutzers gespeichert, solange dieses aktiv ist. Die App hält außerdem eine temporäre Kopie auf dem Smartphone vor, um offline zu funktionieren; sie wird synchronisiert, sobald wieder eine Verbindung besteht. Technische Fehlerprotokolle werden für einen begrenzten Zeitraum von höchstens 90 Tagen aufbewahrt.","Wird das Konto gelöscht (Profil → Meine Daten löschen), werden personenbezogene, Gesundheits- und Standortdaten von den Produktionsservern entfernt; Sicherungen rotieren und werden spätestens nach 30 Tagen automatisch vernichtet. Zancada kann Konten löschen, die länger als drei Jahre inaktiv waren, nach vorheriger Mitteilung an die hinterlegte E-Mail-Adresse. Daten, die aufgrund gesetzlicher Pflichten (z. B. steuerlicher oder buchhalterischer Art) aufbewahrt werden müssen, bleiben nur für den vorgeschriebenen Zeitraum erhalten."]},{"h":"10. Cookies, Analyse und ähnliche Technologien","p":["Zancada verwendet keine Werbe-Cookies, kein Google Analytics, keinen Meta Pixel und kein sonstiges Analyse- oder Tracking-SDK und gibt keine Daten an Werbenetzwerke weiter. Es wird nur technisch notwendiger Speicher verwendet, damit die App funktioniert: Sitzung aufrechterhalten, eine Kopie der Daten auf dem Smartphone für die Offline-Nutzung speichern und eine Gerätekennung zur Zustellung von Push-Benachrichtigungen (über Firebase Cloud Messaging), sofern aktiviert. Da keine Tracking-Cookies und keine Analysewerkzeuge eingesetzt werden, ist kein Cookie-Einwilligungsbanner erforderlich; „Do Not Track“- oder globale Datenschutzsignale werden nicht verarbeitet, weil kein Werbetracking stattfindet."]},{"h":"11. Rechte der betroffenen Person und ihre Ausübung","p":["Die betroffene Person kann jederzeit: Auskunft über ihre Daten verlangen; deren Berichtigung, Aktualisierung oder Löschung verlangen; der Verarbeitung widersprechen oder deren Einschränkung verlangen; Datenübertragbarkeit verlangen (eine Kopie in einem strukturierten, gängigen Format); und erteilte Einwilligungen widerrufen. Sie kann alle ihre Daten selbst unter Profil → Meine Daten löschen entfernen.","Zur Ausübung dieser Rechte ist eine Nachricht an info@zancada.org zu senden, in der das auszuübende Recht und die betroffenen Daten angegeben sind, und zwar von der mit dem Konto verknüpften E-Mail-Adresse (oder unter Nachweis der Identität auf andere angemessene Weise). Die Antwort erfolgt innerhalb der gesetzlichen Fristen: zehn (10) Kalendertage für Auskunft und fünf (5) Werktage für Berichtigung, Aktualisierung oder Löschung. Die Ausübung der Rechte führt weder zu Diskriminierung noch zu geänderten Dienstbedingungen.","In der Argentinischen Republik ist der Zugang zu personenbezogenen Daten in Abständen von nicht weniger als sechs Monaten kostenlos, sofern kein berechtigtes Interesse nachgewiesen wird. Die Agentur für den Zugang zu öffentlichen Informationen (AAIP), Kontrollorgan des Gesetzes 25.326, nimmt Beschwerden und Anzeigen wegen Verstößen gegen die Datenschutzvorschriften entgegen (argentina.gob.ar/aaip).","Befindet sich die betroffene Person in der Europäischen Union, im Vereinigten Königreich oder in einer anderen Rechtsordnung mit eigenen Vorschriften (z. B. der DSGVO), stehen ihr die entsprechenden Rechte zu, und sie kann Beschwerde bei der zuständigen Aufsichtsbehörde einlegen. Vertreter in der Europäischen Union, soweit anwendbar: [Vor der Veröffentlichung der App zu ergänzen]."]},{"h":"12. Einwohner der Vereinigten Staaten und anderer Rechtsordnungen","p":["Zancada verkauft keine personenbezogenen Daten und gibt sie nicht für zielgerichtete oder kontextübergreifende verhaltensbasierte Werbung weiter. Sensible Informationen (einschließlich Gesundheitsdaten und genauer Standort) werden nur zur Bereitstellung der angeforderten Dienste verwendet. Einwohner von US-Bundesstaaten mit Datenschutzgesetzen (z. B. Kalifornien) können die Rechte auf Auskunft, Berichtigung, Löschung und Übertragbarkeit über den in Abschnitt 11 genannten Weg ausüben, ohne Diskriminierung zu erfahren."]},{"h":"13. Minderjährige","p":["Zancada richtet sich nicht an Personen unter 16 Jahren und erhebt wissentlich keine Daten von ihnen. Zwischen 16 und 17 Jahren setzt die Nutzung der Dienste die Zustimmung eines Elternteils oder gesetzlichen Vertreters voraus, der in die Datenverarbeitung einwilligen muss. Wird festgestellt, dass Daten eines Minderjährigen ohne diese Einwilligung erhoben wurden, wird das Konto unverzüglich gelöscht. Eltern oder Vormunde können sich unter info@zancada.org melden, um die Löschung der Daten eines Minderjährigen zu verlangen."]},{"h":"14. Links und Dienste Dritter","p":["Die Dienste können Links zu Websites oder Apps Dritter enthalten und die Verbindung mit externen Plattformen ermöglichen (u. a. Strava, Polar, Wahoo, COROS, Suunto, Google, Apple). Die Daten, die der Nutzer diesen Dritten übermittelt, unterliegen deren jeweiligen Datenschutzerklärungen, über die Zancada weder Kontrolle hat noch Verantwortung übernimmt. Wir empfehlen, diese vor der Verbindung eines Kontos zu lesen."]},{"h":"15. Änderungen dieser Erklärung","p":["Zancada kann diese Erklärung ändern, um rechtliche oder dienstbezogene Änderungen abzubilden. Änderungen werden mit dem Datum des Inkrafttretens veröffentlicht. Ist die Änderung wesentlich — insbesondere hinsichtlich der Verarbeitung sensibler Daten —, wird sie vor ihrem Inkrafttreten deutlich in der App mitgeteilt. Ist der Nutzer mit der Änderung nicht einverstanden, kann er die Nutzung der Dienste einstellen und sein Konto löschen."]}],"h_contact":"Kontakt","contact_q":"Fragen, Anträge zur Ausübung von Rechten oder Beschwerden zur Verarbeitung personenbezogener Daten:","note":"Dieses Dokument wurde als allgemeine Vorlage für eine in Entwicklung befindliche App erstellt und stellt keine Rechtsberatung dar. Vor dem öffentlichen Start von Zancada wird empfohlen, es von einem Rechtsanwalt prüfen und an die anwendbaren Vorschriften anpassen zu lassen."}};
const LANG_LABELS = {es:'ES', en:'EN', pt:'PT', fr:'FR', it:'IT', de:'DE'};
const LANG_NAMES = {es:'es', en:'en-US', pt:'pt-BR', fr:'fr', it:'it', de:'de'};

function detectLang(){
  const url = new URL(window.location.href);
  const q = url.searchParams.get('lang');
  if(q && L[q]) return q;
  try{
    const saved = localStorage.getItem('zancada_legal_lang');
    if(saved && L[saved]) return saved;
  }catch(e){}
  const nav = (navigator.language || 'es').slice(0,2).toLowerCase();
  if(L[nav]) return nav;
  return 'es';
}

// Cada documento es una lista de secciones: título, párrafos, lista, recuadro de aviso o recuadro "a completar".
// El texto es propio (no viene de usuarios), por eso se arma con innerHTML para poder usar <strong> y <a>.
function renderSection(s){
  let html = '<h2>' + s.h + '</h2>';
  const boxHtml = s.box ? '<div class="health-box"><p class="health-label">' + s.box.label + '</p><p>' + s.box.text + '</p></div>' : '';
  const boxFirst = s.box && !s.ul && !s.p2;
  if(boxFirst) html += boxHtml;
  (s.p || []).forEach(t => { html += '<p>' + t + '</p>'; });
  if(s.ph) html += '<div class="placeholder-box"><p>' + s.ph + '</p></div>';
  if(s.ul) html += '<ul>' + s.ul.map(i => '<li>' + i + '</li>').join('') + '</ul>';
  if(s.box && !boxFirst) html += boxHtml;
  (s.p2 || []).forEach(t => { html += '<p>' + t + '</p>'; });
  return html;
}

function render(code){
  const d = L[code];
  document.documentElement.lang = LANG_NAMES[code] || code;
  document.getElementById('page-title').textContent = d.title;
  document.getElementById('back-link').textContent = d.back;
  document.getElementById('t-title').textContent = d.title.replace(/^Zancada\s*—\s*/, '');
  document.getElementById('t-updated').textContent = d.updated;
  document.getElementById('t-intro').textContent = d.intro;
  document.getElementById('t-summary-label').textContent = d.summary_label;
  document.getElementById('t-summary').innerHTML = d.summary.map(item=>'<li>' + item + '</li>').join('');
  document.getElementById('t-sections').innerHTML = d.sections.map(renderSection).join('');
  document.getElementById('t-h-contact').textContent = d.h_contact;
  document.getElementById('t-contact-q').textContent = d.contact_q;
  document.getElementById('t-note').textContent = d.note;
  document.querySelectorAll('.lang-pill').forEach(p=>p.classList.toggle('active', p.dataset.v===code));
  try{ localStorage.setItem('zancada_legal_lang', code); }catch(e){}
}

const langRow = document.getElementById('lang-row');
Object.keys(LANG_LABELS).forEach(code=>{
  const el = document.createElement('div');
  el.className = 'lang-pill';
  el.dataset.v = code;
  el.textContent = LANG_LABELS[code];
  el.onclick = ()=>render(code);
  langRow.appendChild(el);
});

render(detectLang());
</script>
