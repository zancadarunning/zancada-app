  p, li{color:var(--ink-soft); font-size:15px;}
  strong{color:var(--ink); font-weight:600;}
  ul{padding-left:20px;}
  li{margin-bottom:8px;}
  a{color:var(--ink); text-decoration:underline; text-underline-offset:2px;}
  .placeholder-box{border:1px solid var(--ink); padding:16px 18px; margin-top:4px;}
  .placeholder-box p{color:var(--ink); margin:0; font-size:13.5px; font-style:italic;}

uardan y por cuánto tiempo","storage":"Tus datos quedan guardados en la base de datos asociada a tu cuenta mientras la cuenta exista. Además, la app guarda una copia temporal en tu teléfono para poder seguir funcionando sin conexión, que se sincroniza apenas volvés a tener internet.","h_cookies":"7. Cookies, analítica y tecnologías similares","cookies":"Zancada no usa cookies de publicidad, no usa Google Analytics, Meta Pixel ni ningún otro SDK de analítica o rastreo, y no compartimos tus datos con redes publicitarias. Usamos únicamente almacenamiento técnico esencial para que la app funcione: mantener tu sesión iniciada, guardar una copia de tus datos en tu teléfono para que funcione sin conexión, y un identificador de tu dispositivo para poder enviarte notificaciones push (a través de Firebase Cloud Messaging) si las activaste. Como no usamos cookies de rastreo ni herramientas de analítica, no hace falta mostrarte un banner de consentimiento de cookies.","h_rights":"8. Tus derechos","rights":"Podés borrar todos tus datos vos mismo en cualquier momento desde Perfil → Borrar mis datos. También podés pedirnos una copia de tu información, corregir un dato puntual o retirar tu consentimiento escribiéndonos a la dirección de contacto de abajo. Si estás en Argentina, estos derechos de acceso, rectificación y supresión están reconocidos por la Ley 25.326 de Protección de Datos Personales, y podés hacer un reclamo ante la Agencia de Acceso a la Información Pública (AAIP) si considerás que no los respetamos. Si estás en otro país con su propia normativa de protección de datos (por ejemplo, el RGPD en la Unión Europea), tenés los mismos derechos básicos de acceder, corregir, borrar y llevarte tu información, y podés presentar un reclamo ante la autoridad de protección de datos que corresponda.","h_minors":"9. Menores de edad","minors":"Zancada no está dirigida a menores de 16 años.","h_changes":"10. Cambios a esta política","changes":"Si actualizamos esta política de forma importante, te lo vamos a avisar dentro de la app.","h_contact":"Contacto","contact_q":"¿Preguntas sobre tus datos o esta política?","note":"Este documento fue redactado como una plantilla general para una app en desarrollo y no constituye asesoramiento legal. Antes de lanzar Zancada públicamente, te recomendamos que un abogado la revise y la adapte a las leyes de tu país."},"en":{"title":"Zancada — Privacy Policy","back":"‹ Back to Zancada","updated":"Last updated: September 30, 2026","intro":"This policy explains what data Zancada collects, what we use it for, and what choices you have. We wrote it in plain language, without unnecessary legal jargon.","summary_label":"At a glance","summary":["We don't sell your data or use it for advertising.","We don't use tracking cookies or any kind of analytics SDK.","You can delete all your data yourself, anytime, from within the app.","We only share data with the services needed to make the app work — full list below."],"h_controller":"1. Who's responsible for your data","controller":"[To complete before publishing the app: legal name of the responsible person or company, registered address, and, if applicable, registration number with Argentina's Agencia de Acceso a la Información Pública (AAIP). In the meantime, any question about who manages your data can be sent to info@zancada.org.]","h_collect":"2. What data we collect","collect":[["Account","your email and, if you sign in with Google, your name and profile photo from that account."],["Training data","your runs (distance, duration, pace, GPS route, cadence, elevation), your heart rate during those runs, and your configured HR zones."],["Athletic profile","age, preferred terrain, runner type, your goal or upcoming race, weekly kilometer goal, and the shoes you log."],["Conversations with Zonda","the messages you send to Zonda, the AI coach, inside the app."],["Preferences","language, unit system (metric/imperial), and whether you enabled push notifications."]],"h_how":"3. How we get this data","how":"Most of it you enter directly in the app. If you connect your watch to Strava, Polar, Wahoo, or COROS, we sync your runs automatically from there (only the ones you authorize). If you sign in with Google, we receive the basic data Google shares to identify you.","h_use":"4. What we use it for","use":["Generate and adjust your training plan week by week.","Show you your progress, history, and stats.","Let the AI coach give you answers and suggestions with real context about you.","Notify you by push notification about today's session (if enabled).","Alert you if your training load rises too fast or if your shoes have passed their recommended mileage."],"h_share":"5. Who we share data with","share_intro":"We don't sell your data to anyone, and we don't use it for advertising. We only share it with the services that make the app work:","share":[["Supabase","hosts the database where your information is stored."],["Strava","two-way activity sync, only if you connect it."],["Polar","syncs your runs, only if you connect your Polar account."],["Wahoo","syncs your runs, only if you connect your Wahoo account."],["COROS","syncs your runs, only if you connect your COROS account."],["Google","only if you choose to sign in with your Google account."],["Firebase Cloud Messaging (Google)","receives a device identifier so it can deliver the coach's push notifications, if you enabled them."],["Anthropic (Claude)","is the AI model behind Zonda, our virtual coach. It processes what you write plus the context we need to give it so it can respond with real judgment: your profile, your training plan, your recent run history, your heart-rate zones, and any notes or aches you've logged."],["Sentry","receives technical information when a server error occurs, or when someone tries to access a protected part of the app without authorization, so we can detect and fix it. We never send it your password or payment data."]],"h_storage":"6. Where it's stored and for how long","storage":"Your data stays in the database tied to your account for as long as the account exists. The app also keeps a temporary copy on your phone so it can keep working offline, which syncs as soon as you're back online.","h_cookies":"7. Cookies, analytics, and similar technologies","cookies":"Zancada doesn't use advertising cookies, doesn't use Google Analytics, Meta Pixel, or any other analytics or tracking SDK, and we don't share your data with ad networks. We only use essential technical storage to make the app work: keeping you signed in, saving a copy of your data on your phone so the app works offline, and a device identifier so we can send you push notifications (via Firebase Cloud Messaging) if you enabled them. Since we don't use tracking cookies or analytics tools, there's no need to show you a cookie consent banner.","h_rights":"8. Your rights","rights":"You can delete all your data yourself at any time from Profile → Delete my data. You can also request a copy of your information, correct something specific, or withdraw your consent by writing to us at the contact address below. If you're in Argentina, these access, rectification, and deletion rights are recognized under Ley 25.326 (the Personal Data Protection Law), and you can file a complaint with the Agencia de Acceso a la Información Pública (AAIP) if you believe we haven't respected them. If you're in another country with its own data protection law (for example, the GDPR in the European Union), you have the same basic rights to access, correct, delete, and export your information, and you can file a complaint with the relevant data protection authority.","h_minors":"9. Minors","minors":"Zancada is not directed at anyone under 16.","h_changes":"10. Changes to this policy","changes":"If we make an important update to this policy, we'll let you know inside the app.","h_contact":"Contact","contact_q":"Questions about your data or this policy?","note":"This document was written as a general template for an app in development and does not constitute legal advice. Before launching Zancada publicly, we recommend having a lawyer review it and adapt it to your country's laws."},"pt":{"title":"Zancada — Política de Privacidade","back":"‹ Voltar para o Zancada","updated":"Última atualização: 30 de setembro de 2026","intro":"Esta política explica quais dados o Zancada coleta, para que os usamos e quais escolhas você tem. Escrevemos em linguagem simples, sem rodeios jurídicos desnecessários.","summary_label":"Resumo","summary":["Não vendemos seus dados nem os usamos para publicidade.","Não usamos cookies de rastreamento nem nenhum tipo de SDK de analítica.","Você pode apagar todos os seus dados sozinho, quando quiser, dentro do app.","Só compartilhamos dados com os serviços necessários para o app funcionar — lista completa abaixo."],"h_controller":"1. Responsável pelos seus dados","controller":"[A completar antes de publicar o app: razão social ou nome da pessoa responsável pelo tratamento de dados, endereço legal e, se aplicável, número de registro junto à Agencia de Acceso a la Información Pública (AAIP) da Argentina. Enquanto isso, qualquer dúvida sobre quem administra seus dados pode ser enviada para info@zancada.org.]","h_collect":"2. Quais dados coletamos","collect":[["Conta","seu email e, se você entrar com o Google, seu nome e foto de perfil dessa conta."],["Dados de treino","suas corridas (distância, duração, ritmo, rota GPS, cadência, desnível), sua frequência cardíaca durante essas corridas e suas zonas de FC configuradas."],["Perfil esportivo","idade, terreno preferido, tipo de corredor, seu objetivo ou próxima prova, meta semanal de quilômetros e os tênis que você registra."],["Conversas com o Zonda","as mensagens que você envia ao Zonda, o coach de IA, dentro do app."],["Preferências","idioma, sistema de medida (métrico/imperial) e se você ativou as notificações push."]],"h_how":"3. Como obtemos esses dados","how":"A maioria você insere diretamente no app. Se você conectar seu relógio ao Strava, Polar, Wahoo ou COROS, sincronizamos suas corridas automaticamente de lá (só as que você autorizar). Se você entrar com o Google, recebemos os dados básicos que o Google compartilha para te identificar.","h_use":"4. Para que os usamos","use":["Gerar e ajustar seu plano de treino semana a semana.","Mostrar seu progresso, histórico e estatísticas.","Permitir que o coach com IA te dê respostas e sugestões com contexto real sobre você.","Avisar por notificação push sobre sua sessão do dia (se ativado).","Alertar se sua carga de treino subir rápido demais ou se seus tênis já passaram da quilometragem recomendada."],"h_share":"5. Com quem compartilhamos dados","share_intro":"Não vendemos seus dados para ninguém, nem os usamos para publicidade. Compartilhamos apenas com os serviços que fazem o app funcionar:","share":[["Supabase","hospeda o banco de dados onde suas informações ficam salvas."],["Strava","sincronização bidirecional de atividades, só se você conectar."],["Polar","sincronização das suas corridas, só se você conectar sua conta Polar."],["Wahoo","sincronização das suas corridas, só se você conectar sua conta Wahoo."],["COROS","sincronização das suas corridas, só se você conectar sua conta COROS."],["Google","apenas se você escolher entrar com sua conta do Google."],["Firebase Cloud Messaging (Google)","recebe um identificador do seu dispositivo para poder entregar as notificações push do coach, se você as ativou."],["Anthropic (Claude)","é o modelo de IA por trás do Zonda, nosso coach virtual. Processa o que você escreve mais o contexto que precisamos passar para ele responder com critério: seu perfil, seu plano de treino, seu histórico recente de corridas, suas zonas de frequência cardíaca e as notas ou dores que você registrou."],["Sentry","recebe informações técnicas quando ocorre um erro no servidor, ou quando alguém tenta acessar uma parte protegida do app sem autorização, para que possamos detectar e corrigir. Nunca enviamos sua senha nem dados de pagamento."]],"h_storage":"6. Onde ficam guardados e por quanto tempo","storage":"Seus dados ficam no banco de dados associado à sua conta enquanto ela existir. Além disso, o app guarda uma cópia temporária no seu celular para continuar funcionando sem conexão, que sincroniza assim que você voltar a ter internet.","h_cookies":"7. Cookies, analítica e tecnologias semelhantes","cookies":"O Zancada não usa cookies de publicidade, não usa Google Analytics, Meta Pixel nem nenhum outro SDK de analítica ou rastreamento, e não compartilhamos seus dados com redes de anúncios. Usamos apenas armazenamento técnico essencial para o app funcionar: manter sua sessão iniciada, guardar uma cópia dos seus dados no celular para o app funcionar offline, e um identificador do dispositivo para podermos te enviar notificações push (via Firebase Cloud Messaging) se você as ativou. Como não usamos cookies de rastreamento nem ferramentas de analítica, não é necessário mostrar um banner de consentimento de cookies.","h_rights":"8. Seus direitos","rights":"Você pode apagar todos os seus dados sozinho a qualquer momento em Perfil → Apagar meus dados. Você também pode pedir uma cópia das suas informações, corrigir algo específico ou retirar seu consentimento escrevendo para o contato abaixo. Se você estiver na Argentina, esses direitos de acesso, retificação e exclusão são reconhecidos pela Ley 25.326 (Lei de Proteção de Dados Pessoais), e você pode registrar uma reclamação junto à Agencia de Acceso a la Información Pública (AAIP) se considerar que não os respeitamos. Se você estiver em outro país com sua própria legislação de proteção de dados (por exemplo, o RGPD na União Europeia, ou a LGPD no Brasil), você tem os mesmos direitos básicos de acessar, corrigir, apagar e exportar suas informações, e pode registrar uma reclamação junto à autoridade de proteção de dados correspondente.","h_minors":"9. Menores de idade","minors":"O Zancada não é direcionado a menores de 16 anos.","h_changes":"10. Mudanças nesta política","changes":"Se fizermos uma atualização importante nesta política, vamos avisar dentro do app.","h_contact":"Contato","contact_q":"Dúvidas sobre seus dados ou esta política?","note":"Este documento foi redigido como um modelo geral para um app em desenvolvimento e não constitui aconselhamento jurídico. Antes de lançar o Zancada publicamente, recomendamos que um advogado o revise e o adapte às leis do seu país."},"fr":{"title":"Zancada — Politique de Confidentialité","back":"‹ Retour à Zancada","updated":"Dernière mise à jour : 30 septembre 2026","intro":"Cette politique explique quelles données Zancada collecte, à quoi elles servent et quels choix tu as. On l'a écrite simplement, sans jargon juridique inutile.","summary_label":"En bref","summary":["On ne vend pas tes données et on ne les utilise pas pour la publicité.","On n'utilise aucun cookie de suivi ni aucun SDK d'analytique.","Tu peux supprimer toutes tes données toi-même, quand tu veux, depuis l'appli.","On ne partage des données qu'avec les services nécessaires au fonctionnement de l'appli — liste complète ci-dessous."],"h_controller":"1. Responsable de tes données","controller":"[À compléter avant la publication de l'appli : nom légal de la personne ou société responsable du traitement des données, adresse légale et, le cas échéant, numéro d'enregistrement auprès de l'Agencia de Acceso a la Información Pública (AAIP) d'Argentine. En attendant, toute question sur qui gère tes données peut être envoyée à info@zancada.org.]","h_collect":"2. Quelles données on collecte","collect":[["Compte","ton email et, si tu te connectes avec Google, ton nom et ta photo de profil de ce compte."],["Données d'entraînement","tes courses (distance, durée, allure, tracé GPS, cadence, dénivelé), ta fréquence cardiaque pendant ces courses et tes zones de FC configurées."],["Profil sportif","âge, terrain préféré, type de coureur, ton objectif ou ta prochaine course, ton objectif hebdomadaire de kilomètres et les chaussures que tu enregistres."],["Conversations avec Zonda","les messages que tu envoies à Zonda, le coach IA, dans l'appli."],["Préférences","langue, système d'unités (métrique/impérial) et si tu as activé les notifications push."]],"h_how":"3. Comment on obtient ces données","how":"La plupart, tu les saisis directement dans l'appli. Si tu connectes ta montre à Strava, Polar, Wahoo ou COROS, on synchronise tes courses automatiquement depuis là-bas (seulement celles que tu autorises). Si tu te connectes avec Google, on reçoit les données de base que Google partage pour t'identifier.","h_use":"4. À quoi elles servent","use":["Générer et ajuster ton plan d'entraînement semaine après semaine.","T'afficher ta progression, ton historique et tes statistiques.","Permettre au coach IA de te donner des réponses et suggestions avec un vrai contexte sur toi.","T'avertir par notification push de ta séance du jour (si activé).","T'alerter si ta charge d'entraînement augmente trop vite ou si tes chaussures ont dépassé le kilométrage recommandé."],"h_share":"5. Avec qui on partage les données","share_intro":"On ne vend tes données à personne, et on ne les utilise pas à des fins publicitaires. On les partage uniquement avec les services qui font fonctionner l'appli :","share":[["Supabase","héberge la base de données où tes informations sont stockées."],["Strava","synchronisation bidirectionnelle des activités, seulement si tu la connectes."],["Polar","synchronisation de tes courses, seulement si tu connectes ton compte Polar."],["Wahoo","synchronisation de tes courses, seulement si tu connectes ton compte Wahoo."],["COROS","synchronisation de tes courses, seulement si tu connectes ton compte COROS."],["Google","uniquement si tu choisis de te connecter avec ton compte Google."],["Firebase Cloud Messaging (Google)","reçoit un identifiant de ton appareil pour pouvoir te livrer les notifications push du coach, si tu les as activées."],["Anthropic (Claude)","est le modèle d'IA derrière Zonda, notre coach virtuel. Il traite ce que tu écris ainsi que le contexte qu'on doit lui transmettre pour qu'il réponde avec pertinence : ton profil, ton plan d'entraînement, ton historique de courses récent, tes zones de fréquence cardiaque et les notes ou douleurs que tu as enregistrées."],["Sentry","reçoit des informations techniques en cas d'erreur serveur, ou quand quelqu'un tente d'accéder sans autorisation à une partie protégée de l'appli, pour qu'on puisse le détecter et le corriger. On ne lui envoie jamais ton mot de passe ni tes données de paiement."]],"h_storage":"6. Où elles sont stockées et pendant combien de temps","storage":"Tes données restent dans la base de données liée à ton compte tant que le compte existe. L'appli garde aussi une copie temporaire sur ton téléphone pour continuer à fonctionner hors ligne, qui se synchronise dès que tu retrouves une connexion.","h_cookies":"7. Cookies, analytique et technologies similaires","cookies":"Zancada n'utilise pas de cookies publicitaires, n'utilise pas Google Analytics, Meta Pixel ni aucun autre SDK d'analytique ou de suivi, et on ne partage pas tes données avec des réseaux publicitaires. On utilise uniquement un stockage technique essentiel pour que l'appli fonctionne : garder ta session ouverte, sauvegarder une copie de tes données sur ton téléphone pour que l'appli marche hors ligne, et un identifiant d'appareil pour pouvoir t'envoyer des notifications push (via Firebase Cloud Messaging) si tu les as activées. Comme on n'utilise ni cookies de suivi ni outils d'analytique, il n'est pas nécessaire de t'afficher une bannière de consentement aux cookies.","h_rights":"8. Tes droits","rights":"Tu peux supprimer toutes tes données toi-même à tout moment depuis Profil → Supprimer mes données. Tu peux aussi demander une copie de tes informations, corriger quelque chose de précis, ou retirer ton consentement en nous écrivant à l'adresse de contact ci-dessous. Si tu es en Argentine, ces droits d'accès, de rectification et de suppression sont reconnus par la Ley 25.326 (loi de protection des données personnelles), et tu peux déposer une plainte auprès de l'Agencia de Acceso a la Información Pública (AAIP) si tu estimes qu'on ne les a pas respectés. Si tu es dans un autre pays avec sa propre réglementation de protection des données (par exemple le RGPD dans l'Union européenne), tu as les mêmes droits de base d'accéder, corriger, supprimer et exporter tes informations, et tu peux déposer une plainte auprès de l'autorité de protection des données compétente.","h_minors":"9. Mineurs","minors":"Zancada ne s'adresse pas aux moins de 16 ans.","h_changes":"10. Changements de cette politique","changes":"Si on fait une mise à jour importante de cette politique, on te le fera savoir dans l'appli.","h_contact":"Contact","contact_q":"Des questions sur tes données ou cette politique ?","note":"Ce document a été rédigé comme un modèle général pour une appli en développement et ne constitue pas un conseil juridique. Avant de lancer Zancada publiquement, on te recommande de le faire relire par un avocat et de l'adapter aux lois de ton pays."},"it":{"title":"Zancada — Informativa sulla Privacy","back":"‹ Torna a Zancada","updated":"Ultimo aggiornamento: 30 settembre 2026","intro":"Questa informativa spiega quali dati raccoglie Zancada, a cosa li usiamo e quali scelte hai. L'abbiamo scritta in linguaggio semplice, senza inutili giri di parole legali.","summary_label":"In breve","summary":["Non vendiamo i tuoi dati né li usiamo per scopi pubblicitari.","Non usiamo cookie di tracciamento né alcun tipo di SDK di analytics.","Puoi eliminare tutti i tuoi dati da solo, quando vuoi, dall'app.","Condividiamo i dati solo con i servizi necessari a far funzionare l'app — elenco completo qui sotto."],"h_controller":"1. Titolare del trattamento dei tuoi dati","controller":"[Da completare prima della pubblicazione dell'app: ragione sociale o nome della persona responsabile del trattamento dei dati, indirizzo legale e, se applicabile, numero di registrazione presso l'Agencia de Acceso a la Información Pública (AAIP) dell'Argentina. Nel frattempo, qualsiasi domanda su chi gestisce i tuoi dati può essere inviata a info@zancada.org.]","h_collect":"2. Quali dati raccogliamo","collect":[["Account","la tua email e, se accedi con Google, il tuo nome e la foto profilo di quell'account."],["Dati di allenamento","le tue corse (distanza, durata, ritmo, percorso GPS, cadenza, dislivello), la tua frequenza cardiaca durante quelle corse e le zone di FC configurate."],["Profilo sportivo","età, terreno preferito, tipo di corridore, il tuo obiettivo o la prossima gara, l'obiettivo settimanale di chilometri e le scarpe che registri."],["Conversazioni con Zonda","i messaggi che scrivi a Zonda, il coach IA, nell'app."],["Preferenze","lingua, sistema di misura (metrico/imperiale) e se hai attivato le notifiche push."]],"h_how":"3. Come otteniamo questi dati","how":"La maggior parte la inserisci direttamente nell'app. Se colleghi il tuo orologio a Strava, Polar, Wahoo o COROS, sincronizziamo le tue corse automaticamente da lì (solo quelle che autorizzi). Se accedi con Google, riceviamo i dati di base che Google condivide per identificarti.","h_use":"4. A cosa li usiamo","use":["Generare e adattare il tuo piano di allenamento settimana per settimana.","Mostrarti i tuoi progressi, la cronologia e le statistiche.","Permettere al coach con IA di darti risposte e suggerimenti con un contesto reale su di te.","Avvisarti con una notifica push della sessione di oggi (se attivata).","Avvisarti se il tuo carico di allenamento sale troppo in fretta o se le tue scarpe hanno superato il chilometraggio consigliato."],"h_share":"5. Con chi condividiamo i dati","share_intro":"Non vendiamo i tuoi dati a nessuno, né li usiamo a scopo pubblicitario. Li condividiamo solo con i servizi che fanno funzionare l'app:","share":[["Supabase","ospita il database dove sono salvate le tue informazioni."],["Strava","sincronizzazione bidirezionale delle attività, solo se la colleghi."],["Polar","sincronizzazione delle tue corse, solo se colleghi il tuo account Polar."],["Wahoo","sincronizzazione delle tue corse, solo se colleghi il tuo account Wahoo."],["COROS","sincronizzazione delle tue corse, solo se colleghi il tuo account COROS."],["Google","solo se scegli di accedere con il tuo account Google."],["Firebase Cloud Messaging (Google)","riceve un identificativo del tuo dispositivo per poterti recapitare le notifiche push del coach, se le hai attivate."],["Anthropic (Claude)","è il modello di IA dietro Zonda, il nostro coach virtuale. Elabora quello che scrivi più il contesto che dobbiamo passargli perché possa risponderti con criterio: il tuo profilo, il tuo piano di allenamento, la cronologia recente delle corse, le tue zone di frequenza cardiaca e le note o i dolori che hai registrato."],["Sentry","riceve informazioni tecniche in caso di errore del server, o quando qualcuno tenta di accedere senza autorizzazione a una parte protetta dell'app, così possiamo rilevarlo e correggerlo. Non gli inviamo mai la tua password né dati di pagamento."]],"h_storage":"6. Dove vengono conservati e per quanto tempo","storage":"I tuoi dati restano nel database associato al tuo account finché l'account esiste. L'app conserva anche una copia temporanea sul tuo telefono per continuare a funzionare offline, che si sincronizza appena torni online.","h_cookies":"7. Cookie, analytics e tecnologie simili","cookies":"Zancada non usa cookie pubblicitari, non usa Google Analytics, Meta Pixel né alcun altro SDK di analytics o tracciamento, e non condividiamo i tuoi dati con reti pubblicitarie. Usiamo solo un'archiviazione tecnica essenziale per far funzionare l'app: mantenere la tua sessione attiva, salvare una copia dei tuoi dati sul telefono per far funzionare l'app offline, e un identificativo del dispositivo per poterti inviare notifiche push (tramite Firebase Cloud Messaging) se le hai attivate. Dato che non usiamo cookie di tracciamento né strumenti di analytics, non è necessario mostrarti un banner di consenso ai cookie.","h_rights":"8. I tuoi diritti","rights":"Puoi cancellare tutti i tuoi dati da solo in qualsiasi momento da Profilo → Elimina i miei dati. Puoi anche richiedere una copia delle tue informazioni, correggere qualcosa in particolare o revocare il tuo consenso scrivendoci all'indirizzo di contatto qui sotto. Se ti trovi in Argentina, questi diritti di accesso, rettifica e cancellazione sono riconosciuti dalla Ley 25.326 (legge sulla protezione dei dati personali), e puoi presentare un reclamo all'Agencia de Acceso a la Información Pública (AAIP) se ritieni che non li abbiamo rispettati. Se ti trovi in un altro paese con una propria normativa sulla protezione dei dati (ad esempio il GDPR nell'Unione Europea), hai gli stessi diritti di base di accedere, correggere, cancellare ed esportare le tue informazioni, e puoi presentare un reclamo all'autorità di protezione dei dati competente.","h_minors":"9. Minori","minors":"Zancada non è rivolta a persone sotto i 16 anni.","h_changes":"10. Modifiche a questa informativa","changes":"Se apportiamo un aggiornamento importante a questa informativa, te lo faremo sapere nell'app.","h_contact":"Contatto","contact_q":"Domande sui tuoi dati o su questa informativa?","note":"Questo documento è stato redatto come modello generale per un'app in sviluppo e non costituisce consulenza legale. Prima di lanciare Zancada pubblicamente, ti consigliamo di farlo revisionare da un avvocato e di adattarlo alle leggi del tuo paese."},"de":{"title":"Zancada — Datenschutzerklärung","back":"‹ Zurück zu Zancada","updated":"Zuletzt aktualisiert: 30. September 2026","intro":"Diese Datenschutzerklärung erklärt, welche Daten Zancada sammelt, wofür wir sie verwenden und welche Möglichkeiten du hast. Wir haben sie in einfacher Sprache geschrieben, ohne unnötigen Juristendeutsch.","summary_label":"Auf einen Blick","summary":["Wir verkaufen deine Daten nicht und nutzen sie nicht für Werbung.","Wir verwenden keine Tracking-Cookies oder Analytics-SDKs jeglicher Art.","Du kannst alle deine Daten jederzeit selbst in der App löschen.","Wir teilen Daten nur mit Diensten, die für den Betrieb der App notwendig sind — vollständige Liste unten."],"h_controller":"1. Verantwortlich für deine Daten","controller":"[Vor Veröffentlichung der App zu ergänzen: rechtlicher Name der verantwortlichen Person oder Firma, eingetragene Adresse und, falls zutreffend, Registrierungsnummer bei der argentinischen Agencia de Acceso a la Información Pública (AAIP). In der Zwischenzeit können Fragen dazu, wer deine Daten verwaltet, an info@zancada.org gerichtet werden.]","h_collect":"2. Welche Daten wir sammeln","collect":[["Konto","deine E-Mail und, falls du dich mit Google anmeldest, deinen Namen und dein Profilbild von diesem Konto."],["Trainingsdaten","deine Läufe (Distanz, Dauer, Tempo, GPS-Route, Kadenz, Höhenmeter), deine Herzfrequenz während dieser Läufe und deine eingerichteten HF-Zonen."],["Sportprofil","Alter, bevorzugtes Terrain, Läufertyp, dein Ziel oder bevorstehendes Rennen, dein wöchentliches Kilometerziel und die Schuhe, die du erfasst."],["Gespräche mit Zonda","die Nachrichten, die du Zonda, dem KI-Coach, in der App schickst."],["Einstellungen","Sprache, Maßsystem (metrisch/imperial) und ob du Push-Benachrichtigungen aktiviert hast."]],"h_how":"3. Wie wir diese Daten erhalten","how":"Die meisten gibst du direkt in der App ein. Wenn du deine Uhr mit Strava, Polar, Wahoo oder COROS verbindest, synchronisieren wir deine Läufe automatisch von dort (nur die, die du erlaubst). Wenn du dich mit Google anmeldest, erhalten wir die Basisdaten, die Google zur Identifizierung teilt.","h_use":"4. Wofür wir sie verwenden","use":["Deinen Trainingsplan Woche für Woche erstellen und anpassen.","Dir deinen Fortschritt, deinen Verlauf und deine Statistiken zeigen.","Dem KI-Coach ermöglichen, dir Antworten und Vorschläge mit echtem Kontext über dich zu geben.","Dich per Push-Benachrichtigung an deine heutige Einheit erinnern (falls aktiviert).","Dich warnen, wenn deine Trainingsbelastung zu schnell steigt oder deine Schuhe die empfohlene Laufleistung überschritten haben."],"h_share":"5. Mit wem wir Daten teilen","share_intro":"Wir verkaufen deine Daten an niemanden und nutzen sie nicht für Werbung. Wir teilen sie ausschließlich mit den Diensten, die die App zum Laufen bringen:","share":[["Supabase","hostet die Datenbank, in der deine Informationen gespeichert werden."],["Strava","bidirektionale Aktivitätssynchronisierung, nur wenn du sie verbindest."],["Polar","Synchronisierung deiner Läufe, nur wenn du dein Polar-Konto verbindest."],["Wahoo","Synchronisierung deiner Läufe, nur wenn du dein Wahoo-Konto verbindest."],["COROS","Synchronisierung deiner Läufe, nur wenn du dein COROS-Konto verbindest."],["Google","nur wenn du dich für die Anmeldung mit deinem Google-Konto entscheidest."],["Firebase Cloud Messaging (Google)","erhält eine Geräte-ID, um dir die Push-Benachrichtigungen des Coaches zustellen zu können, falls du sie aktiviert hast."],["Anthropic (Claude)","ist das KI-Modell hinter Zonda, unserem virtuellen Coach. Es verarbeitet, was du schreibst, sowie den Kontext, den wir ihm mitgeben müssen, damit er sachkundig antworten kann: dein Profil, deinen Trainingsplan, deinen letzten Lauf-Verlauf, deine Herzfrequenzzonen und die Notizen oder Beschwerden, die du erfasst hast."],["Sentry","erhält technische Informationen bei einem Serverfehler oder wenn jemand versucht, ohne Berechtigung auf einen geschützten Teil der App zuzugreifen, damit wir das erkennen und beheben können. Wir senden dabei nie dein Passwort oder Zahlungsdaten."]],"h_storage":"6. Wo sie gespeichert werden und für wie lange","storage":"Deine Daten bleiben in der mit deinem Konto verknüpften Datenbank, solange das Konto existiert. Die App speichert außerdem eine temporäre Kopie auf deinem Handy, damit sie offline weiter funktioniert, die synchronisiert wird, sobald du wieder online bist.","h_cookies":"7. Cookies, Analytics und ähnliche Technologien","cookies":"Zancada verwendet keine Werbe-Cookies, kein Google Analytics, kein Meta Pixel und kein anderes Analytics- oder Tracking-SDK, und wir teilen deine Daten nicht mit Werbenetzwerken. Wir verwenden ausschließlich essenzielle technische Speicherung, damit die App funktioniert: deine Sitzung angemeldet zu halten, eine Kopie deiner Daten auf deinem Handy zu speichern, damit die App offline funktioniert, und eine Geräte-ID, um dir Push-Benachrichtigungen zu schicken (über Firebase Cloud Messaging), falls du sie aktiviert hast. Da wir weder Tracking-Cookies noch Analytics-Tools verwenden, ist kein Cookie-Consent-Banner nötig.","h_rights":"8. Deine Rechte","rights":"Du kannst jederzeit selbst alle deine Daten löschen, unter Profil → Meine Daten löschen. Du kannst auch eine Kopie deiner Informationen anfordern, etwas Bestimmtes korrigieren oder deine Einwilligung widerrufen, indem du uns an die untenstehende Kontaktadresse schreibst. Wenn du dich in Argentinien befindest, sind diese Rechte auf Auskunft, Berichtigung und Löschung durch die Ley 25.326 (Datenschutzgesetz) anerkannt, und du kannst eine Beschwerde bei der Agencia de Acceso a la Información Pública (AAIP) einreichen, wenn du der Meinung bist, dass wir sie nicht respektiert haben. Wenn du dich in einem anderen Land mit eigenem Datenschutzrecht befindest (zum Beispiel der DSGVO in der Europäischen Union), hast du dieselben grundlegenden Rechte auf Auskunft, Berichtigung, Löschung und Export deiner Daten, und kannst eine Beschwerde bei der zuständigen Datenschutzbehörde einreichen.","h_minors":"9. Minderjährige","minors":"Zancada richtet sich nicht an Personen unter 16 Jahren.","h_changes":"10. Änderungen dieser Datenschutzerklärung","changes":"Wenn wir ein wichtiges Update dieser Datenschutzerklärung vornehmen, informieren wir dich in der App.","h_contact":"Kontakt","contact_q":"Fragen zu deinen Daten oder dieser Datenschutzerklärung?","note":"Dieses Dokument wurde als allgemeine Vorlage für eine App in Entwicklung verfasst und stellt keine Rechtsberatung dar. Bevor du Zancada öffentlich veröffentlichst, empfehlen wir, es von einem Anwalt prüfen und an die Gesetze deines Landes anpassen zu lassen."}};
const LANG_LABELS = {es:'ES', en:'EN', pt:'PT', fr:'FR', it:'IT', de:'DE'};
const LANG_NAMES = {es:'es', en:'en-US', pt:'pt-BR', fr:'fr', it:'it', de:'de'};

function detectLang(){
  const url = new URL(window.location.href);
  const q = url.searchParams.get('lang');
  if(q && L[q]) return q;
  try{
    const saved = localStorage.getItem('zancada_legal_lang');
    if(saved && L[saved]) return saved;
  }catch(e){}
  const nav = (navigator.language || 'es').slice(0,2).toLowerCase();
  if(L[nav]) return nav;
  return 'es';
}

function render(code){
  const d = L[code];
  document.documentElement.lang = LANG_NAMES[code] || code;
  document.getElementById('page-title').textContent = d.title;
  document.getElementById('back-link').textContent = d.back;
  document.getElementById('t-title').textContent = d.title.replace(/^Zancada\s*—\s*/, '');
  document.getElementById('t-updated').textContent = d.updated;
  document.getElementById('t-intro').textContent = d.intro;
  document.getElementById('t-summary-label').textContent = d.summary_label;
  document.getElementById('t-summary').innerHTML = d.summary.map(item=>`<li>${item}</li>`).join('');
  document.getElementById('t-h-controller').textContent = d.h_controller;
  document.getElementById('t-controller').textContent = d.controller;
  document.getElementById('t-h-collect').textContent = d.h_collect;
  document.getElementById('t-collect').innerHTML = d.collect.map(([label,desc])=>`<li><strong>${label}:</strong> ${desc}</li>`).join('');
  document.getElementById('t-h-how').textContent = d.h_how;
  document.getElementById('t-how').textContent = d.how;
  document.getElementById('t-h-use').textContent = d.h_use;
  document.getElementById('t-use').innerHTML = d.use.map(item=>`<li>${item}</li>`).join('');
  document.getElementById('t-h-share').textContent = d.h_share;
  document.getElementById('t-share-intro').textContent = d.share_intro;
  document.getElementById('t-share').innerHTML = d.share.map(([label,desc])=>`<li><strong>${label}:</strong> ${desc}</li>`).join('');
  document.getElementById('t-h-storage').textContent = d.h_storage;
  document.getElementById('t-storage').textContent = d.storage;
  document.getElementById('t-h-cookies').textContent = d.h_cookies;
  document.getElementById('t-cookies').textContent = d.cookies;
  document.getElementById('t-h-rights').textContent = d.h_rights;
  document.getElementById('t-rights').textContent = d.rights;
  document.getElementById('t-h-minors').textContent = d.h_minors;
  document.getElementById('t-minors').textContent = d.minors;
  document.getElementById('t-h-changes').textContent = d.h_changes;
  document.getElementById('t-changes').textContent = d.changes;
  document.getElementById('t-h-contact').textContent = d.h_contact;
  document.getElementById('t-contact-q').textContent = d.contact_q;
  document.getElementById('t-note').textContent = d.note;
  document.querySelectorAll('.lang-pill').forEach(p=>p.classList.toggle('active', p.dataset.v===code));
  try{ localStorage.setItem('zancada_legal_lang', code); }catch(e){}
}

const langRow = document.getElementById('lang-row');
Object.keys(LANG_LABELS).forEach(code=>{
  const el = document.createElement('div');
  el.className = 'lang-pill';
  el.dataset.v = code;
  el.textContent = LANG_LABELS[code];
  el.onclick = ()=>render(code);
  langRow.appendChild(el);
});

render(detectLang());
</script>
