# Análisis de seguridad del código (CodeQL de GitHub): busca fallos conocidos (XSS, inyecciones, rutas inseguras, secretos en el código...).
# Corre en cada pull request, en cada cambio a main y una vez por semana. Los resultados quedan en la pestaña "Security" del repositorio.
name: CodeQL

on:
  push:
  pull_request:
    branches: [main]
  schedule:
    - cron: '30 11 * * 2'   # martes 11:30 UTC

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
      - uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee   # v4.39.0
        with:
          languages: javascript-typescript
          queries: security-extended
          config-file: ./.github/codeql/codeql-config.yml
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370   # v4.39.1
        with:
          category: /language:javascript-typescript
