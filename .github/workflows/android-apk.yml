# Compila un APK de PRUEBA de la app Android (Capacitor) en los servidores de GitHub, sin
# Android Studio: genera el proyecto nativo de cero, le aplica lo que piden las guías de
# mobile/*-setup/ (ver .github/scripts/patch-android.py) y deja el APK para bajar en la
# pestaña Actions → la corrida → "Artifacts" → zancada-prueba-apk.
# Es un build de debug (firma de prueba, applicationId org.zancada.app.test): se instala al
# lado de la app de la tienda, no la reemplaza. No sirve para subir a Play Store.
name: Android APK de prueba

on:
  workflow_dispatch:
  push:
    branches: ['claude/**', 'main']
    paths:
      - 'app.js'
      - 'index.html'
      - 'locales/**'
      - 'mobile/**'
      - '.github/workflows/android-apk.yml'
      - '.github/scripts/patch-android.py'

permissions:
  contents: write # para publicar el APK como release "prueba-android"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # Sin android-actions/setup-android: ubuntu-latest ya trae el SDK de Android
      # (ANDROID_HOME) y esa action falla al querer reinstalar el paquete 'tools'.

      - name: Instalar dependencias de mobile/
        working-directory: mobile
        run: npm ci --no-audit --no-fund

      - name: Copiar la web a mobile/www
        run: |
          mkdir -p mobile/www
          cp app.js index.html manifest.json privacy.html terms.html mobile/www/
          cp -r locales img brand mobile/www/
          cp icon-192.png icon-512.png icon-512-maskable.png mobile/www/

      - name: Generar el proyecto Android
        working-directory: mobile
        run: |
          npx cap add android
          npx cap sync android

      - name: Ícono de Zancada
        working-directory: mobile
        continue-on-error: true
        run: |
          mkdir -p resources
          cp ../icon-512.png resources/icon.png
          npx capacitor-assets generate --android --splashBackgroundColor '#0A0A0A' --splashBackgroundColorDark '#0A0A0A'

      - name: Aplicar las guías de mobile/*-setup/
        run: python3 .github/scripts/patch-android.py

      - name: Compilar APK
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: zancada-prueba-apk
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      # Además del artifact (que GitHub entrega en .zip), un link directo al .apk, cómodo
      # para bajarlo e instalarlo desde el celular: Releases → "Zancada de prueba (Android)".
      # Se pisa en cada build, así que el link siempre trae la última versión.
      - name: Publicar como release "prueba-android"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp mobile/android/app/build/outputs/apk/debug/app-debug.apk zancada-prueba.apk
          gh release delete prueba-android --yes --cleanup-tag || true
          gh release create prueba-android zancada-prueba.apk \
            --prerelease --target "${{ github.sha }}" \
            --title "Zancada de prueba (Android)" \
            --notes "APK de prueba compilado automáticamente desde ${{ github.ref_name }} (${{ github.sha }}). Se instala al lado de la app de la tienda como \"Zancada (prueba)\"."
