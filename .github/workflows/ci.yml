# Integración continua: en cada push y en cada pull request corre las pruebas.
# El despliegue (CD) lo hace Vercel solo, al subir a main; esto avisa si el cambio rompe algo.
# Además, una vez por semana revisa si apareció alguna vulnerabilidad grave en las dependencias.
name: CI

on:
  push:
  pull_request:
  schedule:
    - cron: '0 12 * * 1'   # lunes 12:00 UTC

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  test:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020   # v4.4.0
        with:
          node-version: 24
          cache: npm
      # --ignore-scripts: no hace falta bajar el binario de ffmpeg para las pruebas
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Sintaxis de app.js
        run: node --check app.js
      - name: Pruebas
        run: npm test

  # Vulnerabilidades graves en lo que usa el servidor. Va en un trabajo aparte: un aviso nuevo de una librería
  # no tiene que mostrar en rojo un cambio que no tocó nada de eso.
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020   # v4.4.0
        with:
          node-version: 24
      - run: npm audit --omit=dev --audit-level=high

  # Secretos: recorre TODO el historial de git (no solo lo actual) buscando claves, tokens y llaves privadas. El repositorio es público: lo que se sube
  # una vez ya está filtrado. Corre en cada subida, en cada pull request y una vez por semana. Las reglas están en scripts/scan-secrets.js.
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020   # v4.4.0
        with:
          node-version: 24
      - run: node scripts/scan-secrets.js --history

  # Revisa las dependencias que agrega o cambia un pull request: avisa si traen vulnerabilidades graves conocidas.
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294   # v5.0.0
        with:
          fail-on-severity: high
