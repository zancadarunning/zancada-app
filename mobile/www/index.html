     valor no tiene ningún efecto real en iPhone (sí importa en Chrome/Android, por eso
     lo dejamos en resizes-visual, el comportamiento que además ya es el nativo de
     Safari: el viewport de LAYOUT nunca se achica con el teclado, solo el VISUAL
     viewport). El bug real de "la tabbar queda más arriba, con hueco vacío debajo,
     después de cerrar el teclado" es OTRA cosa, confirmada por reportes públicos de
     2025-2026 (WebKit bug #217754, varios hilos de Apple Developer Forums) como un bug
     de iOS 26 específico: window.visualViewport.height/offsetTop no siempre vuelven del
     todo a su valor real inmediatamente al cerrar el teclado (afecta hasta apple.com;
     Apple lo reconoció y lo mejoró parcialmente recién en beta de iOS 26.1, sin arreglo
     completo todavía). Es un bug a nivel de compositor de WebKit, no de layout -- ver el
     comentario largo junto a forceFixedLayoutReflow() en app.js para el mecanismo real
     y el fix aplicado (un scroll de verdad, no un simple reflow). -->

<style>
  /* ---- Paleta única (modo claro eliminado a pedido del usuario) ----
     Hubo un modo claro (:root[data-theme="light"]) con toggle en Perfil -- se sacó
     entero (CSS, el toggle de Perfil, applyTheme()/handleThemeToggle() en app.js, y
     el script de arranque que leía la preferencia de localStorage) porque el usuario
     prefirió quedarse solo con este tema oscuro. Todo el resto de la hoja de
     estilos usa estas variables, así que no queda ningún selector "data-theme" en
     ningún lado: esto es lo único que hay.

     --ink y --hivis-text existen separados de --chalk/--hivis porque el verde lima
     (--hivis) cumple dos roles distintos: como RELLENO sólido (fondo de botones,
     barra "hoy", el punto del avatar) es el mismo color siempre; pero como TEXTO --
     ya sea encima de ese mismo relleno (--ink) o encima de un fondo con apenas un
     toque de color (--hivis-text, para chips y pills) -- son variables aparte por si
     alguna vez hace falta ajustarlas por contraste sin tocar el relleno. */
  :root{
    /* Paleta "carbón profundo" (refactor visual 2026-09): el fondo general baja bastante
       más oscuro que las tarjetas (antes quedaban a solo un par de puntos de luminosidad
       de diferencia, y esa cercanía es lo que obligaba a apoyarse en bordes duros para que
       una tarjeta se notara separada del fondo). Con --asphalt bien carbón y --asphalt-2
       varios pasos más claro, la separación se nota sola por contraste de luminosidad --
       el borde (--overlay-hairline) queda como un detalle apenas insinuado, no como el
       recurso principal. */
    --asphalt:#0A0A0A; --asphalt-2:#18181B; --asphalt-3:#202023; --asphalt-4:#2C2C30;
    --chalk:#EDEFEF; --mist:#8B9296; --mist-dim:#5C6366;
    --hivis:#D6FF3F; --hivis-dim:rgba(214,255,63,.14); --hivis-text:#D6FF3F; --ink:#121415;
    --clay:#C06A2E; --clay-dim:rgba(192,106,46,.16);
    --danger:#FF6B5D; --danger-dim:rgba(255,107,93,.15);
    --radius:26px; --radius-sm:18px;
    --press:rgba(255,255,255,.045); --overlay-hairline:rgba(255,255,255,.045);
    --tabbar-bg:rgba(24,24,27,.92);
    --toast-error-bg:#3a1f1c; --toast-error-fg:#FF9A8D;
    --shadow-card:0 8px 22px rgba(0,0,0,.4); --shadow-lg:0 16px 48px rgba(0,0,0,.55);
    --hivis-glow:rgba(214,255,63,.32);
    /* Colores de zona (ritmo/FC) del tema oscuro: se probó una versión pastel
       más suave y se volvió atrás a pedido del usuario -- estos son los
       saturados/"neon" originales. El tema claro de acá abajo se deja como
       está, sin tocar (ver su propio comentario: está oscurecido a propósito
       por contraste WCAG AA sobre fondo blanco). */
    --zone1:#5B9BFF; --zone1-bg:rgba(91,155,255,.16); --zone1-bg-live:rgba(91,155,255,.13);
    --zone2:#4ADE80; --zone2-bg:rgba(74,222,128,.16); --zone2-bg-live:rgba(74,222,128,.13);
    --zone3:#FACC15; --zone3-bg:rgba(250,204,21,.16); --zone3-bg-live:rgba(250,204,21,.13);
    --zone4:#FB923C; --zone4-bg:rgba(251,146,60,.16); --zone4-bg-live:rgba(251,146,60,.13);
    --zone5:#FF6B5D; --zone5-bg:rgba(255,107,93,.16); --zone5-bg-live:rgba(255,107,93,.13);
    --cs:dark;
    --safe-top:env(safe-area-inset-top); --safe-bottom:env(safe-area-inset-bottom);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0; background:var(--asphalt); height:100%;}
  body{font-family:'Inter',-apple-system,sans-serif; color:var(--chalk); overscroll-behavior-y:none;}
  .display{font-family:'Bebas Neue',sans-serif; letter-spacing:.02em;}
  .mono{font-family:'JetBrains Mono',monospace;}
  h1,h2,h3,p{margin:0;}
  button,input,select{font-family:inherit;}
  ::selection{background:var(--hivis); color:var(--ink);}

  /* min-height: TERCER intento, ninguna unidad CSS fija alcanza sola. Primero era
     100dvh -- eso hacía que la tabbar (sticky, en flujo normal DENTRO de #app)
     bajara "escalonado y de forma suave" siguiendo la animación del teclado (dvh
     sigue en tiempo real cualquier cambio del área visible, INCLUIDO el teclado en
     Safari nuevo). Pasarlo a 100svh (peor caso, valor fijo, inmune al teclado)
     arregló eso -- pero rompió otra cosa: svh asume SIEMPRE el peor caso (todo el
     chrome del navegador expandido), así que apenas ese chrome está minimizado (o en
     standalone, si la pantalla real es más alta que ese peor caso) #app queda MÁS
     CHICO que la pantalla real -- y en ese hueco no hay nada nuestro pintado, así que
     se ve la barra gris que pinta el propio navegador/WebView por fuera del
     documento (reportada en una captura real). Ni dvh (sigue de más) ni svh (se
     queda corto) alcanzan solos -- la solución real es la misma que ya usamos para
     el chat (syncCoachChatLayout): medir NOSOTROS window.innerHeight por JS (ver
     syncAppMinHeight() en app.js), que en iOS no se mueve con el teclado (no vuelve
     el escalonado) pero sí refleja la altura real cuando cambia de verdad el chrome
     del navegador (no vuelve la barra gris). --app-min-h es esa medición; se deja
     min-height con 100vh/100dvh/100svh en cascada ANTES como respaldo -- por si el
     JS todavía no corrió en el primer pintado, o en un navegador que no entienda
     variables CSS -- y recién la última declaración (con la variable) manda una vez
     que app.js corrió. */
  #app{max-width:480px; margin:0 auto; min-height:100vh; min-height:100dvh; min-height:100svh;
    min-height:var(--app-min-h, 100svh); position:relative;
    background:radial-gradient(60% 40% at 50% 0%, rgba(214,255,63,.07), transparent 60%),
      radial-gradient(55% 35% at 100% 12%, rgba(192,106,46,.05), transparent 62%), var(--asphalt);
    display:flex; flex-direction:column;}

  .pulse-strip{width:100%; height:34px; overflow:hidden; opacity:.55; color:var(--hivis);}
  .pulse-strip svg{width:200%; height:100%; animation:pulseScroll 5.5s linear infinite;}
  @keyframes pulseScroll{from{transform:translateX(0);} to{transform:translateX(-50%);}}
  @keyframes blink{0%,100%{opacity:1;} 50%{opacity:.25;}}
  @media (prefers-reduced-motion:reduce){ .pulse-strip svg{animation:none;} }

  #offline-banner{position:fixed; top:0; left:0; right:0; z-index:90; display:flex; align-items:center; justify-content:center; gap:7px;
    background:var(--clay); color:var(--ink); font-size:12px; font-weight:700; padding:calc(8px + var(--safe-top)) 16px 8px;
    transform:translateY(-100%); transition:transform .25s ease; pointer-events:none;}
  #offline-banner.show{transform:translateY(0); pointer-events:auto;}

  /* #splash es un panel fijo a pantalla completa que se ve SOLO en el arranque en frío
     (antes de iniciar sesión), sin que haya intervenido nunca el teclado -- por eso el
     bug reportado ("el botón Comenzar se mueve solo al abrir la app de cero") no puede
     ser el mismo bug de WebKit del teclado (ese necesita que el teclado se haya abierto
     y cerrado al menos una vez). Con position:fixed + inset:0, la altura real del panel
     depende de qué "viewport" use el motor para resolver ese 0 de abajo -- y en Safari
     de iOS, apenas termina de cargar la página, la barra de Safari (o la propia altura
     utilizable) puede terminar de "asentarse" un instante después del primer pintado
     (sin que el usuario haya scrolleado ni tocado nada), lo que cambia esa altura y
     mueve todo lo que esté anclado contra el borde inferior -- en este caso, el botón
     "Comenzar", que cuelga del fondo del panel via .splash-mid{flex:1}. La solución no
     es JS (acá no hay ningún reflow que forzar, es la altura de partida la que está mal
     elegida): usar el viewport CHICO (100svh) en vez de dejar que inset:0 tome el
     tamaño "grande"/ambiguo -- 100svh es, por definición, la altura ya calculada para
     cuando la barra del navegador está totalmente expandida (el peor caso, el más
     chico), así que el panel arranca directamente con esa altura final y no tiene
     margen para "crecer" (ni por lo tanto mover nada) después del primer pintado. Se
     deja 100dvh y 100vh como fallback en cascada para navegadores viejos que no
     entienden la unidad svh (una declaración con un valor no soportado se ignora por
     completo, así que la anterior queda en pie). */
  #splash{position:fixed; top:0; left:0; right:0; height:100vh; height:100dvh; height:100svh;
    z-index:60; background:var(--asphalt); display:flex; flex-direction:column;
    align-items:center; justify-content:flex-start; text-align:center; padding:32px; max-width:480px; margin:0 auto;}
  #splash .splash-mid{flex:1; width:100%; display:flex; flex-direction:column; justify-content:center; align-items:center; min-height:0; padding-bottom:96px;}
  #splash .word{font-size:60px; line-height:.9;}
  #splash .word span{color:var(--hivis-text);}
  #splash .tag{color:var(--mist); margin-top:10px; font-size:15px;}
  #splash .pulse-strip{margin:28px 0; max-width:280px;}
  .splash-features{width:100%; max-width:320px; margin-top:8px; display:flex; flex-direction:column; gap:16px; text-align:left;}
  .splash-feature{display:flex; align-items:flex-start; gap:12px;}
  .splash-feature strong{display:block; font-size:14px; color:var(--chalk); font-weight:700;}
  .splash-feature p{margin:2px 0 0; font-size:12.5px; color:var(--mist); line-height:1.4;}
  .lang-row{display:flex; gap:8px; flex-wrap:wrap; justify-content:center; margin-bottom:28px;}
  .lang-pill{padding:8px 13px; border-radius:999px; border:1.5px solid var(--asphalt-4); background:var(--asphalt-2);
    color:var(--mist); font-size:12px; font-weight:700; cursor:pointer;}
  .lang-pill.active{border-color:var(--hivis); color:var(--hivis-text); background:var(--hivis-dim); box-shadow:0 4px 14px var(--hivis-glow);}

  .overlay{position:fixed; inset:0; z-index:50; background:var(--asphalt); max-width:480px; margin:0 auto;
    overflow-y:auto; display:none; padding:calc(28px + var(--safe-top)) 24px calc(28px + var(--safe-bottom));}
  .overlay h2{font-size:28px;}
  .overlay .lead{color:var(--mist); margin-top:6px; font-size:14px; line-height:1.5;}

  /* Overlays "hoja" -- los que se abren desde un botón de una sola fila en Perfil/Logros
     (Datos personales, Objetivos, Zapatillas, Evento, Idioma, Días, Zonas, Molestias,
     Logros). Antes usaban display:none/block como el resto de los overlays de la app
     (login, onboarding, modales de confirmación) -- práctico pero sin transición, así que
     aparecían y desaparecían de un salto. Estos en particular quedan siempre con
     display:block (nunca display:none) y se animan con opacity+transform nada más --
     truco clásico y soportado en todos lados, a propósito en vez de animar la propiedad
     display con @starting-style/allow-discrete (todavía no soportado en todos los
     navegadores/WebViews que usa la app). pointer-events:none mientras está cerrado
     evita que, al estar solo invisible y no removida del layout, tape clicks o el
     scroll de lo que hay debajo. Esto habilita el gesto de "arrastrar hacia abajo para
     cerrar" de wireOverlaySheetSwipe() en app.js. No se toca el resto de los overlays
     (login, onboarding, los modales de confirmación/info) para no arriesgar esos flujos. */
  .overlay-sheet{display:block; opacity:0; pointer-events:none; transform:translateY(22px);
    transition:opacity .22s ease, transform .22s ease;}
  .overlay-sheet.overlay-open{opacity:1; pointer-events:auto; transform:translateY(0);}

  .confirm-email-icon{width:76px; height:76px; border-radius:50%; background:var(--hivis-dim); color:var(--hivis-text);
    display:flex; align-items:center; justify-content:center; margin:4px auto 22px;}
  .confirm-email-icon svg{width:32px; height:32px;}
  #confirm-email h2,#confirm-email .lead{text-align:center;}
  #confirm-email .lead strong{color:var(--hivis-text); font-weight:700;}
  .confirm-email-waiting{display:flex; align-items:center; justify-content:center; gap:8px; margin-top:24px; color:var(--mist); font-size:13.5px;}

  .ob-progress-wrap{display:flex; align-items:center; gap:10px; margin-bottom:22px;}
  .ob-progress{flex:1; height:5px; background:var(--asphalt-3); border-radius:999px; overflow:hidden;}
  .ob-progress-fill{height:100%; width:20%; background:var(--hivis); border-radius:999px; transition:width .3s ease;}
  .ob-step{display:none;}
  .ob-step.active{display:block; animation:viewFadeIn .22s ease;}

  .toast-wrap{position:fixed; left:0; right:0; bottom:calc(92px + var(--safe-bottom)); display:flex; justify-content:center; z-index:85; pointer-events:none; padding:0 24px; transition:bottom .15s ease;}
  body.chat-kb-open .toast-wrap{bottom:calc(85px + (var(--safe-bottom) * 2));}
  .toast{background:var(--asphalt-4); color:var(--chalk); padding:13px 18px; border-radius:999px; font-size:13.5px; font-weight:600;
    box-shadow:0 8px 24px rgba(0,0,0,.4); display:flex; align-items:center; gap:8px; max-width:360px; text-align:center;
    opacity:0; transform:translateY(10px) scale(.96); transition:opacity .22s ease, transform .22s ease; pointer-events:auto;}
  .toast.show{opacity:1; transform:translateY(0) scale(1);}
  .toast.error{background:var(--toast-error-bg); color:var(--toast-error-fg); border:1px solid rgba(255,107,93,.3);}
  .toast.success{background:var(--hivis-dim); color:var(--hivis-text); border:1px solid rgba(214,255,63,.3);}

  .confirm-backdrop{position:fixed; inset:0; z-index:90; background:rgba(0,0,0,.6); display:none; align-items:center; justify-content:center; padding:24px;}
  .confirm-backdrop.show{display:flex;}
  .confirm-card{background:var(--asphalt-2); border-radius:var(--radius); padding:22px; max-width:320px; width:100%;
    box-shadow:var(--shadow-lg); border:1px solid var(--overlay-hairline); animation:confirmPop .18s ease;}
  .confirm-card p{margin:0 0 20px; font-size:14.5px; line-height:1.5; color:var(--chalk); font-weight:600;}
  .confirm-actions{display:flex; gap:10px;}
  .confirm-actions .btn{flex:1; width:auto;}
  @keyframes confirmPop{from{opacity:0; transform:scale(.9) translateY(6px);} to{opacity:1; transform:scale(1) translateY(0);}}
  .field{margin-top:20px;}
  .field label{display:block; font-size:12px; text-transform:uppercase; letter-spacing:.07em; color:var(--mist);
    margin-bottom:8px; font-weight:600;}
  .field input[type=text],.field input[type=number],.field input[type=date],.field input[type=email],.field input[type=password],.field select{
    width:100%; max-width:100%; background:var(--asphalt-2); border:1.5px solid var(--asphalt-4); color:var(--chalk);
    padding:13px 15px; border-radius:var(--radius-sm); font-size:16px; outline:none; color-scheme:var(--cs);
    transition:border-color .15s ease, box-shadow .15s ease;}
  .field input[type=date]{padding-top:9px; padding-bottom:9px; padding-right:6px; height:48px; box-sizing:border-box; overflow:hidden; font-size:15px;}
  .date-box{width:100%; background:var(--asphalt-2); border:1.5px solid var(--asphalt-4); color:var(--chalk);
    padding:13px 15px; border-radius:var(--radius-sm); font-size:16px; cursor:pointer;
    display:flex; align-items:center; height:48px; box-sizing:border-box;}
  .date-box .date-box-text{color:var(--chalk);}
  .date-box .date-box-text.placeholder{color:var(--mist-dim);}
  .cal-weekdays{display:grid; grid-template-columns:repeat(7,1fr); text-align:center; font-size:11px; color:var(--mist-dim); margin-bottom:8px; text-transform:uppercase; letter-spacing:.04em;}
  .cal-grid{display:grid; grid-template-columns:repeat(7,1fr); gap:4px;}
  .cal-day{aspect-ratio:1; display:flex; align-items:center; justify-content:center; border-radius:50%; font-size:15px; cursor:pointer; color:var(--chalk);}
  .cal-day.other-month{color:var(--mist-dim); opacity:.35; pointer-events:none;}
  .cal-day.today{border:1.5px solid var(--mist-dim);}
  .cal-day.selected{background:var(--hivis); color:var(--ink); font-weight:800;}
  .cal-months-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:8px;}
  .cal-years-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:8px;}
  .cal-cell{padding:16px 4px; border-radius:14px; text-align:center; font-size:14.5px; cursor:pointer; color:var(--chalk); text-transform:capitalize;}
  .cal-cell.current{border:1.5px solid var(--mist-dim);}
  .cal-cell.selected{background:var(--hivis); color:var(--ink); font-weight:800;}
  #cal-month-label{background:none; border:none; cursor:pointer; padding:6px 10px;}
  .field input:focus,.field select:focus{border-color:var(--hivis); box-shadow:0 0 0 3px var(--hivis-dim);}
  .date-box{transition:border-color .15s ease, box-shadow .15s ease;}
  .date-box:focus-within,.date-box.focused{border-color:var(--hivis); box-shadow:0 0 0 3px var(--hivis-dim);}
  .choice-row{display:flex; gap:8px; flex-wrap:wrap;}
  .choice{flex:1; min-width:80px; text-align:center; padding:11px 6px; border-radius:var(--radius-sm);
    border:1.5px solid var(--asphalt-4); background:var(--asphalt-2); color:var(--mist);
    font-size:12.5px; font-weight:600; cursor:pointer; user-select:none;}
  .choice.active{border-color:var(--hivis); color:var(--hivis-text); background:var(--hivis-dim); box-shadow:0 4px 14px var(--hivis-glow);}
  /* Control segmentado de una sola pieza (borde redondeado continuo, sin que cada
     opción sea un botón suelto con su propio borde) -- para grupos chicos de 2-3
     opciones mutuamente excluyentes (sueño, terreno, unidades, voz). Los grupos con
     muchas opciones (dolores, idioma) siguen usando .choice-row sin esta clase. */
  .choice-row.segmented{flex-wrap:nowrap; gap:2px; background:var(--asphalt-3); border-radius:var(--radius-sm); padding:3px;}
  .choice-row.segmented .choice{min-width:0; border:none; background:none; box-shadow:none; padding:9px 4px; color:var(--mist);}
  .choice-row.segmented .choice.active{background:var(--hivis); color:var(--ink); box-shadow:0 2px 10px var(--hivis-glow);}
  .switch{position:relative; display:inline-block; width:51px; height:31px; flex-shrink:0;}
  .switch input{opacity:0; width:0; height:0; position:absolute;}
  .switch-slider{position:absolute; cursor:pointer; inset:0; background:var(--asphalt-4); transition:.2s; border-radius:31px;}
  .switch-slider:before{content:""; position:absolute; height:27px; width:27px; left:2px; top:2px; background:#fff; transition:.2s; border-radius:50%; box-shadow:0 2px 4px rgba(0,0,0,.3);}
  .switch input:checked + .switch-slider{background:#34C759;}
  .switch input:checked + .switch-slider:before{transform:translateX(20px);}
  .two-col{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  .divider-or{display:flex; align-items:center; gap:10px; margin:20px 0; color:var(--mist-dim);
    font-size:11.5px; text-transform:uppercase; letter-spacing:.08em;}
  .divider-or::before,.divider-or::after{content:''; flex:1; height:1px; background:var(--asphalt-3);}

  .btn{border:none; border-radius:999px; padding:15px 22px; font-weight:700; font-size:15px; cursor:pointer;
    width:100%; display:flex; align-items:center; justify-content:center; gap:8px;}
  .btn-primary{background:var(--hivis); color:var(--ink); box-shadow:0 10px 24px var(--hivis-glow); transition:transform .12s ease, box-shadow .12s ease;}
  .btn-primary:active{transform:scale(.98); box-shadow:0 4px 12px var(--hivis-glow);}
  .btn-outline{background:var(--asphalt-2); border:1.5px solid var(--overlay-hairline); color:var(--chalk); box-shadow:var(--shadow-card); transition:transform .12s ease, background .12s ease;}
  .btn-outline:active{transform:scale(.97); background:var(--press);}
  .btn-saved-flash{background:var(--hivis) !important; border-color:var(--hivis) !important; color:var(--ink) !important; transition:background .15s ease, color .15s ease;}
  /* Los botones "Guardar" de Perfil quedan ocultos hasta que el usuario modifica algo en
     esa sección -- antes estaban siempre visibles y generaban dudas sobre si un cambio ya
     estaba guardado o no. Ver PERFIL_SAVE_SECTIONS / confirmAndSave en app.js. */
  .perfil-save-btn{display:none;}
  .perfil-save-btn.dirty{display:flex;}
  .btn-danger{background:var(--danger-dim); color:var(--danger);}
  /* Acciones secundarias al pie de Plan (agregar al calendario / pedirle un ajuste al
     coach) -- antes eran botones outline de peso completo, iguales a cualquier acción
     primaria; bajan de escala a un link con ícono, y con más aire antes de la tabbar. */
  .plan-secondary-actions{display:flex; flex-direction:column; align-items:center; gap:8px; margin:18px 0 30px;}
  .plan-secondary-btn{background:none; border:none; color:var(--mist); font-size:13px; font-weight:600;
    padding:10px 18px; border-radius:999px; display:flex; align-items:center; gap:7px; cursor:pointer;
    transition:background .12s ease, color .12s ease;}
  .plan-secondary-btn:active{background:var(--press); color:var(--chalk);}
  .btn-sm{padding:10px 16px; font-size:13.5px; width:auto;}
  .btn-disabled{background:var(--asphalt-2); color:var(--mist-dim); border:1.5px solid var(--asphalt-4);
    cursor:not-allowed; position:relative; margin-top:10px;}
  .soon-tag{position:absolute; right:14px; top:50%; transform:translateY(-50%); font-size:9px;
    text-transform:uppercase; letter-spacing:.05em; background:var(--asphalt-3); padding:3px 7px; border-radius:6px;}
  .soon-note{font-size:12px; color:var(--mist-dim); text-align:center; margin-top:10px; line-height:1.5;}
  .err-text{color:var(--danger); font-size:12.5px; margin-top:8px; display:none;}

  header.top{padding:calc(16px + var(--safe-top)) 20px 14px; display:flex; align-items:center; justify-content:space-between;
    position:sticky; top:0; z-index:5; background:linear-gradient(180deg, var(--tabbar-bg) 55%, transparent); backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px);
    flex-shrink:0;}
  header.top .brand{display:flex; align-items:center; gap:9px;}
  header.top .brand .dot{width:9px; height:9px; border-radius:50%; background:var(--hivis); box-shadow:0 0 10px var(--hivis);}
  header.top .brand span{font-size:15px; font-weight:800; letter-spacing:.02em;}

  /* Antes 128px para que el contenido no quedara tapado DEBAJO de la tabbar, que era
     position:fixed (flotaba por fuera del flujo del documento). Ahora que nav.tabbar es
     position:sticky (ver el comentario largo junto a esa regla) ocupa espacio real en
     el flujo -- ya no hay nada que tapar, así que esto es solo un margen chico de
     respiro antes de que aparezca la tabbar al final del scroll. */
  .view{display:none; padding:4px 20px 20px;}
  /* flex:1 1 auto es lo que hace que nav.tabbar (sticky, más abajo) termine SIEMPRE
     pegada al fondo real de la pantalla, no solo en vistas con contenido largo. #app
     ya es display:flex; flex-direction:column -- pero sin esto, una vista "corta" en
     contenido de verdad (como #view-coach, cuyo único hijo #coachChatWrap es
     position:fixed y por lo tanto no suma nada de alto real al flujo) deja a la tabbar
     parada justo debajo de esa vista casi vacía, MUY arriba de donde tendría que estar
     -- position:sticky solo puede EVITAR que algo seguía bajando de más al scrollear,
     nunca puede empujarlo hacia abajo si su posición natural ya está más arriba. Con
     flex:1 1 auto la vista activa siempre estira para ocupar el espacio que sobra
     (basado en su contenido real -- si el contenido ya es más alto que la pantalla,
     esto no lo achica, así que las vistas largas siguen scrolleando igual que
     siempre). */
  .view.active{display:block; flex:1 1 auto; animation:viewFadeIn .22s ease;}
  @keyframes viewFadeIn{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);}}
  /* #view-coach usa una animación sin transform (solo opacity): un transform en este
     elemento crearía un "containing block" nuevo para su hijo #coachChatWrap
     (position:fixed), y durante los .22s de la animación el chat quedaría mal
     posicionado (relativo a esta sección en vez de a la pantalla). */
  #view-coach.active{animation:viewFadeInOpacity .22s ease;}
  @keyframes viewFadeInOpacity{from{opacity:0;} to{opacity:1;}}

  /* Nada de alpha acá: las tarjetas tipo "swipe to delete" (history, zapatillas)
     ponen esta misma clase .card ARRIBA de un fondo rojo de "borrar" -- un
     segundo color con transparencia dejaba traslucir ese rojo por debajo,
     incluso en reposo. El highlight de "elevada" se logra solo con el inset,
     que no afecta la opacidad del fondo. */
  .card{background:var(--asphalt-2); border-radius:var(--radius); padding:22px; margin-bottom:16px; border:1px solid var(--overlay-hairline); box-shadow:var(--shadow-card), inset 0 1px 0 rgba(255,255,255,.03);}
  .card[onclick]{cursor:pointer; transition:transform .12s ease;}
  .card[onclick]:active{transform:scale(.98);}
  .card h3{font-size:11.5px; text-transform:uppercase; letter-spacing:.09em; color:var(--mist); font-weight:700; margin-bottom:12px;}
  .muted{color:var(--mist); font-size:13.5px; line-height:1.5; white-space:pre-line;}

  .streak-badge{display:inline-flex; align-items:center; gap:5px; font-size:12.5px; font-weight:800; padding:6px 12px; border-radius:999px;
    background:var(--hivis-dim); color:var(--hivis-text); white-space:nowrap; flex-shrink:0;}

  .tag{display:inline-block; font-size:10.5px; font-weight:700; text-transform:uppercase; letter-spacing:.04em; padding:5px 10px; border-radius:999px;}
  .tag-asfalto{background:var(--asphalt-4); color:var(--chalk);}
  .tag-trail{background:var(--clay-dim); color:var(--clay);}
  .tag-mixto{background:var(--hivis-dim); color:var(--hivis-text);}
  .tag-soon{background:var(--asphalt-3); color:var(--mist-dim); border:1px dashed var(--asphalt-4);}
  .tag-load-caution{background:var(--clay-dim); color:var(--clay);}
  .tag-load-risk{background:var(--danger-dim); color:var(--danger);}

  .weather-chip{flex-direction:column; align-items:flex-start; gap:6px; font-size:12.5px; font-weight:600; line-height:1.35; padding:9px 12px; border-radius:var(--radius-sm);}
  .weather-chip.weather-rain, .weather-chip.weather-cold{background:var(--zone1-bg); color:var(--zone1);}
  .weather-chip.weather-storm{background:var(--danger-dim); color:var(--danger);}
  .weather-chip.weather-heat{background:var(--clay-dim); color:var(--clay);}
  .weather-chip-row{display:flex; align-items:center; gap:8px; width:100%;}
  .weather-chip-action{background:none; border:none; padding:0; margin:0; font:inherit; font-weight:800; text-decoration:underline; color:inherit; cursor:pointer; align-self:flex-start;}
  .weather-chip-action:active{opacity:.6;}

  .zone-chip{display:inline-flex; align-items:center; gap:5px; font-size:11px; font-weight:700; padding:5px 10px; border-radius:999px;}
  .zone-1{background:var(--zone1-bg); color:var(--zone1);}
  .zone-2{background:var(--zone2-bg); color:var(--zone2);}
  .zone-3{background:var(--zone3-bg); color:var(--zone3);}
  .zone-4{background:var(--zone4-bg); color:var(--zone4);}
  .zone-5{background:var(--zone5-bg); color:var(--zone5);}
  .zone-badge-live{display:flex; align-items:center; justify-content:space-between; padding:14px 16px; border-radius:var(--radius-sm); margin-bottom:12px; background:var(--asphalt-2);}
  .zone-badge-live.zone-1{background:var(--zone1-bg-live);}
  .zone-badge-live.zone-2{background:var(--zone2-bg-live);}
  .zone-badge-live.zone-3{background:var(--zone3-bg-live);}
  .zone-badge-live.zone-4{background:var(--zone4-bg-live);}
  .zone-badge-live.zone-5{background:var(--zone5-bg-live);}
  .zone-badge-live .zn{font-size:19px; font-weight:800;}

  .greeting{font-size:25px; font-weight:600; margin:14px 0 4px; letter-spacing:-.01em;}
  .next-session{display:flex; justify-content:space-between; align-items:flex-start;}
  .next-session .big{font-size:42px; line-height:.95;}
  /* Tarjeta destacada -- "próxima sesión" es LA acción del día, así que se diferencia
     del resto de las tarjetas con un borde lima tenue y un degradado interno apenas
     insinuado, no con un color de fondo sólido distinto (eso competiría demasiado). */
  .card-highlight{background:linear-gradient(160deg, rgba(214,255,63,.07), var(--asphalt-2) 55%); border-color:var(--hivis); border-width:1.5px;
    box-shadow:0 0 0 1px rgba(214,255,63,.25), 0 0 22px rgba(214,255,63,.35), 0 4px 18px rgba(0,0,0,.3);}
  /* Viñetas breves para la descripción de la sesión (entrada en calor / sesión /
     vuelta a la calma vienen como líneas separadas por \n desde planLabel()) -- se
     listan una debajo de otra con una marca chica, en vez de un párrafo corrido. */
  .next-session-bullets{margin-top:2px;}
  .next-session-bullet{display:flex; gap:7px; align-items:flex-start; color:var(--mist); font-size:13.5px; line-height:1.45; margin-top:5px;}
  .next-session-bullet::before{content:''; width:5px; height:5px; margin-top:7px; border-radius:50%; background:var(--hivis); flex-shrink:0;}
  .stat-row{display:flex; gap:10px;}
  .stat-box{flex:1; background:var(--asphalt-3); border-radius:var(--radius-sm); padding:13px 10px; text-align:center; border:1px solid var(--overlay-hairline); box-shadow:0 2px 8px rgba(0,0,0,.14);}
  .stat-box .n{font-size:21px; font-weight:800;}
  .hist-card .stat-row-divided .stat-cell .n{font-size:16px;}
  .hist-map{position:relative; isolation:isolate; height:108px; border-radius:var(--radius-sm); overflow:hidden; margin-bottom:10px; background:var(--asphalt-3);}
  .hist-map:empty{background:linear-gradient(90deg, var(--asphalt-3) 25%, var(--asphalt-4) 37%, var(--asphalt-3) 63%); background-size:400% 100%; animation:skeletonShine 1.4s ease infinite;}
  .stat-box .l{font-size:10px; color:var(--mist); text-transform:uppercase; letter-spacing:.05em;}
  /* Reemplaza los stat-box cuadrados por números grandes separados por divisores
     verticales finos -- mismo dato, sin cajas. Reutilizado en "Esta semana" (Inicio)
     y en las métricas de la tarjeta de Strava (Historial). */
  .stat-row-divided{display:flex; align-items:stretch; margin-top:2px;}
  .stat-row-divided .stat-cell{flex:1; min-width:0; text-align:center; padding:0 6px; position:relative; display:flex; flex-direction:column; gap:4px;}
  .stat-row-divided .stat-cell:first-child{padding-left:0;}
  .stat-row-divided .stat-cell:last-child{padding-right:0;}
  .stat-row-divided .stat-cell + .stat-cell::before{content:''; position:absolute; left:0; top:8%; bottom:8%; width:1px; background:var(--asphalt-4);}
  .stat-row-divided .stat-cell .n{font-size:20px; font-weight:800; font-family:'JetBrains Mono',monospace; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .stat-row-divided .stat-cell .l{font-size:10px; color:var(--mist); text-transform:uppercase; letter-spacing:.05em;}
  /* Botón compacto "+" del encabezado de Historial -- reemplaza la barra ancha de
     "+ Agregar carrera manual" de antes; mismo tamaño/tratamiento que los demás
     botones circulares chicos de la app (.week-nav-btn, .info-btn). */
  .hist-add-btn{width:34px; height:34px; border-radius:50%; background:var(--asphalt-3); border:1px solid var(--overlay-hairline);
    color:var(--hivis-text); display:flex; align-items:center; justify-content:center; cursor:pointer; flex-shrink:0; padding:0;
    transition:transform .12s ease, background .12s ease;}
  .hist-add-btn:active{transform:scale(.88); background:var(--asphalt-4);}
  .hist-add-btn svg{width:16px; height:16px;}
  /* Gráficos de tendencia (Historial): reemplaza las barras dentro de cajas grises por
     trazos verticales finos y redondeados -- los días/semanas sin actividad quedan como
     una línea fina en vez de una barra, así el ojo va directo a los días con volumen. */
  .trend-bars{display:flex; align-items:flex-end; justify-content:space-between; height:70px; gap:3px;}
  .trend-col{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:flex-end; height:100%; gap:6px; min-width:0;}
  .trend-stroke{width:5px; border-radius:99px; background:var(--hivis); transition:height .4s cubic-bezier(.22,1,.36,1);}
  .trend-stroke.trend-planned{background:var(--mist-dim);}
  .trend-stroke.trend-rest{width:1.5px; background:var(--asphalt-4);}
  .trend-lbl{font-size:9.5px; color:var(--mist-dim); text-transform:uppercase; letter-spacing:.04em; flex-shrink:0;}
  /* Insignia "STRAVA" + duración sobre la vista previa del mapa, en vez de una fila de
     texto aparte encima de la tarjeta -- libera espacio y agrupa el origen del dato
     (Strava) con el mapa que ya lo representa visualmente. */
  .hist-map-badge{position:absolute; top:8px; right:8px; z-index:1000; display:flex; align-items:center; gap:6px;}
  .hist-map-badge .tag{margin:0;}
  .hist-map-badge .hist-map-duration{background:rgba(10,10,10,.62); backdrop-filter:blur(3px); color:var(--chalk); font-size:11.5px; font-weight:700; font-family:'JetBrains Mono',monospace; padding:4px 8px; border-radius:99px;}
  /* Peso/Altura (Perfil): en vez de dos inputs numéricos encajonados, un valor grande
     centrado con la etiqueta arriba y un divisor fino abajo -- se ve y se edita como un
     dato destacado, no como un formulario. */
  .metric-input-row{display:flex; gap:20px; margin-top:16px;}
  .metric-input-cell{flex:1; display:flex; flex-direction:column; align-items:center; gap:8px; min-width:0;}
  .metric-input-cell label{margin:0; font-size:10.5px; text-transform:uppercase; letter-spacing:.06em; color:var(--mist); font-weight:600;}
  .metric-input{width:100%; max-width:130px; background:none; border:none; border-bottom:1.5px solid var(--asphalt-4);
    color:var(--chalk); font-size:26px; font-weight:800; font-family:'JetBrains Mono',monospace; text-align:center;
    padding:2px 0 9px; -moz-appearance:textfield; transition:border-color .15s ease;}
  .metric-input::-webkit-outer-spin-button,.metric-input::-webkit-inner-spin-button{-webkit-appearance:none; margin:0;}
  .metric-input:focus{outline:none; border-bottom-color:var(--hivis);}
  /* Selector de tiempo (horas:minutos:segundos) para la calculadora de ritmo -- 3
     selects nativos en vez de un campo de texto libre, así se elige el tiempo tocando
     en vez de tipear números a mano (el picker nativo del celular hace el resto). */
  .time-picker-row{display:flex; align-items:flex-start; justify-content:center; gap:6px; margin-top:6px;
    background:var(--asphalt-2); border:1.5px solid var(--asphalt-4); border-radius:var(--radius-sm); padding:10px 6px 8px;}
  .time-picker-row .tp-col{display:flex; flex-direction:column; align-items:center; flex:1; min-width:0;}
  .time-picker-row select{width:100%; background:none; border:none; color:var(--chalk); font-size:19px; font-weight:800;
    font-family:'JetBrains Mono',monospace; text-align:center; text-align-last:center; padding:4px 0; cursor:pointer;}
  .time-picker-row select:focus{outline:none;}
  .time-picker-row .tp-colon{color:var(--mist-dim); font-weight:800; font-size:19px; padding-top:4px;}
  .time-picker-row .tp-unit{font-size:9px; color:var(--mist); text-transform:uppercase; letter-spacing:.04em; margin-top:2px;}
  /* Tira de días L-D: reemplaza las barras verticales por día/punto -- el punto se
     agranda y se llena de lima en un día de entrenamiento, queda chico y hueco en un
     descanso, y el día de hoy se marca con un anillo fino alrededor. */
  .week-days{display:flex; justify-content:space-between; align-items:flex-end; margin-top:18px; height:66px; gap:4px;}
  .week-days .wd-col{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:flex-end; gap:8px; height:100%; min-width:0;}
  .week-days .wd-lbl{font-size:10px; color:var(--mist); text-transform:uppercase; letter-spacing:.04em;}
  .week-days .wd-bar-wrap{flex:1; display:flex; align-items:flex-end;}
  .week-days .wd-bar{width:7px; border-radius:99px; background:var(--asphalt-4); transition:height .3s cubic-bezier(.22,1,.36,1);}
  .week-days .wd-col.training .wd-bar{background:var(--hivis); box-shadow:0 0 8px var(--hivis-glow);}
  .week-days .wd-col.today .wd-bar{box-shadow:0 0 0 1.5px var(--mist-dim), 0 0 8px var(--hivis-glow);}
  .week-days .wd-col.today .wd-lbl{color:var(--chalk); font-weight:700;}
  .coach-snippet{display:flex; gap:12px; align-items:flex-start;}
  .coach-avatar{width:40px; height:40px; border-radius:14px; background:var(--hivis-dim); display:flex; align-items:center; justify-content:center; flex-shrink:0;}

  .day-row{display:flex; align-items:flex-start; gap:12px; padding:13px 0; border-bottom:1px solid var(--asphalt-3); cursor:pointer; transition:background .12s ease, opacity .12s ease;}
  .day-row:active{background:var(--press);}
  .day-row:last-child{border-bottom:none;}
  .day-badge{width:42px; text-align:center; flex-shrink:0;}
  .day-badge .d{font-size:11px; color:var(--mist); text-transform:uppercase;}
  .day-info{flex:1; min-width:0;}
  .day-info .t{font-weight:700; font-size:15.5px;}
  .day-info .m{font-size:12px; color:var(--mist); margin-top:4px; display:flex; gap:6px; flex-wrap:wrap; align-items:center;}
  .day-info-title-row{display:flex; align-items:baseline; gap:9px; flex-wrap:wrap;}
  /* Kilometraje integrado en la misma fila del tipo de sesión, con un divisor fino en
     vez de vivir solo en su propia columna a la derecha (que dejaba la fila con mucho
     aire vacío en el medio en pantallas angostas). */
  .day-km-inline{font-family:'JetBrains Mono',monospace; font-size:12.5px; font-weight:700; color:var(--hivis-text); flex-shrink:0;
    padding-left:9px; border-left:1px solid var(--asphalt-4);}
  .day-dist{font-family:'JetBrains Mono',monospace; font-size:14.5px; font-weight:700; color:var(--hivis-text); flex-shrink:0;}
  /* Ícono de estado (check/x) solo, siempre al final de la fila. Los chips de
     terreno/zona viven debajo del título (ver .day-row-chips), no acá. */
  .day-row-end{display:flex; align-items:center; flex-shrink:0; padding-top:2px;}
  .day-row-chips{display:flex; gap:5px; flex-wrap:wrap; margin-top:6px;}
  /* Día de descanso: toda la fila baja de opacidad para que los días CON entrenamiento
     salten a la vista de entrada, sin tener que leer cada renglón. */
  .day-row.day-row-rest{opacity:.5;}
  .day-detail{display:none; padding:0 0 14px 54px; font-size:13px; color:var(--mist); line-height:1.7; white-space:pre-line;}
  .day-detail.open{display:block;}

  #runIdle{text-align:center; padding-top:16px;}
  /* Tarjeta de estado GPS: reemplaza el bloque de dos párrafos de advertencia por una
     tarjeta prolija con ícono satelital discreto + micro-viñetas (mismo patrón visual
     que .next-session-bullet en Inicio, para que se sienta parte del mismo sistema). */
  .gps-status-card{display:flex; gap:12px; align-items:flex-start; background:var(--asphalt-2); border:1px solid var(--overlay-hairline);
    border-radius:var(--radius-sm); padding:16px; margin-top:14px; text-align:left; box-shadow:var(--shadow-card);}
  .gps-status-title{margin:0 0 6px; font-weight:700; font-size:13.5px; color:var(--chalk);}
  .gps-status-bullet{margin:5px 0 0; font-size:12px; line-height:1.4; color:var(--mist); display:flex; gap:6px;}
  .gps-status-bullet::before{content:'—'; color:var(--mist-dim); flex-shrink:0;}
  /* Zona del botón de arrancar: el fondo de líneas de ruta/altimetría es puramente
     decorativo (aria-hidden), muy tenue, para que el espacio vacío alrededor del botón
     dé contexto de "esto registra tu recorrido" antes de arrancar a correr. */
  .run-idle-cta{position:relative; margin-top:8px; min-height:400px; display:flex; align-items:flex-start; justify-content:center; padding-top:28px;}
  .run-bg-route{position:absolute; inset:0; z-index:0; overflow:hidden; pointer-events:none;}
  .run-bg-route svg{width:100%; height:100%;}
  /* Fondo decorativo detrás del botón START: una pista de atletismo (carriles + línea de
     llegada) tenue en gris, con el carril interno resaltado en lima -- ocupa el espacio
     vacío entre el botón y la tabbar en vez de dejarlo en blanco. */
  .run-bg-route .rbr-contour{fill:none; stroke:var(--asphalt-4); stroke-width:1.4; opacity:.6;}
  .run-bg-route .rbr-route{fill:none; stroke:var(--hivis); stroke-width:2.5; stroke-linecap:round; stroke-linejoin:round; opacity:.55;
    filter:drop-shadow(0 0 5px var(--hivis-glow));}
  .run-bg-route .rbr-finish{stroke:var(--mist-dim); stroke-width:1.6; opacity:.5;}
  .run-bg-route .rbr-finish-dim{opacity:.3;}
  .go-circle{position:relative; z-index:1; width:100%; max-width:220px; height:88px; border-radius:999px; margin:0 auto; background:var(--hivis);
    display:flex; align-items:center; justify-content:center; flex-direction:column; color:var(--ink); border:none; cursor:pointer;
    box-shadow:0 16px 40px var(--hivis-glow); transition:transform .12s ease, box-shadow .12s ease;}
  .go-circle .display{font-size:25px; letter-spacing:.03em;}
  .go-circle:active{transform:scale(.96); box-shadow:0 8px 24px var(--hivis-glow);}
  #runActive,#runSummary{display:none;}
  .rec-dot{width:9px; height:9px; border-radius:50%; background:var(--danger); animation:blink 1.4s ease-in-out infinite; display:inline-block; margin-right:7px;}

  /* Micro-festejo (confetti): PR nuevo o meta semanal cumplida -- ver celebrate() en
     app.js. Los <span> se crean y se destruyen solos por JS; acá solo va la animación. */
  .confetti-layer{position:fixed; inset:0; pointer-events:none; z-index:9999; overflow:hidden;}
  .confetti-piece{position:absolute; top:-12px; border-radius:2px; opacity:0; animation-name:confettiFall; animation-timing-function:cubic-bezier(.35,0,.65,1); animation-fill-mode:forwards;}
  @keyframes confettiFall{
    0%{opacity:1; transform:translateY(0) rotate(0deg);}
    100%{opacity:0; transform:translateY(100vh) rotate(720deg);}
  }
  @media (prefers-reduced-motion:reduce){ .confetti-piece{display:none;} }
  .timer-big{font-size:48px; text-align:center; margin:10px 0 14px;}
  .map-wrap{position:relative; isolation:isolate; height:260px; border-radius:var(--radius); overflow:hidden; margin-bottom:14px; border:1px solid var(--asphalt-4);
    background:linear-gradient(90deg, var(--asphalt-3) 25%, var(--asphalt-4) 37%, var(--asphalt-3) 63%); background-size:400% 100%; animation:skeletonShine 1.4s ease infinite;}
  #liveMap{height:100%; width:100%; background:var(--asphalt-3);}
  .map-wrap .leaflet-control-attribution{background:rgba(10,10,10,.75); color:var(--mist-dim); font-size:9px; padding:1px 5px;}
  .map-wrap .leaflet-control-attribution a{color:var(--mist);}
  .map-recenter-btn{position:absolute; bottom:12px; right:12px; z-index:10; width:40px; height:40px; border-radius:50%; background:var(--asphalt-2); border:1.5px solid var(--asphalt-4); color:var(--hivis-text); font-size:17px; cursor:pointer; display:flex; align-items:center; justify-content:center;}
  .run-controls{display:flex; gap:10px; margin-top:16px;}

  /* ---- Detalle de carrera con pestañas (Ruta/Ritmo/Segmentos/Gráficos/Detalles) ----
     El mapa de la pestaña Ruta se hace sangrar hasta el borde de la pantalla con
     márgenes negativos (el .overlay que lo contiene tiene 24px de padding lateral
     fijo, ver la regla .overlay más arriba) -- así se ve edge-to-edge como en la
     referencia en vez de quedar como una tarjeta más. */
  .rd-tabs{display:flex; gap:4px; margin:0 -24px 14px; padding:0 24px 2px; overflow-x:auto; -webkit-overflow-scrolling:touch; scrollbar-width:none; border-bottom:1px solid var(--asphalt-4);}
  .rd-tabs::-webkit-scrollbar{display:none;}
  .rd-tab-btn{background:none; border:none; color:var(--mist); font-family:inherit; font-size:14px; font-weight:700; padding:8px 12px 12px; cursor:pointer; white-space:nowrap; border-bottom:2.5px solid transparent; flex-shrink:0;}
  .rd-tab-btn.active{color:var(--hivis-text); border-bottom-color:var(--hivis);}
  .rd-panel{display:none;}
  .rd-panel.active{display:block;}
  .rd-map-full{position:relative; isolation:isolate; height:340px; margin:0 -24px 16px; background:var(--asphalt-3); transition:height .3s cubic-bezier(.22,.9,.3,1);}
  .rd-map-full.rd-map-dragging{transition:none;}
  .rd-map-full .leaflet-control-attribution{background:rgba(10,10,10,.75); color:var(--mist-dim); font-size:9px; padding:1px 5px;}
  .rd-map-full .leaflet-control-attribution a{color:var(--mist);}
  .rd-map-controls{position:absolute; top:12px; right:12px; z-index:10; display:flex; flex-direction:column; gap:8px;}
  .rd-map-controls button{width:38px; height:38px; border-radius:50%; background:rgba(10,10,10,.82); border:1.5px solid var(--asphalt-4); color:var(--chalk); cursor:pointer; display:flex; align-items:center; justify-content:center;}
  /* Degradado gris arriba del mapa (como en la foto de referencia) -- además de
     prolijo, sirve para que el botón de recentrar de arriba se siga viendo bien
     apenas el mapa crece y queda con mucho cielo/tile clarito detrás. pointer-events
     none para no tapar los controles ni interferir con el drag de la agarradera. */
  .rd-map-fade{position:absolute; top:0; left:0; right:0; height:90px; z-index:9; pointer-events:none;
    background:linear-gradient(to bottom, rgba(10,12,13,.5), rgba(10,12,13,0));}
  /* Agarradera para arrastrar el mapa de la pestaña Ruta hacia arriba y agrandarlo
     (a pantalla casi completa), y volver a arrastrarlo hacia abajo para achicarlo --
     el touch-action:none evita que el navegador intente hacer scroll de la página
     mientras el dedo está sobre la agarradera. */
  .rd-map-handle{position:absolute; left:50%; bottom:10px; transform:translateX(-50%); width:42px; height:5px; border-radius:999px;
    background:rgba(255,255,255,.55); z-index:11; box-shadow:0 1px 5px rgba(0,0,0,.35); touch-action:none; cursor:grab;}
  .rd-ruta-below{transition:opacity .26s ease, max-height .3s ease, margin .3s ease; max-height:600px; opacity:1;}
  .rd-ruta-below.rd-collapsed{opacity:0; max-height:0; margin:0; overflow:hidden; pointer-events:none;}
  .rd-big-dist{font-size:44px; font-weight:800; line-height:1;}
  .rd-legend-bar{height:6px; border-radius:999px; margin:14px 0 6px; background:linear-gradient(90deg, var(--zone2), var(--zone3), var(--zone5));}
  .rd-legend-labels{display:flex; justify-content:space-between; font-size:11.5px; color:var(--mist);}
  .rd-stat-row{display:flex; justify-content:space-around; text-align:center; margin-top:18px; padding-top:16px; border-top:1px solid var(--asphalt-3);}
  .rd-stat-row div span{display:block; font-size:19px; font-weight:800; margin-bottom:2px;}
  .pace-bar-row{display:flex; align-items:center; gap:10px; margin-bottom:8px;}
  .pace-bar-row .pace-bar-label{width:18px; font-size:12.5px; color:var(--mist); flex-shrink:0;}
  .pace-bar-track{flex:1; height:26px; border-radius:8px; background:var(--asphalt-3); overflow:hidden; position:relative;}
  /* A pedido del usuario, las barras de ritmo de la pestaña Ritmo se ven más
     intensas/vivas que el resto de los usos de --zoneN (mapa de la ruta,
     donuts de zona) -- en vez de duplicar las variables de color, se le suma
     un filtro que satura/aclara un poco lo que ya venga de --zoneN, así el
     resto de la app sigue compartiendo la misma fuente de verdad de colores. */
  .pace-bar-fill{height:100%; border-radius:8px; display:flex; align-items:center; justify-content:flex-end; padding-right:8px; font-size:12px; font-weight:700; color:var(--ink); min-width:38px; filter:saturate(1.45) brightness(1.06);}
  .rd-stat-grid{display:grid; grid-template-columns:1fr 1fr; gap:16px 12px;}
  .rd-stat-tile{display:flex; align-items:flex-start; gap:9px;}
  .rd-stat-tile .rd-tile-ico{width:26px; height:26px; flex-shrink:0; margin-top:2px; color:var(--hivis-text);}
  .rd-stat-tile .rd-tile-val{font-size:17px; font-weight:800;}
  .rd-stat-tile .rd-tile-lbl{font-size:12px; color:var(--mist);}
  .rd-seg-table{width:100%; border-collapse:collapse; font-size:12.5px;}
  .rd-seg-table th{text-align:right; color:var(--mist); font-weight:600; font-size:11px; padding:0 0 8px; white-space:nowrap;}
  .rd-seg-table th:first-child, .rd-seg-table td:first-child{text-align:left;}
  .rd-seg-table td{text-align:right; padding:8px 0; border-top:1px solid var(--asphalt-3); font-weight:700; white-space:nowrap;}
  .rd-seg-table tr:last-child td{font-weight:800; color:var(--hivis-text);}
  .rd-chart-card{margin-bottom:16px;}
  .rd-chart-svg{width:100%; height:110px; display:block;}
  .rd-donut-row{display:flex; align-items:center; gap:18px; margin-top:10px;}
  .rd-donut-legend{flex:1; display:flex; flex-direction:column; gap:6px;}
  .rd-donut-legend-row{display:flex; align-items:center; justify-content:space-between; font-size:12.5px;}
  .rd-donut-legend-row .dot{width:9px; height:9px; border-radius:50%; margin-right:7px; display:inline-block; flex-shrink:0;}
  .rd-donut-legend-name{display:flex; align-items:center; color:var(--chalk);}
  .rd-donut-legend-val{color:var(--mist); flex-shrink:0;}
  .rd-video-btn{background:var(--hivis-dim); color:var(--hivis-text); border:none; border-radius:999px; padding:11px 18px; font-weight:700; font-size:13.5px; display:inline-flex; align-items:center; gap:7px; cursor:pointer; white-space:nowrap;}
  .rd-video-overlay{position:fixed; inset:0; z-index:70; background:#000; display:none; flex-direction:column; align-items:center; justify-content:center;}
  .rd-video-overlay canvas{max-width:100%; max-height:70vh; border-radius:14px;}
  .rd-video-overlay .rd-video-actions{display:flex; gap:12px; margin-top:20px; padding:0 24px; width:100%; max-width:420px;}
  .rd-video-progress{color:#fff; font-size:14px; margin-top:16px; font-weight:600;}

  /* ---- Contenedor del chat: alto real medido por JS (syncCoachChatLayout), no CSS
     adivinado -- ver ese comentario largo junto a la función en el <script> para el
     porqué. #coachChatWrap ocupa desde abajo del header hasta arriba de la tabbar
     (o hasta el borde del teclado cuando está abierto), y adentro es un flex column:
     título -> #chatLog (el único que scrollea, flex:1) -> barra de escribir (último
     hijo, en flujo normal -- ya no "position:fixed" independiente, así que nunca
     puede quedar mal calculada ni moverse sola al hacer scroll del chat). */
  #coachChatWrap{position:fixed; left:0; right:0; max-width:480px; margin:0 auto; top:64px; bottom:78px;
    display:flex; flex-direction:column; z-index:15; background:var(--asphalt);}
  #coachChatTitle{font-size:25px; margin:0; padding:14px 20px 0; flex-shrink:0;}
  .coach-disclaimer{flex-shrink:0; margin:0; padding:4px 20px 10px; font-size:11px; color:var(--mist-dim); line-height:1.4;}
  #chatLog{display:flex; flex-direction:column; flex:1; min-height:0; overflow-y:auto; -webkit-overflow-scrolling:touch; padding:0 20px 10px; overscroll-behavior:contain;}
  .msg{max-width:82%; padding:11px 14px; border-radius:16px; font-size:14px; line-height:1.5; margin-bottom:10px;}
  .msg.first,.msg.mid{margin-bottom:2px;}
  .msg.coach{background:var(--asphalt-2); align-self:flex-start; border-bottom-left-radius:4px; white-space:pre-wrap;}
  .msg.user{background:var(--hivis); color:var(--ink); align-self:flex-end; border-bottom-right-radius:4px; font-weight:600;}
  .msg.system{align-self:center; background:none; color:var(--hivis-text); font-size:11.5px; text-align:center; max-width:100%; font-weight:700; margin-bottom:10px;}
  .msg.coach.mid,.msg.coach.last{border-top-left-radius:6px;}
  .msg.coach.first,.msg.coach.mid{border-bottom-left-radius:6px;}
  .msg.user.mid,.msg.user.last{border-top-right-radius:6px;}
  .msg.user.first,.msg.user.mid{border-bottom-right-radius:6px;}
  .msg-time{display:flex; font-size:10.5px; color:var(--mist-dim); margin:-4px 0 10px; padding:0 4px;}
  .msg-time.left{justify-content:flex-start; padding-left:14px;}
  .msg-time.right{justify-content:flex-end; padding-right:14px;}
  .typing span{display:inline-block; width:6px; height:6px; background:var(--mist); border-radius:50%; margin-right:3px; animation:blink 1s infinite;}
  .typing span:nth-child(2){animation-delay:.15s;} .typing span:nth-child(3){animation-delay:.3s;}
  .chat-input-bar{flex-shrink:0; background:var(--asphalt);
    padding:10px 20px; display:none; align-items:center; gap:8px; border-top:1px solid var(--asphalt-3);}
  .chat-input-bar.active{display:flex;}
  .chat-input-bar input{flex:1; background:var(--asphalt-2); border:1.5px solid var(--asphalt-4); color:var(--chalk); padding:13px 16px; border-radius:999px; font-size:15px; outline:none;}
  .chat-input-bar input:focus{border-color:var(--hivis);}
  .chat-send{background:var(--hivis); color:var(--ink); border:none; width:44px; height:44px; border-radius:50%; flex-shrink:0; cursor:pointer; display:flex; align-items:center; justify-content:center; transition:transform .12s ease, background .15s ease;}
  .chat-send:active{transform:scale(.92);}
  .chat-send[data-busy="1"]{background:var(--asphalt-4); color:var(--chalk);}
  .chat-chips{display:flex; flex-wrap:wrap; gap:8px; margin:2px 0 16px;}
  .chat-chip{background:var(--asphalt-2); border:1.5px solid var(--asphalt-4); color:var(--mist); font-size:12.5px; font-weight:600; padding:8px 13px; border-radius:999px; cursor:pointer; transition:border-color .12s ease, color .12s ease, transform .1s ease;}
  .chat-chip:active{transform:scale(.95); border-color:var(--hivis); color:var(--hivis-text);}
  .msg .msg-list{margin:6px 0; padding-left:18px;}
  .msg .msg-list li{margin-bottom:3px;}
  /* position:absolute relativo a #coachChatWrap (que es el positioning context) --
     JS ajusta "bottom" según el alto real de la barra de escribir. */
  .chat-scroll-btn-wrap{position:absolute; left:0; right:0; bottom:86px; pointer-events:none; z-index:2;}
  .chat-scroll-btn{position:absolute; right:20px; bottom:0; width:38px; height:38px; border-radius:50%; background:var(--asphalt-2); border:1.5px solid var(--asphalt-4); color:var(--hivis-text); display:flex; align-items:center; justify-content:center; cursor:pointer; pointer-events:auto; box-shadow:0 3px 12px rgba(0,0,0,.35); transition:transform .12s ease;}
  .chat-scroll-btn:active{transform:scale(.9);}

  .day-picker{display:flex; flex-wrap:wrap; gap:8px;}
  .day-pill{width:42px; height:42px; border-radius:50%; display:flex; align-items:center; justify-content:center;
    border:1.5px solid var(--asphalt-4); background:var(--asphalt-2); color:var(--mist); font-size:11px; font-weight:700; cursor:pointer; user-select:none; flex-shrink:0;}
  .day-pill.active{border-color:var(--hivis); color:var(--hivis-text); background:var(--hivis-dim); box-shadow:0 4px 14px var(--hivis-glow);}

  .hist-card{margin-bottom:12px;}
  .type-breakdown-row{display:flex; align-items:center; gap:10px; margin-bottom:9px;}
  .type-breakdown-row:last-child{margin-bottom:0;}
  .type-breakdown-label{width:92px; flex-shrink:0; font-size:12.5px; color:var(--mist); font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .type-breakdown-bar-wrap{flex:1; height:8px; background:var(--asphalt-3); border-radius:99px; overflow:hidden;}
  .type-breakdown-bar{height:100%; background:var(--hivis); border-radius:99px;}
  .type-breakdown-count{width:18px; text-align:right; font-size:12.5px; font-weight:700; color:var(--chalk); flex-shrink:0;}
  .swipe-item{position:relative; overflow:hidden;}
  #history-list .swipe-item{border-radius:var(--radius); margin-bottom:12px;}
  #history-list .swipe-item .hist-card{margin-bottom:0;}
  .swipe-action-delete{position:absolute; top:0; right:0; bottom:0; width:78px; background:var(--danger);
    color:#fff; display:flex; align-items:center; justify-content:center; cursor:pointer;}
  /* #history-list: acá el fondo rojo NO pinta directo sobre el rectángulo del botón
     (que sigue siendo el área completa, para no achicar el tap target) -- pinta en un
     ::before, separado unos px de las esquinas redondeadas de la tarjeta de arriba.
     Con las dos formas coincidiendo exactamente en la esquina, quedaba asomando un
     hilito de rojo sin antialiasear ahí (bug clásico de recortes redondeados
     superpuestos) -- separándolo unos píxeles, el rojo nunca llega a esa zona. */
  #history-list .swipe-action-delete{background:none;}
  #history-list .swipe-action-delete::before{content:''; position:absolute; top:4px; right:4px; bottom:4px; left:0;
    background:var(--danger); border-radius:0 var(--radius-sm) var(--radius-sm) 0;}
  #history-list .swipe-action-delete .icon-sq{position:relative;}
  .swipe-content{position:relative; touch-action:pan-y; will-change:transform; backface-visibility:hidden;}
  .swipe-content.swipe-anim{transition:transform .25s cubic-bezier(.22,1,.36,1);}
  .shoe-row{display:flex; align-items:center; gap:12px; padding:12px 0; border-bottom:1px solid var(--asphalt-3);}
  .shoe-row:last-child, #shoe-list > .shoe-item:last-child{border-bottom:none;}
  .shoe-row .swipe-item{flex:1; min-width:0;}
  .shoe-row .swipe-content{background:var(--asphalt-2); display:flex; align-items:center; gap:10px;}
  .shoe-row .shoe-info{min-width:0;}
  .shoe-row .shoe-info .n{overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .hist-top{display:flex; justify-content:space-between; align-items:baseline; margin-bottom:10px;}
  .hist-date{font-size:12px; color:var(--mist);}
  .hist-hrlist{display:flex; gap:6px; flex-wrap:wrap; margin-top:10px;}

  .profile-head{display:flex; align-items:center; gap:14px; margin-bottom:6px;}
  /* El círculo/cuadrado de la foto necesita overflow:hidden para recortar la imagen a su
     forma -- pero eso mismo recortaba el emoji de la cámara si vivía adentro, dejándolo
     "pegado" en el borde interno en vez de asomar hacia afuera como en Instagram. La
     solución es un wrapper aparte SIN overflow:hidden que sostiene los dos: la foto (que
     sí recorta) y la insignia (que ahora puede sobresalir del círculo sin que nada la corte). */
  .avatar-big-wrap{position:relative; flex-shrink:0; cursor:pointer;}
  /* position:relative es necesario acá -- si no, el <img> de adentro (que es
     position:absolute) se posiciona relativo a .avatar-big-wrap (el próximo ancestro
     posicionado) en vez de a este elemento, se sale de esta caja con overflow:hidden y
     border-radius, y termina mostrándose sin recortar (foto cuadrada, sin bordes
     redondeados) -- exactamente el bug que quedó al separar el badge de la cámara. */
  .avatar-big{position:relative; width:56px; height:56px; border-radius:18px; background:var(--hivis-dim); color:var(--hivis-text); display:flex; align-items:center; justify-content:center; font-weight:800; font-size:21px; overflow:hidden;}
  .avatar-big img{position:absolute; inset:0; width:100%; height:100%; object-fit:cover;}
  .avatar-edit-badge{position:absolute; bottom:-4px; right:-4px; width:22px; height:22px; border-radius:50%; background:var(--hivis); color:var(--ink); display:flex; align-items:center; justify-content:center; border:2.5px solid var(--asphalt); pointer-events:none;}
  .pr-medal-grid{display:grid; grid-template-columns:repeat(3, 1fr); gap:10px; margin-top:4px;}
  .pr-medal{display:flex; flex-direction:column; align-items:center; gap:5px; padding:14px 6px; border-radius:var(--radius-sm); background:var(--asphalt-3); text-align:center; transition:background .15s ease;}
  .pr-medal.achieved{background:var(--hivis-dim);}
  .pr-medal .icon-sq{width:24px; height:24px; color:var(--mist-dim);}
  .pr-medal.achieved .icon-sq{color:var(--hivis-text);}
  .pr-medal-label{font-size:11.5px; font-weight:800; color:var(--mist);}
  .pr-medal.achieved .pr-medal-label{color:var(--chalk);}
  .pr-medal-time{font-size:12px; font-weight:800; font-family:'JetBrains Mono',monospace; color:var(--hivis-text);}
  .pr-medal-locked{font-size:11px; color:var(--mist-dim);}
  .shoe-item{display:flex; align-items:center; gap:12px; padding:12px 0; border-bottom:1px solid var(--asphalt-3); transition:background .12s ease;}
  .shoe-item:active{background:var(--press);}
  .shoe-icon{width:36px; height:36px; border-radius:11px; background:var(--asphalt-3); display:flex; align-items:center; justify-content:center; flex-shrink:0; color:var(--mist);}
  .shoe-icon svg{width:19px; height:19px;}
  .shoe-info{flex:1;}
  .shoe-info .n{font-weight:700; font-size:13.5px;}
  .wearbar{height:6px; background:var(--asphalt-3); border-radius:99px; margin-top:6px; overflow:hidden;}
  .wearbar > div{height:100%; background:var(--hivis);}
  .wearbar.warn > div{background:var(--danger);}
  .conn-item{display:flex; align-items:center; justify-content:space-between; padding:11px 0; border-bottom:1px solid var(--asphalt-3); transition:background .12s ease;}
  .conn-item:active{background:var(--press);}
  .conn-item:last-child{border-bottom:none;}
  .conn-item .n{font-size:13.5px; font-weight:600;}
  .zone-row{display:flex; justify-content:space-between; align-items:center; padding:9px 0; border-bottom:1px solid var(--asphalt-3);}
  .zone-row:last-child{border-bottom:none;}
  .zone-row .zd{font-size:11px; color:var(--mist-dim); margin-top:2px;}
  .small-link{color:var(--mist); font-size:12.5px; text-decoration:underline; background:none; border:none; cursor:pointer; padding:0; transition:opacity .12s ease;}
  .info-btn{background:none; border:none; color:var(--mist-dim); cursor:pointer; padding:4px; margin:-4px; display:flex; align-items:center; justify-content:center; flex-shrink:0; transition:color .12s ease, transform .12s ease;}
  .info-btn:active{transform:scale(.85); color:var(--hivis-text);}
  .pw-wrap{position:relative;}
  .pw-wrap input{padding-right:44px !important;}
  .pw-toggle{position:absolute; right:2px; top:0; bottom:0; margin:auto; height:fit-content; background:none; border:none; color:var(--mist-dim); cursor:pointer; padding:10px; display:flex; align-items:center; justify-content:center;}
  .pw-toggle:active{color:var(--hivis-text);}
  .small-link:active{opacity:.55;}
  /* En Plan, .week-nav se ve como una única cápsula compacta y centrada (flechas +
     texto adentro de un mismo contenedor) en vez de las flechas sueltas a los
     costados de antes -- las otras dos veces que se reusa .week-nav-btn (volver del
     detalle de carrera, el calendario) no usan la clase .week-nav y no se ven
     afectadas por esto. */
  .week-nav{display:flex; align-items:center; justify-content:center; gap:10px; margin:0 auto 16px; max-width:280px;}
  .week-nav .week-nav-btn{width:34px; height:34px; background:var(--hivis); color:#0a0a0a; flex-shrink:0; box-shadow:0 3px 12px var(--hivis-glow);}
  .week-nav .week-nav-btn:active{background:var(--hivis); transform:scale(.88);}
  .week-nav-label{margin:0; text-align:center; color:var(--chalk); font-size:13px; font-weight:700; flex:1; letter-spacing:.01em; white-space:nowrap;
    padding:9px 18px; background:var(--asphalt-2); border:1px solid var(--overlay-hairline); border-radius:999px;}
  .week-nav-btn{width:32px; height:32px; border-radius:50%; background:var(--asphalt-3); border:none; color:var(--chalk);
    display:flex; align-items:center; justify-content:center; cursor:pointer; flex-shrink:0; padding:0;
    transition:transform .12s ease, background .12s ease, opacity .15s ease;}
  .week-nav-btn:active{transform:scale(.85); background:var(--asphalt-4);}
  .week-nav-btn:disabled{opacity:.25; pointer-events:none;}
  .plan-slide-left{animation:planSlideLeft .22s ease;}
  .plan-slide-right{animation:planSlideRight .22s ease;}
  @keyframes planSlideLeft{from{opacity:0; transform:translateX(14px);} to{opacity:1; transform:translateX(0);}}
  @keyframes planSlideRight{from{opacity:0; transform:translateX(-14px);} to{opacity:1; transform:translateX(0);}}
  .icon-sq{display:inline-flex; flex-shrink:0;}
  .icon-sq svg{width:100%; height:100%; display:block;}
  .spin-icon{animation:spinIcon .8s linear infinite;}
  @keyframes spinIcon{from{transform:rotate(0deg);} to{transform:rotate(360deg);}}

  .skeleton{background:linear-gradient(90deg, var(--asphalt-3) 25%, var(--asphalt-4) 37%, var(--asphalt-3) 63%);
    background-size:400% 100%; animation:skeletonShine 1.4s ease infinite; border-radius:8px;}
  @keyframes skeletonShine{0%{background-position:100% 50%;} 100%{background-position:0 50%;}}
  .add-row{display:flex; gap:8px; margin-top:12px;}
  .add-row input,.add-row select{flex:1; background:var(--asphalt-3); border:1.5px solid var(--asphalt-4); color:var(--chalk); padding:11px; border-radius:var(--radius-sm); font-size:14px;}

  /* Segundo intento -- el primero (bottom:0 con padding 9px arriba / 9px+safe-bottom
     abajo) seguía viéndose desproporcionada, porque el padding de abajo le sumaba
     safe-bottom ENCIMA de los 9px, agrandando la tarjeta hacia abajo con espacio vacío.
     Ahora el padding es 9px parejo arriba Y abajo (de verdad simétrico, la tarjeta
     abraza su contenido igual de los dos lados) y el hueco que hace falta para no tapar
     el home indicator se resuelve levantando la tarjeta ENTERA con bottom:safe-bottom
     en vez de agrandarla por dentro -- por eso vuelve a tener las 4 esquinas redondeadas
     (ya no está pegada al borde real, así que redondearlas abajo no se ve "cortado").

     TERCER intento, el más importante -- position:fixed a position:sticky. Después de
     muchas vueltas tratando de arreglar a los PARCHES el bug de iOS (visualViewport que
     no vuelve a su tamaño real después de cerrar el teclado, dejando a los elementos
     position:fixed mal ubicados -- ver los comentarios largos en app.js junto a
     forceFixedLayoutReflow), la solución de raíz es no depender más de position:fixed
     para esto. Ese bug de WebKit es específico de cómo el compositor re-ancla los
     elementos FIXED contra el viewport visual -- position:sticky usa un mecanismo de
     layout completamente distinto (se recalcula como parte del scroll normal de la
     página, no como una capa aparte "flotando" sobre el viewport), así que no le pega
     el mismo bug. Ya sabemos que funciona bien en esta misma app: header.top usa
     position:sticky hace rato y nunca hubo un reporte de que se quede mal ubicado.
     Como la tabbar es el último elemento de #app (que mide como mínimo 100svh -- ver
     el comentario junto a #app sobre por qué NO es 100dvh),
     position:sticky con bottom:safe-bottom se comporta IGUAL que fixed en pantallas
     que entran completas (que es la mayoría acá), y en las pocas vistas con scroll
     largo (Historial, Plan) se queda pegada abajo mientras se scrollea iqual que antes
     -- la diferencia solo se nota (para bien) después de cerrar el teclado. Como ya no
     "flota" por fuera del documento, ahora ocupa espacio real en el flujo -- por eso
     el padding-bottom de 128px que tenían las .view (pensado para que el contenido no
     quedara tapado DEBAJO de la tabbar flotante) se achica más abajo a un margen chico,
     ya no hace falta compensar ningún solapamiento. left/right ya no aplican igual con
     sticky (esos insets sirven para stickiness horizontal, no para achicar el ancho de
     la caja como con fixed) -- se reemplazan por width+margin para lograr el mismo
     ancho y centrado de antes. */
  nav.tabbar{position:sticky; bottom:var(--safe-bottom); width:calc(100% - 28px); max-width:452px; margin:14px auto 0; background:var(--tabbar-bg);
    backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px); display:flex; padding:9px 6px; flex-shrink:0;
    border-radius:26px; border:1px solid var(--overlay-hairline); box-shadow:var(--shadow-lg); z-index:20;}
  nav.tabbar button{flex:1; background:none; border:none; color:var(--mist-dim); display:flex; flex-direction:column; align-items:center; gap:4px; font-size:10.5px; font-weight:600; cursor:pointer; padding:4px 2px; transition:transform .12s ease, color .12s ease;}
  .nav-icon-wrap{position:relative; display:inline-flex;}
  .nav-badge-dot{position:absolute; top:-2px; right:-4px; width:8px; height:8px; border-radius:50%; background:var(--hivis); border:1.5px solid var(--asphalt); display:none;}
  nav.tabbar button svg{width:22px; height:22px; padding:3px; box-sizing:content-box; border-radius:10px; transition:background .15s ease;}
  nav.tabbar button.active{color:var(--hivis-text);}
  nav.tabbar button.active svg{background:var(--hivis-dim);}
  nav.tabbar button:active{transform:scale(.9);}
  /* Tab central de acción primaria (Correr): un círculo lleno que sobresale por
     encima de la línea de la barra, como el botón de cámara/grabar de apps de
     actividad -- se nota de un vistazo cuál es LA acción del día, sin depender
     de la etiqueta de texto (que se saca para no competir con el círculo). */
  nav.tabbar button.nav-btn-primary{flex:0 0 auto; width:64px; margin-top:-24px;}
  nav.tabbar button.nav-btn-primary .nav-primary-circle{width:56px; height:56px; border-radius:50%; background:var(--hivis);
    display:flex; align-items:center; justify-content:center; border:4px solid var(--asphalt);
    box-shadow:0 10px 24px var(--hivis-glow); transition:transform .12s ease, box-shadow .12s ease;}
  nav.tabbar button.nav-btn-primary svg{width:37px; height:37px; padding:0; color:var(--ink); background:none !important;}
  nav.tabbar button.nav-btn-primary.active .nav-primary-circle{box-shadow:0 12px 30px var(--hivis-glow), 0 0 0 3px var(--hivis-dim);}
  nav.tabbar button.nav-btn-primary:active .nav-primary-circle{transform:scale(.92);}
  /* Botón flotante del coach: al sacar Coach de la tabbar (para bajar de 6 a 5
     pestañas, menos saturada), la conversación con el coach pasa a un burbuja
     flotante siempre a mano -- mismo destino (showView('coach')) y mismo badge
     de no leídos que tenía el tab, solo que ya no compite por espacio abajo. */
  .coach-fab-wrap{position:fixed; left:0; right:0; bottom:calc(104px + var(--safe-bottom)); max-width:480px; margin:0 auto; pointer-events:none; z-index:21;}
  .coach-fab{position:absolute; right:16px; bottom:0; width:50px; height:50px; border-radius:50%; pointer-events:auto;
    background:var(--asphalt-3); border:1.5px solid var(--hivis); color:var(--hivis-text);
    display:flex; align-items:center; justify-content:center; box-shadow:0 6px 18px rgba(0,0,0,.4), 0 0 14px var(--hivis-glow); cursor:pointer; transition:transform .12s ease;}
  .coach-fab:active{transform:scale(.92);}
  .coach-fab svg{width:22px; height:22px;}
  .coach-fab .nav-badge-dot{top:1px; right:3px;}

  .elev-divider{display:flex; align-items:center; gap:8px; margin:22px 0 14px; color:var(--mist-dim);}
  .elev-divider svg{width:60px; height:14px; flex-shrink:0;}
  .elev-divider span{font-size:11px; text-transform:uppercase; letter-spacing:.07em;}
  .elev-divider::after{content:''; flex:1; height:1px; background:var(--asphalt-3);}
</style>
</head>
<body>
<div id="app">

<!-- Spacer invisible que garantiza SIEMPRE unos pocos px de overflow real en el
     documento. Es clave para forceFixedLayoutReflow() en app.js: ese truco necesita
     poder scrollear la página de verdad (1-2px) para forzar a WebKit a recalcular
     los elementos position:fixed (tabbar) después de cerrar el teclado -- sin este
     spacer, #app mide justo lo que mide la pantalla (sin overflow), así que ese
     scroll "de mentira" no tiene nada para mover y nunca fuerza nada. Es un bug de
     iOS 26 confirmado públicamente (visualViewport no vuelve del todo a su tamaño
     real tras cerrar el teclado, afecta hasta apple.com) -- ver el comentario largo
     junto a forceFixedLayoutReflow(). Este div no se ve nunca: mide 4px de alto,
     0 de ancho visible y comparte el fondo de la página. -->
<div id="scrollNudgeSpacer" style="height:4px; width:1px; background:var(--asphalt); pointer-events:none;" aria-hidden="true"></div>
