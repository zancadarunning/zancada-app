<script>
const L = {"es":{"title":"Zancada — Términos y Condiciones","back":"‹ Volver a Zancada","updated":"Última actualización: 6 de octubre de 2026","intro":"Al crear una cuenta o usar Zancada, aceptás estos términos. Leelos con atención, especialmente el aviso sobre salud y entrenamiento.","summary_label":"En resumen","summary":["Hoy Zancada es gratuita. Al lanzarse en las tiendas de aplicaciones pasa a ser por suscripción, con 14 días de prueba gratis (sección 10).","Los planes y el coach con IA son orientativos, no reemplazan a un profesional de la salud. El test de nivel es un esfuerzo máximo.","Podés cancelar y borrar tus datos cuando quieras.","La app se ofrece \"tal cual\", sin garantía de disponibilidad ininterrumpida."],"sections":[{"h":"1. Descripción del servicio","p":["Zancada es una aplicación de entrenamiento para corredores: genera planes personalizados (por distancia o por tiempo), registra tus carreras, propone un test de nivel para calcular tus ritmos y zonas, sincroniza métricas con plataformas de terceros (Strava, Polar, Wahoo, COROS y Suunto) y ofrece a Zonda, un asistente virtual basado en Inteligencia Artificial, para responder tus dudas y ajustar tu plan."]},{"h":"2. Capacidad y cuenta","p":["Para usar Zancada tenés que tener capacidad legal para contratar. Zancada no está dirigida a menores de 16 años; entre los 16 y los 17 años solo podés usarla con la autorización expresa y la supervisión de tu madre, padre o tutor legal. Sos responsable de mantener la confidencialidad de tus credenciales de acceso y de toda la actividad que ocurra en tu cuenta."]},{"h":"3. Aviso importante sobre salud y entrenamiento","box":{"label":"Aviso","text":"Las sugerencias de Zonda (el coach de IA) y los planes generados por Zancada son orientativos, se generan de forma automatizada y están basados en principios generales de entrenamiento. Bajo ninguna circunstancia constituyen asesoramiento, diagnóstico o tratamiento médico, kinesiológico ni psicológico, y no reemplazan el consejo de un médico, kinesiólogo o entrenador certificado."},"p":["Correr y la actividad física implican riesgos inherentes para la salud, incluidas lesiones físicas o cardiovasculares. Consultá a un médico o profesional de la salud matriculado antes de empezar cualquier programa de entrenamiento, en especial antes de hacer el test de nivel (un esfuerzo máximo de 12 minutos), si tenés una condición preexistente, si sentís dolor agudo o si algo no se siente bien. Al usar Zancada declarás estar en condiciones físicas aptas y asumís la responsabilidad por tu decisión de entrenar y por cómo lo hacés."]},{"h":"4. Limitaciones de la Inteligencia Artificial","p":["Zancada usa un modelo de lenguaje de Inteligencia Artificial (operado por Anthropic) para dar vida a Zonda. Por la naturaleza de esta tecnología, el asistente puede dar respuestas inexactas, incompletas o que no se ajusten a tu situación física real. Aplicá siempre tu propio criterio y sentido común antes de hacer cualquier cambio en tu entrenamiento sugerido por la app."]},{"h":"5. Privacidad, datos sensibles y servicios de terceros","p":["Para funcionar, Zancada recopila información personal y datos de salud (métricas físicas y geolocalización, incluida la ubicación en segundo plano mientras registrás una carrera). Das tu consentimiento libre y expreso para ese tratamiento, en los términos de la Ley 25.326 y de nuestra <a href=\"/privacy.html\">Política de Privacidad<\/a>, que forma parte de estos términos.","Zancada se integra con servicios de terceros: Strava, Polar, Wahoo, COROS, Suunto, Google y Apple (inicio de sesión), Anthropic (el modelo de IA Claude que impulsa a Zonda), Supabase (base de datos), Firebase (notificaciones) y Sentry (monitoreo técnico de errores). El uso de cada integración también está sujeto a los términos propios de ese servicio. Al usar Zancada entendés y aceptás expresamente la transferencia internacional de tus datos a servidores ubicados fuera de tu país de residencia; Zancada trabaja con proveedores que ofrecen estándares de seguridad adecuados.","Tenés derecho al acceso, rectificación, supresión y portabilidad de tus datos, y podés pedir una copia de tu historial en un formato estructurado escribiendo a info@zancada.org. La Agencia de Acceso a la Información Pública (AAIP) de Argentina es el órgano de control de la Ley 25.326."]},{"h":"6. Uso aceptable y comportamiento","ul":["No uses Zancada para fines ilegales ni para dañar a otros usuarios o al servicio.","No intentes vulnerar la seguridad de la app ni acceder a datos que no te pertenecen.","No hagas ingeniería inversa ni descompilación del código, no extraigas datos de forma masiva (scraping) y no revendas el servicio sin autorización."],"p":["Zancada tiene tolerancia cero con el contenido abusivo, ofensivo o que incite al odio. Nos reservamos el derecho de eliminar cualquier contenido generado por usuarios y de suspender de inmediato las cuentas que publiquen material inapropiado."]},{"h":"7. Propiedad intelectual","p":["La marca \"Zancada\", sus logotipos, el diseño de la interfaz, los algoritmos y el código fuente son propiedad exclusiva de sus titulares y están protegidos por la Ley de Propiedad Intelectual (11.723) y la Ley de Marcas (22.362) de la República Argentina. Tus datos de entrenamiento te pertenecen por completo: Zancada solo tiene una licencia de uso para almacenarlos, procesarlos y brindarte el servicio."]},{"h":"8. Cancelación de la cuenta","p":["Podés pedir la eliminación definitiva de todos tus datos personales y tu historial cuando quieras desde Perfil → Borrar mis datos. Nos reservamos el derecho de suspender o eliminar, sin aviso previo, las cuentas que incumplan estos términos."]},{"h":"9. Limitación de responsabilidad","p":["Zancada se ofrece \"tal cual\" (as is) y \"según disponibilidad\". No garantizamos que la app esté libre de errores, de interrupciones técnicas o de fallos en la sincronización con plataformas de terceros. No nos hacemos responsables por pérdidas de información, por la imposibilidad de usar el servicio ni por lesiones, daños o perjuicios derivados del uso de la app o de seguir las recomendaciones del coach virtual — la decisión de entrenar, y cómo hacerlo, siempre es tuya. Esta limitación se aplica en la medida permitida por la ley y no afecta los derechos que la normativa de defensa del consumidor te reconozca."]},{"h":"10. Suscripciones, período de prueba y pagos","p":["Hoy Zancada es gratuita. Desde su lanzamiento en las tiendas de aplicaciones, opera bajo un modelo de suscripción, y podés acceder a todas las funciones durante un período de prueba gratuito inicial de catorce (14) días.","<strong>A. Período de prueba.<\/strong> Al iniciar la prueba, se te pide asociar un método de pago a través de tu cuenta de Apple App Store o de Google Play. No se realiza ningún cargo durante esos 14 días.","<strong>B. Facturación y renovación automática.<\/strong> Al terminar la prueba, la suscripción (mensual o anual) se renueva y se cobra automáticamente al método de pago asociado, salvo que la canceles al menos veinticuatro (24) horas antes de que termine el período en curso.","<strong>C. Cancelación.<\/strong> Podés cancelar la renovación automática en cualquier momento desde los ajustes de suscripciones de tu cuenta de Apple ID o de Google Play. Desinstalar la app o eliminar tu cuenta de Zancada (desde Perfil) no cancela automáticamente la suscripción gestionada por las tiendas.","<strong>D. Precios y reembolsos.<\/strong> Todos los pagos se procesan exclusivamente a través de Apple o Google y están sujetos a sus políticas de reembolso: Zancada no procesa pagos directos ni gestiona devoluciones. Nos reservamos el derecho de modificar los precios y te vamos a avisar con la debida anticipación."]},{"h":"11. Disposiciones para usuarios de iOS (Apple App Store)","p":["Si descargás Zancada desde la App Store, reconocés y aceptás que estos términos se celebran únicamente entre vos y Zancada, y no con Apple Inc. Zancada es la única responsable de la aplicación y de su contenido. Apple no tiene ninguna obligación de brindar servicios de mantenimiento ni soporte, ni es responsable de atender reclamos relacionados con la aplicación, incluidos los de responsabilidad por el producto, defensa del consumidor o infracción de propiedad intelectual. Cualquier reclamo sobre cargos, facturación o devoluciones de suscripciones hechas a través de la App Store debe gestionarse directamente con el soporte de Apple."]},{"h":"12. Cambios a estos términos","p":["Si hacemos cambios importantes, te lo vamos a avisar dentro de la app antes de que entren en vigencia."]},{"h":"13. Ley aplicable y jurisdicción","p":["Estos términos se rigen por las leyes de la República Argentina. Para cualquier controversia derivada del uso de la aplicación, las partes se someten a la jurisdicción de los Tribunales Ordinarios de la Ciudad Autónoma de Buenos Aires, renunciando a cualquier otro fuero que pudiera corresponder."]}],"h_contact":"Contacto","contact_q":"¿Preguntas sobre estos términos?","note":"Este documento fue redactado como una plantilla general para una app en desarrollo y no constituye asesoramiento legal. Antes de lanzar Zancada públicamente, te recomendamos que un abogado lo revise y lo adapte a las leyes de tu país."},"en":{"title":"Zancada — Terms and Conditions","back":"‹ Back to Zancada","updated":"Last updated: October 6, 2026","intro":"By creating an account or using Zancada, you agree to these terms. Read them carefully, especially the notice about health and training.","summary_label":"At a glance","summary":["Zancada is free today. Once launched on the app stores it becomes a subscription, with a 14-day free trial (section 10).","Plans and the AI coach are guidance, not a substitute for a health professional. The fitness test is a maximum effort.","You can cancel and delete your data whenever you want.","The app is provided \"as is,\" without a guarantee of uninterrupted availability."],"sections":[{"h":"1. Description of the service","p":["Zancada is a training app for runners: it generates personalized plans (by distance or by time), logs your runs, offers a fitness test to calculate your paces and zones, syncs metrics with third-party platforms (Strava, Polar, Wahoo, COROS and Suunto) and gives you Zonda, a virtual assistant based on Artificial Intelligence, to answer your questions and adjust your plan."]},{"h":"2. Capacity and account","p":["To use Zancada you must have legal capacity to enter into contracts. Zancada is not directed at anyone under 16; between 16 and 17 you may only use it with the express authorization and supervision of your parent or legal guardian. You are responsible for keeping your login credentials confidential and for all activity in your account."]},{"h":"3. Important health and training notice","box":{"label":"Notice","text":"The suggestions from Zonda (the AI coach) and the plans generated by Zancada are guidance, are generated automatically and are based on general training principles. Under no circumstances do they constitute medical, physiotherapy or psychological advice, diagnosis or treatment, and they do not replace the advice of a doctor, physiotherapist or certified coach."},"p":["Running and physical activity carry inherent health risks, including physical or cardiovascular injury. Consult a doctor or licensed health professional before starting any training program, especially before taking the fitness test (a maximum 12-minute effort), if you have a pre-existing condition, if you feel acute pain or if something doesn't feel right. By using Zancada you declare that you are physically fit and you take responsibility for your decision to train and for how you do it."]},{"h":"4. Limitations of Artificial Intelligence","p":["Zancada uses an Artificial Intelligence language model (operated by Anthropic) to power Zonda. Because of the nature of this technology, the assistant may give answers that are inaccurate, incomplete or unsuited to your real physical situation. Always use your own judgment and common sense before making any change to your training suggested by the app."]},{"h":"5. Privacy, sensitive data and third-party services","p":["To work, Zancada collects personal information and health data (physical metrics and geolocation, including background location while you record a run). You give your free and express consent to that processing, under Law 25,326 and our <a href=\"/privacy.html\">Privacy Policy<\/a>, which is part of these terms.","Zancada integrates with third-party services: Strava, Polar, Wahoo, COROS, Suunto, Google and Apple (sign-in), Anthropic (the Claude AI model that powers Zonda), Supabase (database), Firebase (notifications) and Sentry (technical error monitoring). Using each integration is also subject to that service's own terms. By using Zancada you understand and expressly accept the international transfer of your data to servers located outside your country of residence; Zancada works with providers that offer adequate security standards.","You have the right to access, correct, delete and port your data, and you can request a copy of your history in a structured format by writing to info@zancada.org. Argentina's Agency for Access to Public Information (AAIP) is the control body for Law 25,326."]},{"h":"6. Acceptable use and conduct","ul":["Don't use Zancada for illegal purposes or to harm other users or the service.","Don't try to breach the app's security or access data that isn't yours.","Don't reverse-engineer or decompile the code, don't extract data in bulk (scraping) and don't resell the service without authorization."],"p":["Zancada has zero tolerance for abusive, offensive or hateful content. We reserve the right to remove any user-generated content and to immediately suspend accounts that post inappropriate material."]},{"h":"7. Intellectual property","p":["The \"Zancada\" brand, its logos, interface design, algorithms and source code are the exclusive property of their owners and are protected by Argentina's Intellectual Property Law (11,723) and Trademark Law (22,362). Your training data belongs entirely to you: Zancada only holds a license to store and process it and provide you the service."]},{"h":"8. Account cancellation","p":["You can request the permanent deletion of all your personal data and history at any time from Profile → Delete my data. We reserve the right to suspend or delete, without prior notice, accounts that breach these terms."]},{"h":"9. Limitation of liability","p":["Zancada is provided \"as is\" and \"as available\". We do not guarantee that the app is free of errors, technical interruptions or failures syncing with third-party platforms. We are not liable for loss of information, for being unable to use the service, or for injuries, damages or harm arising from using the app or following the virtual coach's recommendations — the decision to train, and how, is always yours. This limitation applies to the extent permitted by law and does not affect the rights that consumer-protection law grants you."]},{"h":"10. Subscriptions, free trial and payments","p":["Zancada is free today. From its launch on the app stores, it operates under a subscription model, and you can access all features during an initial free trial of fourteen (14) days.","<strong>A. Free trial.<\/strong> When you start the trial, you are asked to link a payment method through your Apple App Store or Google Play account. No charge is made during those 14 days.","<strong>B. Billing and automatic renewal.<\/strong> When the trial ends, the subscription (monthly or annual) renews and is charged automatically to the linked payment method, unless you cancel at least twenty-four (24) hours before the current period ends.","<strong>C. Cancellation.<\/strong> You can cancel automatic renewal at any time from the subscription settings of your Apple ID or Google Play account. Uninstalling the app or deleting your Zancada account (from Profile) does not automatically cancel the subscription managed by the stores.","<strong>D. Prices and refunds.<\/strong> All payments are processed exclusively through Apple or Google and are subject to their refund policies: Zancada does not process direct payments or handle refunds. We reserve the right to change prices and will give you reasonable advance notice."]},{"h":"11. Provisions for iOS users (Apple App Store)","p":["If you download Zancada from the App Store, you acknowledge and agree that these terms are entered into solely between you and Zancada, and not with Apple Inc. Zancada is solely responsible for the application and its content. Apple has no obligation to provide maintenance or support services, nor is it responsible for handling claims related to the application, including product liability, consumer protection or intellectual-property infringement claims. Any claim about charges, billing or refunds for subscriptions made through the App Store must be handled directly with Apple support."]},{"h":"12. Changes to these terms","p":["If we make important changes, we will let you know inside the app before they take effect."]},{"h":"13. Governing law and jurisdiction","p":["These terms are governed by the laws of the Argentine Republic. For any dispute arising from the use of the application, the parties submit to the jurisdiction of the Ordinary Courts of the City of Buenos Aires, waiving any other jurisdiction that might apply."]}],"h_contact":"Contact","contact_q":"Questions about these terms?","note":"This document was written as a general template for an app in development and does not constitute legal advice. Before launching Zancada publicly, we recommend having a lawyer review it and adapt it to your country's laws."},"pt":{"title":"Zancada — Termos e Condições","back":"‹ Voltar para o Zancada","updated":"Última atualização: 6 de outubro de 2026","intro":"Ao criar uma conta ou usar o Zancada, você concorda com estes termos. Leia com atenção, especialmente o aviso sobre saúde e treino.","summary_label":"Resumo","summary":["Hoje o Zancada é gratuito. Ao ser lançado nas lojas de aplicativos, passa a ser por assinatura, com 14 dias de teste grátis (seção 10).","Os planos e o coach com IA são orientativos, não substituem um profissional de saúde. O teste de nível é um esforço máximo.","Você pode cancelar e apagar seus dados quando quiser.","O app é oferecido \"como está\", sem garantia de disponibilidade ininterrupta."],"sections":[{"h":"1. Descrição do serviço","p":["O Zancada é um aplicativo de treino para corredores: gera planos personalizados (por distância ou por tempo), registra suas corridas, propõe um teste de nível para calcular seus ritmos e zonas, sincroniza métricas com plataformas de terceiros (Strava, Polar, Wahoo, COROS e Suunto) e oferece o Zonda, um assistente virtual baseado em Inteligência Artificial, para responder suas dúvidas e ajustar seu plano."]},{"h":"2. Capacidade e conta","p":["Para usar o Zancada você precisa ter capacidade legal para contratar. O Zancada não é direcionado a menores de 16 anos; entre 16 e 17 anos você só pode usá-lo com a autorização expressa e a supervisão de seus pais ou responsável legal. Você é responsável por manter a confidencialidade das suas credenciais de acesso e por toda a atividade da sua conta."]},{"h":"3. Aviso importante sobre saúde e treino","box":{"label":"Aviso","text":"As sugestões do Zonda (o coach de IA) e os planos gerados pelo Zancada são orientativos, gerados de forma automatizada e baseados em princípios gerais de treinamento. Em nenhuma hipótese constituem aconselhamento, diagnóstico ou tratamento médico, fisioterapêutico ou psicológico, e não substituem o conselho de um médico, fisioterapeuta ou treinador certificado."},"p":["Correr e a atividade física envolvem riscos inerentes à saúde, incluindo lesões físicas ou cardiovasculares. Consulte um médico ou profissional de saúde habilitado antes de começar qualquer programa de treino, em especial antes de fazer o teste de nível (um esforço máximo de 12 minutos), se tiver uma condição preexistente, sentir dor aguda ou algo não parecer certo. Ao usar o Zancada você declara estar em condições físicas adequadas e assume a responsabilidade pela sua decisão de treinar e por como o faz."]},{"h":"4. Limitações da Inteligência Artificial","p":["O Zancada usa um modelo de linguagem de Inteligência Artificial (operado pela Anthropic) para dar vida ao Zonda. Pela natureza dessa tecnologia, o assistente pode dar respostas imprecisas, incompletas ou inadequadas à sua situação física real. Use sempre seu próprio critério e bom senso antes de fazer qualquer mudança no treino sugerida pelo app."]},{"h":"5. Privacidade, dados sensíveis e serviços de terceiros","p":["Para funcionar, o Zancada coleta informações pessoais e dados de saúde (métricas físicas e geolocalização, inclusive a localização em segundo plano enquanto você registra uma corrida). Você dá seu consentimento livre e expresso para esse tratamento, nos termos da Lei 25.326 e da nossa <a href=\"/privacy.html\">Política de Privacidade<\/a>, que faz parte destes termos.","O Zancada se integra com serviços de terceiros: Strava, Polar, Wahoo, COROS, Suunto, Google e Apple (login), Anthropic (o modelo de IA Claude que dá vida ao Zonda), Supabase (banco de dados), Firebase (notificações) e Sentry (monitoramento técnico de erros). O uso de cada integração também está sujeito aos termos próprios desse serviço. Ao usar o Zancada você entende e aceita expressamente a transferência internacional dos seus dados para servidores localizados fora do seu país de residência; o Zancada trabalha com provedores que oferecem padrões de segurança adequados.","Você tem direito a acesso, retificação, exclusão e portabilidade dos seus dados e pode pedir uma cópia do seu histórico em formato estruturado escrevendo para info@zancada.org. A Agência de Acesso à Informação Pública (AAIP) da Argentina é o órgão de controle da Lei 25.326."]},{"h":"6. Uso aceitável e conduta","ul":["Não use o Zancada para fins ilegais nem para prejudicar outros usuários ou o serviço.","Não tente violar a segurança do app nem acessar dados que não são seus.","Não faça engenharia reversa nem descompile o código, não extraia dados em massa (scraping) e não revenda o serviço sem autorização."],"p":["O Zancada tem tolerância zero com conteúdo abusivo, ofensivo ou que incite ao ódio. Reservamo-nos o direito de remover qualquer conteúdo gerado por usuários e de suspender imediatamente as contas que publiquem material inadequado."]},{"h":"7. Propriedade intelectual","p":["A marca \"Zancada\", seus logotipos, o design da interface, os algoritmos e o código-fonte são propriedade exclusiva de seus titulares e estão protegidos pela Lei de Propriedade Intelectual (11.723) e pela Lei de Marcas (22.362) da República Argentina. Seus dados de treino pertencem inteiramente a você: o Zancada tem apenas uma licença de uso para armazená-los, processá-los e oferecer o serviço."]},{"h":"8. Cancelamento da conta","p":["Você pode pedir a exclusão definitiva de todos os seus dados pessoais e histórico a qualquer momento em Perfil → Apagar meus dados. Reservamo-nos o direito de suspender ou excluir, sem aviso prévio, as contas que descumprirem estes termos."]},{"h":"9. Limitação de responsabilidade","p":["O Zancada é oferecido \"como está\" (as is) e \"conforme a disponibilidade\". Não garantimos que o app esteja livre de erros, interrupções técnicas ou falhas na sincronização com plataformas de terceiros. Não nos responsabilizamos por perda de informações, pela impossibilidade de usar o serviço nem por lesões, danos ou prejuízos decorrentes do uso do app ou de seguir as recomendações do coach virtual — a decisão de treinar, e como, é sempre sua. Esta limitação se aplica na medida permitida por lei e não afeta os direitos que a legislação de defesa do consumidor lhe garanta."]},{"h":"10. Assinaturas, período de teste e pagamentos","p":["Hoje o Zancada é gratuito. A partir do lançamento nas lojas de aplicativos, opera sob um modelo de assinatura, e você pode acessar todas as funções durante um período de teste gratuito inicial de quatorze (14) dias.","<strong>A. Período de teste.<\/strong> Ao iniciar o teste, você é solicitado a associar uma forma de pagamento pela sua conta da Apple App Store ou do Google Play. Nenhuma cobrança é feita durante esses 14 dias.","<strong>B. Cobrança e renovação automática.<\/strong> Ao fim do teste, a assinatura (mensal ou anual) é renovada e cobrada automaticamente na forma de pagamento associada, a menos que você a cancele com pelo menos vinte e quatro (24) horas de antecedência do fim do período em curso.","<strong>C. Cancelamento.<\/strong> Você pode cancelar a renovação automática a qualquer momento nos ajustes de assinaturas da sua conta Apple ID ou Google Play. Desinstalar o app ou excluir sua conta do Zancada (em Perfil) não cancela automaticamente a assinatura gerenciada pelas lojas.","<strong>D. Preços e reembolsos.<\/strong> Todos os pagamentos são processados exclusivamente pela Apple ou pelo Google e estão sujeitos às suas políticas de reembolso: o Zancada não processa pagamentos diretos nem gerencia devoluções. Reservamo-nos o direito de alterar os preços e avisaremos com a devida antecedência."]},{"h":"11. Disposições para usuários de iOS (Apple App Store)","p":["Se você baixar o Zancada pela App Store, reconhece e aceita que estes termos são celebrados somente entre você e o Zancada, e não com a Apple Inc. O Zancada é o único responsável pelo aplicativo e seu conteúdo. A Apple não tem nenhuma obrigação de prestar serviços de manutenção ou suporte, nem é responsável por atender reclamações relacionadas ao aplicativo, incluindo responsabilidade pelo produto, defesa do consumidor ou violação de propriedade intelectual. Qualquer reclamação sobre cobranças, faturamento ou reembolsos de assinaturas feitas pela App Store deve ser tratada diretamente com o suporte da Apple."]},{"h":"12. Mudanças nestes termos","p":["Se fizermos mudanças importantes, avisaremos dentro do app antes de entrarem em vigor."]},{"h":"13. Lei aplicável e jurisdição","p":["Estes termos são regidos pelas leis da República Argentina. Para qualquer controvérsia decorrente do uso do aplicativo, as partes se submetem à jurisdição dos Tribunais Ordinários da Cidade Autônoma de Buenos Aires, renunciando a qualquer outro foro que possa corresponder."]}],"h_contact":"Contato","contact_q":"Dúvidas sobre estes termos?","note":"Este documento foi redigido como um modelo geral para um app em desenvolvimento e não constitui aconselhamento jurídico. Antes de lançar o Zancada publicamente, recomendamos que um advogado o revise e o adapte às leis do seu país."},"fr":{"title":"Zancada — Conditions Générales","back":"‹ Retour à Zancada","updated":"Dernière mise à jour : 6 octobre 2026","intro":"En créant un compte ou en utilisant Zancada, tu acceptes ces conditions. Lis-les attentivement, surtout l'avis sur la santé et l'entraînement.","summary_label":"En bref","summary":["Zancada est gratuite aujourd'hui. Une fois lancée sur les boutiques d'applications, elle passe en abonnement, avec 14 jours d'essai gratuit (section 10).","Les plans et le coach IA sont indicatifs, ils ne remplacent pas un professionnel de santé. Le test de niveau est un effort maximal.","Tu peux annuler et supprimer tes données quand tu veux.","L'appli est fournie « telle quelle », sans garantie de disponibilité ininterrompue."],"sections":[{"h":"1. Description du service","p":["Zancada est une appli d'entraînement pour coureurs : elle génère des plans personnalisés (à la distance ou au temps), enregistre tes courses, propose un test de niveau pour calculer tes allures et tes zones, se synchronise avec des plateformes tierces (Strava, Polar, Wahoo, COROS et Suunto) et te propose Zonda, un assistant virtuel basé sur l'Intelligence Artificielle, pour répondre à tes questions et ajuster ton plan."]},{"h":"2. Capacité et compte","p":["Pour utiliser Zancada, tu dois avoir la capacité juridique de contracter. Zancada ne s'adresse pas aux moins de 16 ans ; entre 16 et 17 ans, tu ne peux l'utiliser qu'avec l'autorisation expresse et la supervision de ton parent ou tuteur légal. Tu es responsable de la confidentialité de tes identifiants et de toute l'activité de ton compte."]},{"h":"3. Avis important sur la santé et l'entraînement","box":{"label":"Avis","text":"Les suggestions de Zonda (le coach IA) et les plans générés par Zancada sont indicatifs, générés automatiquement et basés sur des principes généraux d'entraînement. Ils ne constituent en aucun cas un conseil, un diagnostic ou un traitement médical, kinésithérapique ou psychologique, et ne remplacent pas l'avis d'un médecin, d'un kinésithérapeute ou d'un entraîneur certifié."},"p":["Courir et pratiquer une activité physique comportent des risques inhérents pour la santé, notamment des blessures physiques ou cardiovasculaires. Consulte un médecin ou un professionnel de santé agréé avant de commencer tout programme d'entraînement, surtout avant de faire le test de niveau (un effort maximal de 12 minutes), si tu as une condition préexistante, si tu ressens une douleur aiguë ou si quelque chose ne va pas. En utilisant Zancada, tu déclares être en bonne condition physique et tu assumes la responsabilité de ta décision de t'entraîner et de la façon dont tu le fais."]},{"h":"4. Limites de l'Intelligence Artificielle","p":["Zancada utilise un modèle de langage d'Intelligence Artificielle (exploité par Anthropic) pour faire fonctionner Zonda. Par la nature de cette technologie, l'assistant peut donner des réponses inexactes, incomplètes ou inadaptées à ta situation physique réelle. Applique toujours ton propre jugement et ton bon sens avant de modifier ton entraînement sur la base d'une suggestion de l'appli."]},{"h":"5. Confidentialité, données sensibles et services tiers","p":["Pour fonctionner, Zancada collecte des informations personnelles et des données de santé (métriques physiques et géolocalisation, y compris la position en arrière-plan pendant que tu enregistres une course). Tu donnes ton consentement libre et exprès à ce traitement, au sens de la loi 25.326 et de notre <a href=\"/privacy.html\">Politique de Confidentialité<\/a>, qui fait partie de ces conditions.","Zancada s'intègre avec des services tiers : Strava, Polar, Wahoo, COROS, Suunto, Google et Apple (connexion), Anthropic (le modèle d'IA Claude qui fait fonctionner Zonda), Supabase (base de données), Firebase (notifications) et Sentry (suivi technique des erreurs). L'utilisation de chaque intégration est aussi soumise aux conditions propres de ce service. En utilisant Zancada, tu comprends et acceptes expressément le transfert international de tes données vers des serveurs situés hors de ton pays de résidence ; Zancada travaille avec des prestataires offrant des normes de sécurité adéquates.","Tu as le droit d'accéder à tes données, de les rectifier, de les supprimer et de les porter, et tu peux demander une copie de ton historique dans un format structuré en écrivant à info@zancada.org. L'Agence d'accès à l'information publique (AAIP) d'Argentine est l'organe de contrôle de la loi 25.326."]},{"h":"6. Utilisation acceptable et comportement","ul":["N'utilise pas Zancada à des fins illégales ni pour nuire à d'autres utilisateurs ou au service.","N'essaie pas de violer la sécurité de l'appli ni d'accéder à des données qui ne sont pas les tiennes.","Ne fais pas d'ingénierie inverse ni de décompilation du code, n'extrais pas de données en masse (scraping) et ne revends pas le service sans autorisation."],"p":["Zancada applique une tolérance zéro envers les contenus abusifs, offensants ou incitant à la haine. On se réserve le droit de supprimer tout contenu généré par les utilisateurs et de suspendre immédiatement les comptes qui publient du matériel inapproprié."]},{"h":"7. Propriété intellectuelle","p":["La marque « Zancada », ses logos, le design de l'interface, les algorithmes et le code source sont la propriété exclusive de leurs titulaires et sont protégés par la loi argentine sur la propriété intellectuelle (11.723) et la loi sur les marques (22.362). Tes données d'entraînement t'appartiennent entièrement : Zancada ne dispose que d'une licence d'utilisation pour les stocker, les traiter et te fournir le service."]},{"h":"8. Résiliation du compte","p":["Tu peux demander la suppression définitive de toutes tes données personnelles et de ton historique à tout moment depuis Profil → Supprimer mes données. On se réserve le droit de suspendre ou de supprimer, sans préavis, les comptes qui ne respectent pas ces conditions."]},{"h":"9. Limitation de responsabilité","p":["Zancada est fournie « telle quelle » (as is) et « selon disponibilité ». On ne garantit pas que l'appli soit exempte d'erreurs, d'interruptions techniques ou de défaillances de synchronisation avec des plateformes tierces. On n'est pas responsables des pertes d'informations, de l'impossibilité d'utiliser le service, ni des blessures, dommages ou préjudices résultant de l'utilisation de l'appli ou du suivi des recommandations du coach virtuel — la décision de t'entraîner, et comment, t'appartient toujours. Cette limitation s'applique dans la mesure permise par la loi et n'affecte pas les droits que la réglementation de protection des consommateurs te reconnaît."]},{"h":"10. Abonnements, période d'essai et paiements","p":["Zancada est gratuite aujourd'hui. À partir de son lancement sur les boutiques d'applications, elle fonctionne sous un modèle d'abonnement, et tu peux accéder à toutes les fonctions pendant une période d'essai gratuite initiale de quatorze (14) jours.","<strong>A. Période d'essai.<\/strong> Au début de l'essai, on te demande d'associer un moyen de paiement via ton compte Apple App Store ou Google Play. Aucun prélèvement n'a lieu pendant ces 14 jours.","<strong>B. Facturation et renouvellement automatique.<\/strong> À la fin de l'essai, l'abonnement (mensuel ou annuel) se renouvelle et est prélevé automatiquement sur le moyen de paiement associé, sauf si tu l'annules au moins vingt-quatre (24) heures avant la fin de la période en cours.","<strong>C. Annulation.<\/strong> Tu peux annuler le renouvellement automatique à tout moment depuis les réglages d'abonnements de ton compte Apple ID ou Google Play. Désinstaller l'appli ou supprimer ton compte Zancada (depuis Profil) n'annule pas automatiquement l'abonnement géré par les boutiques.","<strong>D. Prix et remboursements.<\/strong> Tous les paiements sont traités exclusivement par Apple ou Google et sont soumis à leurs politiques de remboursement : Zancada ne traite pas de paiements directs et ne gère pas les remboursements. On se réserve le droit de modifier les prix et on te préviendra avec un préavis raisonnable."]},{"h":"11. Dispositions pour les utilisateurs iOS (Apple App Store)","p":["Si tu télécharges Zancada depuis l'App Store, tu reconnais et acceptes que ces conditions sont conclues uniquement entre toi et Zancada, et non avec Apple Inc. Zancada est seule responsable de l'application et de son contenu. Apple n'a aucune obligation de fournir des services de maintenance ou d'assistance, ni de traiter les réclamations relatives à l'application, y compris en matière de responsabilité du fait des produits, de protection des consommateurs ou d'atteinte à la propriété intellectuelle. Toute réclamation relative aux prélèvements, à la facturation ou aux remboursements d'abonnements effectués via l'App Store doit être traitée directement auprès du support d'Apple."]},{"h":"12. Modifications de ces conditions","p":["Si on apporte des changements importants, on te le fera savoir dans l'appli avant leur entrée en vigueur."]},{"h":"13. Loi applicable et juridiction","p":["Ces conditions sont régies par les lois de la République argentine. Pour tout litige découlant de l'utilisation de l'application, les parties se soumettent à la juridiction des tribunaux ordinaires de la Ville autonome de Buenos Aires, en renonçant à tout autre for qui pourrait être compétent."]}],"h_contact":"Contact","contact_q":"Des questions sur ces conditions ?","note":"Ce document a été rédigé comme un modèle général pour une appli en développement et ne constitue pas un conseil juridique. Avant de lancer Zancada publiquement, on te recommande de le faire relire par un avocat et de l'adapter aux lois de ton pays."},"it":{"title":"Zancada — Termini e Condizioni","back":"‹ Torna a Zancada","updated":"Ultimo aggiornamento: 6 ottobre 2026","intro":"Creando un account o usando Zancada, accetti questi termini. Leggili con attenzione, in particolare l'avviso su salute e allenamento.","summary_label":"In breve","summary":["Oggi Zancada è gratuita. Al lancio sugli store di app diventa in abbonamento, con 14 giorni di prova gratuita (sezione 10).","I piani e il coach IA sono indicativi, non sostituiscono un professionista sanitario. Il test di livello è uno sforzo massimale.","Puoi annullare ed eliminare i tuoi dati quando vuoi.","L'app è fornita \"così com'è\", senza garanzia di disponibilità ininterrotta."],"sections":[{"h":"1. Descrizione del servizio","p":["Zancada è un'app di allenamento per corridori: genera piani personalizzati (a distanza o a tempo), registra le tue corse, propone un test di livello per calcolare ritmi e zone, si sincronizza con piattaforme di terze parti (Strava, Polar, Wahoo, COROS e Suunto) e ti offre Zonda, un assistente virtuale basato sull'Intelligenza Artificiale, per rispondere alle tue domande e adattare il tuo piano."]},{"h":"2. Capacità e account","p":["Per usare Zancada devi avere la capacità legale di stipulare contratti. Zancada non è rivolta a persone sotto i 16 anni; tra i 16 e i 17 anni puoi usarla solo con l'autorizzazione espressa e la supervisione di un genitore o tutore legale. Sei responsabile di mantenere riservate le tue credenziali e di tutta l'attività del tuo account."]},{"h":"3. Avviso importante su salute e allenamento","box":{"label":"Avviso","text":"I suggerimenti di Zonda (il coach IA) e i piani generati da Zancada sono indicativi, generati in modo automatizzato e basati su principi generali di allenamento. In nessun caso costituiscono consulenza, diagnosi o trattamento medico, fisioterapico o psicologico, e non sostituiscono il parere di un medico, fisioterapista o allenatore certificato."},"p":["Correre e l'attività fisica comportano rischi intrinseci per la salute, inclusi infortuni fisici o cardiovascolari. Consulta un medico o un professionista sanitario abilitato prima di iniziare qualsiasi programma di allenamento, in particolare prima di fare il test di livello (uno sforzo massimale di 12 minuti), se hai una condizione preesistente, avverti un dolore acuto o qualcosa non va. Usando Zancada dichiari di essere in condizioni fisiche idonee e ti assumi la responsabilità della tua decisione di allenarti e di come lo fai."]},{"h":"4. Limiti dell'Intelligenza Artificiale","p":["Zancada usa un modello linguistico di Intelligenza Artificiale (gestito da Anthropic) per far funzionare Zonda. Per la natura di questa tecnologia, l'assistente può dare risposte inesatte, incomplete o non adatte alla tua situazione fisica reale. Usa sempre il tuo giudizio e il buon senso prima di apportare qualsiasi modifica all'allenamento suggerita dall'app."]},{"h":"5. Privacy, dati sensibili e servizi di terze parti","p":["Per funzionare, Zancada raccoglie informazioni personali e dati di salute (metriche fisiche e geolocalizzazione, inclusa la posizione in background mentre registri una corsa). Dai il tuo consenso libero ed esplicito a tale trattamento, ai sensi della legge 25.326 e della nostra <a href=\"/privacy.html\">Informativa sulla Privacy<\/a>, che fa parte di questi termini.","Zancada si integra con servizi di terze parti: Strava, Polar, Wahoo, COROS, Suunto, Google e Apple (accesso), Anthropic (il modello di IA Claude che fa funzionare Zonda), Supabase (database), Firebase (notifiche) e Sentry (monitoraggio tecnico degli errori). L'uso di ciascuna integrazione è soggetto anche ai termini propri di quel servizio. Usando Zancada comprendi e accetti espressamente il trasferimento internazionale dei tuoi dati a server situati fuori dal tuo paese di residenza; Zancada lavora con fornitori che offrono standard di sicurezza adeguati.","Hai diritto di accesso, rettifica, cancellazione e portabilità dei tuoi dati e puoi chiedere una copia del tuo storico in formato strutturato scrivendo a info@zancada.org. L'Agenzia per l'accesso all'informazione pubblica (AAIP) argentina è l'organo di controllo della legge 25.326."]},{"h":"6. Uso consentito e comportamento","ul":["Non usare Zancada per scopi illegali né per danneggiare altri utenti o il servizio.","Non tentare di violare la sicurezza dell'app né di accedere a dati che non sono tuoi.","Non fare reverse engineering né decompilare il codice, non estrarre dati in massa (scraping) e non rivendere il servizio senza autorizzazione."],"p":["Zancada ha tolleranza zero verso contenuti offensivi, abusivi o che incitano all'odio. Ci riserviamo il diritto di rimuovere qualsiasi contenuto generato dagli utenti e di sospendere immediatamente gli account che pubblicano materiale inappropriato."]},{"h":"7. Proprietà intellettuale","p":["Il marchio \"Zancada\", i suoi loghi, il design dell'interfaccia, gli algoritmi e il codice sorgente sono di proprietà esclusiva dei rispettivi titolari e sono protetti dalla Legge sulla Proprietà Intellettuale (11.723) e dalla Legge sui Marchi (22.362) della Repubblica Argentina. I tuoi dati di allenamento appartengono interamente a te: Zancada ha solo una licenza d'uso per archiviarli, elaborarli e fornirti il servizio."]},{"h":"8. Cancellazione dell'account","p":["Puoi chiedere l'eliminazione definitiva di tutti i tuoi dati personali e dello storico in qualsiasi momento da Profilo → Elimina i miei dati. Ci riserviamo il diritto di sospendere o eliminare, senza preavviso, gli account che violano questi termini."]},{"h":"9. Limitazione di responsabilità","p":["Zancada è fornita \"così com'è\" (as is) e \"come disponibile\". Non garantiamo che l'app sia priva di errori, interruzioni tecniche o difetti di sincronizzazione con piattaforme di terze parti. Non siamo responsabili per perdite di informazioni, per l'impossibilità di usare il servizio né per infortuni, danni o pregiudizi derivanti dall'uso dell'app o dal seguire le raccomandazioni del coach virtuale — la decisione di allenarti, e come, è sempre tua. Questa limitazione si applica nella misura consentita dalla legge e non pregiudica i diritti che la normativa a tutela dei consumatori ti riconosce."]},{"h":"10. Abbonamenti, periodo di prova e pagamenti","p":["Oggi Zancada è gratuita. Dal lancio sugli store di app opera con un modello di abbonamento e puoi accedere a tutte le funzioni durante un periodo di prova gratuito iniziale di quattordici (14) giorni.","<strong>A. Periodo di prova.<\/strong> All'inizio della prova ti viene chiesto di associare un metodo di pagamento tramite il tuo account Apple App Store o Google Play. Non viene addebitato nulla durante quei 14 giorni.","<strong>B. Fatturazione e rinnovo automatico.<\/strong> Al termine della prova, l'abbonamento (mensile o annuale) si rinnova e viene addebitato automaticamente sul metodo di pagamento associato, a meno che tu non lo annulli almeno ventiquattro (24) ore prima della fine del periodo in corso.","<strong>C. Annullamento.<\/strong> Puoi annullare il rinnovo automatico in qualsiasi momento dalle impostazioni degli abbonamenti del tuo account Apple ID o Google Play. Disinstallare l'app o eliminare il tuo account Zancada (da Profilo) non annulla automaticamente l'abbonamento gestito dagli store.","<strong>D. Prezzi e rimborsi.<\/strong> Tutti i pagamenti sono elaborati esclusivamente tramite Apple o Google e sono soggetti alle loro politiche di rimborso: Zancada non elabora pagamenti diretti né gestisce resi. Ci riserviamo il diritto di modificare i prezzi e ti avviseremo con adeguato anticipo."]},{"h":"11. Disposizioni per gli utenti iOS (Apple App Store)","p":["Se scarichi Zancada dall'App Store, riconosci e accetti che questi termini sono stipulati solo tra te e Zancada, e non con Apple Inc. Zancada è l'unica responsabile dell'applicazione e del suo contenuto. Apple non ha alcun obbligo di fornire servizi di manutenzione o supporto, né è responsabile di gestire reclami relativi all'applicazione, inclusi quelli su responsabilità del prodotto, tutela dei consumatori o violazione della proprietà intellettuale. Qualsiasi reclamo su addebiti, fatturazione o rimborsi di abbonamenti effettuati tramite l'App Store deve essere gestito direttamente con il supporto Apple."]},{"h":"12. Modifiche a questi termini","p":["Se apportiamo modifiche importanti, te lo faremo sapere nell'app prima che entrino in vigore."]},{"h":"13. Legge applicabile e giurisdizione","p":["Questi termini sono regolati dalle leggi della Repubblica Argentina. Per qualsiasi controversia derivante dall'uso dell'applicazione, le parti si sottopongono alla giurisdizione dei Tribunali Ordinari della Città Autonoma di Buenos Aires, rinunciando a qualsiasi altro foro che potesse spettare."]}],"h_contact":"Contatto","contact_q":"Domande su questi termini?","note":"Questo documento è stato redatto come modello generale per un'app in sviluppo e non costituisce consulenza legale. Prima di lanciare Zancada pubblicamente, ti consigliamo di farlo revisionare da un avvocato e di adattarlo alle leggi del tuo paese."},"de":{"title":"Zancada — Allgemeine Geschäftsbedingungen","back":"‹ Zurück zu Zancada","updated":"Zuletzt aktualisiert: 6. Oktober 2026","intro":"Mit der Erstellung eines Kontos oder der Nutzung von Zancada akzeptierst du diese Bedingungen. Lies sie aufmerksam, besonders den Hinweis zu Gesundheit und Training.","summary_label":"Auf einen Blick","summary":["Zancada ist heute kostenlos. Mit dem Start in den App-Stores wird sie zum Abonnement, mit 14 Tagen kostenloser Testphase (Abschnitt 10).","Pläne und der KI-Coach sind Orientierungshilfen, kein Ersatz für eine medizinische Fachperson. Der Leistungstest ist eine maximale Belastung.","Du kannst jederzeit kündigen und deine Daten löschen.","Die App wird „wie besehen“ bereitgestellt, ohne Garantie unterbrechungsfreier Verfügbarkeit."],"sections":[{"h":"1. Beschreibung des Dienstes","p":["Zancada ist eine Trainings-App für Läufer: Sie erstellt personalisierte Pläne (nach Distanz oder Zeit), erfasst deine Läufe, bietet einen Leistungstest zur Berechnung deiner Tempi und Zonen, synchronisiert mit Plattformen von Drittanbietern (Strava, Polar, Wahoo, COROS und Suunto) und stellt dir Zonda, einen auf Künstlicher Intelligenz basierenden virtuellen Assistenten, zur Seite, der deine Fragen beantwortet und deinen Plan anpasst."]},{"h":"2. Geschäftsfähigkeit und Konto","p":["Um Zancada zu nutzen, musst du geschäftsfähig sein. Zancada richtet sich nicht an Personen unter 16 Jahren; zwischen 16 und 17 Jahren darfst du sie nur mit ausdrücklicher Zustimmung und unter Aufsicht deiner Eltern oder deines gesetzlichen Vertreters nutzen. Du bist dafür verantwortlich, deine Zugangsdaten geheim zu halten, und für jede Aktivität in deinem Konto."]},{"h":"3. Wichtiger Hinweis zu Gesundheit und Training","box":{"label":"Hinweis","text":"Die Vorschläge von Zonda (dem KI-Coach) und die von Zancada erstellten Pläne sind Orientierungshilfen, werden automatisiert erzeugt und basieren auf allgemeinen Trainingsprinzipien. Sie stellen unter keinen Umständen ärztliche, physiotherapeutische oder psychologische Beratung, Diagnose oder Behandlung dar und ersetzen nicht den Rat eines Arztes, Physiotherapeuten oder zertifizierten Trainers."},"p":["Laufen und körperliche Aktivität bergen inhärente Gesundheitsrisiken, einschließlich körperlicher oder kardiovaskulärer Verletzungen. Wende dich an einen Arzt oder approbierte medizinische Fachperson, bevor du ein Trainingsprogramm beginnst, besonders vor dem Leistungstest (eine maximale Belastung von 12 Minuten), wenn du eine bestehende Erkrankung hast, akute Schmerzen spürst oder sich etwas nicht richtig anfühlt. Mit der Nutzung von Zancada erklärst du, körperlich geeignet zu sein, und übernimmst die Verantwortung für deine Entscheidung zu trainieren und dafür, wie du es tust."]},{"h":"4. Grenzen der Künstlichen Intelligenz","p":["Zancada nutzt ein KI-Sprachmodell (betrieben von Anthropic), um Zonda zu betreiben. Aufgrund der Natur dieser Technologie kann der Assistent ungenaue, unvollständige oder auf deine tatsächliche körperliche Situation nicht passende Antworten geben. Nutze immer dein eigenes Urteil und deinen gesunden Menschenverstand, bevor du eine von der App vorgeschlagene Änderung an deinem Training vornimmst."]},{"h":"5. Datenschutz, sensible Daten und Dienste von Drittanbietern","p":["Um zu funktionieren, erhebt Zancada personenbezogene Informationen und Gesundheitsdaten (körperliche Messwerte und Geolokalisierung, einschließlich des Standorts im Hintergrund, während du einen Lauf aufzeichnest). Du erteilst deine freie und ausdrückliche Einwilligung zu dieser Verarbeitung, gemäß Gesetz 25.326 und unserer <a href=\"/privacy.html\">Datenschutzerklärung<\/a>, die Teil dieser Bedingungen ist.","Zancada bindet Dienste von Drittanbietern ein: Strava, Polar, Wahoo, COROS, Suunto, Google und Apple (Anmeldung), Anthropic (das KI-Modell Claude, das Zonda antreibt), Supabase (Datenbank), Firebase (Benachrichtigungen) und Sentry (technisches Fehlermonitoring). Die Nutzung jeder Integration unterliegt auch den eigenen Bedingungen des jeweiligen Dienstes. Mit der Nutzung von Zancada verstehst du die internationale Übermittlung deiner Daten an Server außerhalb deines Wohnsitzlandes und akzeptierst sie ausdrücklich; Zancada arbeitet mit Anbietern, die angemessene Sicherheitsstandards bieten.","Du hast das Recht auf Auskunft, Berichtigung, Löschung und Übertragbarkeit deiner Daten und kannst eine Kopie deines Verlaufs in strukturiertem Format anfordern, indem du an info@zancada.org schreibst. Die argentinische Behörde für Zugang zu öffentlichen Informationen (AAIP) ist das Kontrollorgan des Gesetzes 25.326."]},{"h":"6. Zulässige Nutzung und Verhalten","ul":["Nutze Zancada nicht für illegale Zwecke oder um anderen Nutzern oder dem Dienst zu schaden.","Versuche nicht, die Sicherheit der App zu umgehen oder auf Daten zuzugreifen, die dir nicht gehören.","Führe kein Reverse Engineering oder Dekompilieren des Codes durch, extrahiere keine Daten massenhaft (Scraping) und verkaufe den Dienst nicht ohne Genehmigung weiter."],"p":["Zancada hat null Toleranz gegenüber missbräuchlichen, beleidigenden oder zu Hass aufstachelnden Inhalten. Wir behalten uns das Recht vor, nutzergenerierte Inhalte zu entfernen und Konten, die unangemessenes Material veröffentlichen, sofort zu sperren."]},{"h":"7. Geistiges Eigentum","p":["Die Marke „Zancada“, ihre Logos, das Interface-Design, die Algorithmen und der Quellcode sind ausschließliches Eigentum ihrer Inhaber und durch das argentinische Gesetz über geistiges Eigentum (11.723) und das Markengesetz (22.362) geschützt. Deine Trainingsdaten gehören vollständig dir: Zancada hat lediglich eine Nutzungslizenz, um sie zu speichern, zu verarbeiten und dir den Dienst bereitzustellen."]},{"h":"8. Kündigung des Kontos","p":["Du kannst jederzeit die endgültige Löschung aller deiner personenbezogenen Daten und deines Verlaufs beantragen unter Profil → Meine Daten löschen. Wir behalten uns vor, Konten, die gegen diese Bedingungen verstoßen, ohne Vorankündigung zu sperren oder zu löschen."]},{"h":"9. Haftungsbeschränkung","p":["Zancada wird „wie besehen“ (as is) und „nach Verfügbarkeit“ bereitgestellt. Wir garantieren nicht, dass die App frei von Fehlern, technischen Unterbrechungen oder Synchronisierungsfehlern mit Plattformen von Drittanbietern ist. Wir haften nicht für Informationsverluste, die Unmöglichkeit der Nutzung des Dienstes oder für Verletzungen, Schäden oder Nachteile, die durch die Nutzung der App oder das Befolgen der Empfehlungen des virtuellen Coaches entstehen — die Entscheidung zu trainieren, und wie, liegt immer bei dir. Diese Beschränkung gilt, soweit gesetzlich zulässig, und berührt nicht die Rechte, die dir das Verbraucherschutzrecht gewährt."]},{"h":"10. Abonnements, Testphase und Zahlungen","p":["Zancada ist heute kostenlos. Ab dem Start in den App-Stores arbeitet sie mit einem Abonnementmodell, und du kannst während einer anfänglichen kostenlosen Testphase von vierzehn (14) Tagen auf alle Funktionen zugreifen.","<strong>A. Testphase.<\/strong> Zu Beginn der Testphase wirst du gebeten, über dein Apple-App-Store- oder Google-Play-Konto eine Zahlungsmethode zu hinterlegen. Während dieser 14 Tage wird nichts abgebucht.","<strong>B. Abrechnung und automatische Verlängerung.<\/strong> Nach Ende der Testphase verlängert sich das Abonnement (monatlich oder jährlich) und wird automatisch von der hinterlegten Zahlungsmethode abgebucht, es sei denn, du kündigst mindestens vierundzwanzig (24) Stunden vor Ende des laufenden Zeitraums.","<strong>C. Kündigung.<\/strong> Du kannst die automatische Verlängerung jederzeit in den Abonnementeinstellungen deiner Apple-ID oder deines Google-Play-Kontos kündigen. Das Deinstallieren der App oder das Löschen deines Zancada-Kontos (unter Profil) kündigt das von den Stores verwaltete Abonnement nicht automatisch.","<strong>D. Preise und Erstattungen.<\/strong> Alle Zahlungen werden ausschließlich über Apple oder Google abgewickelt und unterliegen deren Erstattungsrichtlinien: Zancada wickelt keine direkten Zahlungen ab und bearbeitet keine Rückerstattungen. Wir behalten uns vor, Preise zu ändern, und informieren dich rechtzeitig."]},{"h":"11. Bestimmungen für iOS-Nutzer (Apple App Store)","p":["Wenn du Zancada aus dem App Store lädst, erkennst du an und akzeptierst, dass diese Bedingungen ausschließlich zwischen dir und Zancada geschlossen werden, nicht mit Apple Inc. Zancada ist allein für die Anwendung und ihre Inhalte verantwortlich. Apple ist nicht verpflichtet, Wartungs- oder Supportleistungen zu erbringen, und ist nicht für die Bearbeitung von Ansprüchen im Zusammenhang mit der Anwendung zuständig, einschließlich Produkthaftung, Verbraucherschutz oder Verletzung geistigen Eigentums. Ansprüche zu Abbuchungen, Abrechnung oder Erstattungen von Abonnements über den App Store sind direkt beim Apple-Support geltend zu machen."]},{"h":"12. Änderungen dieser Bedingungen","p":["Wenn wir wichtige Änderungen vornehmen, informieren wir dich in der App, bevor sie in Kraft treten."]},{"h":"13. Anwendbares Recht und Gerichtsstand","p":["Diese Bedingungen unterliegen den Gesetzen der Argentinischen Republik. Für Streitigkeiten aus der Nutzung der Anwendung unterwerfen sich die Parteien der Zuständigkeit der ordentlichen Gerichte der Autonomen Stadt Buenos Aires und verzichten auf jeden anderen Gerichtsstand, der in Betracht kommen könnte."]}],"h_contact":"Kontakt","contact_q":"Fragen zu diesen Bedingungen?","note":"Dieses Dokument wurde als allgemeine Vorlage für eine App in Entwicklung verfasst und stellt keine Rechtsberatung dar. Bevor du Zancada öffentlich veröffentlichst, empfehlen wir, es von einem Anwalt prüfen und an die Gesetze deines Landes anpassen zu lassen."}};
const LANG_LABELS = {es:'ES', en:'EN', pt:'PT', fr:'FR', it:'IT', de:'DE'};
const LANG_NAMES = {es:'es', en:'en-US', pt:'pt-BR', fr:'fr', it:'it', de:'de'};

function detectLang(){
  const url = new URL(window.location.href);
  const q = url.searchParams.get('lang');
  if(q && L[q]) return q;
  try{
    const saved = localStorage.getItem('zancada_legal_lang');
    if(saved && L[saved]) return saved;
  }catch(e){}
  const nav = (navigator.language || 'es').slice(0,2).toLowerCase();
  if(L[nav]) return nav;
  return 'es';
}

// Cada documento es una lista de secciones: título, párrafos, lista, recuadro de aviso o recuadro "a completar".
// El texto es propio (no viene de usuarios), por eso se arma con innerHTML para poder usar <strong> y <a>.
function renderSection(s){
  let html = '<h2>' + s.h + '</h2>';
  if(s.ph) html += '<div class="placeholder-box"><p>' + s.ph + '</p></div>';
  (s.p || []).forEach(t => { html += '<p>' + t + '</p>'; });
  if(s.ul) html += '<ul>' + s.ul.map(i => '<li>' + i + '</li>').join('') + '</ul>';
  if(s.box) html += '<div class="health-box"><p class="health-label">' + s.box.label + '</p><p>' + s.box.text + '</p></div>';
  return html;
}

function render(code){
  const d = L[code];
  document.documentElement.lang = LANG_NAMES[code] || code;
  document.getElementById('page-title').textContent = d.title;
  document.getElementById('back-link').textContent = d.back;
  document.getElementById('t-title').textContent = d.title.replace(/^Zancada\s*—\s*/, '');
  document.getElementById('t-updated').textContent = d.updated;
  document.getElementById('t-intro').textContent = d.intro;
  document.getElementById('t-summary-label').textContent = d.summary_label;
  document.getElementById('t-summary').innerHTML = d.summary.map(item=>'<li>' + item + '</li>').join('');
  document.getElementById('t-sections').innerHTML = d.sections.map(renderSection).join('');
  document.getElementById('t-h-contact').textContent = d.h_contact;
  document.getElementById('t-contact-q').textContent = d.contact_q;
  document.getElementById('t-note').textContent = d.note;
  document.querySelectorAll('.lang-pill').forEach(p=>p.classList.toggle('active', p.dataset.v===code));
  try{ localStorage.setItem('zancada_legal_lang', code); }catch(e){}
}

const langRow = document.getElementById('lang-row');
Object.keys(LANG_LABELS).forEach(code=>{
  const el = document.createElement('div');
  el.className = 'lang-pill';
  el.dataset.v = code;
  el.textContent = LANG_LABELS[code];
  el.onclick = ()=>render(code);
  langRow.appendChild(el);
});

render(detectLang());
</script>
