 fue redactado como una plantilla general para una app en desarrollo y no constituye asesoramiento legal. Antes de lanzar Zancada públicamente, te recomendamos que un abogado lo revise y lo adapte a las leyes de tu país."},"en":{"title":"Zancada — Terms and Conditions","back":"‹ Back to Zancada","updated":"Last updated: October 6, 2026","intro":"By creating an account or using Zancada, you agree to these terms. Read them carefully, especially the note about health and training.","summary_label":"At a glance","summary":["Zancada is free today — no payments or subscriptions.","Plans and the AI coach are guidance, not a substitute for a health professional.","You can cancel and delete your data whenever you want.","The app is provided \"as is,\" without a guarantee of uninterrupted availability."],"h1":"1. Description of the service","h1_text":"Zancada is a training app for runners: it generates personalized plans, logs your runs, syncs with Strava, Polar, Wahoo, and COROS, Suunto, and gives you Zonda, the AI coach, to answer your questions and adjust your plan.","h2":"2. Your account","h2_text":"You're responsible for keeping your password confidential and for all activity on your account. Zancada is not directed at anyone under 16.","h3":"3. Important health and training notice","h3_label":"Notice","h3_box":"The suggestions from Zonda (the AI coach) and the plans generated by Zancada are guidance based on general training principles. They do not replace the advice of a doctor, physiotherapist, or certified coach. Consult a health professional before starting any training program, especially if you have a pre-existing condition, feel acute pain, or something doesn't feel right. You use the app and its recommendations at your own discretion and responsibility.","h4":"4. Acceptable use","h4_items":["Don't use Zancada for illegal purposes or to harm other users or the service.","Don't try to breach the app's security or access data that isn't yours.","Don't reverse-engineer the code or resell the service without authorization."],"h5":"5. Third-party services","h5_text":"Zancada integrates with Strava, Polar, Wahoo, COROS, Suunto, Google (for sign-in), Anthropic (the Claude AI model that powers Zonda), and Sentry (technical error monitoring) to work. Using those integrations is also subject to each of those services' own terms.","h6":"6. Intellectual property","h6_text":"Zancada's name, brand, and design belong to us. Your training data is yours — we only store and process it to provide you the service.","h7":"7. Cancellation","h7_text":"You can stop using Zancada and delete all your data whenever you want from Profile → Delete my data. We reserve the right to suspend accounts that violate these terms.","h8":"8. Limitation of liability","h8_text":"Zancada is provided \"as is,\" without guarantees of uninterrupted availability. We're not liable for injuries, damages, or harm arising from using the app or following the virtual coach's recommendations — the decision to train, and how, is always yours.","h9":"9. Changes to these terms","h9_text":"If we make an important change, we'll let you know inside the app.","h10":"10. Free service (for now)","h10_text":"Zancada is currently free, with no paid features. If we introduce subscriptions, in-app purchases, or any other form of payment in the future, we'll update these terms and include a clear refund policy before enabling any charge — you'll never be charged without these terms reflecting it first.","h11":"11. Governing law and jurisdiction","h11_text":"[To complete before publishing the app: which law governs these terms and which courts handle any dispute. This depends on the legal structure you operate under (individual or registered company) — pending reminder before launch.]","h_contact":"Contact","contact_q":"Questions about these terms?","note":"This document was written as a general template for an app in development and does not constitute legal advice. Before launching Zancada publicly, we recommend having a lawyer review it and adapt it to your country's laws."},"pt":{"title":"Zancada — Termos e Condições","back":"‹ Voltar para o Zancada","updated":"Última atualização: 6 de outubro de 2026","intro":"Ao criar uma conta ou usar o Zancada, você concorda com estes termos. Leia com atenção, especialmente o aviso sobre saúde e treino.","summary_label":"Resumo","summary":["O Zancada é gratuito hoje — sem pagamentos nem assinaturas.","Os planos e o coach com IA são orientativos, não substituem um profissional de saúde.","Você pode cancelar e apagar seus dados quando quiser.","O app é oferecido \"como está\", sem garantia de disponibilidade ininterrupta."],"h1":"1. Descrição do serviço","h1_text":"O Zancada é um app de treino para corredores: gera planos personalizados, registra suas corridas, sincroniza com Strava, Polar, Wahoo e COROS, Suunto, e oferece o Zonda (o coach de IA) para responder suas dúvidas e ajustar seu plano.","h2":"2. Sua conta","h2_text":"Você é responsável por manter a confidencialidade da sua senha e por toda atividade que ocorrer na sua conta. O Zancada não é direcionado a menores de 16 anos.","h3":"3. Aviso importante sobre saúde e treino","h3_label":"Aviso","h3_box":"As sugestões do Zonda (o coach de IA) e os planos gerados pelo Zancada são orientativos e baseados em princípios gerais de treinamento. Eles não substituem o conselho de um médico, fisioterapeuta ou treinador certificado. Consulte um profissional de saúde antes de começar qualquer programa de treino, especialmente se você tiver uma condição preexistente, sentir dor aguda ou algo não parecer certo. Você usa o app e suas recomendações por sua própria conta e risco.","h4":"4. Uso aceitável","h4_items":["Não use o Zancada para fins ilegais nem para prejudicar outros usuários ou o serviço.","Não tente violar a segurança do app nem acessar dados que não são seus.","Não faça engenharia reversa do código nem revenda o serviço sem autorização."],"h5":"5. Serviços de terceiros","h5_text":"O Zancada se integra com Strava, Polar, Wahoo, COROS, Suunto, Google (para login), Anthropic (o modelo de IA Claude que dá vida ao Zonda) e Sentry (monitoramento técnico de erros) para funcionar. O uso dessas integrações também está sujeito aos próprios termos de cada um desses serviços.","h6":"6. Propriedade intelectual","h6_text":"O nome, a marca e o design do Zancada nos pertencem. Seus dados de treino são seus — nós apenas os armazenamos e processamos para poder oferecer o serviço.","h7":"7. Cancelamento","h7_text":"Você pode parar de usar o Zancada e apagar todos os seus dados quando quiser em Perfil → Apagar meus dados. Reservamo-nos o direito de suspender contas que violem estes termos.","h8":"8. Limitação de responsabilidade","h8_text":"O Zancada é oferecido \"como está\", sem garantias de disponibilidade ininterrupta. Não nos responsabilizamos por lesões, danos ou prejuízos decorrentes do uso do app ou de seguir as recomendações do coach virtual — a decisão de treinar, e como fazê-lo, é sempre sua.","h9":"9. Mudanças nestes termos","h9_text":"Se fizermos uma mudança importante, vamos avisar dentro do app.","h10":"10. Serviço gratuito (por enquanto)","h10_text":"O Zancada é gratuito no momento, sem nenhuma função paga. Se no futuro incluirmos assinaturas, compras dentro do app ou outra forma de pagamento, vamos atualizar estes termos e incluir uma política de reembolso clara antes de habilitar qualquer cobrança — você nunca será cobrado sem que estes termos reflitam isso antes.","h11":"11. Lei aplicável e jurisdição","h11_text":"[A completar antes de publicar o app: sob qual legislação estes termos se regem e perante quais tribunais qualquer disputa é resolvida. Depende da estrutura legal em que você opera (pessoa física ou empresa registrada) — lembrete pendente antes do lançamento.]","h_contact":"Contato","contact_q":"Dúvidas sobre estes termos?","note":"Este documento foi redigido como um modelo geral para um app em desenvolvimento e não constitui aconselhamento jurídico. Antes de lançar o Zancada publicamente, recomendamos que um advogado o revise e o adapte às leis do seu país."},"fr":{"title":"Zancada — Conditions Générales","back":"‹ Retour à Zancada","updated":"Dernière mise à jour : 6 octobre 2026","intro":"En créant un compte ou en utilisant Zancada, tu acceptes ces conditions. Lis-les attentivement, surtout la remarque sur la santé et l'entraînement.","summary_label":"En bref","summary":["Zancada est gratuite aujourd'hui — aucun paiement ni abonnement.","Les plans et le coach IA sont indicatifs, ils ne remplacent pas un professionnel de santé.","Tu peux annuler et supprimer tes données quand tu veux.","L'appli est fournie « telle quelle », sans garantie de disponibilité ininterrompue."],"h1":"1. Description du service","h1_text":"Zancada est une appli d'entraînement pour coureurs : elle génère des plans personnalisés, enregistre tes courses, se synchronise avec Strava, Polar, Wahoo et COROS, Suunto, et te propose Zonda, le coach IA, pour répondre à tes questions et ajuster ton plan.","h2":"2. Ton compte","h2_text":"Tu es responsable de garder ton mot de passe confidentiel et de toute activité sur ton compte. Zancada ne s'adresse pas aux moins de 16 ans.","h3":"3. Avis important sur la santé et l'entraînement","h3_label":"Avis","h3_box":"Les suggestions de Zonda (le coach IA) et les plans générés par Zancada sont indicatifs et basés sur des principes généraux d'entraînement. Ils ne remplacent pas l'avis d'un médecin, kinésithérapeute ou entraîneur certifié. Consulte un professionnel de santé avant de commencer tout programme d'entraînement, surtout si tu as une condition préexistante, si tu ressens une douleur aiguë ou si quelque chose ne va pas. Tu utilises l'appli et ses recommandations à ta propre appréciation et sous ta propre responsabilité.","h4":"4. Utilisation acceptable","h4_items":["N'utilise pas Zancada à des fins illégales ni pour nuire à d'autres utilisateurs ou au service.","N'essaie pas de violer la sécurité de l'appli ni d'accéder à des données qui ne sont pas les tiennes.","Ne fais pas d'ingénierie inverse du code ni ne revends le service sans autorisation."],"h5":"5. Services tiers","h5_text":"Zancada s'intègre avec Strava, Polar, Wahoo, COROS, Suunto, Google (pour la connexion), Anthropic (le modèle d'IA Claude qui fait fonctionner Zonda) et Sentry (suivi technique des erreurs) pour fonctionner. L'utilisation de ces intégrations est aussi soumise aux propres conditions de chacun de ces services.","h6":"6. Propriété intellectuelle","h6_text":"Le nom, la marque et le design de Zancada nous appartiennent. Tes données d'entraînement sont les tiennes — on les stocke et les traite uniquement pour te fournir le service.","h7":"7. Résiliation","h7_text":"Tu peux arrêter d'utiliser Zancada et supprimer toutes tes données quand tu veux depuis Profil → Supprimer mes données. On se réserve le droit de suspendre les comptes qui violent ces conditions.","h8":"8. Limitation de responsabilité","h8_text":"Zancada est fourni « tel quel », sans garantie de disponibilité ininterrompue. On n'est pas responsables des blessures, dommages ou préjudices résultant de l'utilisation de l'appli ou du suivi des recommandations du coach virtuel — la décision de s'entraîner, et comment, t'appartient toujours.","h9":"9. Changements de ces conditions","h9_text":"Si on fait un changement important, on te le fera savoir dans l'appli.","h10":"10. Service gratuit (pour l'instant)","h10_text":"Zancada est gratuite actuellement, sans aucune fonctionnalité payante. Si on introduit un jour des abonnements, des achats intégrés ou toute autre forme de paiement, on mettra à jour ces conditions et on inclura une politique de remboursement claire avant d'activer un quelconque paiement — tu ne seras jamais facturé sans que ces conditions ne le reflètent d'abord.","h11":"11. Loi applicable et juridiction","h11_text":"[À compléter avant la publication de l'appli : sous quelle législation ces conditions sont régies et devant quels tribunaux tout litige est réglé. Cela dépend de la structure légale sous laquelle tu opères (personne physique ou société enregistrée) — rappel en attente avant le lancement.]","h_contact":"Contact","contact_q":"Des questions sur ces conditions ?","note":"Ce document a été rédigé comme un modèle général pour une appli en développement et ne constitue pas un conseil juridique. Avant de lancer Zancada publiquement, on te recommande de le faire relire par un avocat et de l'adapter aux lois de ton pays."},"it":{"title":"Zancada — Termini e Condizioni","back":"‹ Torna a Zancada","updated":"Ultimo aggiornamento: 6 ottobre 2026","intro":"Creando un account o usando Zancada, accetti questi termini. Leggili con attenzione, in particolare l'avviso su salute e allenamento.","summary_label":"In breve","summary":["Zancada è gratuita oggi — nessun pagamento né abbonamento.","I piani e il coach IA sono indicativi, non sostituiscono un professionista sanitario.","Puoi annullare ed eliminare i tuoi dati quando vuoi.","L'app è fornita \"così com'è\", senza garanzia di disponibilità ininterrotta."],"h1":"1. Descrizione del servizio","h1_text":"Zancada è un'app di allenamento per corridori: genera piani personalizzati, registra le tue corse, si sincronizza con Strava, Polar, Wahoo e COROS, Suunto, e ti offre Zonda, il coach IA, per rispondere alle tue domande e adattare il tuo piano.","h2":"2. Il tuo account","h2_text":"Sei responsabile di mantenere riservata la tua password e di tutta l'attività sul tuo account. Zancada non è rivolta a persone sotto i 16 anni.","h3":"3. Avviso importante su salute e allenamento","h3_label":"Avviso","h3_box":"I suggerimenti di Zonda (il coach IA) e i piani generati da Zancada sono indicativi e basati su principi generali di allenamento. Non sostituiscono il consiglio di un medico, fisioterapista o allenatore certificato. Consulta un professionista sanitario prima di iniziare qualsiasi programma di allenamento, specialmente se hai una condizione preesistente, senti un dolore acuto o qualcosa non ti convince. Usi l'app e le sue raccomandazioni a tuo giudizio e sotto la tua responsabilità.","h4":"4. Uso consentito","h4_items":["Non usare Zancada per scopi illegali né per danneggiare altri utenti o il servizio.","Non provare a violare la sicurezza dell'app né ad accedere a dati che non sono tuoi.","Non fare reverse engineering del codice né rivendere il servizio senza autorizzazione."],"h5":"5. Servizi di terze parti","h5_text":"Zancada si integra con Strava, Polar, Wahoo, COROS, Suunto, Google (per l'accesso), Anthropic (il modello di IA Claude che fa funzionare Zonda) e Sentry (monitoraggio tecnico degli errori) per funzionare. L'uso di queste integrazioni è anche soggetto ai termini propri di ciascuno di questi servizi.","h6":"6. Proprietà intellettuale","h6_text":"Il nome, il marchio e il design di Zancada ci appartengono. I tuoi dati di allenamento sono tuoi — noi li archiviamo ed elaboriamo solo per offrirti il servizio.","h7":"7. Cancellazione","h7_text":"Puoi smettere di usare Zancada ed eliminare tutti i tuoi dati quando vuoi da Profilo → Elimina i miei dati. Ci riserviamo il diritto di sospendere account che violano questi termini.","h8":"8. Limitazione di responsabilità","h8_text":"Zancada viene fornita \"così com'è\", senza garanzie di disponibilità ininterrotta. Non siamo responsabili per infortuni, danni o pregiudizi derivanti dall'uso dell'app o dal seguire le raccomandazioni del coach virtuale — la decisione di allenarti, e come farlo, è sempre tua.","h9":"9. Modifiche a questi termini","h9_text":"Se apportiamo una modifica importante, te lo faremo sapere nell'app.","h10":"10. Servizio gratuito (per ora)","h10_text":"Zancada è attualmente gratuita, senza alcuna funzione a pagamento. Se in futuro introdurremo abbonamenti, acquisti in-app o qualsiasi altra forma di pagamento, aggiorneremo questi termini e includeremo una chiara politica di rimborso prima di attivare qualsiasi addebito — non ti verrà mai addebitato nulla senza che questi termini lo riflettano prima.","h11":"11. Legge applicabile e giurisdizione","h11_text":"[Da completare prima della pubblicazione dell'app: sotto quale legislazione sono regolati questi termini e presso quali tribunali si risolve qualsiasi controversia. Dipende dalla struttura legale con cui operi (persona fisica o società registrata) — promemoria in sospeso prima del lancio.]","h_contact":"Contatto","contact_q":"Domande su questi termini?","note":"Questo documento è stato redatto come modello generale per un'app in sviluppo e non costituisce consulenza legale. Prima di lanciare Zancada pubblicamente, ti consigliamo di farlo revisionare da un avvocato e di adattarlo alle leggi del tuo paese."},"de":{"title":"Zancada — Allgemeine Geschäftsbedingungen","back":"‹ Zurück zu Zancada","updated":"Zuletzt aktualisiert: 6. Oktober 2026","intro":"Mit der Erstellung eines Kontos oder der Nutzung von Zancada akzeptierst du diese Bedingungen. Lies sie aufmerksam, besonders den Hinweis zu Gesundheit und Training.","summary_label":"Auf einen Blick","summary":["Zancada ist heute kostenlos — keine Zahlungen oder Abonnements.","Pläne und der KI-Coach sind Orientierungshilfen, kein Ersatz für eine medizinische Fachperson.","Du kannst jederzeit kündigen und deine Daten löschen.","Die App wird \"wie besehen\" bereitgestellt, ohne Garantie unterbrechungsfreier Verfügbarkeit."],"h1":"1. Beschreibung des Dienstes","h1_text":"Zancada ist eine Trainings-App für Läufer: Sie erstellt personalisierte Pläne, erfasst deine Läufe, synchronisiert mit Strava, Polar, Wahoo und COROS, Suunto, und stellt dir Zonda, den KI-Coach, zur Seite, der deine Fragen beantwortet und deinen Plan anpasst.","h2":"2. Dein Konto","h2_text":"Du bist dafür verantwortlich, dein Passwort geheim zu halten und für jede Aktivität auf deinem Konto. Zancada richtet sich nicht an Personen unter 16 Jahren.","h3":"3. Wichtiger Hinweis zu Gesundheit und Training","h3_label":"Hinweis","h3_box":"Die Vorschläge von Zonda (dem KI-Coach) und die von Zancada erstellten Pläne sind Orientierungshilfen, die auf allgemeinen Trainingsprinzipien basieren. Sie ersetzen nicht den Rat eines Arztes, Physiotherapeuten oder zertifizierten Trainers. Wende dich an eine medizinische Fachperson, bevor du ein Trainingsprogramm beginnst, besonders wenn du eine bestehende Erkrankung hast, akute Schmerzen spürst oder sich etwas nicht richtig anfühlt. Du nutzt die App und ihre Empfehlungen nach eigenem Ermessen und in eigener Verantwortung.","h4":"4. Zulässige Nutzung","h4_items":["Nutze Zancada nicht für illegale Zwecke oder um anderen Nutzern oder dem Dienst zu schaden.","Versuche nicht, die Sicherheit der App zu umgehen oder auf Daten zuzugreifen, die dir nicht gehören.","Führe kein Reverse Engineering des Codes durch und verkaufe den Dienst nicht ohne Genehmigung weiter."],"h5":"5. Dienste von Drittanbietern","h5_text":"Zancada bindet Strava, Polar, Wahoo, COROS, Suunto, Google (zur Anmeldung), Anthropic (das KI-Modell Claude, das Zonda antreibt) und Sentry (technisches Fehlermonitoring) ein, um zu funktionieren. Die Nutzung dieser Integrationen unterliegt auch den jeweils eigenen Bedingungen dieser Dienste.","h6":"6. Geistiges Eigentum","h6_text":"Name, Marke und Design von Zancada gehören uns. Deine Trainingsdaten gehören dir — wir speichern und verarbeiten sie nur, um dir den Dienst anbieten zu können.","h7":"7. Kündigung","h7_text":"Du kannst die Nutzung von Zancada jederzeit beenden und alle deine Daten löschen, unter Profil → Meine Daten löschen. Wir behalten uns vor, Konten zu sperren, die gegen diese Bedingungen verstoßen.","h8":"8. Haftungsbeschränkung","h8_text":"Zancada wird \"wie besehen\" bereitgestellt, ohne Garantie für unterbrechungsfreie Verfügbarkeit. Wir haften nicht für Verletzungen, Schäden oder Nachteile, die durch die Nutzung der App oder das Befolgen der Empfehlungen des virtuellen Coaches entstehen — die Entscheidung, zu trainieren, und wie, liegt immer bei dir.","h9":"9. Änderungen dieser Bedingungen","h9_text":"Wenn wir eine wichtige Änderung vornehmen, informieren wir dich in der App.","h10":"10. Kostenloser Dienst (vorerst)","h10_text":"Zancada ist derzeit kostenlos, ohne kostenpflichtige Funktionen. Falls wir künftig Abonnements, In-App-Käufe oder eine andere Zahlungsform einführen, aktualisieren wir diese Bedingungen und ergänzen eine klare Rückerstattungsrichtlinie, bevor eine Belastung aktiviert wird — dir wird nie etwas berechnet, ohne dass diese Bedingungen das vorher widerspiegeln.","h11":"11. Anwendbares Recht und Gerichtsstand","h11_text":"[Vor Veröffentlichung der App zu ergänzen: welchem Recht diese Bedingungen unterliegen und welche Gerichte für Streitigkeiten zuständig sind. Dies hängt von der rechtlichen Struktur ab, unter der du tätig bist (Einzelperson oder eingetragene Firma) — ausstehende Erinnerung vor dem Launch.]","h_contact":"Kontakt","contact_q":"Fragen zu diesen Bedingungen?","note":"Dieses Dokument wurde als allgemeine Vorlage für eine App in Entwicklung verfasst und stellt keine Rechtsberatung dar. Bevor du Zancada öffentlich veröffentlichst, empfehlen wir, es von einem Anwalt prüfen und an die Gesetze deines Landes anpassen zu lassen."}};
const LANG_LABELS = {es:'ES', en:'EN', pt:'PT', fr:'FR', it:'IT', de:'DE'};
const LANG_NAMES = {es:'es', en:'en-US', pt:'pt-BR', fr:'fr', it:'it', de:'de'};

function detectLang(){
  const url = new URL(window.location.href);
  const q = url.searchParams.get('lang');
  if(q && L[q]) return q;
  try{
    const saved = localStorage.getItem('zancada_legal_lang');
    if(saved && L[saved]) return saved;
  }catch(e){}
  const nav = (navigator.language || 'es').slice(0,2).toLowerCase();
  if(L[nav]) return nav;
  return 'es';
}

function render(code){
  const d = L[code];
  document.documentElement.lang = LANG_NAMES[code] || code;
  document.getElementById('page-title').textContent = d.title;
  document.getElementById('back-link').textContent = d.back;
  document.getElementById('t-title').textContent = d.title.replace(/^Zancada\s*—\s*/, '');
  document.getElementById('t-updated').textContent = d.updated;
  document.getElementById('t-intro').textContent = d.intro;
  document.getElementById('t-summary-label').textContent = d.summary_label;
  document.getElementById('t-summary').innerHTML = d.summary.map(item=>`<li>${item}</li>`).join('');
  document.getElementById('t-h1').textContent = d.h1;
  document.getElementById('t-h1-text').textContent = d.h1_text;
  document.getElementById('t-h2').textContent = d.h2;
  document.getElementById('t-h2-text').textContent = d.h2_text;
  document.getElementById('t-h3').textContent = d.h3;
  document.getElementById('t-h3-label').textContent = d.h3_label;
  document.getElementById('t-h3-box').textContent = d.h3_box;
  document.getElementById('t-h4').textContent = d.h4;
  document.getElementById('t-h4-items').innerHTML = d.h4_items.map(item=>`<li>${item}</li>`).join('');
  document.getElementById('t-h5').textContent = d.h5;
  document.getElementById('t-h5-text').textContent = d.h5_text;
  document.getElementById('t-h6').textContent = d.h6;
  document.getElementById('t-h6-text').textContent = d.h6_text;
  document.getElementById('t-h7').textContent = d.h7;
  document.getElementById('t-h7-text').textContent = d.h7_text;
  document.getElementById('t-h8').textContent = d.h8;
  document.getElementById('t-h8-text').textContent = d.h8_text;
  document.getElementById('t-h9').textContent = d.h9;
  document.getElementById('t-h9-text').textContent = d.h9_text;
  document.getElementById('t-h10').textContent = d.h10;
  document.getElementById('t-h10-text').textContent = d.h10_text;
  document.getElementById('t-h11').textContent = d.h11;
  document.getElementById('t-h11-text').textContent = d.h11_text;
  document.getElementById('t-h-contact').textContent = d.h_contact;
  document.getElementById('t-contact-q').textContent = d.contact_q;
  document.getElementById('t-note').textContent = d.note;
  document.querySelectorAll('.lang-pill').forEach(p=>p.classList.toggle('active', p.dataset.v===code));
  try{ localStorage.setItem('zancada_legal_lang', code); }catch(e){}
}

const langRow = document.getElementById('lang-row');
Object.keys(LANG_LABELS).forEach(code=>{
  const el = document.createElement('div');
  el.className = 'lang-pill';
  el.dataset.v = code;
  el.textContent = LANG_LABELS[code];
  el.onclick = ()=>render(code);
  langRow.appendChild(el);
});

render(detectLang());
</script>

</html>
