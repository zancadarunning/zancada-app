<script>
const L = {"es":{"title":"Zancada — Términos y Condiciones","back":"‹ Volver a Zancada","updated":"Última actualización: 9 de octubre de 2026","intro":"Los presentes Términos y Condiciones rigen el acceso y uso de Zancada. Al descargar, instalar, registrarse o utilizar los Servicios, el Usuario acepta quedar obligado por ellos y por la Política de Privacidad. Si no está de acuerdo, no debe utilizar los Servicios. Se recomienda leer con especial atención el aviso sobre salud y entrenamiento (sección 4).","summary_label":"En resumen","summary":["Hoy Zancada es gratuita. Desde su lanzamiento en las tiendas de aplicaciones funcionará bajo suscripción, con un período de prueba gratuito de 14 días (sección 15).","Los planes y las respuestas de Zonda son orientativos y no reemplazan a un profesional de la salud. El test de nivel es un esfuerzo máximo.","El Usuario puede cancelar y eliminar sus datos cuando lo desee.","El servicio se presta \"tal cual\" y según disponibilidad, sin garantía de funcionamiento ininterrumpido."],"sections":[{"h":"1. Aceptación, definiciones e identificación del titular","p":["Estos Términos y Condiciones (los \"Términos\") constituyen un contrato vinculante entre el Usuario y el titular de Zancada, e incorporan la Política de Privacidad. Se aplican a la aplicación móvil Zancada, a su versión web (zancada.org) y a las funciones y servicios relacionados (los \"Servicios\"). \"Usuario\" es la persona que accede o utiliza los Servicios y \"Contenido\" es todo dato, texto, imagen o información que el Usuario cargue o genere mediante los Servicios."],"ph":"[A completar antes de publicar la app]: razón social o nombre del titular, CUIT, domicilio legal, correo de contacto. Alojamiento del servicio: Vercel (aplicación y funciones de servidor) y Supabase (base de datos)."},{"h":"2. Descripción del servicio","p":["Zancada es una aplicación de entrenamiento para corredores: genera planes personalizados (por distancia o por tiempo), registra carreras, propone un test de nivel para calcular ritmos y zonas, sincroniza métricas con plataformas de terceros (Strava, Polar, Wahoo, COROS y Suunto) y ofrece a Zonda, un asistente virtual basado en Inteligencia Artificial, para responder consultas y ajustar la planificación deportiva. Zancada puede agregar, modificar o discontinuar funciones en cualquier momento. También estima marcas y tiempos de carrera, ofrece un plan de carrera con parciales, avisa por voz sobre el ritmo y la carga semanal, y muestra el clima."]},{"h":"3. Capacidad, registro y cuenta","p":["El Usuario debe tener capacidad legal para contratar. Zancada no está dirigida a menores de 16 años; entre los 16 y los 17 años solo puede utilizarse con la autorización expresa y la supervisión de la madre, el padre o el tutor legal."],"ul":["Proporcionar información veraz, actual y completa, y mantenerla actualizada.","Crear una sola cuenta, de uso personal, y no compartir la cuenta ni la suscripción con otras personas.","Mantener la confidencialidad de las credenciales y notificar de inmediato cualquier uso no autorizado. El Usuario es responsable de toda la actividad realizada bajo su cuenta.","Zancada podrá suspender o cancelar la cuenta que incumpla estos Términos."]},{"h":"4. Aviso importante sobre salud, seguridad y geolocalización","box":{"label":"Aviso","text":"Las sugerencias de Zonda y los planes generados por Zancada son orientativos, se generan de forma automatizada y se basan en principios generales de entrenamiento. Bajo ninguna circunstancia constituyen asesoramiento, diagnóstico o tratamiento médico, kinesiológico ni psicológico, y Zancada no es un dispositivo médico. No reemplazan el consejo de un médico, kinesiólogo o entrenador certificado."},"p":["La práctica del running y de la actividad física conlleva riesgos inherentes para la salud, incluidas lesiones físicas o cardiovasculares. El Usuario debe consultar a un médico o profesional de la salud matriculado antes de iniciar cualquier programa de entrenamiento, especialmente si tiene una condición preexistente, está embarazada o en período de posparto, o ha estado inactivo. Debe comenzar gradualmente, no exceder sus capacidades y detener la actividad de inmediato ante mareos, dolor agudo, deshidratación o cualquier malestar. Nunca debe desatender un consejo médico ni demorar la consulta por lo que indique la aplicación.","El Usuario asume los riesgos de la actividad física que realiza y de las decisiones que adopte en base a los Servicios. Debe entrenar con atención al entorno (tránsito, terreno, clima, otras personas), no interactuar con la aplicación mientras conduce o cruza una calle, y usar las funciones de geolocalización de manera segura y responsable. La publicación o el uso compartido de rutas puede revelar lugares frecuentados; el Usuario es responsable de evaluar ese riesgo según su situación."]},{"h":"5. Test de nivel y recomendaciones personalizadas","p":["El test de nivel (test de Cooper de 12 minutos) es un esfuerzo máximo que Zancada propone para calcular ritmos y zonas. Su realización es responsabilidad exclusiva del Usuario, quien debe contar con aptitud física y, cuando corresponda, con autorización médica. Los ritmos, zonas y planes derivados del test son estimaciones y pueden no ajustarse a la situación real del Usuario. El Usuario puede repetir el test o ajustar los valores en cualquier momento. Lo mismo vale para las marcas estimadas, el plan de carrera, los ritmos objetivo, los avisos de ritmo por voz y las alertas de carga: son orientativos y no sustituyen el criterio del Usuario ni el consejo médico."]},{"h":"6. Limitaciones de la Inteligencia Artificial","p":["Zancada utiliza modelos de lenguaje de Inteligencia Artificial (operados por Anthropic) para dar funcionamiento a Zonda y a ciertas funciones de personalización. Estas tecnologías tienen riesgos y limitaciones conocidos y desconocidos: pueden producir respuestas inexactas, incompletas o inadecuadas para la situación física del Usuario. El Usuario utiliza estas funciones bajo su propio riesgo y debe aplicar siempre su criterio y sentido común antes de adoptar cualquier recomendación. Zonda puede modificar el plan por pedido del Usuario; los cambios son revisables y reversibles desde la aplicación."]},{"h":"7. Privacidad y datos sensibles","p":["Para funcionar, Zancada recopila datos personales y datos de salud (métricas físicas y geolocalización, incluida la ubicación en segundo plano mientras se registra una actividad). El Usuario presta su consentimiento libre, expreso e informado para ese tratamiento, en los términos de la Ley 25.326 y de la <a href=\"/privacy.html\">Política de Privacidad<\/a>, que forma parte de estos Términos. Esa Política describe también los derechos de acceso, rectificación, supresión y portabilidad, la transferencia internacional de datos y el rol de la Agencia de Acceso a la Información Pública (AAIP), órgano de control de la Ley 25.326."]},{"h":"8. Integraciones y servicios de terceros","p":["El Usuario puede iniciar sesión con Google o Apple y conectar dispositivos y plataformas como Strava, Polar, Wahoo, COROS, Suunto o Health Connect. Zancada también se apoya en proveedores como Anthropic, Supabase, Vercel, Firebase y Sentry. La información que el Usuario comparte con esos terceros se rige por sus propios términos y políticas, sobre los cuales Zancada no tiene control ni responsabilidad. Zancada no garantiza la disponibilidad, exactitud ni continuidad de las integraciones, que pueden depender de cambios de los terceros. Para los mapas y el clima, Zancada utiliza además a Mapbox y a Open-Meteo.","Los productos o servicios de terceros que el Usuario adquiera (por ejemplo, relojes o sensores) y los enlaces a otros sitios se contratan o utilizan directamente con esos terceros, sin que Zancada sea parte ni responda por ellos. Si el Usuario utiliza Zancada en otros países, debe cumplir la normativa local aplicable."]},{"h":"9. Contenido del Usuario y licencia","p":["El Usuario conserva la titularidad sobre su Contenido (incluidos sus datos de entrenamiento). Para prestar los Servicios, otorga a Zancada una licencia no exclusiva, mundial, gratuita y limitada para alojar, almacenar, procesar, reproducir y mostrar ese Contenido con la única finalidad de brindar y mejorar el servicio, conforme a la Política de Privacidad. Zancada no utiliza el Contenido con fines publicitarios.","El Usuario declara que es titular del Contenido que carga o que cuenta con los derechos necesarios, y que su Contenido no infringe derechos de terceros ni la ley. Los comentarios, ideas y sugerencias que el Usuario envíe a Zancada (el \"Feedback\") podrán ser utilizados libremente por Zancada para mejorar los Servicios, sin obligación de compensación ni de confidencialidad."]},{"h":"10. Uso aceptable, conducta y uso personal","p":["Los Servicios son de uso personal y no comercial, salvo autorización escrita de Zancada. El Usuario se compromete a utilizarlos conforme a la ley y a estos Términos. En particular, queda prohibido:"],"ul":["Utilizar Zancada con fines ilegales, o para dañar, hostigar o suplantar la identidad de otras personas o de Zancada.","Vulnerar o intentar eludir la seguridad de la aplicación, o acceder a datos que no pertenecen al Usuario.","Acceder a los Servicios por medios distintos de las interfaces provistas; utilizar robots, scripts, minería de datos o scraping para extraer datos o contenido; o sobrecargar o interferir con los Servicios.","Realizar ingeniería inversa, descompilar o intentar obtener el código fuente, salvo en los casos permitidos por la ley.","Revender, alquilar, sublicenciar o explotar comercialmente los Servicios o sus datos sin autorización.","Utilizar los Servicios, o información derivada de ellos, para desarrollar, entrenar o mejorar modelos de aprendizaje automático o de Inteligencia Artificial ajenos a Zancada.","Cargar contenido abusivo, ofensivo, discriminatorio o que incite al odio, o que contenga virus o código malicioso."],"p2":["Zancada mantiene una política de tolerancia cero hacia el contenido abusivo, ofensivo o que incite al odio. Zancada puede revisar, restringir o eliminar cualquier contenido que infrinja estos Términos y suspender de inmediato las cuentas involucradas."]},{"h":"11. Propiedad intelectual","p":["La marca \"Zancada\", sus logotipos, el diseño de la interfaz, los algoritmos, el software y el código fuente son propiedad exclusiva de sus titulares y están protegidos por la Ley de Propiedad Intelectual (11.723) y la Ley de Marcas (22.362) de la República Argentina, y por los tratados aplicables. Zancada otorga al Usuario una licencia limitada, personal, revocable, no exclusiva e intransferible para usar la aplicación conforme a estos Términos. Todos los derechos no concedidos expresamente quedan reservados. Las marcas de terceros pertenecen a sus respectivos titulares y su mención no implica patrocinio ni recomendación.","Quien considere que algún contenido de los Servicios infringe sus derechos de propiedad intelectual puede notificarlo a info@zancada.org, indicando: su identificación y datos de contacto; la obra o marca protegida; la ubicación del contenido cuestionado; una declaración de buena fe sobre la falta de autorización; y una declaración de que la información es exacta y de que está facultado para actuar en nombre del titular."]},{"h":"12. Funciones en prueba","p":["Zancada puede ofrecer funciones nuevas o experimentales en versión preliminar. Su uso es opcional y bajo exclusiva responsabilidad del Usuario; pueden contener errores, carecer de soporte, modificarse o retirarse en cualquier momento."]},{"h":"13. Dispositivos, conectividad y batería","p":["El Usuario es responsable de contar con un dispositivo compatible, de la conexión a internet y de los cargos de datos que su proveedor le aplique. Algunas funciones, como el registro de actividades con GPS en segundo plano, pueden incrementar significativamente el consumo de batería. Zancada no garantiza la precisión de los sensores ni del GPS, que depende de cada dispositivo y de las condiciones del entorno. Los avisos de voz, la notificación de la carrera y el seguimiento en segundo plano pueden verse limitados por el ahorro de batería o por los permisos del sistema; el Usuario es responsable de configurarlos."]},{"h":"14. Comunicaciones y notificaciones","p":["Zancada podrá enviar al Usuario comunicaciones sobre el servicio (cambios de los Términos, seguridad, soporte y notificaciones push que el Usuario haya activado). Las comunicaciones electrónicas satisfacen cualquier requisito legal de forma escrita. El Usuario puede desactivar las notificaciones desde la aplicación o el sistema operativo y no debe enviar comunicaciones abusivas, reiteradas o no deseadas a Zancada o a terceros."]},{"h":"15. Suscripciones, período de prueba y pagos","p":["Hoy Zancada es gratuita. Desde su lanzamiento en las tiendas de aplicaciones operará bajo un modelo de suscripción, y el Usuario podrá acceder a todas las funciones durante un período de prueba gratuito inicial de catorce (14) días. Zancada podrá agregar, modificar o discontinuar funciones gratuitas o de suscripción.","<strong>A. Período de prueba.<\/strong> Al iniciar la prueba se solicitará asociar un método de pago a través de la cuenta de Apple App Store o de Google Play. No se realiza ningún cargo durante esos 14 días. La prueba gratuita puede utilizarse una sola vez por Usuario.","<strong>B. Facturación y renovación automática.<\/strong> Al finalizar la prueba, la suscripción (mensual o anual, según el plan elegido) se renueva y se cobra automáticamente al método de pago asociado, salvo que el Usuario la cancele con al menos veinticuatro (24) horas de anticipación a la finalización del período en curso. El plan elegido no puede modificarse hasta su vencimiento o renovación.","<strong>C. Cancelación.<\/strong> El Usuario puede cancelar la renovación automática en cualquier momento desde los ajustes de suscripciones de su cuenta de Apple ID o de Google Play; la cancelación surte efecto al final del período vigente, y hasta entonces conserva el acceso. Desinstalar la aplicación o eliminar la cuenta de Zancada no cancela automáticamente la suscripción gestionada por las tiendas.","<strong>D. Precios e impuestos.<\/strong> Los precios se informan en la tienda antes de suscribirse e incluyen los impuestos que correspondan. Zancada podrá modificar los precios con aviso razonable previo; el cambio se aplicará desde el siguiente período de facturación.","<strong>E. Pagos y reembolsos.<\/strong> Todos los pagos se procesan exclusivamente a través de Apple o Google y están sujetos a sus políticas de reembolso: Zancada no procesa pagos directos ni gestiona devoluciones, salvo lo que la ley imponga.","<strong>F. Derecho de revocación.<\/strong> Cuando la ley argentina de defensa del consumidor (Ley 24.240 y arts. 1110 y siguientes del Código Civil y Comercial) reconozca al Usuario el derecho de revocar la aceptación dentro de los diez (10) días corridos de la contratación, podrá ejercerlo escribiendo a info@zancada.org o por el medio que la tienda disponga; la devolución se gestionará a través de la tienda correspondiente."]},{"h":"16. Modificación, suspensión y terminación","p":["El Usuario puede dejar de utilizar los Servicios y solicitar la eliminación definitiva de todos sus datos personales y su historial en cualquier momento desde Perfil → Borrar mis datos.","Zancada podrá suspender o cancelar la cuenta o el acceso a los Servicios, con o sin aviso previo según la gravedad del caso y conforme a la ley, en los siguientes supuestos: incumplimiento de estos Términos; requerimiento de una autoridad; fraude o abuso; problemas técnicos o de seguridad; discontinuación o modificación sustancial del servicio; o prolongada inactividad. Las cláusulas que por su naturaleza deban subsistir (propiedad intelectual, limitación de responsabilidad, ley aplicable, entre otras) seguirán vigentes tras la terminación."]},{"h":"17. Exclusión de garantías y limitación de responsabilidad","p":["Los Servicios se prestan \"tal cual\" (as is) y \"según disponibilidad\". Zancada no garantiza que sean ininterrumpidos, oportunos, seguros o libres de errores, ni que los resultados, métricas, planes o recomendaciones sean exactos o confiables, ni que la sincronización con plataformas de terceros funcione sin fallas. Zancada no asume responsabilidad por la organización, supervisión o conducción de eventos o actividades grupales que utilicen los Servicios.","En la máxima medida permitida por la ley, Zancada no será responsable por pérdidas de información, por la imposibilidad de uso del servicio, ni por lesiones, daños o perjuicios directos, indirectos o consecuentes derivados del uso de la aplicación o de seguir las recomendaciones del asistente virtual: la decisión de entrenar, y cómo hacerlo, es siempre del Usuario. Salvo dolo o culpa grave, y en la medida permitida, la responsabilidad total de Zancada frente al Usuario no excederá el monto abonado por este en los doce (12) meses anteriores al reclamo. Esta limitación no afecta los derechos irrenunciables que la normativa de defensa del consumidor reconozca al Usuario."]},{"h":"18. Indemnidad","p":["En la medida permitida por la ley, el Usuario mantendrá indemne a Zancada, a sus titulares y colaboradores frente a reclamos de terceros derivados del Contenido que el Usuario cargue, de su incumplimiento de estos Términos o de la ley, o de la violación de derechos de terceros."]},{"h":"19. Disposiciones para usuarios de iOS y de Android","p":["Si el Usuario descarga Zancada desde la App Store de Apple, reconoce y acepta que estos Términos se celebran únicamente entre el Usuario y Zancada, y no con Apple Inc. Zancada es la única responsable de la aplicación y de su contenido. Apple no tiene obligación de prestar servicios de mantenimiento ni soporte, ni es responsable de atender reclamos relacionados con la aplicación, incluidos los de responsabilidad por el producto, defensa del consumidor o infracción de propiedad intelectual. Apple y sus subsidiarias son terceros beneficiarios de estos Términos y podrán hacerlos valer. Cualquier reclamo sobre cargos, facturación o devoluciones de suscripciones realizadas a través de la App Store deberá gestionarse directamente con Apple.","Si la descarga se realiza desde Google Play, serán también aplicables las condiciones de esa tienda, y los reclamos sobre pagos o reembolsos se gestionarán con Google."]},{"h":"20. Defensa del consumidor y resolución de controversias","p":["Nada en estos Términos limita los derechos que la Ley 24.240 de Defensa del Consumidor y demás normas imperativas reconocen al Usuario. Ante cualquier reclamo, el Usuario puede contactar a Zancada en info@zancada.org, y las partes procurarán resolver la controversia de buena fe mediante negociación directa antes de iniciar acciones legales. Asimismo, el Usuario puede acudir a la autoridad de aplicación de la Ley 24.240 que corresponda a su domicilio."]},{"h":"21. Disposiciones generales","p":["Estos Términos y la Política de Privacidad constituyen el acuerdo íntegro entre las partes respecto de los Servicios. Si alguna disposición fuera inválida o inaplicable, las restantes mantendrán su vigencia. La falta de ejercicio de un derecho no implica su renuncia. Zancada podrá ceder estos Términos en caso de reorganización o transferencia del negocio; el Usuario no podrá cederlos sin consentimiento escrito. Zancada no responderá por incumplimientos causados por hechos de fuerza mayor o ajenos a su control. Las traducciones se ofrecen a título informativo; en caso de discrepancia, prevalece la versión en español."]},{"h":"22. Cambios a estos Términos","p":["Zancada podrá modificar estos Términos. Los cambios importantes se notificarán dentro de la aplicación antes de su entrada en vigencia. El uso de los Servicios con posterioridad a esa fecha implica la aceptación de los nuevos Términos; si el Usuario no está de acuerdo, puede dejar de utilizar los Servicios y eliminar su cuenta."]},{"h":"23. Ley aplicable y jurisdicción","p":["Estos Términos se rigen por las leyes de la República Argentina. Para cualquier controversia derivada del uso de la aplicación, las partes se someten a la jurisdicción de los Tribunales Ordinarios de la Ciudad Autónoma de Buenos Aires, renunciando a cualquier otro fuero que pudiera corresponder, sin perjuicio del derecho del consumidor a demandar ante los tribunales de su domicilio cuando la ley así lo disponga."]}],"h_contact":"Contacto","contact_q":"Consultas sobre estos Términos y Condiciones:","note":"Este documento fue redactado como una plantilla general para una aplicación en desarrollo y no constituye asesoramiento legal. Antes de lanzar Zancada públicamente, se recomienda que un abogado lo revise y lo adapte a la normativa aplicable."},"en":{"title":"Zancada — Terms and Conditions","back":"‹ Back to Zancada","updated":"Last updated: October 9, 2026","intro":"These Terms and Conditions govern access to and use of Zancada. By downloading, installing, registering or using the Services, the User agrees to be bound by them and by the Privacy Policy. If the User does not agree, they must not use the Services. Particular attention should be paid to the notice on health and training (section 4).","summary_label":"At a glance","summary":["Zancada is free today. From its launch on the app stores it will operate under a subscription, with a 14-day free trial (section 15).","Plans and Zonda's answers are guidance and do not replace a health professional. The fitness test is a maximum effort.","The User may cancel and delete their data whenever they wish.","The service is provided \"as is\" and as available, with no guarantee of uninterrupted operation."],"sections":[{"h":"1. Acceptance, definitions and identification of the owner","p":["These Terms and Conditions (the \"Terms\") constitute a binding agreement between the User and the owner of Zancada, and incorporate the Privacy Policy. They apply to the Zancada mobile application, its web version (zancada.org) and the related features and services (the \"Services\"). \"User\" is the person who accesses or uses the Services and \"Content\" is any data, text, image or information the User uploads or generates through the Services."],"ph":"[To be completed before publishing the app]: company name or name of the owner, tax ID (CUIT), legal address, contact email. Hosting of the service: Vercel (application and server functions) and Supabase (database)."},{"h":"2. Description of the service","p":["Zancada is a training application for runners: it generates personalized plans (by distance or by time), logs runs, offers a fitness test to calculate paces and zones, syncs metrics with third-party platforms (Strava, Polar, Wahoo, COROS and Suunto) and provides Zonda, a virtual assistant based on Artificial Intelligence, to answer questions and adjust sports planning. Zancada may add, modify or discontinue features at any time. It also estimates race records and times, offers a race plan with splits, gives voice alerts about pace and weekly load, and shows the weather."]},{"h":"3. Capacity, registration and account","p":["The User must have legal capacity to enter into contracts. Zancada is not directed at anyone under 16; between 16 and 17 it may only be used with the express authorization and supervision of the parent or legal guardian."],"ul":["Provide truthful, current and complete information, and keep it up to date.","Create a single account for personal use, and not share the account or the subscription with other people.","Keep credentials confidential and notify any unauthorized use immediately. The User is responsible for all activity under their account.","Zancada may suspend or cancel an account that breaches these Terms."]},{"h":"4. Important notice on health, safety and geolocation","box":{"label":"Notice","text":"Zonda's suggestions and the plans generated by Zancada are guidance, are generated automatically and are based on general training principles. Under no circumstances do they constitute medical, physiotherapy or psychological advice, diagnosis or treatment, and Zancada is not a medical device. They do not replace the advice of a doctor, physiotherapist or certified coach."},"p":["Running and physical activity carry inherent health risks, including physical or cardiovascular injury. The User must consult a doctor or licensed health professional before starting any training program, especially if they have a pre-existing condition, are pregnant or postpartum, or have been inactive. They must start gradually, not exceed their capabilities and stop the activity immediately if they experience dizziness, acute pain, dehydration or any discomfort. They must never disregard medical advice or delay seeking it because of what the app indicates.","The User assumes the risks of the physical activity they perform and of the decisions they make based on the Services. They must train paying attention to their surroundings (traffic, terrain, weather, other people), must not interact with the app while driving or crossing a street, and must use geolocation features safely and responsibly. Publishing or sharing routes may reveal frequented places; the User is responsible for assessing that risk according to their situation."]},{"h":"5. Fitness test and personalized recommendations","p":["The fitness test (12-minute Cooper test) is a maximum effort that Zancada proposes to calculate paces and zones. Taking it is the User's sole responsibility; the User must be physically fit and, where appropriate, have medical clearance. The paces, zones and plans derived from the test are estimates and may not match the User's real situation. The User may repeat the test or adjust the values at any time. The same applies to estimated records, the race plan, target paces, voice pace alerts and load alerts: they are a guide and do not replace the User's judgment or medical advice."]},{"h":"6. Limitations of Artificial Intelligence","p":["Zancada uses Artificial Intelligence language models (operated by Anthropic) to power Zonda and certain personalization features. These technologies have known and unknown risks and limitations: they may produce answers that are inaccurate, incomplete or unsuitable for the User's physical situation. The User uses these features at their own risk and must always apply their own judgment and common sense before adopting any recommendation. Zonda may change the plan at the User's request; changes are reviewable and reversible from the app."]},{"h":"7. Privacy and sensitive data","p":["To work, Zancada collects personal data and health data (physical metrics and geolocation, including background location while an activity is recorded). The User gives free, express and informed consent to that processing, under Law 25,326 and the <a href=\"/privacy.html\">Privacy Policy<\/a>, which forms part of these Terms. That Policy also describes the rights of access, rectification, deletion and portability, the international transfer of data and the role of the Agency for Access to Public Information (AAIP), the control body of Law 25,326."]},{"h":"8. Integrations and third-party services","p":["The User may sign in with Google or Apple and connect devices and platforms such as Strava, Polar, Wahoo, COROS, Suunto or Health Connect. Zancada also relies on providers such as Anthropic, Supabase, Vercel, Firebase and Sentry. Information the User shares with those third parties is governed by their own terms and policies, over which Zancada has no control or responsibility. Zancada does not guarantee the availability, accuracy or continuity of the integrations, which may depend on changes by the third parties. For maps and weather, Zancada also uses Mapbox and Open-Meteo.","Third-party products or services the User acquires (for example, watches or sensors) and links to other sites are contracted or used directly with those third parties, and Zancada is neither a party to them nor responsible for them. If the User uses Zancada in other countries, they must comply with the applicable local rules."]},{"h":"9. User Content and license","p":["The User retains ownership of their Content (including their training data). To provide the Services, they grant Zancada a non-exclusive, worldwide, royalty-free, limited license to host, store, process, reproduce and display that Content for the sole purpose of providing and improving the service, in accordance with the Privacy Policy. Zancada does not use the Content for advertising.","The User declares that they own the Content they upload or have the necessary rights, and that their Content does not infringe third-party rights or the law. Comments, ideas and suggestions the User sends to Zancada (\"Feedback\") may be freely used by Zancada to improve the Services, with no obligation of compensation or confidentiality."]},{"h":"10. Acceptable use, conduct and personal use","p":["The Services are for personal, non-commercial use, unless Zancada authorizes otherwise in writing. The User agrees to use them in accordance with the law and these Terms. In particular, the following is prohibited:"],"ul":["Using Zancada for illegal purposes, or to harm, harass or impersonate other people or Zancada.","Breaching or attempting to circumvent the app's security, or accessing data that does not belong to the User.","Accessing the Services by means other than the interfaces provided; using robots, scripts, data mining or scraping to extract data or content; or overloading or interfering with the Services.","Reverse engineering, decompiling or attempting to obtain the source code, except where permitted by law.","Reselling, renting, sublicensing or commercially exploiting the Services or their data without authorization.","Using the Services, or information derived from them, to develop, train or improve machine learning or Artificial Intelligence models other than Zancada's.","Uploading abusive, offensive or discriminatory content, content that incites hatred, or content containing viruses or malicious code."],"p2":["Zancada maintains a zero-tolerance policy toward abusive, offensive or hateful content. Zancada may review, restrict or remove any content that breaches these Terms and immediately suspend the accounts involved."]},{"h":"11. Intellectual property","p":["The \"Zancada\" brand, its logos, interface design, algorithms, software and source code are the exclusive property of their owners and are protected by Argentina's Intellectual Property Law (11,723) and Trademark Law (22,362), and by applicable treaties. Zancada grants the User a limited, personal, revocable, non-exclusive and non-transferable license to use the app in accordance with these Terms. All rights not expressly granted are reserved. Third-party trademarks belong to their respective owners and their mention does not imply sponsorship or endorsement.","Anyone who believes that content in the Services infringes their intellectual property rights may notify info@zancada.org, stating: their identity and contact details; the protected work or trademark; the location of the content in question; a good-faith statement that it is unauthorized; and a statement that the information is accurate and that they are authorized to act on behalf of the owner."]},{"h":"12. Features in testing","p":["Zancada may offer new or experimental features in preview. Their use is optional and at the User's sole responsibility; they may contain errors, lack support, and be modified or withdrawn at any time."]},{"h":"13. Devices, connectivity and battery","p":["The User is responsible for having a compatible device, an internet connection and any data charges applied by their provider. Some features, such as recording activities with background GPS, may significantly increase battery consumption. Zancada does not guarantee the accuracy of sensors or GPS, which depends on each device and environmental conditions. Voice alerts, the run notification and background tracking may be limited by battery saving or system permissions; the User is responsible for configuring them."]},{"h":"14. Communications and notifications","p":["Zancada may send the User communications about the service (changes to the Terms, security, support and push notifications the User has turned on). Electronic communications satisfy any legal requirement to be in writing. The User may turn off notifications from the app or the operating system and must not send abusive, repeated or unwanted communications to Zancada or third parties."]},{"h":"15. Subscriptions, free trial and payments","p":["Zancada is free today. From its launch on the app stores it will operate under a subscription model, and the User will be able to access all features during an initial free trial of fourteen (14) days. Zancada may add, modify or discontinue free or subscription features.","<strong>A. Free trial.<\/strong> When the trial starts, the User will be asked to link a payment method through their Apple App Store or Google Play account. No charge is made during those 14 days. The free trial may be used only once per User.","<strong>B. Billing and automatic renewal.<\/strong> When the trial ends, the subscription (monthly or annual, depending on the plan chosen) renews and is charged automatically to the linked payment method, unless the User cancels at least twenty-four (24) hours before the current period ends. The chosen plan cannot be changed until it expires or renews.","<strong>C. Cancellation.<\/strong> The User may cancel automatic renewal at any time from the subscription settings of their Apple ID or Google Play account; cancellation takes effect at the end of the current period, and access continues until then. Uninstalling the app or deleting the Zancada account does not automatically cancel the subscription managed by the stores.","<strong>D. Prices and taxes.<\/strong> Prices are shown in the store before subscribing and include applicable taxes. Zancada may change prices with reasonable prior notice; the change will apply from the next billing period.","<strong>E. Payments and refunds.<\/strong> All payments are processed exclusively through Apple or Google and are subject to their refund policies: Zancada does not process direct payments or handle refunds, except as the law requires.","<strong>F. Right of withdrawal.<\/strong> Where Argentine consumer protection law (Law 24,240 and articles 1110 et seq. of the Civil and Commercial Code) grants the User the right to revoke acceptance within ten (10) calendar days of contracting, the User may exercise it by writing to info@zancada.org or through the means the store provides; the refund will be handled through the relevant store."]},{"h":"16. Modification, suspension and termination","p":["The User may stop using the Services and request the permanent deletion of all their personal data and history at any time from Profile → Delete my data.","Zancada may suspend or cancel the account or access to the Services, with or without prior notice depending on the seriousness of the case and in accordance with the law, in the following cases: breach of these Terms; a request from an authority; fraud or abuse; technical or security problems; discontinuation or substantial modification of the service; or prolonged inactivity. Provisions that by their nature should survive (intellectual property, limitation of liability, governing law, among others) remain in force after termination."]},{"h":"17. Disclaimer of warranties and limitation of liability","p":["The Services are provided \"as is\" and \"as available\". Zancada does not guarantee that they will be uninterrupted, timely, secure or error-free, that results, metrics, plans or recommendations will be accurate or reliable, or that syncing with third-party platforms will work without failures. Zancada assumes no responsibility for the organization, supervision or conduct of events or group activities that use the Services.","To the maximum extent permitted by law, Zancada will not be liable for loss of information, for the inability to use the service, or for direct, indirect or consequential injuries, damages or losses arising from using the app or following the virtual assistant's recommendations: the decision to train, and how, is always the User's. Except for willful misconduct or gross negligence, and to the extent permitted, Zancada's total liability to the User will not exceed the amount paid by the User in the twelve (12) months before the claim. This limitation does not affect the non-waivable rights that consumer protection law grants the User."]},{"h":"18. Indemnity","p":["To the extent permitted by law, the User will hold Zancada, its owners and collaborators harmless from third-party claims arising from the Content the User uploads, from the User's breach of these Terms or the law, or from the violation of third-party rights."]},{"h":"19. Provisions for iOS and Android users","p":["If the User downloads Zancada from Apple's App Store, they acknowledge and agree that these Terms are entered into solely between the User and Zancada, and not with Apple Inc. Zancada is solely responsible for the application and its content. Apple has no obligation to provide maintenance or support services, nor is it responsible for handling claims related to the application, including product liability, consumer protection or intellectual property infringement claims. Apple and its subsidiaries are third-party beneficiaries of these Terms and may enforce them. Any claim about charges, billing or refunds for subscriptions made through the App Store must be handled directly with Apple.","If the download is made from Google Play, that store's conditions also apply, and claims about payments or refunds will be handled with Google."]},{"h":"20. Consumer protection and dispute resolution","p":["Nothing in these Terms limits the rights that Law 24,240 on Consumer Protection and other mandatory rules grant the User. For any claim, the User may contact Zancada at info@zancada.org, and the parties will try to resolve the dispute in good faith through direct negotiation before taking legal action. The User may also go to the enforcement authority of Law 24,240 corresponding to their place of residence."]},{"h":"21. General provisions","p":["These Terms and the Privacy Policy constitute the entire agreement between the parties regarding the Services. If any provision is invalid or unenforceable, the rest remain in force. Failure to exercise a right does not imply waiver of it. Zancada may assign these Terms in the event of a reorganization or transfer of the business; the User may not assign them without written consent. Zancada will not be liable for breaches caused by force majeure or events beyond its control. Translations are provided for information only; in case of discrepancy, the Spanish version prevails."]},{"h":"22. Changes to these Terms","p":["Zancada may modify these Terms. Important changes will be notified inside the app before they take effect. Use of the Services after that date implies acceptance of the new Terms; if the User does not agree, they may stop using the Services and delete their account."]},{"h":"23. Governing law and jurisdiction","p":["These Terms are governed by the laws of the Argentine Republic. For any dispute arising from the use of the application, the parties submit to the jurisdiction of the Ordinary Courts of the City of Buenos Aires, waiving any other jurisdiction that might apply, without prejudice to the consumer's right to sue before the courts of their place of residence where the law so provides."]}],"h_contact":"Contact","contact_q":"Inquiries about these Terms and Conditions:","note":"This document was written as a general template for an app in development and does not constitute legal advice. Before launching Zancada publicly, it is recommended that a lawyer review it and adapt it to the applicable regulations."},"pt":{"title":"Zancada — Termos e Condições","back":"‹ Voltar para o Zancada","updated":"Última atualização: 9 de outubro de 2026","intro":"Os presentes Termos e Condições regem o acesso e o uso do Zancada. Ao baixar, instalar, cadastrar-se ou utilizar os Serviços, o Usuário aceita ficar vinculado a eles e à Política de Privacidade. Se não concordar, não deve utilizar os Serviços. Recomenda-se ler com especial atenção o aviso sobre saúde e treino (seção 4).","summary_label":"Resumo","summary":["Hoje o Zancada é gratuito. A partir do lançamento nas lojas de aplicativos funcionará por assinatura, com período de teste gratuito de 14 dias (seção 15).","Os planos e as respostas do Zonda são orientativos e não substituem um profissional de saúde. O teste de nível é um esforço máximo.","O Usuário pode cancelar e excluir seus dados quando quiser.","O serviço é prestado \"como está\" e conforme a disponibilidade, sem garantia de funcionamento ininterrupto."],"sections":[{"h":"1. Aceitação, definições e identificação do titular","p":["Estes Termos e Condições (os \"Termos\") constituem um contrato vinculante entre o Usuário e o titular do Zancada, e incorporam a Política de Privacidade. Aplicam-se ao aplicativo móvel Zancada, à sua versão web (zancada.org) e às funções e serviços relacionados (os \"Serviços\"). \"Usuário\" é a pessoa que acessa ou utiliza os Serviços e \"Conteúdo\" é todo dado, texto, imagem ou informação que o Usuário carregue ou gere por meio dos Serviços."],"ph":"[A completar antes de publicar o aplicativo]: razão social ou nome do titular, CUIT, endereço legal, e-mail de contato. Hospedagem do serviço: Vercel (aplicativo e funções de servidor) e Supabase (banco de dados)."},{"h":"2. Descrição do serviço","p":["O Zancada é um aplicativo de treino para corredores: gera planos personalizados (por distância ou por tempo), registra corridas, propõe um teste de nível para calcular ritmos e zonas, sincroniza métricas com plataformas de terceiros (Strava, Polar, Wahoo, COROS e Suunto) e oferece o Zonda, um assistente virtual baseado em Inteligência Artificial, para responder consultas e ajustar o planejamento esportivo. O Zancada pode adicionar, modificar ou descontinuar funções a qualquer momento. Também estima recordes e tempos de prova, oferece um plano de prova com parciais, avisa por voz sobre o ritmo e a carga semanal, e mostra o clima."]},{"h":"3. Capacidade, cadastro e conta","p":["O Usuário deve ter capacidade legal para contratar. O Zancada não é direcionado a menores de 16 anos; entre 16 e 17 anos só pode ser utilizado com a autorização expressa e a supervisão da mãe, do pai ou do responsável legal."],"ul":["Fornecer informações verdadeiras, atuais e completas, e mantê-las atualizadas.","Criar uma única conta, de uso pessoal, e não compartilhar a conta nem a assinatura com outras pessoas.","Manter a confidencialidade das credenciais e notificar imediatamente qualquer uso não autorizado. O Usuário é responsável por toda a atividade realizada em sua conta.","O Zancada poderá suspender ou cancelar a conta que descumprir estes Termos."]},{"h":"4. Aviso importante sobre saúde, segurança e geolocalização","box":{"label":"Aviso","text":"As sugestões do Zonda e os planos gerados pelo Zancada são orientativos, são gerados de forma automatizada e baseiam-se em princípios gerais de treinamento. Em nenhuma hipótese constituem aconselhamento, diagnóstico ou tratamento médico, fisioterapêutico ou psicológico, e o Zancada não é um dispositivo médico. Não substituem o conselho de um médico, fisioterapeuta ou treinador certificado."},"p":["A prática de corrida e de atividade física envolve riscos inerentes à saúde, incluindo lesões físicas ou cardiovasculares. O Usuário deve consultar um médico ou profissional de saúde habilitado antes de iniciar qualquer programa de treino, especialmente se tiver uma condição preexistente, estiver grávida ou no pós-parto, ou tiver estado inativo. Deve começar gradualmente, não exceder suas capacidades e interromper a atividade imediatamente diante de tontura, dor aguda, desidratação ou qualquer mal-estar. Nunca deve desconsiderar um conselho médico nem adiar a consulta por causa do que o aplicativo indicar.","O Usuário assume os riscos da atividade física que realiza e das decisões que adotar com base nos Serviços. Deve treinar atento ao entorno (trânsito, terreno, clima, outras pessoas), não interagir com o aplicativo enquanto dirige ou atravessa uma rua, e usar as funções de geolocalização de maneira segura e responsável. A publicação ou o compartilhamento de rotas pode revelar locais frequentados; o Usuário é responsável por avaliar esse risco conforme sua situação."]},{"h":"5. Teste de nível e recomendações personalizadas","p":["O teste de nível (teste de Cooper de 12 minutos) é um esforço máximo que o Zancada propõe para calcular ritmos e zonas. Sua realização é responsabilidade exclusiva do Usuário, que deve ter aptidão física e, quando couber, autorização médica. Os ritmos, zonas e planos derivados do teste são estimativas e podem não corresponder à situação real do Usuário. O Usuário pode repetir o teste ou ajustar os valores a qualquer momento. O mesmo vale para os recordes estimados, o plano de prova, os ritmos alvo, os avisos de ritmo por voz e os alertas de carga: são orientativos e não substituem o critério do Usuário nem o conselho médico."]},{"h":"6. Limitações da Inteligência Artificial","p":["O Zancada utiliza modelos de linguagem de Inteligência Artificial (operados pela Anthropic) para dar funcionamento ao Zonda e a certas funções de personalização. Essas tecnologias têm riscos e limitações conhecidos e desconhecidos: podem produzir respostas imprecisas, incompletas ou inadequadas à situação física do Usuário. O Usuário utiliza essas funções por sua conta e risco e deve aplicar sempre seu próprio critério e bom senso antes de adotar qualquer recomendação. O Zonda pode modificar o plano a pedido do Usuário; as mudanças são revisáveis e reversíveis pelo aplicativo."]},{"h":"7. Privacidade e dados sensíveis","p":["Para funcionar, o Zancada coleta dados pessoais e dados de saúde (métricas físicas e geolocalização, incluindo a localização em segundo plano enquanto se registra uma atividade). O Usuário presta seu consentimento livre, expresso e informado para esse tratamento, nos termos da Lei argentina 25.326 e da <a href=\"/privacy.html\">Política de Privacidade<\/a>, que faz parte destes Termos. Essa Política descreve também os direitos de acesso, retificação, exclusão e portabilidade, a transferência internacional de dados e o papel da Agência de Acesso à Informação Pública (AAIP), órgão de controle da Lei 25.326."]},{"h":"8. Integrações e serviços de terceiros","p":["O Usuário pode entrar com Google ou Apple e conectar dispositivos e plataformas como Strava, Polar, Wahoo, COROS, Suunto ou Health Connect. O Zancada também se apoia em provedores como Anthropic, Supabase, Vercel, Firebase e Sentry. As informações que o Usuário compartilha com esses terceiros regem-se por seus próprios termos e políticas, sobre os quais o Zancada não tem controle nem responsabilidade. O Zancada não garante a disponibilidade, a exatidão nem a continuidade das integrações, que podem depender de mudanças dos terceiros. Para mapas e clima, a Zancada também usa a Mapbox e a Open-Meteo.","Os produtos ou serviços de terceiros que o Usuário adquirir (por exemplo, relógios ou sensores) e os links para outros sites são contratados ou utilizados diretamente com esses terceiros, sem que o Zancada seja parte nem responda por eles. Se o Usuário utilizar o Zancada em outros países, deve cumprir a normativa local aplicável."]},{"h":"9. Conteúdo do Usuário e licença","p":["O Usuário conserva a titularidade sobre seu Conteúdo (incluindo seus dados de treino). Para prestar os Serviços, concede ao Zancada uma licença não exclusiva, mundial, gratuita e limitada para hospedar, armazenar, processar, reproduzir e exibir esse Conteúdo com a única finalidade de prestar e melhorar o serviço, conforme a Política de Privacidade. O Zancada não utiliza o Conteúdo para fins publicitários.","O Usuário declara ser titular do Conteúdo que carrega ou ter os direitos necessários, e que seu Conteúdo não infringe direitos de terceiros nem a lei. Os comentários, ideias e sugestões que o Usuário enviar ao Zancada (o \"Feedback\") poderão ser utilizados livremente pelo Zancada para melhorar os Serviços, sem obrigação de compensação nem de confidencialidade."]},{"h":"10. Uso aceitável, conduta e uso pessoal","p":["Os Serviços são de uso pessoal e não comercial, salvo autorização escrita do Zancada. O Usuário compromete-se a utilizá-los conforme a lei e estes Termos. Em particular, é proibido:"],"ul":["Utilizar o Zancada para fins ilegais, ou para prejudicar, assediar ou se passar por outras pessoas ou pelo Zancada.","Violar ou tentar burlar a segurança do aplicativo, ou acessar dados que não pertençam ao Usuário.","Acessar os Serviços por meios distintos das interfaces fornecidas; usar robôs, scripts, mineração de dados ou scraping para extrair dados ou conteúdo; ou sobrecarregar ou interferir nos Serviços.","Fazer engenharia reversa, descompilar ou tentar obter o código-fonte, salvo nos casos permitidos por lei.","Revender, alugar, sublicenciar ou explorar comercialmente os Serviços ou seus dados sem autorização.","Utilizar os Serviços, ou informações derivadas deles, para desenvolver, treinar ou melhorar modelos de aprendizado de máquina ou de Inteligência Artificial alheios ao Zancada.","Carregar conteúdo abusivo, ofensivo, discriminatório ou que incite ao ódio, ou que contenha vírus ou código malicioso."],"p2":["O Zancada mantém uma política de tolerância zero em relação a conteúdo abusivo, ofensivo ou que incite ao ódio. O Zancada pode revisar, restringir ou remover qualquer conteúdo que infrinja estes Termos e suspender imediatamente as contas envolvidas."]},{"h":"11. Propriedade intelectual","p":["A marca \"Zancada\", seus logotipos, o design da interface, os algoritmos, o software e o código-fonte são propriedade exclusiva de seus titulares e estão protegidos pela Lei de Propriedade Intelectual (11.723) e pela Lei de Marcas (22.362) da República Argentina, e pelos tratados aplicáveis. O Zancada concede ao Usuário uma licença limitada, pessoal, revogável, não exclusiva e intransferível para usar o aplicativo conforme estes Termos. Todos os direitos não concedidos expressamente ficam reservados. As marcas de terceiros pertencem a seus respectivos titulares e sua menção não implica patrocínio nem recomendação.","Quem considerar que algum conteúdo dos Serviços infringe seus direitos de propriedade intelectual pode notificar info@zancada.org, indicando: sua identificação e dados de contato; a obra ou marca protegida; a localização do conteúdo questionado; uma declaração de boa-fé sobre a falta de autorização; e uma declaração de que a informação é exata e de que está autorizado a agir em nome do titular."]},{"h":"12. Funções em teste","p":["O Zancada pode oferecer funções novas ou experimentais em versão preliminar. Seu uso é opcional e de exclusiva responsabilidade do Usuário; podem conter erros, carecer de suporte, ser modificadas ou retiradas a qualquer momento."]},{"h":"13. Dispositivos, conectividade e bateria","p":["O Usuário é responsável por dispor de um dispositivo compatível, da conexão à internet e das tarifas de dados que seu provedor aplicar. Algumas funções, como o registro de atividades com GPS em segundo plano, podem aumentar significativamente o consumo de bateria. O Zancada não garante a precisão dos sensores nem do GPS, que depende de cada dispositivo e das condições do ambiente. Os avisos de voz, a notificação da corrida e o rastreamento em segundo plano podem ser limitados pela economia de bateria ou pelas permissões do sistema; o Usuário é responsável por configurá-los."]},{"h":"14. Comunicações e notificações","p":["O Zancada poderá enviar ao Usuário comunicações sobre o serviço (mudanças nos Termos, segurança, suporte e notificações push que o Usuário tenha ativado). As comunicações eletrônicas satisfazem qualquer exigência legal de forma escrita. O Usuário pode desativar as notificações pelo aplicativo ou pelo sistema operacional e não deve enviar comunicações abusivas, reiteradas ou indesejadas ao Zancada ou a terceiros."]},{"h":"15. Assinaturas, período de teste e pagamentos","p":["Hoje o Zancada é gratuito. A partir do lançamento nas lojas de aplicativos, operará sob um modelo de assinatura, e o Usuário poderá acessar todas as funções durante um período de teste gratuito inicial de quatorze (14) dias. O Zancada poderá adicionar, modificar ou descontinuar funções gratuitas ou de assinatura.","<strong>A. Período de teste.<\/strong> Ao iniciar o teste, será solicitado associar uma forma de pagamento por meio da conta da Apple App Store ou do Google Play. Nenhuma cobrança é feita durante esses 14 dias. O teste gratuito pode ser utilizado uma única vez por Usuário.","<strong>B. Cobrança e renovação automática.<\/strong> Ao término do teste, a assinatura (mensal ou anual, conforme o plano escolhido) é renovada e cobrada automaticamente na forma de pagamento associada, salvo se o Usuário a cancelar com pelo menos vinte e quatro (24) horas de antecedência do fim do período em curso. O plano escolhido não pode ser alterado até seu vencimento ou renovação.","<strong>C. Cancelamento.<\/strong> O Usuário pode cancelar a renovação automática a qualquer momento nos ajustes de assinaturas de sua conta Apple ID ou Google Play; o cancelamento produz efeito ao final do período vigente, e o acesso é mantido até então. Desinstalar o aplicativo ou excluir a conta do Zancada não cancela automaticamente a assinatura gerenciada pelas lojas.","<strong>D. Preços e impostos.<\/strong> Os preços são informados na loja antes da assinatura e incluem os impostos cabíveis. O Zancada poderá modificar os preços com aviso prévio razoável; a mudança se aplicará a partir do próximo período de cobrança.","<strong>E. Pagamentos e reembolsos.<\/strong> Todos os pagamentos são processados exclusivamente pela Apple ou pelo Google e estão sujeitos às suas políticas de reembolso: o Zancada não processa pagamentos diretos nem gerencia devoluções, salvo o que a lei impuser.","<strong>F. Direito de arrependimento.<\/strong> Quando a lei argentina de defesa do consumidor (Lei 24.240 e arts. 1110 e seguintes do Código Civil e Comercial) reconhecer ao Usuário o direito de revogar a aceitação em até dez (10) dias corridos da contratação, poderá exercê-lo escrevendo para info@zancada.org ou pelo meio que a loja disponibilizar; a devolução será gerenciada pela loja correspondente."]},{"h":"16. Modificação, suspensão e rescisão","p":["O Usuário pode deixar de utilizar os Serviços e solicitar a exclusão definitiva de todos os seus dados pessoais e histórico a qualquer momento em Perfil → Apagar meus dados.","O Zancada poderá suspender ou cancelar a conta ou o acesso aos Serviços, com ou sem aviso prévio conforme a gravidade do caso e de acordo com a lei, nos seguintes casos: descumprimento destes Termos; requisição de uma autoridade; fraude ou abuso; problemas técnicos ou de segurança; descontinuação ou modificação substancial do serviço; ou inatividade prolongada. As cláusulas que por sua natureza devam subsistir (propriedade intelectual, limitação de responsabilidade, lei aplicável, entre outras) continuarão em vigor após a rescisão."]},{"h":"17. Exclusão de garantias e limitação de responsabilidade","p":["Os Serviços são prestados \"como estão\" (as is) e \"conforme a disponibilidade\". O Zancada não garante que sejam ininterruptos, oportunos, seguros ou livres de erros, nem que os resultados, métricas, planos ou recomendações sejam exatos ou confiáveis, nem que a sincronização com plataformas de terceiros funcione sem falhas. O Zancada não assume responsabilidade pela organização, supervisão ou condução de eventos ou atividades em grupo que utilizem os Serviços.","Na máxima medida permitida por lei, o Zancada não será responsável por perdas de informação, pela impossibilidade de uso do serviço, nem por lesões, danos ou prejuízos diretos, indiretos ou consequentes decorrentes do uso do aplicativo ou de seguir as recomendações do assistente virtual: a decisão de treinar, e como, é sempre do Usuário. Salvo dolo ou culpa grave, e na medida permitida, a responsabilidade total do Zancada perante o Usuário não excederá o valor pago por este nos doze (12) meses anteriores à reclamação. Esta limitação não afeta os direitos irrenunciáveis que a normativa de defesa do consumidor reconheça ao Usuário."]},{"h":"18. Indenização","p":["Na medida permitida por lei, o Usuário manterá indene o Zancada, seus titulares e colaboradores diante de reclamações de terceiros decorrentes do Conteúdo que o Usuário carregar, do descumprimento destes Termos ou da lei, ou da violação de direitos de terceiros."]},{"h":"19. Disposições para usuários de iOS e de Android","p":["Se o Usuário baixar o Zancada da App Store da Apple, reconhece e aceita que estes Termos são celebrados somente entre o Usuário e o Zancada, e não com a Apple Inc. O Zancada é o único responsável pelo aplicativo e seu conteúdo. A Apple não tem obrigação de prestar serviços de manutenção nem suporte, nem é responsável por atender reclamações relacionadas ao aplicativo, incluindo as de responsabilidade pelo produto, defesa do consumidor ou violação de propriedade intelectual. A Apple e suas subsidiárias são terceiros beneficiários destes Termos e poderão exigir seu cumprimento. Qualquer reclamação sobre cobranças, faturamento ou devoluções de assinaturas feitas pela App Store deverá ser tratada diretamente com a Apple.","Se o download for feito pelo Google Play, aplicam-se também as condições dessa loja, e as reclamações sobre pagamentos ou reembolsos serão tratadas com o Google."]},{"h":"20. Defesa do consumidor e resolução de controvérsias","p":["Nada nestes Termos limita os direitos que a Lei argentina 24.240 de Defesa do Consumidor e demais normas imperativas reconhecem ao Usuário. Diante de qualquer reclamação, o Usuário pode contatar o Zancada em info@zancada.org, e as partes procurarão resolver a controvérsia de boa-fé por negociação direta antes de iniciar ações legais. O Usuário também pode recorrer à autoridade de aplicação da Lei 24.240 correspondente ao seu domicílio."]},{"h":"21. Disposições gerais","p":["Estes Termos e a Política de Privacidade constituem o acordo integral entre as partes quanto aos Serviços. Se alguma disposição for inválida ou inaplicável, as demais manterão sua vigência. A falta de exercício de um direito não implica renúncia a ele. O Zancada poderá ceder estes Termos em caso de reorganização ou transferência do negócio; o Usuário não poderá cedê-los sem consentimento escrito. O Zancada não responderá por descumprimentos causados por caso fortuito, força maior ou fatos alheios ao seu controle. As traduções são oferecidas a título informativo; em caso de discrepância, prevalece a versão em espanhol."]},{"h":"22. Mudanças nestes Termos","p":["O Zancada poderá modificar estes Termos. As mudanças importantes serão notificadas dentro do aplicativo antes de entrar em vigor. O uso dos Serviços após essa data implica a aceitação dos novos Termos; se o Usuário não concordar, pode deixar de utilizar os Serviços e excluir sua conta."]},{"h":"23. Lei aplicável e jurisdição","p":["Estes Termos regem-se pelas leis da República Argentina. Para qualquer controvérsia decorrente do uso do aplicativo, as partes submetem-se à jurisdição dos Tribunais Ordinários da Cidade Autônoma de Buenos Aires, renunciando a qualquer outro foro que possa corresponder, sem prejuízo do direito do consumidor de demandar perante os tribunais de seu domicílio quando a lei assim dispuser."]}],"h_contact":"Contato","contact_q":"Consultas sobre estes Termos e Condições:","note":"Este documento foi redigido como um modelo geral para um aplicativo em desenvolvimento e não constitui aconselhamento jurídico. Antes de lançar o Zancada publicamente, recomenda-se que um advogado o revise e o adapte à normativa aplicável."},"fr":{"title":"Zancada — Conditions Générales","back":"‹ Retour à Zancada","updated":"Dernière mise à jour : 9 octobre 2026","intro":"Les présentes Conditions Générales régissent l'accès à Zancada et son utilisation. En téléchargeant, installant, s'inscrivant ou utilisant les Services, l'Utilisateur accepte d'être lié par celles-ci et par la Politique de Confidentialité. S'il n'est pas d'accord, il ne doit pas utiliser les Services. Il est recommandé de lire avec une attention particulière l'avis sur la santé et l'entraînement (section 4).","summary_label":"En bref","summary":["Zancada est gratuite aujourd'hui. À partir de son lancement sur les boutiques d'applications, elle fonctionnera par abonnement, avec une période d'essai gratuite de 14 jours (section 15).","Les plans et les réponses de Zonda sont indicatifs et ne remplacent pas un professionnel de santé. Le test de niveau est un effort maximal.","L'Utilisateur peut annuler et supprimer ses données quand il le souhaite.","Le service est fourni « tel quel » et selon disponibilité, sans garantie de fonctionnement ininterrompu."],"sections":[{"h":"1. Acceptation, définitions et identification du titulaire","p":["Les présentes Conditions Générales (les « Conditions ») constituent un contrat contraignant entre l'Utilisateur et le titulaire de Zancada, et intègrent la Politique de Confidentialité. Elles s'appliquent à l'application mobile Zancada, à sa version web (zancada.org) et aux fonctionnalités et services associés (les « Services »). « Utilisateur » désigne la personne qui accède aux Services ou les utilise et « Contenu » désigne toute donnée, texte, image ou information que l'Utilisateur charge ou génère via les Services."],"ph":"[À compléter avant la publication de l'application] : raison sociale ou nom du titulaire, CUIT, adresse légale, e-mail de contact. Hébergement du service : Vercel (application et fonctions serveur) et Supabase (base de données)."},{"h":"2. Description du service","p":["Zancada est une application d'entraînement pour coureurs : elle génère des plans personnalisés (à la distance ou au temps), enregistre les courses, propose un test de niveau pour calculer les allures et zones, se synchronise avec des plateformes tierces (Strava, Polar, Wahoo, COROS et Suunto) et propose Zonda, un assistant virtuel fondé sur l'Intelligence Artificielle, pour répondre aux questions et ajuster la planification sportive. Zancada peut ajouter, modifier ou supprimer des fonctionnalités à tout moment. Il estime aussi les records et temps de course, propose un plan de course avec passages, avertit par la voix sur l'allure et la charge hebdomadaire, et affiche la météo."]},{"h":"3. Capacité, inscription et compte","p":["L'Utilisateur doit avoir la capacité juridique de contracter. Zancada ne s'adresse pas aux moins de 16 ans ; entre 16 et 17 ans, elle ne peut être utilisée qu'avec l'autorisation expresse et sous la supervision du parent ou du tuteur légal."],"ul":["Fournir des informations exactes, à jour et complètes, et les tenir à jour.","Créer un seul compte, à usage personnel, et ne pas partager le compte ni l'abonnement avec d'autres personnes.","Préserver la confidentialité des identifiants et notifier immédiatement toute utilisation non autorisée. L'Utilisateur est responsable de toute l'activité réalisée sous son compte.","Zancada pourra suspendre ou résilier le compte qui contrevient aux présentes Conditions."]},{"h":"4. Avis important sur la santé, la sécurité et la géolocalisation","box":{"label":"Avis","text":"Les suggestions de Zonda et les plans générés par Zancada sont indicatifs, générés de manière automatisée et fondés sur des principes généraux d'entraînement. Ils ne constituent en aucun cas un conseil, un diagnostic ou un traitement médical, kinésithérapique ou psychologique, et Zancada n'est pas un dispositif médical. Ils ne remplacent pas l'avis d'un médecin, d'un kinésithérapeute ou d'un entraîneur certifié."},"p":["La course à pied et l'activité physique comportent des risques inhérents pour la santé, notamment des blessures physiques ou cardiovasculaires. L'Utilisateur doit consulter un médecin ou un professionnel de santé agréé avant de commencer tout programme d'entraînement, surtout s'il a une condition préexistante, s'il est enceinte ou en post-partum, ou s'il a été inactif. Il doit commencer progressivement, ne pas dépasser ses capacités et arrêter l'activité immédiatement en cas de vertiges, de douleur aiguë, de déshydratation ou de tout malaise. Il ne doit jamais négliger un avis médical ni retarder une consultation en raison de ce qu'indique l'application.","L'Utilisateur assume les risques de l'activité physique qu'il pratique et des décisions qu'il prend sur la base des Services. Il doit s'entraîner en restant attentif à son environnement (circulation, terrain, météo, autres personnes), ne pas utiliser l'application en conduisant ou en traversant une rue, et utiliser les fonctions de géolocalisation de manière sûre et responsable. La publication ou le partage de tracés peut révéler des lieux fréquentés ; l'Utilisateur est responsable d'évaluer ce risque selon sa situation."]},{"h":"5. Test de niveau et recommandations personnalisées","p":["Le test de niveau (test de Cooper de 12 minutes) est un effort maximal que Zancada propose pour calculer les allures et zones. Sa réalisation relève de la seule responsabilité de l'Utilisateur, qui doit être apte physiquement et, le cas échéant, disposer d'une autorisation médicale. Les allures, zones et plans issus du test sont des estimations et peuvent ne pas correspondre à la situation réelle de l'Utilisateur. L'Utilisateur peut refaire le test ou ajuster les valeurs à tout moment. Il en va de même pour les records estimés, le plan de course, les allures cibles, les alertes d'allure vocales et les alertes de charge : ils sont indicatifs et ne remplacent ni le jugement de l'Utilisateur ni l'avis médical."]},{"h":"6. Limites de l'Intelligence Artificielle","p":["Zancada utilise des modèles de langage d'Intelligence Artificielle (exploités par Anthropic) pour faire fonctionner Zonda et certaines fonctions de personnalisation. Ces technologies présentent des risques et des limites connus et inconnus : elles peuvent produire des réponses inexactes, incomplètes ou inadaptées à la situation physique de l'Utilisateur. L'Utilisateur utilise ces fonctions à ses propres risques et doit toujours exercer son jugement et son bon sens avant d'adopter une recommandation. Zonda peut modifier le plan à la demande de l'Utilisateur ; les changements sont consultables et réversibles depuis l'application."]},{"h":"7. Confidentialité et données sensibles","p":["Pour fonctionner, Zancada collecte des données personnelles et des données de santé (métriques physiques et géolocalisation, y compris la position en arrière-plan pendant l'enregistrement d'une activité). L'Utilisateur donne son consentement libre, exprès et éclairé à ce traitement, au sens de la loi argentine 25.326 et de la <a href=\"/privacy.html\">Politique de Confidentialité<\/a>, qui fait partie des présentes Conditions. Cette Politique décrit aussi les droits d'accès, de rectification, de suppression et de portabilité, le transfert international de données et le rôle de l'Agence d'accès à l'information publique (AAIP), organe de contrôle de la loi 25.326."]},{"h":"8. Intégrations et services tiers","p":["L'Utilisateur peut se connecter avec Google ou Apple et connecter des appareils et plateformes comme Strava, Polar, Wahoo, COROS, Suunto ou Health Connect. Zancada s'appuie aussi sur des prestataires tels qu'Anthropic, Supabase, Vercel, Firebase et Sentry. Les informations que l'Utilisateur partage avec ces tiers sont régies par leurs propres conditions et politiques, sur lesquelles Zancada n'exerce aucun contrôle et dont elle n'assume aucune responsabilité. Zancada ne garantit ni la disponibilité, ni l'exactitude, ni la continuité des intégrations, qui peuvent dépendre de changements chez les tiers. Pour les cartes et la météo, Zancada utilise aussi Mapbox et Open-Meteo.","Les produits ou services de tiers que l'Utilisateur acquiert (par exemple, montres ou capteurs) et les liens vers d'autres sites sont contractés ou utilisés directement auprès de ces tiers, sans que Zancada y soit partie ni en réponde. Si l'Utilisateur utilise Zancada dans d'autres pays, il doit respecter la réglementation locale applicable."]},{"h":"9. Contenu de l'Utilisateur et licence","p":["L'Utilisateur conserve la titularité de son Contenu (y compris ses données d'entraînement). Pour fournir les Services, il accorde à Zancada une licence non exclusive, mondiale, gratuite et limitée pour héberger, stocker, traiter, reproduire et afficher ce Contenu dans le seul but de fournir et d'améliorer le service, conformément à la Politique de Confidentialité. Zancada n'utilise pas le Contenu à des fins publicitaires.","L'Utilisateur déclare être titulaire du Contenu qu'il charge ou disposer des droits nécessaires, et que son Contenu ne porte atteinte ni aux droits de tiers ni à la loi. Les commentaires, idées et suggestions que l'Utilisateur envoie à Zancada (le « Feedback ») pourront être librement utilisés par Zancada pour améliorer les Services, sans obligation de compensation ni de confidentialité."]},{"h":"10. Utilisation acceptable, conduite et usage personnel","p":["Les Services sont destinés à un usage personnel et non commercial, sauf autorisation écrite de Zancada. L'Utilisateur s'engage à les utiliser conformément à la loi et aux présentes Conditions. En particulier, il est interdit de :"],"ul":["Utiliser Zancada à des fins illégales, ou pour nuire à d'autres personnes ou à Zancada, les harceler ou usurper leur identité.","Violer ou tenter de contourner la sécurité de l'application, ou accéder à des données qui n'appartiennent pas à l'Utilisateur.","Accéder aux Services par d'autres moyens que les interfaces fournies ; utiliser des robots, scripts, de l'exploration de données ou du scraping pour extraire des données ou du contenu ; ou surcharger ou perturber les Services.","Effectuer de l'ingénierie inverse, décompiler ou tenter d'obtenir le code source, sauf dans les cas permis par la loi.","Revendre, louer, sous-licencier ou exploiter commercialement les Services ou leurs données sans autorisation.","Utiliser les Services, ou des informations qui en sont dérivées, pour développer, entraîner ou améliorer des modèles d'apprentissage automatique ou d'Intelligence Artificielle étrangers à Zancada.","Charger du contenu abusif, offensant, discriminatoire ou incitant à la haine, ou contenant des virus ou du code malveillant."],"p2":["Zancada applique une politique de tolérance zéro envers les contenus abusifs, offensants ou incitant à la haine. Zancada peut examiner, restreindre ou supprimer tout contenu contraire aux présentes Conditions et suspendre immédiatement les comptes concernés."]},{"h":"11. Propriété intellectuelle","p":["La marque « Zancada », ses logos, le design de l'interface, les algorithmes, le logiciel et le code source sont la propriété exclusive de leurs titulaires et sont protégés par la loi argentine sur la propriété intellectuelle (11.723) et la loi sur les marques (22.362), ainsi que par les traités applicables. Zancada accorde à l'Utilisateur une licence limitée, personnelle, révocable, non exclusive et non transférable pour utiliser l'application conformément aux présentes Conditions. Tous les droits non expressément concédés sont réservés. Les marques de tiers appartiennent à leurs titulaires respectifs et leur mention n'implique ni parrainage ni recommandation.","Toute personne estimant qu'un contenu des Services porte atteinte à ses droits de propriété intellectuelle peut le notifier à info@zancada.org, en indiquant : son identité et ses coordonnées ; l'œuvre ou la marque protégée ; l'emplacement du contenu contesté ; une déclaration de bonne foi sur l'absence d'autorisation ; et une déclaration selon laquelle l'information est exacte et qu'elle est habilitée à agir au nom du titulaire."]},{"h":"12. Fonctions en test","p":["Zancada peut proposer des fonctions nouvelles ou expérimentales en version préliminaire. Leur utilisation est facultative et relève de la seule responsabilité de l'Utilisateur ; elles peuvent contenir des erreurs, ne pas bénéficier de support, être modifiées ou retirées à tout moment."]},{"h":"13. Appareils, connectivité et batterie","p":["L'Utilisateur est responsable de disposer d'un appareil compatible, d'une connexion internet et des frais de données appliqués par son opérateur. Certaines fonctions, comme l'enregistrement d'activités avec GPS en arrière-plan, peuvent accroître sensiblement la consommation de batterie. Zancada ne garantit pas la précision des capteurs ni du GPS, qui dépend de chaque appareil et des conditions de l'environnement. Les alertes vocales, la notification de course et le suivi en arrière-plan peuvent être limités par l'économie de batterie ou les autorisations du système ; l'Utilisateur est responsable de les configurer."]},{"h":"14. Communications et notifications","p":["Zancada pourra adresser à l'Utilisateur des communications relatives au service (modifications des Conditions, sécurité, support et notifications push que l'Utilisateur a activées). Les communications électroniques satisfont à toute exigence légale d'écrit. L'Utilisateur peut désactiver les notifications depuis l'application ou le système d'exploitation et ne doit pas envoyer de communications abusives, répétées ou non sollicitées à Zancada ou à des tiers."]},{"h":"15. Abonnements, période d'essai et paiements","p":["Zancada est gratuite aujourd'hui. À partir de son lancement sur les boutiques d'applications, elle fonctionnera selon un modèle d'abonnement, et l'Utilisateur pourra accéder à toutes les fonctions pendant une période d'essai gratuite initiale de quatorze (14) jours. Zancada pourra ajouter, modifier ou supprimer des fonctions gratuites ou d'abonnement.","<strong>A. Période d'essai.<\/strong> Au début de l'essai, il sera demandé d'associer un moyen de paiement via le compte Apple App Store ou Google Play. Aucun prélèvement n'est effectué pendant ces 14 jours. L'essai gratuit ne peut être utilisé qu'une seule fois par Utilisateur.","<strong>B. Facturation et renouvellement automatique.<\/strong> À la fin de l'essai, l'abonnement (mensuel ou annuel, selon l'offre choisie) se renouvelle et est prélevé automatiquement sur le moyen de paiement associé, sauf si l'Utilisateur l'annule au moins vingt-quatre (24) heures avant la fin de la période en cours. L'offre choisie ne peut être modifiée avant son échéance ou son renouvellement.","<strong>C. Annulation.<\/strong> L'Utilisateur peut annuler le renouvellement automatique à tout moment depuis les réglages d'abonnements de son compte Apple ID ou Google Play ; l'annulation prend effet à la fin de la période en cours, et l'accès est conservé jusque-là. Désinstaller l'application ou supprimer le compte Zancada n'annule pas automatiquement l'abonnement géré par les boutiques.","<strong>D. Prix et taxes.<\/strong> Les prix sont indiqués dans la boutique avant la souscription et incluent les taxes applicables. Zancada pourra modifier les prix moyennant un préavis raisonnable ; le changement s'appliquera à partir de la période de facturation suivante.","<strong>E. Paiements et remboursements.<\/strong> Tous les paiements sont traités exclusivement via Apple ou Google et sont soumis à leurs politiques de remboursement : Zancada ne traite pas de paiements directs et ne gère pas les remboursements, sauf si la loi l'impose.","<strong>F. Droit de rétractation.<\/strong> Lorsque la loi argentine de protection des consommateurs (loi 24.240 et articles 1110 et suivants du Code civil et commercial) reconnaît à l'Utilisateur le droit de révoquer son acceptation dans les dix (10) jours calendaires suivant la conclusion du contrat, il pourra l'exercer en écrivant à info@zancada.org ou par le moyen que la boutique met à disposition ; le remboursement sera géré par la boutique concernée."]},{"h":"16. Modification, suspension et résiliation","p":["L'Utilisateur peut cesser d'utiliser les Services et demander la suppression définitive de toutes ses données personnelles et de son historique à tout moment depuis Profil → Supprimer mes données.","Zancada pourra suspendre ou résilier le compte ou l'accès aux Services, avec ou sans préavis selon la gravité du cas et conformément à la loi, dans les cas suivants : manquement aux présentes Conditions ; demande d'une autorité ; fraude ou abus ; problèmes techniques ou de sécurité ; interruption ou modification substantielle du service ; ou inactivité prolongée. Les clauses qui, par nature, doivent survivre (propriété intellectuelle, limitation de responsabilité, loi applicable, entre autres) restent en vigueur après la résiliation."]},{"h":"17. Exclusion de garanties et limitation de responsabilité","p":["Les Services sont fournis « tels quels » (as is) et « selon disponibilité ». Zancada ne garantit pas qu'ils seront ininterrompus, opportuns, sécurisés ou exempts d'erreurs, ni que les résultats, métriques, plans ou recommandations seront exacts ou fiables, ni que la synchronisation avec des plateformes tierces fonctionnera sans défaillance. Zancada n'assume aucune responsabilité pour l'organisation, la supervision ou la conduite d'événements ou d'activités de groupe utilisant les Services.","Dans toute la mesure permise par la loi, Zancada ne sera pas responsable des pertes d'informations, de l'impossibilité d'utiliser le service, ni des blessures, dommages
