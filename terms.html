 ou préjudices directs, indirects ou consécutifs résultant de l'utilisation de l'application ou du suivi des recommandations de l'assistant virtuel : la décision de s'entraîner, et la manière de le faire, appartient toujours à l'Utilisateur. Sauf dol ou faute lourde, et dans la mesure permise, la responsabilité totale de Zancada envers l'Utilisateur n'excédera pas le montant payé par celui-ci au cours des douze (12) mois précédant la réclamation. Cette limitation n'affecte pas les droits irrévocables que la réglementation de protection des consommateurs reconnaît à l'Utilisateur."]},{"h":"18. Garantie","p":["Dans la mesure permise par la loi, l'Utilisateur garantira Zancada, ses titulaires et collaborateurs contre les réclamations de tiers découlant du Contenu qu'il charge, de son manquement aux présentes Conditions ou à la loi, ou de la violation de droits de tiers."]},{"h":"19. Dispositions pour les utilisateurs iOS et Android","p":["Si l'Utilisateur télécharge Zancada depuis l'App Store d'Apple, il reconnaît et accepte que les présentes Conditions sont conclues uniquement entre l'Utilisateur et Zancada, et non avec Apple Inc. Zancada est seule responsable de l'application et de son contenu. Apple n'a aucune obligation de fournir des services de maintenance ou d'assistance, ni de traiter les réclamations relatives à l'application, y compris celles de responsabilité du fait des produits, de protection des consommateurs ou d'atteinte à la propriété intellectuelle. Apple et ses filiales sont des tiers bénéficiaires des présentes Conditions et pourront les faire valoir. Toute réclamation relative aux prélèvements, à la facturation ou aux remboursements d'abonnements effectués via l'App Store doit être traitée directement auprès d'Apple.","Si le téléchargement est effectué depuis Google Play, les conditions de cette boutique s'appliquent également, et les réclamations relatives aux paiements ou remboursements seront traitées avec Google."]},{"h":"20. Protection des consommateurs et règlement des litiges","p":["Aucune stipulation des présentes Conditions ne limite les droits que la loi argentine 24.240 de Protection des consommateurs et les autres normes impératives reconnaissent à l'Utilisateur. Pour toute réclamation, l'Utilisateur peut contacter Zancada à info@zancada.org, et les parties s'efforceront de résoudre le différend de bonne foi par une négociation directe avant d'engager des actions en justice. L'Utilisateur peut également s'adresser à l'autorité d'application de la loi 24.240 correspondant à son domicile."]},{"h":"21. Dispositions générales","p":["Les présentes Conditions et la Politique de Confidentialité constituent l'accord intégral entre les parties concernant les Services. Si une disposition est invalide ou inapplicable, les autres restent en vigueur. L'absence d'exercice d'un droit n'emporte pas renonciation à celui-ci. Zancada pourra céder les présentes Conditions en cas de réorganisation ou de transfert de l'activité ; l'Utilisateur ne pourra pas les céder sans consentement écrit. Zancada ne répondra pas des manquements causés par un cas de force majeure ou par des faits échappant à son contrôle. Les traductions sont fournies à titre informatif ; en cas de divergence, la version espagnole prévaut."]},{"h":"22. Modifications des présentes Conditions","p":["Zancada pourra modifier les présentes Conditions. Les changements importants seront notifiés dans l'application avant leur entrée en vigueur. L'utilisation des Services après cette date vaut acceptation des nouvelles Conditions ; si l'Utilisateur n'est pas d'accord, il peut cesser d'utiliser les Services et supprimer son compte."]},{"h":"23. Loi applicable et juridiction","p":["Les présentes Conditions sont régies par les lois de la République argentine. Pour tout litige découlant de l'utilisation de l'application, les parties se soumettent à la juridiction des tribunaux ordinaires de la Ville autonome de Buenos Aires, en renonçant à tout autre for qui pourrait être compétent, sans préjudice du droit du consommateur d'agir devant les tribunaux de son domicile lorsque la loi le prévoit."]}],"h_contact":"Contact","contact_q":"Questions sur les présentes Conditions Générales :","note":"Ce document a été rédigé comme un modèle général pour une application en développement et ne constitue pas un conseil juridique. Avant de lancer Zancada publiquement, il est recommandé de le faire relire par un avocat et de l'adapter à la réglementation applicable."},"it":{"title":"Zancada — Termini e Condizioni","back":"‹ Torna a Zancada","updated":"Ultimo aggiornamento: 9 ottobre 2026","intro":"I presenti Termini e Condizioni disciplinano l'accesso a Zancada e il suo utilizzo. Scaricando, installando, registrandosi o utilizzando i Servizi, l'Utente accetta di esserne vincolato e di essere vincolato all'Informativa sulla Privacy. Se non è d'accordo, non deve utilizzare i Servizi. Si raccomanda di leggere con particolare attenzione l'avviso su salute e allenamento (sezione 4).","summary_label":"In breve","summary":["Oggi Zancada è gratuita. Dal lancio sugli store di app funzionerà in abbonamento, con un periodo di prova gratuito di 14 giorni (sezione 15).","I piani e le risposte di Zonda sono indicativi e non sostituiscono un professionista sanitario. Il test di livello è uno sforzo massimale.","L'Utente può annullare ed eliminare i propri dati quando lo desidera.","Il servizio è fornito \"così com'è\" e secondo disponibilità, senza garanzia di funzionamento ininterrotto."],"sections":[{"h":"1. Accettazione, definizioni e identificazione del titolare","p":["I presenti Termini e Condizioni (i \"Termini\") costituiscono un contratto vincolante tra l'Utente e il titolare di Zancada, e incorporano l'Informativa sulla Privacy. Si applicano all'applicazione mobile Zancada, alla sua versione web (zancada.org) e alle funzioni e ai servizi correlati (i \"Servizi\"). \"Utente\" è la persona che accede ai Servizi o li utilizza e \"Contenuto\" è qualsiasi dato, testo, immagine o informazione che l'Utente carica o genera tramite i Servizi."],"ph":"[Da completare prima della pubblicazione dell'app]: ragione sociale o nome del titolare, CUIT, indirizzo legale, e-mail di contatto. Hosting del servizio: Vercel (applicazione e funzioni server) e Supabase (database)."},{"h":"2. Descrizione del servizio","p":["Zancada è un'app di allenamento per corridori: genera piani personalizzati (a distanza o a tempo), registra le corse, propone un test di livello per calcolare ritmi e zone, si sincronizza con piattaforme di terze parti (Strava, Polar, Wahoo, COROS e Suunto) e offre Zonda, un assistente virtuale basato sull'Intelligenza Artificiale, per rispondere alle domande e adattare la pianificazione sportiva. Zancada può aggiungere, modificare o interrompere funzioni in qualsiasi momento. Stima inoltre record e tempi di gara, offre un piano gara con parziali, avvisa a voce su ritmo e carico settimanale e mostra il meteo."]},{"h":"3. Capacità, registrazione e account","p":["L'Utente deve avere la capacità legale di stipulare contratti. Zancada non è rivolta a persone sotto i 16 anni; tra i 16 e i 17 anni può essere utilizzata solo con l'autorizzazione espressa e la supervisione del genitore o del tutore legale."],"ul":["Fornire informazioni veritiere, aggiornate e complete, e mantenerle aggiornate.","Creare un solo account, per uso personale, e non condividere l'account né l'abbonamento con altre persone.","Mantenere riservate le credenziali e notificare immediatamente qualsiasi uso non autorizzato. L'Utente è responsabile di tutta l'attività svolta con il proprio account.","Zancada potrà sospendere o cancellare l'account che violi i presenti Termini."]},{"h":"4. Avviso importante su salute, sicurezza e geolocalizzazione","box":{"label":"Avviso","text":"I suggerimenti di Zonda e i piani generati da Zancada sono indicativi, generati in modo automatizzato e basati su principi generali di allenamento. In nessun caso costituiscono consulenza, diagnosi o trattamento medico, fisioterapico o psicologico, e Zancada non è un dispositivo medico. Non sostituiscono il parere di un medico, fisioterapista o allenatore certificato."},"p":["La corsa e l'attività fisica comportano rischi intrinseci per la salute, inclusi infortuni fisici o cardiovascolari. L'Utente deve consultare un medico o un professionista sanitario abilitato prima di iniziare qualsiasi programma di allenamento, soprattutto se ha una condizione preesistente, è in gravidanza o nel post-parto, o è stato inattivo. Deve iniziare gradualmente, non superare le proprie capacità e interrompere immediatamente l'attività in caso di vertigini, dolore acuto, disidratazione o qualsiasi malessere. Non deve mai trascurare un parere medico né ritardare la visita a causa di quanto indicato dall'app.","L'Utente assume i rischi dell'attività fisica che svolge e delle decisioni che prende sulla base dei Servizi. Deve allenarsi prestando attenzione all'ambiente (traffico, terreno, meteo, altre persone), non interagire con l'app mentre guida o attraversa la strada, e usare le funzioni di geolocalizzazione in modo sicuro e responsabile. La pubblicazione o la condivisione dei percorsi può rivelare luoghi frequentati; l'Utente è responsabile di valutare tale rischio secondo la propria situazione."]},{"h":"5. Test di livello e raccomandazioni personalizzate","p":["Il test di livello (test di Cooper di 12 minuti) è uno sforzo massimale che Zancada propone per calcolare ritmi e zone. La sua esecuzione è di esclusiva responsabilità dell'Utente, che deve essere in condizioni fisiche idonee e, se del caso, avere il nulla osta medico. I ritmi, le zone e i piani derivati dal test sono stime e possono non corrispondere alla situazione reale dell'Utente. L'Utente può ripetere il test o modificare i valori in qualsiasi momento. Lo stesso vale per i record stimati, il piano gara, i ritmi obiettivo, gli avvisi vocali di ritmo e gli avvisi di carico: sono indicativi e non sostituiscono il giudizio dell'Utente né il parere medico."]},{"h":"6. Limiti dell'Intelligenza Artificiale","p":["Zancada utilizza modelli linguistici di Intelligenza Artificiale (gestiti da Anthropic) per far funzionare Zonda e alcune funzioni di personalizzazione. Queste tecnologie presentano rischi e limiti noti e ignoti: possono produrre risposte inesatte, incomplete o inadatte alla situazione fisica dell'Utente. L'Utente usa queste funzioni a proprio rischio e deve sempre applicare il proprio giudizio e il buon senso prima di adottare qualsiasi raccomandazione. Zonda può modificare il piano su richiesta dell'Utente; le modifiche sono rivedibili e reversibili dall'app."]},{"h":"7. Privacy e dati sensibili","p":["Per funzionare, Zancada raccoglie dati personali e dati di salute (metriche fisiche e geolocalizzazione, inclusa la posizione in background mentre si registra un'attività). L'Utente presta il proprio consenso libero, esplicito e informato a tale trattamento, ai sensi della legge argentina 25.326 e dell'<a href=\"/privacy.html\">Informativa sulla Privacy<\/a>, che fa parte dei presenti Termini. Tale Informativa descrive anche i diritti di accesso, rettifica, cancellazione e portabilità, il trasferimento internazionale dei dati e il ruolo dell'Agenzia per l'accesso all'informazione pubblica (AAIP), organo di controllo della legge 25.326."]},{"h":"8. Integrazioni e servizi di terze parti","p":["L'Utente può accedere con Google o Apple e collegare dispositivi e piattaforme come Strava, Polar, Wahoo, COROS, Suunto o Health Connect. Zancada si avvale inoltre di fornitori come Anthropic, Supabase, Vercel, Firebase e Sentry. Le informazioni che l'Utente condivide con tali terzi sono regolate dai loro termini e informative, sui quali Zancada non ha controllo né responsabilità. Zancada non garantisce la disponibilità, l'accuratezza né la continuità delle integrazioni, che possono dipendere da modifiche dei terzi. Per mappe e meteo, Zancada utilizza inoltre Mapbox e Open-Meteo.","I prodotti o servizi di terze parti che l'Utente acquista (ad esempio, orologi o sensori) e i link ad altri siti sono contrattati o utilizzati direttamente con tali terzi, senza che Zancada ne sia parte né ne risponda. Se l'Utente utilizza Zancada in altri paesi, deve rispettare la normativa locale applicabile."]},{"h":"9. Contenuto dell'Utente e licenza","p":["L'Utente conserva la titolarità del proprio Contenuto (inclusi i dati di allenamento). Per fornire i Servizi, concede a Zancada una licenza non esclusiva, mondiale, gratuita e limitata per ospitare, archiviare, elaborare, riprodurre e mostrare tale Contenuto al solo scopo di fornire e migliorare il servizio, in conformità all'Informativa sulla Privacy. Zancada non utilizza il Contenuto a fini pubblicitari.","L'Utente dichiara di essere titolare del Contenuto che carica o di disporre dei diritti necessari, e che il proprio Contenuto non viola diritti di terzi né la legge. I commenti, le idee e i suggerimenti che l'Utente invia a Zancada (il \"Feedback\") potranno essere liberamente utilizzati da Zancada per migliorare i Servizi, senza obbligo di compenso né di riservatezza."]},{"h":"10. Uso consentito, condotta e uso personale","p":["I Servizi sono per uso personale e non commerciale, salvo autorizzazione scritta di Zancada. L'Utente si impegna a utilizzarli in conformità alla legge e ai presenti Termini. In particolare, è vietato:"],"ul":["Utilizzare Zancada per scopi illegali, o per danneggiare, molestare o impersonare altre persone o Zancada.","Violare o tentare di eludere la sicurezza dell'app, o accedere a dati che non appartengono all'Utente.","Accedere ai Servizi con mezzi diversi dalle interfacce fornite; usare robot, script, data mining o scraping per estrarre dati o contenuti; o sovraccaricare o interferire con i Servizi.","Effettuare reverse engineering, decompilare o tentare di ottenere il codice sorgente, salvo nei casi consentiti dalla legge.","Rivendere, noleggiare, concedere in sublicenza o sfruttare commercialmente i Servizi o i loro dati senza autorizzazione.","Utilizzare i Servizi, o informazioni da essi derivate, per sviluppare, addestrare o migliorare modelli di apprendimento automatico o di Intelligenza Artificiale diversi da quelli di Zancada.","Caricare contenuti abusivi, offensivi, discriminatori o che incitino all'odio, o che contengano virus o codice malevolo."],"p2":["Zancada mantiene una politica di tolleranza zero verso contenuti abusivi, offensivi o che incitino all'odio. Zancada può rivedere, limitare o rimuovere qualsiasi contenuto che violi i presenti Termini e sospendere immediatamente gli account coinvolti."]},{"h":"11. Proprietà intellettuale","p":["Il marchio \"Zancada\", i suoi loghi, il design dell'interfaccia, gli algoritmi, il software e il codice sorgente sono di proprietà esclusiva dei rispettivi titolari e sono protetti dalla Legge sulla Proprietà Intellettuale (11.723) e dalla Legge sui Marchi (22.362) della Repubblica Argentina, nonché dai trattati applicabili. Zancada concede all'Utente una licenza limitata, personale, revocabile, non esclusiva e non trasferibile per usare l'app in conformità ai presenti Termini. Tutti i diritti non espressamente concessi sono riservati. I marchi di terzi appartengono ai rispettivi titolari e la loro menzione non implica sponsorizzazione né raccomandazione.","Chi ritenga che un contenuto dei Servizi violi i propri diritti di proprietà intellettuale può segnalarlo a info@zancada.org, indicando: la propria identità e i dati di contatto; l'opera o il marchio protetto; la posizione del contenuto contestato; una dichiarazione in buona fede sulla mancanza di autorizzazione; e una dichiarazione che le informazioni sono esatte e che è autorizzato ad agire per conto del titolare."]},{"h":"12. Funzioni in prova","p":["Zancada può offrire funzioni nuove o sperimentali in versione preliminare. Il loro uso è facoltativo e sotto la sola responsabilità dell'Utente; possono contenere errori, non avere supporto, essere modificate o ritirate in qualsiasi momento."]},{"h":"13. Dispositivi, connettività e batteria","p":["L'Utente è responsabile di disporre di un dispositivo compatibile, della connessione a internet e dei costi dati applicati dal proprio operatore. Alcune funzioni, come la registrazione di attività con GPS in background, possono aumentare in modo significativo il consumo della batteria. Zancada non garantisce la precisione dei sensori né del GPS, che dipende da ciascun dispositivo e dalle condizioni dell'ambiente. Gli avvisi vocali, la notifica della corsa e il tracciamento in background possono essere limitati dal risparmio batteria o dalle autorizzazioni di sistema; l'Utente è responsabile di configurarli."]},{"h":"14. Comunicazioni e notifiche","p":["Zancada potrà inviare all'Utente comunicazioni sul servizio (modifiche ai Termini, sicurezza, supporto e notifiche push che l'Utente ha attivato). Le comunicazioni elettroniche soddisfano qualsiasi requisito legale di forma scritta. L'Utente può disattivare le notifiche dall'app o dal sistema operativo e non deve inviare comunicazioni abusive, reiterate o indesiderate a Zancada o a terzi."]},{"h":"15. Abbonamenti, periodo di prova e pagamenti","p":["Oggi Zancada è gratuita. Dal lancio sugli store di app opererà con un modello di abbonamento, e l'Utente potrà accedere a tutte le funzioni durante un periodo di prova gratuito iniziale di quattordici (14) giorni. Zancada potrà aggiungere, modificare o interrompere funzioni gratuite o in abbonamento.","<strong>A. Periodo di prova.<\/strong> All'inizio della prova verrà richiesto di associare un metodo di pagamento tramite l'account Apple App Store o Google Play. Non viene effettuato alcun addebito durante i 14 giorni. La prova gratuita può essere utilizzata una sola volta per Utente.","<strong>B. Fatturazione e rinnovo automatico.<\/strong> Al termine della prova, l'abbonamento (mensile o annuale, secondo il piano scelto) si rinnova e viene addebitato automaticamente sul metodo di pagamento associato, salvo che l'Utente lo annulli almeno ventiquattro (24) ore prima della fine del periodo in corso. Il piano scelto non può essere modificato fino alla scadenza o al rinnovo.","<strong>C. Annullamento.<\/strong> L'Utente può annullare il rinnovo automatico in qualsiasi momento dalle impostazioni degli abbonamenti del proprio account Apple ID o Google Play; l'annullamento ha effetto al termine del periodo in corso e fino ad allora l'accesso è mantenuto. Disinstallare l'app o eliminare l'account Zancada non annulla automaticamente l'abbonamento gestito dagli store.","<strong>D. Prezzi e imposte.<\/strong> I prezzi sono indicati nello store prima dell'abbonamento e includono le imposte applicabili. Zancada potrà modificare i prezzi con ragionevole preavviso; la modifica si applicherà dal periodo di fatturazione successivo.","<strong>E. Pagamenti e rimborsi.<\/strong> Tutti i pagamenti sono elaborati esclusivamente tramite Apple o Google e sono soggetti alle loro politiche di rimborso: Zancada non elabora pagamenti diretti né gestisce resi, salvo quanto imposto dalla legge.","<strong>F. Diritto di recesso.<\/strong> Quando la legge argentina sulla tutela dei consumatori (legge 24.240 e artt. 1110 e seguenti del Codice Civile e Commerciale) riconosca all'Utente il diritto di revocare l'accettazione entro dieci (10) giorni di calendario dalla conclusione del contratto, potrà esercitarlo scrivendo a info@zancada.org o tramite il mezzo messo a disposizione dallo store; il rimborso sarà gestito tramite lo store corrispondente."]},{"h":"16. Modifica, sospensione e cessazione","p":["L'Utente può smettere di utilizzare i Servizi e chiedere l'eliminazione definitiva di tutti i propri dati personali e dello storico in qualsiasi momento da Profilo → Elimina i miei dati.","Zancada potrà sospendere o cancellare l'account o l'accesso ai Servizi, con o senza preavviso a seconda della gravità del caso e in conformità alla legge, nei seguenti casi: violazione dei presenti Termini; richiesta di un'autorità; frode o abuso; problemi tecnici o di sicurezza; interruzione o modifica sostanziale del servizio; o inattività prolungata. Le clausole che per loro natura devono sopravvivere (proprietà intellettuale, limitazione di responsabilità, legge applicabile, tra altre) restano in vigore dopo la cessazione."]},{"h":"17. Esclusione di garanzie e limitazione di responsabilità","p":["I Servizi sono forniti \"così come sono\" (as is) e \"secondo disponibilità\". Zancada non garantisce che siano ininterrotti, tempestivi, sicuri o privi di errori, né che i risultati, le metriche, i piani o le raccomandazioni siano esatti o affidabili, né che la sincronizzazione con piattaforme di terze parti funzioni senza difetti. Zancada non assume responsabilità per l'organizzazione, la supervisione o la conduzione di eventi o attività di gruppo che utilizzino i Servizi.","Nella massima misura consentita dalla legge, Zancada non sarà responsabile per perdite di informazioni, per l'impossibilità di utilizzare il servizio, né per infortuni, danni o pregiudizi diretti, indiretti o consequenziali derivanti dall'uso dell'app o dal seguire le raccomandazioni dell'assistente virtuale: la decisione di allenarsi, e come, è sempre dell'Utente. Salvo dolo o colpa grave, e nella misura consentita, la responsabilità complessiva di Zancada verso l'Utente non supererà l'importo da questi pagato nei dodici (12) mesi precedenti il reclamo. Tale limitazione non pregiudica i diritti irrinunciabili che la normativa a tutela dei consumatori riconosce all'Utente."]},{"h":"18. Manleva","p":["Nella misura consentita dalla legge, l'Utente manleverà Zancada, i suoi titolari e collaboratori da reclami di terzi derivanti dal Contenuto che l'Utente carica, dalla violazione dei presenti Termini o della legge, o dalla violazione di diritti di terzi."]},{"h":"19. Disposizioni per gli utenti iOS e Android","p":["Se l'Utente scarica Zancada dall'App Store di Apple, riconosce e accetta che i presenti Termini sono stipulati solo tra l'Utente e Zancada, e non con Apple Inc. Zancada è l'unica responsabile dell'applicazione e del suo contenuto. Apple non ha alcun obbligo di fornire servizi di manutenzione o supporto, né è responsabile di gestire reclami relativi all'applicazione, inclusi quelli su responsabilità del prodotto, tutela dei consumatori o violazione della proprietà intellettuale. Apple e le sue controllate sono terzi beneficiari dei presenti Termini e potranno farli valere. Qualsiasi reclamo su addebiti, fatturazione o rimborsi di abbonamenti effettuati tramite l'App Store deve essere gestito direttamente con Apple.","Se il download avviene da Google Play, si applicano anche le condizioni di tale store, e i reclami su pagamenti o rimborsi saranno gestiti con Google."]},{"h":"20. Tutela dei consumatori e risoluzione delle controversie","p":["Nulla nei presenti Termini limita i diritti che la legge argentina 24.240 sulla Tutela dei Consumatori e le altre norme imperative riconoscono all'Utente. Per qualsiasi reclamo, l'Utente può contattare Zancada a info@zancada.org, e le parti cercheranno di risolvere la controversia in buona fede mediante negoziazione diretta prima di avviare azioni legali. L'Utente può inoltre rivolgersi all'autorità di applicazione della legge 24.240 corrispondente al proprio domicilio."]},{"h":"21. Disposizioni generali","p":["I presenti Termini e l'Informativa sulla Privacy costituiscono l'accordo integrale tra le parti riguardo ai Servizi. Se una disposizione fosse invalida o inapplicabile, le restanti rimarranno in vigore. Il mancato esercizio di un diritto non implica rinuncia ad esso. Zancada potrà cedere i presenti Termini in caso di riorganizzazione o cessione dell'attività; l'Utente non potrà cederli senza consenso scritto. Zancada non risponderà di inadempimenti causati da forza maggiore o da fatti al di fuori del proprio controllo. Le traduzioni sono fornite a titolo informativo; in caso di discrepanza, prevale la versione in spagnolo."]},{"h":"22. Modifiche ai presenti Termini","p":["Zancada potrà modificare i presenti Termini. Le modifiche importanti saranno notificate nell'app prima dell'entrata in vigore. L'uso dei Servizi dopo tale data implica l'accettazione dei nuovi Termini; se l'Utente non è d'accordo, può smettere di utilizzare i Servizi ed eliminare il proprio account."]},{"h":"23. Legge applicabile e giurisdizione","p":["I presenti Termini sono regolati dalle leggi della Repubblica Argentina. Per qualsiasi controversia derivante dall'uso dell'applicazione, le parti si sottopongono alla giurisdizione dei Tribunali Ordinari della Città Autonoma di Buenos Aires, rinunciando a qualsiasi altro foro che potesse spettare, fatto salvo il diritto del consumatore di agire dinanzi ai tribunali del proprio domicilio quando la legge lo preveda."]}],"h_contact":"Contatto","contact_q":"Domande sui presenti Termini e Condizioni:","note":"Questo documento è stato redatto come modello generale per un'app in sviluppo e non costituisce consulenza legale. Prima di lanciare Zancada pubblicamente, si raccomanda che un avvocato lo riveda e lo adatti alla normativa applicabile."},"de":{"title":"Zancada — Allgemeine Geschäftsbedingungen","back":"‹ Zurück zu Zancada","updated":"Zuletzt aktualisiert: 9. Oktober 2026","intro":"Diese Allgemeinen Geschäftsbedingungen regeln den Zugang zu Zancada und dessen Nutzung. Mit dem Herunterladen, Installieren, Registrieren oder Verwenden der Dienste erklärt sich der Nutzer an sie sowie an die Datenschutzerklärung gebunden. Ist er nicht einverstanden, darf er die Dienste nicht nutzen. Wir empfehlen, den Hinweis zu Gesundheit und Training (Abschnitt 4) besonders aufmerksam zu lesen.","summary_label":"Kurz gefasst","summary":["Zancada ist derzeit kostenlos. Ab dem Start in den App-Stores wird es per Abonnement angeboten, mit einer kostenlosen Testphase von 14 Tagen (Abschnitt 15).","Pläne und Antworten von Zonda sind Empfehlungen und ersetzen keine medizinische Fachkraft. Der Leistungstest ist eine maximale Belastung.","Der Nutzer kann jederzeit kündigen und seine Daten löschen.","Der Dienst wird „wie besehen“ und nach Verfügbarkeit bereitgestellt, ohne Garantie für unterbrechungsfreien Betrieb."],"sections":[{"h":"1. Annahme, Begriffe und Identifizierung des Betreibers","p":["Diese Allgemeinen Geschäftsbedingungen (die „Bedingungen“) bilden einen verbindlichen Vertrag zwischen dem Nutzer und dem Betreiber von Zancada und beziehen die Datenschutzerklärung ein. Sie gelten für die mobile Anwendung Zancada, ihre Webversion (zancada.org) sowie die zugehörigen Funktionen und Dienste (die „Dienste“). „Nutzer“ ist die Person, die auf die Dienste zugreift oder sie verwendet, und „Inhalt“ sind alle Daten, Texte, Bilder oder Informationen, die der Nutzer über die Dienste hochlädt oder erzeugt."],"ph":"[Vor der Veröffentlichung der App zu ergänzen]: Firma oder Name des Betreibers, CUIT, Rechtsanschrift, Kontakt-E-Mail. Hosting des Dienstes: Vercel (Anwendung und Serverfunktionen) und Supabase (Datenbank)."},{"h":"2. Beschreibung des Dienstes","p":["Zancada ist eine Trainings-App für Läufer: Sie erstellt personalisierte Pläne (nach Distanz oder Zeit), zeichnet Läufe auf, bietet einen Leistungstest zur Berechnung von Tempi und Zonen an, synchronisiert mit Plattformen Dritter (Strava, Polar, Wahoo, COROS und Suunto) und bietet Zonda, einen auf Künstlicher Intelligenz basierenden virtuellen Assistenten, der Fragen beantwortet und die sportliche Planung anpasst. Zancada kann Funktionen jederzeit hinzufügen, ändern oder einstellen. Außerdem schätzt sie Bestzeiten und Rennzeiten, bietet einen Rennplan mit Zwischenzeiten, gibt Sprachhinweise zu Tempo und Wochenbelastung und zeigt das Wetter an."]},{"h":"3. Geschäftsfähigkeit, Registrierung und Konto","p":["Der Nutzer muss geschäftsfähig sein. Zancada richtet sich nicht an Personen unter 16 Jahren; zwischen 16 und 17 Jahren darf es nur mit ausdrücklicher Zustimmung und unter Aufsicht eines Elternteils oder gesetzlichen Vertreters verwendet werden. Der Nutzer verpflichtet sich:"],"ul":["wahrheitsgemäße, aktuelle und vollständige Angaben zu machen und diese aktuell zu halten.","nur ein Konto für den persönlichen Gebrauch anzulegen und weder Konto noch Abonnement mit anderen Personen zu teilen.","seine Zugangsdaten vertraulich zu halten und jede unbefugte Nutzung unverzüglich zu melden. Der Nutzer ist für alle Aktivitäten unter seinem Konto verantwortlich.","Zancada kann ein Konto sperren oder löschen, das gegen diese Bedingungen verstößt."]},{"h":"4. Wichtiger Hinweis zu Gesundheit, Sicherheit und Standortbestimmung","box":{"label":"Hinweis","text":"Die Vorschläge von Zonda und die von Zancada erstellten Pläne sind Empfehlungen, werden automatisiert erzeugt und beruhen auf allgemeinen Trainingsprinzipien. Sie stellen in keinem Fall ärztliche, physiotherapeutische oder psychologische Beratung, Diagnose oder Behandlung dar, und Zancada ist kein Medizinprodukt. Sie ersetzen nicht den Rat eines Arztes, Physiotherapeuten oder zertifizierten Trainers."},"p":["Laufen und körperliche Aktivität bergen inhärente Gesundheitsrisiken, einschließlich körperlicher oder kardiovaskulärer Verletzungen. Der Nutzer sollte vor Beginn eines Trainingsprogramms einen Arzt oder eine zugelassene Gesundheitsfachkraft konsultieren, insbesondere bei Vorerkrankungen, Schwangerschaft oder Wochenbett oder nach längerer Inaktivität. Er sollte schrittweise beginnen, seine Fähigkeiten nicht überschreiten und die Aktivität bei Schwindel, akuten Schmerzen, Dehydrierung oder anderem Unwohlsein sofort beenden. Ärztlichen Rat darf er niemals missachten oder wegen der Angaben der App hinauszögern.","Der Nutzer übernimmt die Risiken der von ihm ausgeübten körperlichen Aktivität und der auf Grundlage der Dienste getroffenen Entscheidungen. Er sollte mit Aufmerksamkeit für seine Umgebung trainieren (Verkehr, Gelände, Wetter, andere Personen), die App nicht beim Fahren oder Überqueren der Straße bedienen und die Standortfunktionen sicher und verantwortungsvoll nutzen. Die Veröffentlichung oder Weitergabe von Strecken kann häufig besuchte Orte offenbaren; der Nutzer ist selbst dafür verantwortlich, dieses Risiko entsprechend seiner Situation zu bewerten."]},{"h":"5. Leistungstest und personalisierte Empfehlungen","p":["Der Leistungstest (12-Minuten-Cooper-Test) ist eine maximale Belastung, die Zancada zur Berechnung von Tempi und Zonen vorschlägt. Seine Durchführung liegt in der alleinigen Verantwortung des Nutzers, der körperlich dazu in der Lage sein und gegebenenfalls eine ärztliche Freigabe haben muss. Aus dem Test abgeleitete Tempi, Zonen und Pläne sind Schätzungen und können von der tatsächlichen Situation des Nutzers abweichen. Der Nutzer kann den Test jederzeit wiederholen oder die Werte ändern. Dasselbe gilt für geschätzte Bestzeiten, den Rennplan, Zieltempi, Sprachhinweise zum Tempo und Belastungswarnungen: Sie sind Richtwerte und ersetzen weder das eigene Urteil des Nutzers noch ärztlichen Rat."]},{"h":"6. Grenzen der Künstlichen Intelligenz","p":["Zancada verwendet Sprachmodelle der Künstlichen Intelligenz (betrieben von Anthropic), um Zonda und einige Personalisierungsfunktionen bereitzustellen. Diese Technologien weisen bekannte und unbekannte Risiken und Grenzen auf: Sie können ungenaue, unvollständige oder für die körperliche Verfassung des Nutzers ungeeignete Antworten liefern. Der Nutzer verwendet diese Funktionen auf eigenes Risiko und muss vor der Umsetzung jeder Empfehlung stets sein eigenes Urteil und seinen gesunden Menschenverstand einsetzen. Zonda kann den Plan auf Wunsch des Nutzers ändern; Änderungen sind in der App überprüfbar und rückgängig zu machen."]},{"h":"7. Datenschutz und sensible Daten","p":["Zancada erhebt zum Betrieb personenbezogene Daten und Gesundheitsdaten (körperliche Messdaten und Standortbestimmung, einschließlich des Standorts im Hintergrund während der Aufzeichnung einer Aktivität). Der Nutzer erteilt seine freie, ausdrückliche und informierte Einwilligung in diese Verarbeitung gemäß dem argentinischen Gesetz 25.326 und der <a href=\"/privacy.html\">Datenschutzerklärung<\/a>, die Bestandteil dieser Bedingungen ist. Diese Erklärung beschreibt auch die Rechte auf Auskunft, Berichtigung, Löschung und Übertragbarkeit, die internationale Datenübermittlung und die Rolle der Agentur für den Zugang zu öffentlichen Informationen (AAIP), Kontrollorgan des Gesetzes 25.326."]},{"h":"8. Integrationen und Dienste Dritter","p":["Der Nutzer kann sich mit Google oder Apple anmelden und Geräte und Plattformen wie Strava, Polar, Wahoo, COROS, Suunto oder Health Connect verbinden. Zancada greift zudem auf Dienstleister wie Anthropic, Supabase, Vercel, Firebase und Sentry zurück. Die Informationen, die der Nutzer mit diesen Dritten teilt, unterliegen deren Bedingungen und Datenschutzerklärungen, über die Zancada weder Kontrolle noch Verantwortung hat. Zancada garantiert weder Verfügbarkeit, Genauigkeit noch Kontinuität der Integrationen, die von Änderungen bei den Dritten abhängen können. Für Karten und Wetter nutzt Zancada außerdem Mapbox und Open-Meteo.","Produkte oder Dienste Dritter, die der Nutzer erwirbt (z. B. Uhren oder Sensoren), sowie Links zu anderen Websites werden unmittelbar mit diesen Dritten vereinbart oder genutzt, ohne dass Zancada Vertragspartei oder dafür verantwortlich ist. Nutzt der Nutzer Zancada in anderen Ländern, hat er die dortigen anwendbaren Vorschriften einzuhalten."]},{"h":"9. Inhalte des Nutzers und Lizenz","p":["Der Nutzer behält die Rechte an seinen Inhalten (einschließlich der Trainingsdaten). Zur Bereitstellung der Dienste räumt er Zancada eine nicht ausschließliche, weltweite, unentgeltliche und beschränkte Lizenz ein, diese Inhalte zu hosten, zu speichern, zu verarbeiten, zu vervielfältigen und anzuzeigen, ausschließlich zur Bereitstellung und Verbesserung des Dienstes und im Einklang mit der Datenschutzerklärung. Zancada verwendet die Inhalte nicht zu Werbezwecken.","Der Nutzer erklärt, Inhaber der hochgeladenen Inhalte zu sein oder über die erforderlichen Rechte zu verfügen und dass seine Inhalte weder Rechte Dritter noch das Gesetz verletzen. Kommentare, Ideen und Vorschläge, die der Nutzer an Zancada sendet (das „Feedback“), darf Zancada zur Verbesserung der Dienste frei verwenden, ohne Vergütungs- oder Vertraulichkeitspflicht."]},{"h":"10. Zulässige Nutzung, Verhalten und persönlicher Gebrauch","p":["Die Dienste sind für den persönlichen, nicht gewerblichen Gebrauch bestimmt, sofern Zancada nicht schriftlich etwas anderes erlaubt. Der Nutzer verpflichtet sich, sie im Einklang mit dem Gesetz und diesen Bedingungen zu nutzen. Insbesondere ist es untersagt:"],"ul":["Zancada für rechtswidrige Zwecke zu verwenden oder andere Personen oder Zancada zu schädigen, zu belästigen oder sich als diese auszugeben.","die Sicherheit der App zu verletzen oder zu umgehen oder auf Daten zuzugreifen, die dem Nutzer nicht gehören.","auf die Dienste auf anderem Wege als über die bereitgestellten Schnittstellen zuzugreifen; Roboter, Skripte, Data Mining oder Scraping zur Extraktion von Daten oder Inhalten zu verwenden; oder die Dienste zu überlasten oder zu stören.","Reverse Engineering zu betreiben, zu dekompilieren oder zu versuchen, den Quellcode zu erlangen, außer soweit gesetzlich zulässig.","die Dienste oder ihre Daten ohne Genehmigung weiterzuverkaufen, zu vermieten, unterzulizenzieren oder gewerblich zu nutzen.","die Dienste oder daraus abgeleitete Informationen zu verwenden, um andere Modelle des maschinellen Lernens oder der Künstlichen Intelligenz als die von Zancada zu entwickeln, zu trainieren oder zu verbessern.","missbräuchliche, anstößige, diskriminierende oder zum Hass aufstachelnde Inhalte oder Inhalte mit Viren oder Schadcode hochzuladen."],"p2":["Zancada verfolgt eine Null-Toleranz-Politik gegenüber missbräuchlichen, anstößigen oder zum Hass aufstachelnden Inhalten. Zancada kann Inhalte, die gegen diese Bedingungen verstoßen, prüfen, einschränken oder entfernen und die betroffenen Konten sofort sperren."]},{"h":"11. Geistiges Eigentum","p":["Die Marke „Zancada“, ihre Logos, das Design der Benutzeroberfläche, die Algorithmen, die Software und der Quellcode sind ausschließliches Eigentum der jeweiligen Inhaber und durch das Gesetz über geistiges Eigentum (11.723) und das Markengesetz (22.362) der Argentinischen Republik sowie durch anwendbare Verträge geschützt. Zancada räumt dem Nutzer eine beschränkte, persönliche, widerrufliche, nicht ausschließliche und nicht übertragbare Lizenz zur Nutzung der App im Einklang mit diesen Bedingungen ein. Alle nicht ausdrücklich gewährten Rechte bleiben vorbehalten. Marken Dritter gehören ihren jeweiligen Inhabern, und ihre Nennung bedeutet weder Förderung noch Empfehlung.","Wer der Ansicht ist, dass ein Inhalt der Dienste seine Rechte des geistigen Eigentums verletzt, kann dies an info@zancada.org melden und dabei angeben: seine Identität und Kontaktdaten; das geschützte Werk oder die Marke; den Fundort des beanstandeten Inhalts; eine Erklärung nach bestem Wissen, dass keine Genehmigung vorliegt; und eine Erklärung, dass die Angaben zutreffen und er befugt ist, im Namen des Rechteinhabers zu handeln."]},{"h":"12. Funktionen in der Testphase","p":["Zancada kann neue oder experimentelle Funktionen in einer Vorabversion anbieten. Ihre Nutzung ist freiwillig und erfolgt auf alleinige Verantwortung des Nutzers; sie können Fehler enthalten, ohne Support sein und jederzeit geändert oder entfernt werden."]},{"h":"13. Geräte, Konnektivität und Akku","p":["Der Nutzer ist dafür verantwortlich, ein kompatibles Gerät, eine Internetverbindung und die von seinem Anbieter berechneten Datenkosten zu haben. Einige Funktionen, etwa die Aufzeichnung von Aktivitäten mit GPS im Hintergrund, können den Akkuverbrauch erheblich erhöhen. Zancada garantiert nicht die Genauigkeit von Sensoren oder GPS, die vom jeweiligen Gerät und den Umgebungsbedingungen abhängt. Sprachhinweise, die Lauf-Benachrichtigung und die Hintergrundaufzeichnung können durch Energiesparmodus oder Systemberechtigungen eingeschränkt sein; der Nutzer ist für die Einrichtung verantwortlich."]},{"h":"14. Mitteilungen und Benachrichtigungen","p":["Zancada kann dem Nutzer Mitteilungen zum Dienst senden (Änderungen der Bedingungen, Sicherheit, Support und vom Nutzer aktivierte Push-Benachrichtigungen). Elektronische Mitteilungen genügen jedem gesetzlichen Schriftformerfordernis. Der Nutzer kann Benachrichtigungen in der App oder im Betriebssystem deaktivieren und darf Zancada oder Dritten keine missbräuchlichen, wiederholten oder unerwünschten Mitteilungen senden."]},{"h":"15. Abonnements, Testphase und Zahlungen","p":["Derzeit ist Zancada kostenlos. Ab dem Start in den App-Stores wird es in einem Abonnementmodell betrieben, und der Nutzer kann während einer anfänglichen kostenlosen Testphase von vierzehn (14) Tagen auf alle Funktionen zugreifen. Zancada kann kostenlose oder abonnementpflichtige Funktionen hinzufügen, ändern oder einstellen.","<strong>A. Testphase.<\/strong> Zu Beginn der Testphase wird der Nutzer aufgefordert, über sein Apple-App-Store- oder Google-Play-Konto eine Zahlungsmethode zu hinterlegen. Während der 14 Tage erfolgt keine Belastung. Die kostenlose Testphase kann nur einmal pro Nutzer in Anspruch genommen werden.","<strong>B. Abrechnung und automatische Verlängerung.<\/strong> Nach Ende der Testphase verlängert sich das Abonnement (monatlich oder jährlich, je nach gewähltem Tarif) und wird automatisch der hinterlegten Zahlungsmethode belastet, es sei denn, der Nutzer kündigt mindestens vierundzwanzig (24) Stunden vor Ende des laufenden Zeitraums. Der gewählte Tarif kann bis zu seinem Ablauf oder seiner Verlängerung nicht gewechselt werden.","<strong>C. Kündigung.<\/strong> Der Nutzer kann die automatische Verlängerung jederzeit in den Abonnementeinstellungen seiner Apple-ID oder von Google Play kündigen; die Kündigung wird zum Ende des laufenden Zeitraums wirksam, bis dahin bleibt der Zugang bestehen. Das Deinstallieren der App oder das Löschen des Zancada-Kontos kündigt das über die Stores verwaltete Abonnement nicht automatisch.","<strong>D. Preise und Steuern.<\/strong> Die Preise werden vor dem Abschluss im Store angezeigt und enthalten die anwendbaren Steuern. Zancada kann die Preise mit angemessener Vorankündigung ändern; die Änderung gilt ab dem nächsten Abrechnungszeitraum.","<strong>E. Zahlungen und Erstattungen.<\/strong> Alle Zahlungen werden ausschließlich über Apple oder Google abgewickelt und unterliegen deren Erstattungsrichtlinien: Zancada wickelt keine direkten Zahlungen ab und bearbeitet keine Rückerstattungen, soweit nicht gesetzlich vorgeschrieben.","<strong>F. Widerrufsrecht.<\/strong> Soweit das argentinische Verbraucherschutzrecht (Gesetz 24.240 und Art. 1110 ff. des Zivil- und Handelsgesetzbuchs) dem Nutzer das Recht einräumt, seine Annahme innerhalb von zehn (10) Kalendertagen ab Vertragsschluss zu widerrufen, kann er dieses durch Mitteilung an info@zancada.org oder über das vom Store bereitgestellte Mittel ausüben; die Erstattung wird über den jeweiligen Store abgewickelt."]},{"h":"16. Änderung, Aussetzung und Beendigung","p":["Der Nutzer kann die Nutzung der Dienste jederzeit einstellen und unter Profil → Meine Daten löschen die endgültige Löschung aller seiner personenbezogenen Daten und seines Verlaufs verlangen.","Zancada kann das Konto oder den Zugang zu den Diensten sperren oder löschen, je nach Schwere des Falls mit oder ohne Vorankündigung und im Einklang mit dem Gesetz, in folgenden Fällen: Verstoß gegen diese Bedingungen; Anordnung einer Behörde; Betrug oder Missbrauch; technische oder Sicherheitsprobleme; Einstellung oder wesentliche Änderung des Dienstes; oder längere Inaktivität. Klauseln, die ihrer Natur nach fortbestehen sollen (geistiges Eigentum, Haftungsbeschränkung, anwendbares Recht u. a.), gelten nach Beendigung weiter."]},{"h":"17. Gewährleistungsausschluss und Haftungsbeschränkung","p":["Die Dienste werden „wie besehen“ (as is) und „nach Verfügbarkeit“ bereitgestellt. Zancada garantiert nicht, dass sie ununterbrochen, rechtzeitig, sicher oder fehlerfrei sind, dass Ergebnisse, Kennzahlen, Pläne oder Empfehlungen genau oder verlässlich sind oder dass die Synchronisierung mit Plattformen Dritter fehlerfrei funktioniert. Zancada übernimmt keine Verantwortung für die Organisation, Aufsicht oder Durchführung von Veranstaltungen oder Gruppenaktivitäten unter Nutzung der Dienste.","Soweit gesetzlich zulässig, haftet Zancada nicht für Informationsverluste, die Unmöglichkeit der Nutzung des Dienstes, noch für Verletzungen, Schäden oder Nachteile, ob direkt, indirekt oder als Folge, die aus der Nutzung der App oder der Befolgung von Empfehlungen des virtuellen Assistenten entstehen: Die Entscheidung, ob und wie trainiert wird, liegt stets beim Nutzer. Außer bei Vorsatz oder grober Fahrlässigkeit und soweit zulässig übersteigt die Gesamthaftung von Zancada gegenüber dem Nutzer nicht den Betrag, den dieser in den zwölf (12) Monaten vor dem Anspruch gezahlt hat. Diese Beschränkung berührt nicht die unabdingbaren Rechte, die das Verbraucherschutzrecht dem Nutzer einräumt."]},{"h":"18. Freistellung","p":["Soweit gesetzlich zulässig, stellt der Nutzer Zancada, seine Inhaber und Mitarbeiter von Ansprüchen Dritter frei, die aus von ihm hochgeladenen Inhalten, einem Verstoß gegen diese Bedingungen oder das Gesetz oder der Verletzung von Rechten Dritter entstehen."]},{"h":"19. Bestimmungen für iOS- und Android-Nutzer","p":["Lädt der Nutzer Zancada aus dem Apple App Store herunter, erkennt er an und stimmt zu, dass diese Bedingungen nur zwischen dem Nutzer und Zancada und nicht mit Apple Inc. geschlossen werden. Zancada ist allein verantwortlich für die Anwendung und ihren Inhalt. Apple ist nicht verpflichtet, Wartungs- oder Supportleistungen zu erbringen, und nicht dafür verantwortlich, Ansprüche im Zusammenhang mit der Anwendung zu bearbeiten, einschließlich Produkthaftung, Verbraucherschutz oder Verletzung geistigen Eigentums. Apple und seine Tochtergesellschaften sind Drittbegünstigte dieser Bedingungen und können sie durchsetzen. Ansprüche wegen Belastungen, Abrechnung oder Erstattung von über den App Store abgeschlossenen Abonnements sind unmittelbar mit Apple zu klären.","Erfolgt der Download über Google Play, gelten zusätzlich die Bedingungen dieses Stores, und Ansprüche zu Zahlungen oder Erstattungen werden mit Google abgewickelt."]},{"h":"20. Verbraucherschutz und Streitbeilegung","p":["Nichts in diesen Bedingungen schränkt die Rechte ein, die das argentinische Gesetz 24.240 zum Verbraucherschutz und andere zwingende Vorschriften dem Nutzer einräumen. Bei Beschwerden kann sich der Nutzer an Zancada unter info@zancada.org wenden, und die Parteien bemühen sich, die Streitigkeit vor Einleitung rechtlicher Schritte durch direkte Verhandlung nach Treu und Glauben beizulegen. Der Nutzer kann sich außerdem an die für seinen Wohnsitz zuständige Vollzugsbehörde des Gesetzes 24.240 wenden."]},{"h":"21. Allgemeine Bestimmungen","p":["Diese Bedingungen und die Datenschutzerklärung bilden die vollständige Vereinbarung zwischen den Parteien in Bezug auf die Dienste. Ist eine Bestimmung unwirksam oder undurchsetzbar, bleiben die übrigen in Kraft. Die Nichtausübung eines Rechts bedeutet keinen Verzicht darauf. Zancada kann diese Bedingungen bei einer Umstrukturierung oder Übertragung des Geschäfts abtreten; der Nutzer darf sie nicht ohne schriftliche Zustimmung abtreten. Zancada haftet nicht für Leistungsstörungen aufgrund höherer Gewalt oder außerhalb seiner Kontrolle liegender Umstände. Übersetzungen dienen nur der Information; bei Abweichungen gilt die spanische Fassung."]},{"h":"22. Änderungen dieser Bedingungen","p":["Zancada kann diese Bedingungen ändern. Wesentliche Änderungen werden vor ihrem Inkrafttreten in der App mitgeteilt. Die Nutzung der Dienste nach diesem Zeitpunkt gilt als Annahme der neuen Bedingungen; ist der Nutzer nicht einverstanden, kann er die Nutzung der Dienste einstellen und sein Konto löschen."]},{"h":"23. Anwendbares Recht und Gerichtsstand","p":["Diese Bedingungen unterliegen dem Recht der Argentinischen Republik. Für alle Streitigkeiten aus der Nutzung der Anwendung unterwerfen sich die Parteien der Gerichtsbarkeit der ordentlichen Gerichte der Autonomen Stadt Buenos Aires und verzichten auf jeden anderen Gerichtsstand, der ihnen zustehen könnte, unbeschadet des Rechts des Verbrauchers, vor den Gerichten seines Wohnsitzes zu klagen, soweit das Gesetz dies vorsieht."]}],"h_contact":"Kontakt","contact_q":"Fragen zu diesen Allgemeinen Geschäftsbedingungen:","note":"Dieses Dokument wurde als allgemeine Vorlage für eine in Entwicklung befindliche App erstellt und stellt keine Rechtsberatung dar. Vor dem öffentlichen Start von Zancada wird empfohlen, es von einem Rechtsanwalt prüfen und an die anwendbaren Vorschriften anpassen zu lassen."}};
const LANG_LABELS = {es:'ES', en:'EN', pt:'PT', fr:'FR', it:'IT', de:'DE'};
const LANG_NAMES = {es:'es', en:'en-US', pt:'pt-BR', fr:'fr', it:'it', de:'de'};

function detectLang(){
  const url = new URL(window.location.href);
  const q = url.searchParams.get('lang');
  if(q && L[q]) return q;
  try{
    const saved = localStorage.getItem('zancada_legal_lang');
    if(saved && L[saved]) return saved;
  }catch(e){}
  const nav = (navigator.language || 'es').slice(0,2).toLowerCase();
  if(L[nav]) return nav;
  return 'es';
}

// Cada documento es una lista de secciones: título, párrafos, lista, recuadro de aviso o recuadro "a completar".
// El texto es propio (no viene de usuarios), por eso se arma con innerHTML para poder usar <strong> y <a>.
function renderSection(s){
  let html = '<h2>' + s.h + '</h2>';
  const boxHtml = s.box ? '<div class="health-box"><p class="health-label">' + s.box.label + '</p><p>' + s.box.text + '</p></div>' : '';
  const boxFirst = s.box && !s.ul && !s.p2;
  if(boxFirst) html += boxHtml;
  (s.p || []).forEach(t => { html += '<p>' + t + '</p>'; });
  if(s.ph) html += '<div class="placeholder-box"><p>' + s.ph + '</p></div>';
  if(s.ul) html += '<ul>' + s.ul.map(i => '<li>' + i + '</li>').join('') + '</ul>';
  if(s.box && !boxFirst) html += boxHtml;
  (s.p2 || []).forEach(t => { html += '<p>' + t + '</p>'; });
  return html;
}

function render(code){
  const d = L[code];
  document.documentElement.lang = LANG_NAMES[code] || code;
  document.getElementById('page-title').textContent = d.title;
  document.getElementById('back-link').textContent = d.back;
  document.getElementById('t-title').textContent = d.title.replace(/^Zancada\s*—\s*/, '');
  document.getElementById('t-updated').textContent = d.updated;
  document.getElementById('t-intro').textContent = d.intro;
  document.getElementById('t-summary-label').textContent = d.summary_label;
  document.getElementById('t-summary').innerHTML = d.summary.map(item=>'<li>' + item + '</li>').join('');
  document.getElementById('t-sections').innerHTML = d.sections.map(renderSection).join('');
  document.getElementById('t-h-contact').textContent = d.h_contact;
  document.getElementById('t-contact-q').textContent = d.contact_q;
  document.getElementById('t-note').textContent = d.note;
  document.querySelectorAll('.lang-pill').forEach(p=>p.classList.toggle('active', p.dataset.v===code));
  try{ localStorage.setItem('zancada_legal_lang', code); }catch(e){}
}

const langRow = document.getElementById('lang-row');
Object.keys(LANG_LABELS).forEach(code=>{
  const el = document.createElement('div');
  el.className = 'lang-pill';
  el.dataset.v = code;
  el.textContent = LANG_LABELS[code];
  el.onclick = ()=>render(code);
  langRow.appendChild(el);
});

render(detectLang());
</script>
